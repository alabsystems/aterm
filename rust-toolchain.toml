# The Trust toolchain, always (owner directive 2026-09-28: every ALab system
# builds with Trust). targo chooses the lane (`targo --unverified <verb>` or
# `targo trust <verb>`), not this file; `aterm pkg which targo` shows which
# store build answers, and crates/trust-gate refuses any other host compiler.
#
# Stock remains only where Trust lacks a capability (the cross lanes, the wasm32
# lane among them: E0463, no std in the Trust sysroot; fuzz/miri/Kani), each
# labelled at its point of use: `git grep -nE 'STOCK EXCEPTION|PUBLIC
# BOUNDARY'` lists them all. The public snapshot keeps this pin (2026-09-29: a
# public user installs aterm, and atpkg installs Trust).
# The long pre-2026-09-28 rationale lives in this file at commit 3f91fbb1c.
[toolchain]
channel = "trust"
