# TEMPLATE: an aterm theme with every key under a comment, ready to copy.
#
# Copy it into your themes folder under the theme's id:
#   ~/.config/aterm/themes/<Your Theme>.conf      (macOS, Linux)
#   %APPDATA%\aterm\themes\<Your Theme>.conf      (Windows)
# The file name without .conf is the id that theme = "<id>" names in aterm.toml.
# Then check it, and see it in a running window:
#   aterm theme check "<file>" --strict    (add --signature for aterm's own bar)
#   aterm ctl theme preview "<Your Theme>"
# The full guide: contrib/themes/GUIDE.md. Every key: aterm theme schema --format text
#
# One `key = value` per line; a line starting with `#` or `;` is a comment. After
# a value, a comment needs a space or tab before its `#` or `;`, so ` #` inside a
# name or description ends the value there. An unknown or repeated
# key stops the whole file loading, so a typo is reported, not ignored. A colour
# is #RRGGBB (the # optional) or #RGB. These colours are aterm's Default.

# The name listings and the picker show. The file name stays the id.
# Optional; when omitted, the file name without .conf is shown.
name = Template

# One line that listings and the picker show under the name.
# Optional; when omitted, no description.
description = A starting point: aterm's Default colours, every key explained

# Who made the theme.
# Optional; when omitted, no author.
author = Your Name

# Whether the theme is drawn for a dark or a light background: dark or light.
# A dark:/light: theme split picks its side by this.
# Optional; when omitted, measured from the background.
appearance = dark

# The theme format version the file was written for. A newer aterm's file
# loads in an older one with the keys it does not know skipped and listed.
# Optional; when omitted, read as this aterm's version. An aterm older than
# the release that added fonts refuses a file that sets it.
# schema = 1

# The default text colour. Required.
# Aim for 7:1 against the background; 3:1 is the floor `check` warns under.
foreground = #d0d0d0

# The default background, which also fills the window's padding. Required.
background = #111318

# The cursor colour (also spelled cursor_color). Aim for 3:1 or more.
# Optional; when omitted, the cursor follows the foreground.
cursor = #50fa7b

# The selection band's background (also spelled selection_color).
# Aim for 1.5:1 against the background, with the foreground at 4.5:1 on it.
# Optional; when omitted, derived from the background, moved toward the foreground.
selection = #33415e

# The text colour inside the selection.
# Optional; when omitted, selected text keeps its own colour (usually best).
# selection_foreground = #ffffff

# ANSI slot N (also spelled palette<N> or ansi<N>), N from 0 to 15:
# 0-7 black, red, green, yellow, blue, magenta, cyan, white; 8-15 their bright forms.
# Optional; when omitted, the slot's xterm default.
# No slot may equal the background, or text in that colour is invisible.
color0 = #000000  # black
color1 = #e06c75  # red
color2 = #00cd00  # green
color3 = #cdcd00  # yellow
color4 = #3b8eea  # blue
color5 = #c678dd  # magenta
color6 = #00cdcd  # cyan
color7 = #e5e5e5  # white
color8 = #8a8f99  # bright black: the dim colour, for comments and suggestions
color9 = #ff6e67  # bright red
color10 = #50fa7b  # bright green
color11 = #f1fa8c  # bright yellow
color12 = #5c5cff  # bright blue
color13 = #ff79c6  # bright magenta
color14 = #8be9fd  # bright cyan
color15 = #ffffff  # bright white

# Derive the 256-colour cube and grey ramp (slots 16-255) from this theme's colours: its bright row colours the cube, and its darkest ink (color0 or color15) and lightest colour anchor black and white, so dark slots stay dark on light themes too.
# Optional; when omitted, slots 16-255 keep the xterm cube and grey ramp.
# palette_generate = true

# Whether bold text in ANSI colours 0-7 is drawn in their bright forms 8-15.
# Optional; when omitted, your aterm.toml value, else aterm's default.
# bold_is_bright = true

# Chrome (optional): colours for aterm's own tabs, seams and highlights.
# Leave them out and aterm derives each from the colours above. An aterm older
# than the release that added them refuses a file that sets one.

# The chrome accent: the active-tab rule, the message band's meter, Settings'
# selected rows, the find highlight's hue. Each surface holds it to 3:1 on its
# own ground.
# Optional; when omitted, the cursor when it has colour, else the theme's ANSI
# blue or cyan.
# accent_color = #7aa2f7

# The selected tab's background; its label is black or white by luminance.
# Optional; when omitted, the selected tab is a raised card in the theme's own tones.
# active_tab_color = #2b3a57

# Split-pane dividers and the seams under the tab strip and over the find bar;
# held to 1.5:1 on each.
# Optional; when omitted, the background stepped 30% toward the foreground.
# border_color = #3b4261

# Find's highlight on every match but the current one (the current match is the
# selection). Keep it apart from the selection colour above.
# Optional; when omitted, a tint of the background toward the accent, apart
# from the selection.
# search_match_color = #3d4f2f

# Typography (optional): fonts by family name (never a file or a path) and the
# type settings around them. An aterm.toml key of the same name wins; a font not
# installed falls back to your font_family, else aterm's default face. Try and
# preview are colours only: the face applies when the theme is kept. An aterm
# older than the release that added these keys refuses a file that sets one.

# The terminal text's font family, by name. display:<id> names one of aterm's
# built-in display faces.
# font_family = JetBrains Mono

# The families for bold, italic and bold italic text.
# font_family_bold = JetBrains Mono
# font_family_italic = JetBrains Mono
# font_family_bold_italic = JetBrains Mono

# Families tried, in order, for a character the main font lacks (at most 8).
# fallback_fonts = Sarasa Mono J, Apple Symbols

# The families for symbols and icons, and for colour emoji.
# symbol_font = Symbols Nerd Font Mono
# emoji_font = Noto Color Emoji

# Line height as a multiple of the font's own, 0.8 to 2.0.
# line_height = 1.15

# Whether programming ligatures are shown.
# ligatures = true

# OpenType features: tag, +tag or tag=N on, -tag off (at most 16).
# font_features = calt, ss02

# Whether a missing bold or italic face is synthesized from the regular one.
# font_synthetic_style = true

# The regular text's weight, 1 to 1000 (400 is regular), for a variable font.
# font_weight = 450

# Scales the text size, 0.8 to 1.25: your font size or aterm's default.
# font_size_scale = 1.08
