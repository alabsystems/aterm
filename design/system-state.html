<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>aterm — System State design</title>
<style>
:root{color-scheme:dark;--bg:#131619;--panel:#1a1e22;--line:#30363c;--ink:#e7ecef;--muted:#a0a9b1;--green:#8edbb9;--blue:#93bbf5;--amber:#ebc487}*{box-sizing:border-box}body{margin:0;background:#0c0f12;color:var(--ink);font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.5}button,select{font:inherit;color:inherit;cursor:pointer}button{border:1px solid var(--line);border-radius:7px;background:#252b31;padding:7px 12px}button:hover{background:#343c44}button:focus-visible,select:focus-visible{outline:2px solid var(--blue);outline-offset:3px}button.active{background:#354553;border-color:#7791a3}header{height:46px;background:#1c2126;display:flex;align-items:center;padding:0 19px;border-bottom:1px solid var(--line);gap:20px}.dots{display:flex;gap:7px}.dots i{width:11px;height:11px;border-radius:50%;background:#686d73}.dots i:first-child{background:#f07870}.dots i:nth-child(2){background:#e8bf60}.dots i:last-child{background:#78bc83}.tab{height:100%;display:flex;align-items:center;border-bottom:2px solid var(--green);font-size:12px}.frame{max-width:1230px;margin:36px auto;background:var(--bg);border:1px solid #353b40;border-radius:12px;overflow:hidden;box-shadow:0 22px 80px #0008}.main{padding:34px 36px 24px}.eyebrow{color:var(--green);font:12px ui-monospace,monospace;letter-spacing:1px}.top{display:flex;align-items:center;justify-content:space-between;gap:15px}h1{font-size:28px;letter-spacing:-.8px;margin:7px 0 3px;font-weight:600}h2{font-size:14px;margin:0;font-weight:600}p{margin:0;color:var(--muted)}.machine{font-size:12px;color:var(--muted)}.pill{display:inline-flex;align-items:center;gap:7px;background:#24372e;color:var(--green);border:1px solid #365847;border-radius:30px;padding:5px 11px;font-size:12px}.summary{margin:27px 0 24px;border:1px solid var(--line);border-radius:9px;padding:17px 20px;background:var(--panel)}.summary-top{display:flex;align-items:center;justify-content:space-between}.summary strong{font-size:16px;font-weight:550}.track{height:5px;background:#30373d;border-radius:9px;margin:14px 0 10px;overflow:hidden}.fill{height:100%;background:var(--green);transition:width .35s}.metrics{display:flex;gap:20px;color:var(--muted);font-size:12px}.metrics b{font-weight:500;color:var(--ink)}.toolbar{display:flex;justify-content:space-between;gap:12px;margin-bottom:16px}.seg{display:flex;gap:4px}.seg button{padding:5px 12px;background:transparent;border-color:transparent;font-size:12px}.seg button.active{background:#303942}.legend{font-size:12px;color:var(--muted);align-self:center}.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px}.group{margin-bottom:18px}.group-title{display:flex;justify-content:space-between;margin:0 1px 8px;color:var(--muted);font-size:12px}.group-title span{font-size:11px}.rows{border:1px solid var(--line);border-radius:9px;overflow:hidden}.task{width:100%;border:0;border-radius:0;border-bottom:1px solid var(--line);background:var(--panel);text-align:left;padding:13px 14px;display:grid;grid-template-columns:22px 1fr auto;gap:9px;align-items:center}.task:last-child{border-bottom:0}.task.selected{background:#273139;box-shadow:inset 2px 0 var(--green)}.task:hover{background:#242b31}.name{font-size:13px;font-weight:500}.sub{font-size:11px;color:var(--muted);margin-top:3px}.state{font-size:11px;color:var(--muted)}.done .icon,.done .state{color:var(--green)}.running .icon,.running .state{color:var(--blue)}.action .icon,.action .state{color:var(--amber)}.retrying .icon,.retrying .state{color:var(--amber)}.icon{font:16px ui-monospace,monospace}.inspector{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:20px;align-self:start;position:sticky;top:20px}.inspector .over{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:1.1px;margin-bottom:8px}.inspector h2{font-size:18px;letter-spacing:-.3px;margin-bottom:7px}.inspector p{font-size:12px}.label{font-size:11px;color:var(--muted);margin:22px 0 7px}.dep{width:100%;display:flex;justify-content:space-between;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:8px 0;font-size:12px}.dep span:last-child{color:var(--green)}.quiet{font-size:11px;color:var(--muted);margin-top:15px}.activity{border-top:1px solid var(--line);padding-top:12px;margin-top:17px}.event{display:grid;grid-template-columns:28px 1fr;gap:8px;font-size:11px;color:var(--muted);margin:8px 0}.event time{font-family:ui-monospace,monospace}.dependency-view{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:20px}.flow{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin:11px 0}.node{font-size:12px;text-align:left;padding:11px 13px;min-width:145px;background:#222b30}.node.done{border-color:#3d6553}.node .state{display:block;margin-top:3px}.arrow{color:var(--muted)}.divider{border-top:1px solid var(--line);margin:18px 0}.foot{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;border-top:1px solid var(--line);padding-top:16px;margin-top:8px}.prototype{max-width:1230px;margin:0 auto 30px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:0 12px;font-size:12px;color:var(--muted)}.prototype select{background:#1c2126;border:1px solid var(--line);border-radius:6px;padding:7px}.prototype strong{font-weight:500;color:var(--ink)}.prototype button{font-size:12px}.attention{margin-bottom:17px;background:#302a21;border:1px solid #695638;border-radius:8px;padding:11px 14px;font-size:12px;display:flex;justify-content:space-between;gap:12px}.attention span{color:var(--amber)}.empty{padding:35px;color:var(--muted);text-align:center;border:1px dashed var(--line);border-radius:9px}@media(max-width:800px){.frame{margin:12px}.main{padding:24px 18px}.layout{grid-template-columns:1fr}.inspector{position:static}.legend{display:none}.metrics{gap:12px}.top{align-items:flex-start}.machine{display:none}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<div class="frame">
<header><div class="dots" aria-hidden="true"><i></i><i></i><i></i></div><div class="tab">◉ &nbsp; System State</div></header>
<main class="main">
 <div class="top"><div><div class="eyebrow">aterm / SYSTEM</div><h1>System State</h1><p id="subtitle">Setup continues automatically.</p></div><div><span class="pill" id="network">● LAN connected</span><div class="machine" style="text-align:right;margin-top:8px">This Mac · Andrew’s Mac</div></div></div>
 <section class="summary" aria-label="Setup progress"><div class="summary-top"><strong id="headline" aria-live="polite"></strong><button id="pause">Pause</button></div><div class="track" role="progressbar" aria-label="Verified setup tasks" aria-valuemin="0" aria-valuemax="12" id="progress"><div class="fill" id="fill"></div></div><div class="metrics" id="metrics"></div></section>
 <div id="attention"></div>
 <div class="toolbar"><div class="seg" role="group" aria-label="View"><button data-view="pending" class="active">In progress</button><button data-view="all">All tasks</button><button data-view="graph">Dependencies</button></div><span class="legend">✓ Verified &nbsp; ◌ Running &nbsp; ↳ Waiting</span></div>
 <div class="layout"><section id="tasks" aria-label="Setup tasks"></section><aside class="inspector" id="inspector" aria-label="Task details"></aside></div>
 <div class="foot"><span>Changes are saved. Setup resumes after a restart.</span><span id="clock">Updated just now</span></div>
</main></div>
<div class="prototype"><strong>Interactive design · simulated data</strong><select id="scenario" aria-label="Scenario"><option value="setup">Starting up</option><option value="offline">LAN returns</option><option value="retry">Temporary failure</option><option value="permission">macOS permission</option><option value="done">Complete</option></select><button id="restart">Restart coordinator</button><button id="reset">Reset demo</button><span id="test-result"></span></div>
<script src="workflow.js"></script>
<script>
"use strict";
let engine, selected="repos", view="pending", scenario="setup";
const $=id=>document.getElementById(id), labels={done:"Done",running:"Running",waiting:"Waiting",queued:"Queued",retrying:"Retrying",action:"Needs you"}, icons={done:"✓",running:"◌",waiting:"↳",queued:"·",retrying:"↻",action:"!"};
const descriptions={shell:"aterm commands are available in new shells.",tools:"Compiler and Git required by development tasks.",preferences:"Apply the selected keyboard, scrolling, and Dock settings.",permissions:"Observe the macOS permissions needed by selected features.",lan:"Discover aterm machines on the local network.",membership:"Admit this machine automatically under the LAN policy.",credentials:"Sync credentials from the available LAN provider.",fleet:"Keep this machine discoverable to other LAN members.",commons:"Make shared data available on this machine.",fabric:"Connect session messaging across the LAN.",repos:"Clone your repositories once credentials and Git are ready.",agents:"Make available agent accounts ready to use."};
function setup(value){scenario=value;engine=new LanWorkflow.Engine();selected="repos";if(value==="offline")engine.online=false;engine.reconcile();if(value==="permission")engine.permission(false);if(value==="retry")engine.fail("tools");if(value==="done")for(let i=0;i<18;i++)engine.tick();render();}
function select(id){selected=id;render();}
function sub(job){const deps=engine.blockers(job);if(job.state==="done")return "Verified";if(job.state==="retrying")return `Retrying automatically in ${Math.max(0,job.retryAt-engine.time)}s`;if(job.id==="lan"&&!engine.online)return "Waiting for this LAN";if(deps.length)return "Needs "+deps.map(id=>engine.get(id).name).join(" + ");if(job.state==="action")return "Grant access in macOS";if(job.state==="running")return job.id==="membership"?"Admitting automatically":"Working…";return engine.paused?"Paused by you":"Starts automatically";}
function task(job){return `<button class="task ${job.state} ${job.id===selected?"selected":""}" data-job="${job.id}" aria-pressed="${job.id===selected}"><span class="icon" aria-hidden="true">${icons[job.state]}</span><span><span class="name">${job.name}</span><div class="sub">${sub(job)}</div></span><span class="state">${labels[job.state]}</span></button>`;}
function node(id){const j=engine.get(id);return `<button class="node ${j.state}" data-job="${id}">${icons[j.state]} ${j.name}<span class="state">${labels[j.state]}</span></button>`;}
function graph(){return `<div class="dependency-view"><h2>What unlocks what</h2><p class="quiet">Each task starts when its incoming dependencies are verified.</p><div class="flow">${node("lan")}<span class="arrow">→</span>${node("membership")}</div><div class="flow"><span class="arrow">↳</span>${node("credentials")}<span class="arrow">→</span>${node("agents")}</div><div class="flow"><span class="arrow">↳</span>${node("fleet")}<span class="arrow">→</span>${node("fabric")}</div><div class="flow"><span class="arrow">↳</span>${node("commons")}</div><div class="divider"></div><div class="flow">${node("credentials")}<span class="arrow">+</span>${node("tools")}<span class="arrow">→</span>${node("repos")}</div><div class="divider"></div><h2>Independent work</h2><div class="flow">${node("shell")}${node("preferences")}${node("permissions")}</div></div>`;}
function render(){const focused=document.activeElement;const focusKey=focused&&focused.dataset&&(focused.dataset.job?"[data-job='"+focused.dataset.job+"']":focused.dataset.view?"[data-view='"+focused.dataset.view+"']":focused.id?"#"+focused.id:null);const done=engine.jobs.filter(j=>j.state==="done").length,running=engine.jobs.filter(j=>j.state==="running").length,waiting=engine.jobs.filter(j=>j.state==="waiting"||j.state==="retrying").length,action=engine.jobs.filter(j=>j.state==="action").length;
 $("headline").textContent=engine.complete()?"All 12 tasks verified":engine.paused?`Paused · ${done} of 12 done`:`${done} of 12 done`;
 $("subtitle").textContent=engine.complete()?"This Mac and its LAN features are ready.":engine.paused?"Resume whenever you’re ready.":"Setup continues automatically.";
 $("fill").style.width=(done/12*100)+"%";$("progress").setAttribute("aria-valuenow",done);
 $("metrics").innerHTML=`<span><b>${done}</b> done</span><span><b>${running}</b> running</span><span><b>${waiting}</b> waiting</span><span><b>${action}</b> need you</span>`;
 $("pause").textContent=engine.paused?"Resume":"Pause";$("pause").hidden=engine.complete();
 $("network").textContent=engine.online?"● LAN connected":"○ LAN unavailable";
 $("attention").innerHTML=action?`<div class="attention"><span>macOS needs permission. Everything else continues.</span><button id="grant">Open macOS settings</button></div>`:!engine.online?`<div class="attention"><span>Waiting for the LAN. Local setup continues.</span><button id="online">Simulate LAN return</button></div>`:"";
 if($("grant"))$("grant").onclick=()=>{engine.permission(true);render();};if($("online"))$("online").onclick=()=>{engine.online=true;engine.signal("lan");render();};
 document.querySelectorAll("[data-view]").forEach(b=>b.classList.toggle("active",b.dataset.view===view));
 if(view==="graph")$("tasks").innerHTML=graph();else{let html="";["This Mac","Your LAN","Development"].forEach(group=>{let all=engine.jobs.filter(j=>j.group===group),shown=all.filter(j=>view==="all"||j.state!=="done");if(shown.length)html+=`<div class="group"><div class="group-title">${group}<span>${all.filter(j=>j.state==="done").length}/${all.length} done</span></div><div class="rows">${shown.map(task).join("")}</div></div>`;});$("tasks").innerHTML=html||`<div class="empty">✓ Setup complete<br><button data-view="all" style="margin-top:15px">View all verified tasks</button></div>`;}
 const j=engine.get(selected),unlocks=engine.jobs.filter(k=>k.requires.includes(j.id));
 $("inspector").innerHTML=`<div class="over">Task details</div><h2>${j.name}</h2><div class="state ${j.state}" style="margin-bottom:13px">${icons[j.state]} ${labels[j.state]} · ${sub(j)}</div><p>${descriptions[j.id]}</p><div class="label">Requires</div>${j.requires.length?j.requires.map(id=>`<button class="dep" data-job="${id}"><span>${engine.get(id).name}</span><span>${engine.get(id).state==="done"?"✓ Done":"↳ "+labels[engine.get(id).state]}</span></button>`).join(""):"<p>Nothing. Runs independently.</p>"}<div class="label">Unlocks</div>${unlocks.length?unlocks.map(k=>`<button class="dep" data-job="${k.id}"><span>${k.name}</span><span>→</span></button>`).join(""):"<p>No dependent tasks.</p>"}<div class="activity"><div class="over">Recent activity</div>${engine.events.filter(e=>e.id===j.id).slice(0,3).map(e=>`<div class="event"><time>${e.time}s</time><span>${e.text}</span></div>`).join("")||"<p>Waiting to start.</p>"}</div><div class="quiet">${j.state==="done"?"Completion verified by reading back the result.":"Continues automatically when ready."}</div>`;
 document.querySelectorAll("[data-job]").forEach(b=>b.onclick=()=>select(b.dataset.job));document.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>{view=b.dataset.view;render();});if(focusKey){const restored=document.querySelector(focusKey);if(restored&&restored!==document.activeElement)restored.focus({preventScroll:true});}
}
$("pause").onclick=()=>{engine.paused=!engine.paused;engine.reconcile();render();};$("scenario").onchange=e=>setup(e.target.value);$("reset").onclick=()=>setup(scenario);$("restart").onclick=()=>{engine=new LanWorkflow.Engine(engine.snapshot());engine.reconcile();render();};
try{$("test-result").textContent=LanWorkflow.tests().length+" workflow checks passed";}catch(e){$("test-result").textContent="Check failed: "+e.message;}
setup("setup");setInterval(()=>{engine.tick();render();},1400);
</script>
</html>
