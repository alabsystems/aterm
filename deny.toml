#
# cargo-deny configuration for the aterm workspace.
# Offline supply-chain audit policy (`cargo deny --offline check`, schema v2).
# Enforced in verification by `targo --unverified forge check` (`[licenses] allow`
# under [OB-9], `[bans] deny` and `[sources]` under [OB-18]).

# Evaluate the dependency graph for all targets aterm actually supports, so the
# audit covers the macOS (objc2/metal), Linux (wayland/x11/drm), and Windows
# (windows-sys) backends of the GPU renderer rather than just the host triple.
[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
# Audit the default feature set. dev-dependencies stay in the graph and are
# therefore in scope for advisories and licensing.
all-features = false
no-default-features = false

# Security advisories (RustSec).
[advisories]
# RustSec advisory DB source. Cloned/refreshed out-of-band; `--offline` reuses
# the local checkout without fetching. (Crates with a known vulnerability are
# ALWAYS an error in cargo-deny v2 — there is no knob to downgrade that, which
# is exactly the conservative behaviour we want.)
db-urls = ["https://github.com/rustsec/advisory-db"]
# Fail the audit if any resolved crate version has been yanked from the registry
# (a strong supply-chain signal for an offline/pinned tree).
yanked = "deny"
# Surface unmaintained / unsound advisories across the whole graph so nothing
# hides in a transitive dep, but treat them as informational (they do not, on
# their own, fail the audit the way a vulnerability or yank does).
unmaintained = "all"
unsound = "all"
# No advisories are ignored. If a future advisory needs a vetted, time-boxed
# exception, add its RUSTSEC id here with a comment explaining why and the plan
# to remove it — never blanket-ignore.
ignore = []

# License policy: Apache-2.0-compatible permissive allowlist.
# Dual-licensed crates with `LGPL-2.1-or-later` (`r-efi`) or `Unlicense`
# (`aho-corasick`, `memchr`, `walkdir`, `same-file`, `termcolor`, `winapi-util`)
# are satisfied via their `MIT` / `Apache-2.0` arms.
[licenses]
# Permissive licenses present in (and required by) the resolved tree. Each line
# notes a representative crate that pulls the license in without a permissive
# OR-alternative, i.e. the reason it MUST be on the list.
allow = [
    "Apache-2.0",   # workspace license + many deps
    "MIT",          # the dominant permissive license in the tree
    "BSD-2-Clause", # zerocopy (also MIT OR Apache-2.0); arrayref left at LW.5
    "BSD-3-Clause", # subtle; tiny-skia and tiny-skia-path left at LW.5
    "CC0-1.0",      # hexf-parse
    "ISC",          # libloading
    "Unicode-3.0",  # unicode-ident: "(MIT OR Apache-2.0) AND Unicode-3.0"
    "Zlib",         # foldhash, slotmap
]
# Per-crate license exceptions.
exceptions = []
# Confidence required for the license-text matcher to accept a crate's declared
# license. 0.8 is cargo-deny's default; keep it strict.
confidence-threshold = 0.8
# Dependency bans and version hygiene.
[bans]
multiple-versions = "warn"
# A wildcard ("*") version requirement is a supply-chain hazard (it floats to
# whatever happens to resolve) — forbid it.
wildcards = "deny"
# ...but allow wildcard requirements between the workspace's own path crates
# (the internal aterm-* members reference each other by path, not by a pinned
# registry version), which are not a registry-floating risk.
allow-wildcard-paths = true
# `atpkg` depends directly on `ring` (>= 0.17.14) for Ed25519 manifest
# verification (`index.toml` / `pkg.toml`) and OpenPGP RSA digest verification.
#
# First-party crates use `aterm_uds::rand` for CSPRNG entropy. `getrandom` 0.2
# is patched to `crates/aterm-getrandom` (`aterm_uds::rand`) for `ring`;
# `fastrand` is restricted to the listed third-party parents.
deny = [
    { name = "ring", version = "<0.17.14", reason = "atpkg's load-bearing Ed25519 and OpenPGP RSA verify root (TOOLCHAIN-PACKAGE-MANAGER.md S8/S13): never allow it to drift below the audited, vendored floor on the verify path" },
    { name = "getrandom", wrappers = ["ring"], reason = "entropy comes from aterm_uds::rand; getrandom is its first-party facade (crates/aterm-getrandom), admitted only as ring's seed source" },
    { name = "fastrand", wrappers = ["async-executor", "futures-lite", "phf_generator", "piper"], reason = "entropy comes from aterm_uds::rand; the Linux stack's own uses (phf's table generator, the wayland async helpers) are the admitted parents" },
    { name = "rand", reason = "entropy comes from aterm_uds::rand" },
    { name = "rand_core", reason = "entropy comes from aterm_uds::rand" },
    { name = "rand_chacha", reason = "entropy comes from aterm_uds::rand" },
    { name = "aterm-phase", wrappers = ["aterm-gui", "aterm-agent"], reason = "the vendor screen reader runs in the server: the fabric (aterm-link) and every other crate reach it only through aterm-gui or aterm-agent" },
]
# Crates explicitly allowed to appear more than once (none pinned yet — the
# warn-level policy above already keeps duplicates non-fatal).
skip = []
# Subtrees whose internal duplicates are ignored wholesale (none needed yet).
skip-tree = []

# Sources: only crates.io is permitted; unknown registries and git sources are denied.
[sources]
unknown-registry = "deny"
unknown-git = "deny"
# The only registry aterm draws from.
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# No git sources are permitted (the workspace's only path deps are the internal
# aterm-* crates, which are not "sources" in cargo-deny's sense).
allow-git = []
