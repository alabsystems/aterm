[workspace]
members = ["crates/*"]
# What a bare `targo --unverified build|check|test` at the root builds: every member
# but the publication tools (the cutter, the Windows signer, the atpkg producer and keys,
# the forge) and the check runners (aterm-verify, aterm-census, the libc and Win32 oracles, the perf
# harnesses, the real-Claude lab), which run from source under their own aliases, and the
# contract probe, which `verify test -p aterm-contract-probe` names. `--workspace` (what
# `verify --all` and `verify release` pass) and `-p` reach every member. A new crate is
# listed here unless it is one of those tools.
default-members = [
    "crates/aterm", "crates/aterm-a11y", "crates/aterm-agent", "crates/aterm-alloc", "crates/aterm-arrayvec",
    "crates/aterm-bidi", "crates/aterm-bits", "crates/aterm-buffer",
    "crates/aterm-cap",
    "crates/aterm-cfg-if", "crates/aterm-cg", "crates/aterm-cli", "crates/aterm-codec",
    "crates/aterm-conformance", "crates/aterm-containment", "crates/aterm-control",
    "crates/aterm-core", "crates/aterm-ctl",
    "crates/aterm-dbus", "crates/aterm-digest", "crates/aterm-dirfd", "crates/aterm-dl", "crates/aterm-durable",
    "crates/aterm-document-features",
    "crates/aterm-effects", "crates/aterm-font", "crates/aterm-getrandom", "crates/aterm-gpu",
    "crates/aterm-gpu-web", "crates/aterm-grapheme", "crates/aterm-grid",
    "crates/aterm-gui", "crates/aterm-gui-consent", "crates/aterm-gui-documents",
    "crates/aterm-gui-fabric", "crates/aterm-gui-tabs", "crates/aterm-gui-timing",
    "crates/aterm-hash", "crates/aterm-http", "crates/aterm-json",
    "crates/aterm-keeper", "crates/aterm-lexicon", "crates/aterm-libc", "crates/aterm-libm",
    "crates/aterm-link", "crates/aterm-log", "crates/aterm-machines", "crates/aterm-log-shim", "crates/aterm-lz4",
    "crates/aterm-macro-support", "crates/aterm-messages", "crates/aterm-objc",
    "crates/aterm-models-atpkg", "crates/aterm-models-core", "crates/aterm-models-effects",
    "crates/aterm-models-gui", "crates/aterm-models-harness", "crates/aterm-models-misc",
    "crates/aterm-models-native", "crates/aterm-models-release", "crates/aterm-models-render",
    "crates/aterm-models-session", "crates/aterm-models-update",
    "crates/aterm-observe", "crates/aterm-once-cell", "crates/aterm-parser",
    "crates/aterm-phase", "crates/aterm-png", "crates/aterm-policy", "crates/aterm-predict",
    "crates/aterm-primer", "crates/aterm-profiling", "crates/aterm-provenance",
    "crates/aterm-pty", "crates/aterm-regex", "crates/aterm-render", "crates/aterm-restore",
    "crates/aterm-rle",
    "crates/aterm-sandbox", "crates/aterm-scene", "crates/aterm-scrollback",
    "crates/aterm-search", "crates/aterm-selection", "crates/aterm-serde", "crates/aterm-serde-derive",
    "crates/aterm-session", "crates/aterm-shell-integration", "crates/aterm-sixel", "crates/aterm-slog",
    "crates/aterm-smallvec", "crates/aterm-spec", "crates/aterm-spec-anchor", "crates/aterm-spec-macros",
    "crates/aterm-spec-models", "crates/aterm-sysprobe", "crates/aterm-tempfile",
    "crates/aterm-theme-pack", "crates/aterm-time", "crates/aterm-toml", "crates/aterm-toolchain",
    "crates/aterm-tracing", "crates/aterm-types", "crates/aterm-uds",
    "crates/aterm-unicode-width", "crates/aterm-update", "crates/aterm-update-core",
    "crates/aterm-wasm", "crates/aterm-wasm-abi", "crates/aterm-wasm-abi-macros", "crates/aterm-wayland",
    "crates/aterm-win32", "crates/aterm-window",
    "crates/aterm-x11", "crates/aterm-xkb",
    "crates/aterm-windows-sys-052", "crates/aterm-winit-keymap", "crates/aterm-winres",
    "crates/aterm-zstd", "crates/atpkg",
]
# vendor/astream is a submodule with its own workspace; its crates are path
# dependencies of aterm-link and inherit package fields from its root manifest.
#
# crates/aterm-windows-sys is excluded because it is the package `windows-sys`
# 0.61.2 and crates/aterm-windows-sys-052 is `windows-sys` 0.52.0: cargo refuses
# two members of one name. It is its own root (a `[workspace]` stub, as a
# vendored fork has), and the `windows-sys` patch row reaches it by path.
exclude = ["vendor/astream", "crates/aterm-windows-sys"]
resolver = "2"

# The executable surface read by `atpkg-publish pack`: `expose` names commands
# shimmed onto PATH; `bundle` names additional executables shipped without shims.
# aterm dispatches its verbs in-process, so no sibling executable is bundled.
# Producer, signing and check-runner binaries are development tools only.
[workspace.metadata.atpkg]
expose = ["aterm"]
bundle = []

# The public OWNER/REPO the release cutter publishes to. Installed copies read
# the same slug from aterm_update_core::DEFAULT_OWNER/DEFAULT_REPO, which
# aterm-release's channel tests hold equal to this key. Distinct from
# `repository`, the private source repo. Authenticity comes from the pinned keys
# in aterm-update-core::pins, not from where the bytes are hosted.
[workspace.metadata.aterm]
update_channel = "alabsystems/aterm"

[workspace.package]
version = "0.106.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/alabsystems/aterm"
authors = ["Andrew Yates"]
description = "aterm — a fast, hardened terminal engine"

[workspace.dependencies]
# First-party serde (docs/AUDIT-third-party-2026-10-15.md SP.6): the traits, the
# std impls aterm's models use and the Content buffer behind tag/untagged/flatten
# (crates/aterm-serde, carved from serde_core + serde 1.0.228), and the syn-free
# derive over aterm's closed attribute set (crates/aterm-serde-derive on
# crates/aterm-macro-support). Every member still writes `serde` and
# `use serde::{Deserialize, Serialize}`; the rename is this row's alone. It is a
# workspace row, never a [patch.crates-io] one: on linux zbus/zvariant keep
# registry serde until A11Y.5, and no type crosses between the two.
# The row carries no `derive`: a member that writes `#[derive(Serialize)]` asks
# for it on its own row (`features = ["derive"]`), so a crate that only
# implements or drives the traits (aterm-json, aterm-toml) keeps the derive's
# proc macro out of its normal closure, which Trust's loader (PM-1) refuses
# (docs/PLAN-pm1-proc-macro-reach-2026-10-16.md, increment 1).
# Optional feature in aterm-types and aterm-core.
serde = { package = "aterm-serde", path = "crates/aterm-serde" }
# Resolves to crates/aterm-libc through [patch.crates-io] below.
libc = "0.2"
# TLS for aterm-http; `ring` backend, no aws-lc C build.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# ring: the bridge half of the KEEP pair under rustls
# (docs/AUDIT-third-party-2026-10-15.md). One row, one version floor, for every
# direct edge. DEFAULT FEATURES OFF: each member names what its edge needs
# (verify-only edges none, atpkg `alloc` for RSA, the signing tool and the test
# builds `default`).
ring = { version = "0.17.14", default-features = false }
# crates/aterm-window, aterm's own windowing crate (absorbed from upstream winit
# 0.30.13; see NOTICE). Its package is still named `winit`, which accesskit_winit, a
# registry crate, required until the first-party AT-SPI publisher replaced it (A11Y.4);
# the rename is winit-core step 7 (docs/AUDIT-third-party-2026-10-15.md).
# Used by aterm-gui and aterm-winit-keymap only; never an optional dependency of a
# platform-free crate.
winit = { path = "crates/aterm-window" }

# --- internal aterm crates ---
# The accessibility tree model and the AT-SPI publisher (A11Y.4-5): Linux screen
# readers read aterm's tree through it, over aterm-dbus; it replaced accesskit,
# accesskit_consumer, accesskit_atspi_common, atspi-common, accesskit_winit,
# accesskit_unix and zbus.
aterm-a11y = { path = "crates/aterm-a11y" }
aterm-agent = { path = "crates/aterm-agent" }
aterm-alloc = { path = "crates/aterm-alloc" }
aterm-bidi = { path = "crates/aterm-bidi" }
aterm-bits = { path = "crates/aterm-bits" }
aterm-cap = { path = "crates/aterm-cap" }
aterm-census = { path = "crates/aterm-census" }
aterm-cg = { path = "crates/aterm-cg" }
aterm-codec = { path = "crates/aterm-codec" }
aterm-containment = { path = "crates/aterm-containment" }
aterm-control = { path = "crates/aterm-control" }
aterm-core = { path = "crates/aterm-core" }
# First-party D-Bus (A11Y.3): the wire format, SASL EXTERNAL and a blocking unix
# client, held to bytes recorded once from zbus/zvariant. aterm-a11y's AT-SPI
# publisher runs on it in zbus's place (A11Y.4).
aterm-dbus = { path = "crates/aterm-dbus" }
aterm-digest = { path = "crates/aterm-digest" }
# dlopen tables for the Linux windowing libraries (LW.6): libxcb, libX11,
# libwayland-client and libxkbcommon read at run time, by versioned soname.
aterm-dl = { path = "crates/aterm-dl" }
# Fd-relative POSIX directory operations (openat/fstat/mkdirat/renameat[2 or
# renameatx_np]/unlinkat/linkat/fchmod/fsync + a readdir stream) over `libc`,
# which was already in the graph. Replaces `rustix`, 72,832 lines across 2
# packages (with `errno`) for a dozen wrappers used by exactly two files. The
# property it exists to keep is TOCTOU safety: every operation is fd-relative
# and re-resolves no path, so a same-uid process cannot swap an ancestor between
# a check and the use.
aterm-dirfd = { path = "crates/aterm-dirfd" }
# How a write is finished: durable (F_FULLFSYNC on Apple) or ordered (F_BARRIERFSYNC,
# through vendor/astream's astream-sys), with a counting seam for tests.
aterm-durable = { path = "crates/aterm-durable" }
aterm-effects = { path = "crates/aterm-effects" }
# First-party font reader and shaper (docs/AUDIT-third-party-2026-10-15.md
# TF.3, TF.5 and TF.6): the sfnt tables aterm-render reads, carved from
# ttf-parser 0.25.1, and the GSUB shaper it shapes runs with, carved from
# rustybuzz 0.20.1; aterm-render names neither upstream crate. ttf-parser
# stayed in the linux cells under sctk-adwaita's ab_glyph until LW.5 took
# both out (the chrome band is the Wayland header now). Default
# features off: its `hint` feature (the TF.4 autohinter, carved from skrifa
# 0.46.2) is on by default for the crate's own tests, and a consumer asks for
# it where it grid-fits (aterm-render, on Linux and Windows).
aterm-font = { path = "crates/aterm-font", default-features = false }
aterm-forge = { path = "crates/aterm-forge" }
aterm-gpu = { path = "crates/aterm-gpu" }
aterm-grapheme = { path = "crates/aterm-grapheme" }
aterm-grid = { path = "crates/aterm-grid" }
# The window's split-out libraries, below aterm-gui (each re-exported there under
# its old module path): the access card, the document models, the fabric
# endpoint, the tab model, and the one timing value of the fabric's and the
# harness host's waits.
aterm-gui-consent = { path = "crates/aterm-gui-consent" }
aterm-gui-documents = { path = "crates/aterm-gui-documents" }
aterm-gui-fabric = { path = "crates/aterm-gui-fabric" }
aterm-gui-tabs = { path = "crates/aterm-gui-tabs" }
aterm-gui-timing = { path = "crates/aterm-gui-timing" }
aterm-hash = { path = "crates/aterm-hash" }
# First-party deadline-bounded TLS stream (the harness network probe's
# handshake). Certificates verify against the OS trust store
# (`crates/aterm-http/src/verifier.rs`), never a root set compiled into the
# binary.
aterm-http = { path = "crates/aterm-http" }
# First-party JSON: a serde Deserializer/Serializer plus the untyped `Value`
# and `json!`. Replaces `serde_json` and `zmij`, the float formatter behind it —
# 2 packages, 24,936 lines — across aterm-gui, aterm-update, aterm-release and
# atpkg.
aterm-json = { path = "crates/aterm-json" }
aterm-keeper = { path = "crates/aterm-keeper" }
aterm-lexicon = { path = "crates/aterm-lexicon" }
aterm-log = { path = "crates/aterm-log" }
aterm-lz4 = { path = "crates/aterm-lz4" }
# The syn-free parser and template layer aterm's proc macros share, and the
# first-party serde derive on it (docs/AUDIT-third-party-2026-10-15.md SP.5).
aterm-machines = { path = "crates/aterm-machines" }
aterm-macro-support = { path = "crates/aterm-macro-support" }
aterm-messages = { path = "crates/aterm-messages" }
# The models, one crate per domain: only the crates whose tests drive a domain's models
# dev-depend on it. `aterm-models` (every domain, spec-check) is a check crate.
aterm-models = { path = "crates/aterm-models" }
aterm-models-atpkg = { path = "crates/aterm-models-atpkg" }
aterm-models-core = { path = "crates/aterm-models-core" }
aterm-models-effects = { path = "crates/aterm-models-effects" }
aterm-models-gui = { path = "crates/aterm-models-gui" }
aterm-models-harness = { path = "crates/aterm-models-harness" }
aterm-models-misc = { path = "crates/aterm-models-misc" }
aterm-models-native = { path = "crates/aterm-models-native" }
aterm-models-release = { path = "crates/aterm-models-release" }
aterm-models-render = { path = "crates/aterm-models-render" }
aterm-models-session = { path = "crates/aterm-models-session" }
aterm-models-update = { path = "crates/aterm-models-update" }
aterm-objc = { path = "crates/aterm-objc" }
aterm-observe = { path = "crates/aterm-observe" }
aterm-parser = { path = "crates/aterm-parser" }
aterm-phase = { path = "crates/aterm-phase" }
# First-party PNG: chunk structure, the five filters, Adam7, and a DEFLATE
# COMPRESSOR — the half `aterm-codec` never had. Replaces `png`, which was the
# largest single import left in the shipped graph at 7 packages / 33,439 lines
# (`png` + `flate2` + `miniz_oxide` + `fdeflate` + `simd-adler32` + `crc32fast`
# + `adler2`), most of it a SECOND compression stack beside the inflate aterm
# already owned.
aterm-png = { path = "crates/aterm-png" }
aterm-policy = { path = "crates/aterm-policy" }
aterm-predict = { path = "crates/aterm-predict" }
aterm-primer = { path = "crates/aterm-primer" }
aterm-provenance = { path = "crates/aterm-provenance" }
aterm-pty = { path = "crates/aterm-pty" }
# The workspace regular-expression engine: parse → NFA → bounded Pike VM,
# first-party and dependency-free. Replaces `regex`, the largest single import
# left in the shipped graph at 4 packages / 158,471 lines of third-party source
# (regex 11,973 + regex-automata 67,074 + regex-syntax 58,501 + aho-corasick
# 20,923) for a surface of six call sites — `Regex::new`, the
# `size_limit`/`dfa_size_limit` builder, `find_iter`, `is_match` and
# `Error::Syntax`.
#
# It is a replacement and not a reduction: `regex` is a finite-automaton engine
# with a linear-time guarantee, no backreferences and no look-around, and
# leftmost-first semantics — a Pike VM has exactly those properties, which is why
# the size ceilings the call sites already pass carry over unchanged. Patterns
# here are user input (selection rules, `await match <re>`, the search verb), so
# the engine is bounded on every axis: a byte ceiling on the compiled program,
# re-checked per instruction; a 250-level nesting cap; and linear match time.
aterm-regex = { path = "crates/aterm-regex" }
aterm-render = { path = "crates/aterm-render" }
# Crash restore, headless (the crash-restore plan): the journal region's layout, records,
# writer, keyframe policy and recovery. No file, thread, socket or clock.
aterm-restore = { path = "crates/aterm-restore" }
aterm-rle = { path = "crates/aterm-rle" }
aterm-sandbox = { path = "crates/aterm-sandbox" }
aterm-scene = { path = "crates/aterm-scene" }
aterm-scrollback = { path = "crates/aterm-scrollback" }
aterm-search = { path = "crates/aterm-search" }
aterm-selection = { path = "crates/aterm-selection" }
aterm-serde-derive = { path = "crates/aterm-serde-derive" }
aterm-session = { path = "crates/aterm-session" }
aterm-shell-integration = { path = "crates/aterm-shell-integration" }
aterm-sixel = { path = "crates/aterm-sixel" }
# The session log's engine (docs/DESIGN-session-log-2026-10-15.md): records,
# the bounded per-session ring, the turn tracker, the fold and `brief`. No
# clock, file, thread or socket: the host hands it a `Stamp`.
aterm-slog = { path = "crates/aterm-slog" }
aterm-spec = { path = "crates/aterm-spec", features = ["anchors"] }
# The anchor attributes' registry, std-only; `macros` re-exports the attributes
# every anchored crate writes (PM-1 keeps them off for `-p aterm-spec-anchor`).
aterm-spec-anchor = { path = "crates/aterm-spec-anchor", features = ["macros"] }
aterm-spec-macros = { path = "crates/aterm-spec-macros" }
aterm-spec-models = { path = "crates/aterm-spec-models" }
aterm-sysprobe = { path = "crates/aterm-sysprobe" }
aterm-tempfile = { path = "crates/aterm-tempfile" }
aterm-theme-pack = { path = "crates/aterm-theme-pack" }
# The workspace clock (retired `web-time`): EXACTLY `std::time` on native — a
# re-export, so the engine is byte-identical to one written against std — and a
# performance.now()/Date.now() shim on wasm32, where `std::time::Instant::now()`
# panics "time not implemented". Ten crates sample a clock; this is the one seam
# they all go through, and being first-party it can be verified with the rest of
# the tree instead of trusted.
aterm-time = { path = "crates/aterm-time" }
# TOML 1.0.0, first-party, in two halves: a `serde::Deserializer`/`Serializer`
# replacing `toml`, and a comment-preserving document model replacing
# `toml_edit`. MEASURED by `forge survey` before and after: SIX packages and
# 64,783 lines of third-party source left EVERY cell — toml_edit 0.22.27,
# winnow 0.7.15, toml_write 0.1.2, toml 0.8.23, and serde_spanned +
# toml_datetime, which the planning estimate missed because they are reached
# only through `toml` itself. mac-arm: 136 -> 130 third-party packages,
# 1,871,883 -> 1,807,100 lines.
#
# It also RETIRED A VENDORED FORK, which is the part that matters beyond the
# line count. `winnow`'s only parent in this graph was `toml_edit` (verified
# with `cargo tree -i -p winnow@0.7.15`), and aterm carried a patched copy at
# vendor/winnow to fix an `offset_from` divide-by-zero and underflow. Retiring
# toml_edit took the fork with it — the vendored tree, its [patch.crates-io]
# entry, its NOTICE line and its [[fork]] block in vendor/forge.toml (which
# aterm-census's scan_set reads) — leaving five forks where there were six,
# and one fewer piece of third-party code this repository must keep reviewing
# forever in order to read a config file.
#
# It is a serde `Deserializer`, deliberately: the `from_str` call sites stand on
# `#[derive(Deserialize)]` models (about 325 derive sites today), so the
# replacement had to BE one. serde itself is first-party since SP.6 (the
# `serde` row at the top of this table).
aterm-toml = { path = "crates/aterm-toml" }
# The toolchain, one std-only source: discovery, rustup, the build-cache rule, the
# gone-checkout rule and the lease core (atpkg re-exports each under its old path).
aterm-toolchain = { path = "crates/aterm-toolchain" }
aterm-types = { path = "crates/aterm-types" }
aterm-uds = { path = "crates/aterm-uds" }
aterm-update = { path = "crates/aterm-update" }
aterm-update-core = { path = "crates/aterm-update-core" }
aterm-verify = { path = "crates/aterm-verify" }
# The host boundary of the two wasm modules, with no third-party dependency:
# the `console.error` panic hook (docs/AUDIT-third-party-2026-10-15.md, WP.3)
# and the export layer that replaces wasm-bindgen, with its syn-free
# `#[export]` (WP.6).
aterm-wasm-abi = { path = "crates/aterm-wasm-abi" }
aterm-wasm-abi-macros = { path = "crates/aterm-wasm-abi-macros" }
# The Win32 declarations aterm's Windows graph reads, generated from
# windows-sys 0.61.2 at upstream's paths with no dependency; the `windows-sys`
# row below re-exports them (docs/AUDIT-third-party-2026-10-15.md, WB.3).
aterm-win32 = { path = "crates/aterm-win32" }
aterm-winit-keymap = { path = "crates/aterm-winit-keymap" }
# First-party Wayland (LW.6): protocol tables generated from the protocol
# descriptions and held to wayland-scanner's, and a runtime over
# libwayland-client opened at run time (the CPU presenter's wl_shm).
aterm-wayland = { path = "crates/aterm-wayland" }
# First-party X11 (LW.6): the wire codec held to x11rb-protocol's recorded
# bytes, a libxcb transport opened at run time, ICCCM and Xrm. The winit fork's
# X11 backend speaks through it since LW.7.
aterm-x11 = { path = "crates/aterm-x11" }
# First-party libxkbcommon (LW.6): keymaps, states, compose and the X11 keymap,
# read at run time, and the keysyms the Linux key handling names.
aterm-xkb = { path = "crates/aterm-xkb" }
aterm-winres = { path = "crates/aterm-winres" }
# First-party Zstandard: XXH64 and the raw-block frame writer atpkg's test
# fixtures use (docs/AUDIT-third-party-2026-10-15.md ZC.3), and the decoder
# carved from ruzstd 0.8.3 (ZC.4) that atpkg's extractor reads .tar.zst with
# (ZC.5) and atpkg-publish reads every pack back through. It replaced the
# zstd / zstd-safe / zstd-sys family, whose workspace row left at ZC.6; the
# packs themselves are compressed by the `zstd` CLI.
aterm-zstd = { path = "crates/aterm-zstd" }
atpkg = { path = "crates/atpkg" }
atpkg-keys = { path = "crates/atpkg-keys" }
atpkg-publish = { path = "crates/atpkg-publish" }
# First-party replacements published under the upstream package names; third-party
# crates reach them through [patch.crates-io]. A root row lets a member write
# `<name> = { workspace = true }`, which aterm_census::scan_set requires.
tracing = { path = "crates/aterm-tracing" }
profiling = { path = "crates/aterm-profiling" }
cfg-if = { path = "crates/aterm-cfg-if" }
# The first-party `arrayvec` replacement, DIRECTORY crates/aterm-arrayvec but
# PACKAGE `arrayvec` — same reason as the three rows above. It is a pure
# re-export of `aterm_alloc::ArrayVec`, which aterm's VT parser has used on
# every byte of terminal output since long before the shim existed; the four
# consumers (naga, wgpu, wgpu-core and wgpu-hal; tiny-skia's Linux edge left
# with sctk-adwaita at LW.5) reach it through [patch.crates-io], not through
# this row.
# It exists so `grep arrayvec Cargo.toml` finds the crate, and so a member that
# ever wants the shim can write `arrayvec = { workspace = true }` without
# tripping the census's hard error on a `workspace = true` edge with no root row.
arrayvec = { path = "crates/aterm-arrayvec" }
once_cell = { path = "crates/aterm-once-cell" }
log = { path = "crates/aterm-log-shim" }
# crates/aterm-smallvec is package `smallvec`: upstream's `SmallVec<[T; N]>`
# over `aterm_alloc::SmallVec<T, N>`. Consumers reach it through
# [patch.crates-io]; the row is here for the same reason as `arrayvec`'s.
smallvec = { path = "crates/aterm-smallvec" }

# The tree is kept clean under
# `targo-tippy --workspace --all-targets --keep-going -- -D warnings`.
# Lints warn, never deny: `verify lint` (-D warnings) enforces them, so a build
# or a test run never fails on one.
[workspace.lints.rust]
# Already the edition-2024 default; set for the 2021-edition members.
unsafe_op_in_unsafe_fn = "warn"
# Centralized known-cfg superset (was declared per-crate). The Trust lanes gate
# code behind these cfgs. Declaring the union here keeps `unexpected_cfgs`
# honest in every crate from one place — an undeclared cfg name warns, which
# `-D warnings` makes an error. `clean_islands` is not here: a crate declares it
# from its build script (crates/aterm-log/clean_islands.rs), so a crate that uses
# it without asking the compiler warns.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(trust_verify)', 'cfg(trust_seals)', 'cfg(trust_binding)'] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
ignore_without_reason = "warn"

# Line tables keep file:line backtraces with much smaller test binaries.
# build-override below matches.
[profile.dev]
debug = "line-tables-only"

# THE SPEED ROWS BELOW ARE THE TEST LOOP'S, NEVER THE TRUST LANE'S (2026-10-01).
# `targo trust check` (`ship trust run`, aterm-release trust_lane.rs) compiles
# under its own profile, `trust-lane`: dev at opt-level 0 with every
# `[profile.dev.package.<name>]` row here zeroed by name — the lane reads them
# from this file, so a row added below needs nothing else. Optimized,
# rustc's MIR inliner pastes std's slice-iterator and NonNull internals into
# every caller and the verifier loses proofs with no source changed (aterm-spec
# 146 -> 76 proved at opt-level 1, aterm-png 285 -> 221 at 2), and a custom
# profile inherits these rows, a named one outranking `package."*"` — measured.

# Hot test paths optimized in dev; debug assertions and overflow checks stay on.
[profile.dev.package.aterm-census]
opt-level = 2

[profile.dev.package.aterm-regex]
opt-level = 2

# aterm-png at opt-level 2 in dev (2026-09-23, gate speed): its tests decode
# the repository's PNG corpus and an every-colour-type/depth/interlace matrix,
# and unoptimized that was the slowest suite of its stage. The trust lane's own
# profile zeroes it (above), so it decides no proof.
[profile.dev.package.aterm-png]
opt-level = 2

# THE FONT TABLE READER AT OPT-LEVEL 2 IN DEV (gate speed). Only opt-level
# moves; debug assertions and overflow checks stay on, and the trust lane zeroes
# the row. Two measurements put it here, each the same machine and load class:
# - 2026-09-30, when the reader was ttf-parser (under its own row): every chrome
#   text measurement in aterm-gui's tests goes through the reader's kern lookups
#   (`tray_raster::ui_text_width_for`), and `sample` put 85% of the Dynamic Type
#   settings tests' child CPU in that unoptimized code. Measured A then B twice:
#   the two Dynamic Type tests 19.6 / 18.5 s -> 6.8-7.0 / 8.1-8.2 s; the whole
#   `-p aterm-gui --lib` run 255 -> 187 CPU-s (6886 passed). Cost: a one-time
#   67 s rebuild of what sits above it.
# - 2026-10-15 (TF.3 of docs/AUDIT-third-party-2026-10-15.md): aterm-font's own
#   suite replays the TF.1 reader corpus over every face the host has (every
#   glyph's outline at every recorded instance) and mutation-fuzzes a face per
#   outline format with overflow checks on. `-p aterm-font`: font_suite 71.8 ->
#   2.9 s, and at 2 the never-panic fuzz still reports a planted overflow
#   (upstream's unchecked CFF stack pop: "attempt to subtract with overflow").
# TF.5 moved the renderer's reads (those kern lookups among them) here and TF.6
# the shaper, so TF.7 deleted the ttf-parser row: ttf-parser was left only on
# Linux, where sctk-adwaita's ab_glyph read it for Wayland decoration titles,
# and LW.5 took that out too.
[profile.dev.package.aterm-font]
opt-level = 2

# THE RENDERER AT OPT-LEVEL 2 IN DEV (2026-10-05, gate speed). The gate's
# busiest-binaries table put `-p aterm-effects --test effects_suite` first, 525
# of 2,117 test CPU-s, and `sample` put half of it (96% of `moves_are_followed`)
# in this crate's frame code at opt-level 0 (`ribbon_beam_ordered`,
# `ribbon_profile`, the premultiplied blends). Only opt-level moves; debug
# assertions and overflow checks stay on. At 2, not 1, it also stops linking
# other crates' opt-level-0 generic copies (share-generics is off above 1).
# Measured 0 / 1 / 2, runs interleaved, every test binary of this crate and the
# crates above it (12,007 passed at each): effects_suite 533 -> 277 -> 240 CPU-s
# (49 -> 28 -> 21 s), aterm-gui --lib 261 -> 255 -> 232, aterm-effects --lib
# 109 -> 103 -> 101, render_suite 19 -> 11 -> 6; all of them 1,083 -> 782 -> 707
# CPU-s. Cost: the lib compiles in 5.1-5.3 s instead of 1.5 (an incremental edit
# 4.8 s instead of 1.2); the crates above it compile as before.
[profile.dev.package.aterm-render]
opt-level = 2

# THE ENGINE AND ITS GRID AT OPT-LEVEL 2 IN DEV (2026-10-05, gate speed). With
# the renderer optimized (above), `sample` put a third of what is left of
# effects_suite in these two at opt-level 0 (`GlowQuad::is_flat`,
# `GlowQuad::damage_words`, the cell frame). Only opt-level moves. Measured
# with aterm-render at 2, interleaved, four runs each: effects_suite 240 -> 139
# CPU-s (21 -> 13 s), aterm-effects --lib 101 -> 92, aterm-gui --lib 232 -> 220;
# their own tests 65 -> 18 CPU-s (the fuzzers, now in core_suite, 37 -> 7). Cost: aterm-core's lib
# compiles in 4.6 s instead of 1.6, aterm-grid's in 3.3 instead of 1.0.
[profile.dev.package.aterm-core]
opt-level = 2

[profile.dev.package.aterm-grid]
opt-level = 2

[profile.dev.package.aterm-spec]
opt-level = 1

# THE PAINT SCANNER AND ITS PNG INFLATE AT OPT-LEVEL 2 IN DEV (gate speed).
# The MEASURE rows decode and scan every frame of a take (a recorded row is
# ~500 frames) inside the test binary. Measured on one 507-frame take at a load
# of ~80: decode 5.4 s -> 0.4 s (aterm-codec's inflate) and scan 6.7 s -> 0.7 s
# (aterm-conformance). Cost: the vt suite builds in 2.5 s instead of 1.4.
[profile.dev.package.aterm-conformance]
opt-level = 2

[profile.dev.package.aterm-codec]
opt-level = 2

# NO DEBUG INFO IN TEST EXECUTABLES. Line tables leave every codegen unit's object
# file in `deps/`, which pushes a build dir past the six figures AGENTS.md allows (a
# fresh test binary's first WindowServer contact makes `tccd` read the whole
# directory). The test profile only: `targo build|run` binaries keep the dev
# profile's line tables, and so share no unit with `targo test`; `verify` builds what
# it drives under this profile too (docs/PROCESS.md). A test backtrace names
# functions, not lines; rebuild one binary with
# `--config profile.test.debug="line-tables-only"` to get them back.
[profile.test]
debug = false

[profile.test.package.aterm-effects]
opt-level = 1

[profile.dev.build-override]
debug = "line-tables-only"

[profile.release]
# Aggressive size+speed, functionality-preserving: fat LTO (whole-program
# optimization across crates → smaller + often faster) + strip symbols. NOT
# panic="abort" — aterm relies on catch_unwind for panic isolation, which abort
# would break.
#
# opt-level is left at the default 3 BY DELIBERATE OWNER DECISION (2026-06-14):
# opt-level="s" was measured to shrink aterm-gui 6.74 → 5.48 MB (-18.7%) but cost
# -12.5% flood throughput (166 → 146 MiB/s). aterm stays #1 of 5 on BOTH axes either
# way (next-smallest competitor 13.3 MB; next-fastest 102 MiB/s), so the owner kept
# the throughput crown — the binary already crushes every competitor on size. Do
# not switch to "s"/"z" without re-confirming this tradeoff is wanted.
lto = true
codegen-units = 1
strip = true

[profile.release.package.aterm-wasm]
opt-level = "z"

[profile.release.package.aterm-gpu-web]
opt-level = "z"

# Release semantics without LTO, for lanes that only need an optimized build.
[profile.gate]
inherits = "release"
lto = false
codegen-units = 16
opt-level = 1

[profile.profiling]
inherits = "release"
strip = false
debug = 1

# AN OPTIMIZED TEST BUILD THAT KEEPS THE DEBUG-GATED SEAMS:
# `targo --unverified test --profile opt-test …`. Release code generation with
# debug assertions on, which compile in the conformance and test seams a plain
# `--release` leaves out. Without fat LTO or a single codegen unit: those make
# every test binary a release link and buy a test nothing.
#
# THE FABRIC LANE'S OPT ARM BUILDS WITH IT (`verify perf fabric --profile opt`),
# which is why it inherits `release` and not `dev`: a profile inheriting `dev`
# keeps the `[profile.dev.package.<name>]` rows above, which outrank its own
# `package."*"` — measured 2026-10-16, `inherits = "dev"` with opt-level 3 and
# `package."*"` at 3 still planned aterm-spec at 1 and aterm-core, aterm-grid,
# aterm-render and four more at 2. Overflow checks stay off, release's: that arm
# stands in for the shipped build, and the seams need debug assertions only.
# The lane reads cargo's plan and refuses the arm if any crate on its path is
# below opt-level 3, so a row added here for test speed is caught there.
[profile.opt-test]
inherits = "release"
debug-assertions = true
lto = false
codegen-units = 16
strip = false

# First-party replacements for third-party dependencies of our dependencies.
# No row points under vendor/: the last vendored fork, indexmap, went back to
# the registry 2026-10-16 (docs/AUDIT-third-party-2026-10-15.md, "The last
# fork"), and vendor/forge.toml records any fork that comes back.
[patch.crates-io]
# The one absorbed crate: upstream source aterm now owns as a workspace member,
# its NOTICE line and Apache-2.0 §4(b) notices held by `forge attest`. It existed for
# accesskit_winit's `winit` requirement; since A11Y.4 no registry crate asks for `winit`,
# and the row goes with the package's rename (winit-core step 7; the workspace row above).
winit = { path = "crates/aterm-window" }
tracing = { path = "crates/aterm-tracing" }
profiling = { path = "crates/aterm-profiling" }
cfg-if = { path = "crates/aterm-cfg-if" }

# `arrayvec` is the one replacement here that is not a facade over nothing: it
# is a real data structure, and aterm already had it. crates/aterm-arrayvec
# (package `arrayvec` 0.7.8) is a pure re-export of `aterm_alloc::ArrayVec`,
# which aterm's VT parser has run on every byte of terminal output since long
# before this table did. Four consumers reach it — naga, wgpu, wgpu-core and
# wgpu-hal (tiny-skia, on Linux, left at LW.5). Because it carries BEHAVIOUR rather than
# silence, crates/aterm-alloc/tests/arrayvec_differential.rs drives it through
# a scripted sequence and a seeded op fuzz against a `Vec`-backed model and
# compares contents, len, capacity, `Debug` and `Hash` after every step. The
# shim's version must stay >= every other `0.7.x` in the graph: cargo hides
# only the registry version a patch names, so a lower shim leaves the row
# replacing NOTHING, with no warning. Two divergences from upstream are
# deliberate: `size_of` (the backing array is not niche-packed the way
# upstream's is) and `Drain` under `mem::forget` (aterm's keeps the elements;
# upstream loses them).
arrayvec = { path = "crates/aterm-arrayvec" }

# `libc` is the substrate row, and the biggest single package left in the
# shipped graph (127,772 lines by the survey metric). It is CLASS B: nine
# third-party parents on mac-arm alone (ring, wgpu-hal, objc2-app-kit,
# objc2-foundation, parking_lot_core, getrandom, core-graphics,
# core-graphics-types, core-foundation) and ten on Linux, so rewriting aterm's
# own 1,480 call sites would remove nothing — only a patch row reaches it.
#
# crates/aterm-libc (package `libc` 0.2.186) is DECLARATIONS, not an
# implementation: constants, `extern "C"` signatures, struct layouts and type
# aliases, generated per (OS, arch) from measurements of that platform's ABI and
# checked item-by-item by libc-oracle/ against a `=0.2.186` copy of the registry
# crate the patch cannot reach — that oracle is its OWN workspace precisely so it
# has no patch table, which is what lets it pin the SAME version rather than skew
# a release apart to escape. The symbols still resolve to the system C library at
# link time.
#
# THE VERSION IS A CONTRACT AND IT MUST NOT DRIFT DOWN. The strictest
# requirement in the graph was `^0.2.182` (rustix 1.1.4, which left the lock
# at LW.7), then `^0.2.172` (wgpu-hal) and `^0.2.161` (rustix 0.38, gone with
# it); the lock held 0.2.186. A shim numbered
# below any of those makes the row silently inert — cargo emits no warning,
# `targo --unverified forge check` does; the `arrayvec` row above says the same.
#
# THE OBLIGATION IS THE `--all-targets` GRAPH, NOT THE SHIPPED ONE: a dev or
# build edge can need items (and features such as `extra_traits`) that nothing
# shipped touches, and the crate must declare them all.
#
# SIX CELLS, NOT FOUR: two of the architectures the tree builds are easy to
# miss — x86_64-apple-darwin, the compat slice `lipo`d into the universal
# binary, and aarch64-unknown-linux-gnu, the Linux arm64 release target.
# Neither is a copy of its sibling: the mac compat slice has 12 linker-symbol
# redirections, while arm64 Linux has different open flags, syscall numbers,
# layouts, and HWCAP declarations required by cpufeatures and ring. WHO
# DECIDES EACH CELL: `verify libc` (crates/aterm-libc-oracle, driving
# libc-oracle/: the type-level oracle plus its emitted-source and symbol
# phases) decides ONE cell per run, the one the box is native to, under Trust
# alone (no rustup, no stock toolchain), so a cell is covered exactly when a
# box hosts its triple. aarch64-unknown-linux-gnu, x86_64-pc-windows-msvc and
# wasm32-unknown-unknown have no fleet host, so those three cells are decided
# by NO check until a box hosts them or Trust ships their std. What still pins
# their SOURCE: the gate's sibling-body check holds each same-OS pair's
# hand-written body section byte-identical (text, so it runs on every box; it
# binds arm64 Linux to the body x86_64 Linux executes, and does not decide
# that cell), and libc-oracle/conformance/src/lib.rs's cell_zero pins Windows
# and wasm to the primitive-only surface — the 14 unconditional `core::ffi`
# aliases and no generated, target-specific libc ABI declaration — for
# whatever does compile it, which today is no check. The oracle never claimed
# a live compile of every Windows/wasm `--all-targets` consumer: existing
# platform-only tests and native C build dependencies stop those complete
# graphs on this host before every consumer can emit an artifact.
libc = { path = "crates/aterm-libc" }

# `log` is the same argument as `tracing` above, at a different address. Nothing
# in this repository installs a `log` logger: every `set_logger` call in the
# tree is `aterm_log::set_logger` — aterm's OWN logger, crates/aterm-log, a
# different package that this entry does not touch — and no cell's lock holds
# env_logger, fern, simplelog, tracing-log or any other backend. So upstream's
# global is `NopLogger` with `max_level() == Off` for the whole process
# lifetime, every macro is already a dead branch, and a facade that expands to
# nothing is IDENTICAL in behaviour rather than an approximation. Re-check with
# `grep -rn 'log::set_logger' crates/ tools/ apps/ --include='*.rs'` == 0, and
# RETIRE this entry the day something installs one, or third-party diagnostics
# go quietly empty. Every consumer is third-party (naga, the wgpu crates and
# gpu-allocator, on win and win-arm, the only cells that compile wgpu; calloop,
# smithay-client-toolkit, wayland-sys and xkbcommon-dl were Linux's until LW.7
# moved the winit fork onto the first-party Linux crates (sctk-adwaita and
# tiny-skia left at LW.5), and forge blame finds no consumer on linux, mac or
# wasm (re-measured 2026-10-17);
# gl_generator in the lock only, as the build-dep of wgpu-hal's Windows GL
# backend, which no cell turns on), which is why the patch table is the lever
# and editing any one consumer is not. rustybuzz, the one consumer on every
# cell, left at TF.6.
log = { path = "crates/aterm-log-shim" }

once_cell = { path = "crates/aterm-once-cell" }

# `smallvec` is the second data structure in this table after `arrayvec`, and
# like it the implementation was already aterm's: crates/aterm-smallvec
# (package `smallvec` 1.15.1) gives `aterm_alloc::SmallVec<T, N>` upstream's
# `SmallVec<[T; N]>` spelling through an `Array` trait whose associated type
# names the storage, so no `generic_const_exprs` is needed and the crate
# forbids `unsafe`. Five consumers reach it since rustybuzz, its sixth and the
# one on every cell, left at TF.6: parking_lot_core, wgpu, wgpu-core and
# wgpu-hal wherever wgpu compiles; and wayland-backend on Linux, which
# re-exported it to wayland-client and smithay-client-toolkit until LW.7 took
# them out. It replaced
# 1 package / 4,183 lines on every cell
# (docs/AUDIT-third-party-2026-10-15.md, shared-build-lock step 1). Its tests
# replay a transcript recorded from the registry crate and run a `Vec` model
# of upstream's contract; the crate header lists where it differs (heap
# growth schedule, `size_of`, a leaked `Drain`). As with `arrayvec`, the
# shim's version must stay >= every other `1.x` in the graph.
smallvec = { path = "crates/aterm-smallvec" }

# `getrandom` 0.2 is the seed source under ring's SystemRandom: every TLS nonce
# and ephemeral key. crates/aterm-getrandom (package `getrandom` 0.2.17)
# forwards it to `aterm_uds::rand::fill`, the workspace's one entropy surface,
# which already minted aterm's own tokens from the same OS calls (getentropy(2)
# on Unix, BCryptGenRandom on Windows) and carries getrandom's /dev/random
# readiness poll before its /dev/urandom fallback. 1 package / 1,997 lines off
# all six native cells, and `wasi` 0.11 leaves the lock
# (docs/AUDIT-third-party-2026-10-15.md, CT.5).
#
# THE VERSION IS A CONTRACT: ring 0.17.14 asks `^0.2.10`, astream-aead (aterm's
# `sealed` feature) `^0.2`. A shim numbered below the highest 0.2.x anything
# asks for leaves the row replacing NOTHING, silently; `targo --unverified
# forge check` [OB-12] fails it. getrandom 0.3 is another major, stays a
# registry package (lock-only: tempfile, whose 0.4 was pinned down to it,
# A11Y.1; jobserver left with zstd-sys, ZC.6), and is in no shipped cell (an
# unpatched copy beside this one in a cell is an [OB-12] failure too).
#
# No `[workspace.dependencies]` row, unlike the shims above: no aterm crate may
# take `getrandom`. deny.toml bans it everywhere but under ring (forge check
# [OB-18]); aterm's own code calls aterm_uds::rand.
getrandom = { path = "crates/aterm-getrandom" }

# `libm` RETIRED THE FORK the `core_maths` facade (deleted when rustybuzz left,
# TF.6) starved on two cells: vendor/libm (19,867 lines and a build script) is
# gone. naga and num-traits are
# its consumers and name 68 functions between them (num-traits' libm-backed
# `Float` impls, which ARE live on every cell with naga because no edge turns
# num-traits' `std` on; naga's constant folder adds `asinh`, `rint`, `rintf`).
# crates/aterm-libm forwards each to the std method computing the same thing:
# the IEEE-exact ones are bit-identical and the transcendentals (all but
# `atanh`, which std computes itself) are the platform's libm instead of musl's
# (upstream's own code on wasm32, where std's math symbols come from
# compiler-builtins). tests/recorded.rs holds the shim to
# answers recorded from the fork before the switch. It retires with naga
# (docs/AUDIT-third-party-2026-10-15.md, gpu-wgpu).
libm = { path = "crates/aterm-libm" }

# `document-features` is a proc macro whose two consumers, wgpu and wgpu-core,
# call it once each, in `#![doc = ...]`: upstream renders their Cargo.toml
# feature comments into rustdoc text aterm never builds. crates/aterm-document-features
# expands to `""`, and litrs (its parser) leaves with it. Retires with wgpu.
document-features = { path = "crates/aterm-document-features" }

# `unicode-width` has one consumer, codespan-reporting (naga's diagnostics),
# which calls `char::width` to align carets under a shader error.
# crates/aterm-unicode-width answers it from aterm-grapheme's tables, the ones
# the terminal grid uses; the tables differ from upstream's on 56,741 scalar
# values (56,398 of them unassigned), which only moves a caret in an error
# message aterm's shaders never produce. This reverses the REFUSED
# verdict (docs/THIRD_PARTY_SURFACE_PLAN.md) for this narrow use: aterm-grapheme
# no longer holds unicode-width as an oracle. Retires with naga.
unicode-width = { path = "crates/aterm-unicode-width" }

# `rustix` 0.38: a row stood here patching it to crates/aterm-rustix-compat
# (package `rustix` 0.38.44, ~25 items over aterm-libc), the syscall crate
# under the Linux windowing stack's older half (calloop 0.13.0,
# calloop-wayland-source 0.3.0, smithay-client-toolkit 0.19.2 and the winit
# fork), which took rustix 0.38 and linux-raw-sys 0.4.15 out of both Linux
# cells at LW.2. LW.7 moved the winit fork onto the first-party Linux crates
# and its own poll loop, so nothing asked for rustix 0.38 any more: the facade
# and this row are DELETED, and rustix 1.1.4, its differential oracle, left
# the lock with it (docs/AUDIT-third-party-2026-10-15.md, LW.7).

# `windows-sys` 0.52 is the one package ring itself pulls onto a Windows cell,
# and only on aarch64 (win-arm): ring 0.17.14 reads ONE function and ONE
# constant from it (src/cpu/arm/windows.rs:16-30, the ARMv8 crypto-extension
# probe), and upstream brought windows-targets and a 5.2 MB prebuilt import
# library (windows_aarch64_msvc, with a build script) to link them.
# crates/aterm-windows-sys-052 (package `windows-sys` 0.52.0) declares those
# items at upstream's paths and imports kernel32.dll with raw-dylib, the way
# windows-link does for the 0.61 line. Its tests/oracle/ const-asserts every
# type, value and signature against the registry 0.52.0 on both Windows
# triples and compares the imported symbol and DLL, with a planted mismatch of
# each kind (docs/AUDIT-third-party-2026-10-15.md, WB.1). win-arm loses 3
# packages / 384,578 lines / 1 build script and then equals win.
#
# THE ROW IS RENAMED, and that is how one manifest patches two majors of one
# name: cargo matches a `[patch]` row on the `package` it names, never on its
# key. The 0.61 facade below is a second renamed row (WB.3), and forge reads a
# renamed row as claiming its own version line only, so neither facade is the
# other's unpatched sibling (aterm_forge::policy::in_row_scope). The version is a contract as above:
# every ring 0.17.x asks `^0.52`, and 0.52.0 is the line's only release.
windows-sys-052 = { package = "windows-sys", path = "crates/aterm-windows-sys-052" }

# `windows-sys` 0.61 is the Win32 binding layer of three packages on both
# Windows cells: winit (crates/aterm-window, 657 of the names), softbuffer (17)
# and aterm-http's crypt32 verifier (42). Upstream is 334,283 generated lines
# and 168,401 names; those packages name 712 of them, and with every
# declaration those name, 831. crates/aterm-win32 holds exactly that closure,
# generated by aterm-win32-oracle from the registry source at
# upstream's module paths, with no dependency (its own raw-dylib `link!`, as
# windows-link writes it). crates/aterm-windows-sys (package `windows-sys`
# 0.61.2) re-exports it, so no consumer changes a line. win32-oracle/ is its
# own workspace with no patch table, and checks every layout, value, signature
# and import against the registry 0.61.2 on both Windows triples, with planted
# mismatches (docs/AUDIT-third-party-2026-10-15.md, WB.3). win and win-arm
# each lose 1 package / 334,283 lines.
#
# THE ROW IS RENAMED too, like the 0.52 row: cargo patches only the semver line
# a replacement's version is in, and forge reads a renamed row the same way
# (aterm_forge::policy::in_row_scope). The lock-only 0.59.0 under rustix 0.38
# was another line, which LW.2 took out with rustix 0.38; under the plain key
# forge would report it as a copy this facade fails to reach. Its version is a
# contract as above: winit and softbuffer ask `^0.61.2`, and 0.61.2 is what
# the lock held.
#
# The crate is NOT A WORKSPACE MEMBER: cargo refuses two members named
# `windows-sys`, and the 0.52 facade is one (`exclude` at the top says so). The
# Trust lane checks it as a path fork, and names the two facades by their
# specs (`windows-sys@0.52.0`, `windows-sys@0.61.2`), so each has its own floor.
windows-sys-061 = { package = "windows-sys", path = "crates/aterm-windows-sys" }
