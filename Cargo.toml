[workspace]
members = ["crates/*"]
# Default build/check/test set: every member except publication tools
# (cutter, Windows signer, atpkg producer/keys, forge), check runners
# (aterm-verify, aterm-census, libc/Win32 oracles, perf harnesses, lab and its
# clock library), and aterm-contract-probe (`verify test -p aterm-contract-probe`).
# `--workspace` and `-p` still reach every member. List new crates here unless
# they are publication tools or check runners.
default-members = [
    "crates/agh", "crates/agh-fake", "crates/amacs", "crates/amacs-files", "crates/amacs-term",
    "crates/aterm", "crates/aterm-a11y", "crates/aterm-agent", "crates/aterm-alloc", "crates/aterm-aos", "crates/aterm-arrayvec",
    "crates/aterm-bidi", "crates/aterm-bits", "crates/aterm-bootstrap-verify", "crates/aterm-brotli", "crates/aterm-buffer",
    "crates/aterm-caffeine", "crates/aterm-cap", "crates/aterm-capacity",
    "crates/aterm-cfg-if", "crates/aterm-cg", "crates/aterm-cli", "crates/aterm-codec",
    "crates/aterm-conformance", "crates/aterm-containment", "crates/aterm-control",
    "crates/aterm-converge",
    "crates/aterm-core", "crates/aterm-ctl",
    "crates/aterm-dbus", "crates/aterm-digest", "crates/aterm-dirfd", "crates/aterm-diskwalk", "crates/aterm-dl",
    "crates/aterm-durable", "crates/aterm-db", "crates/aterm-db-core",
    "crates/aterm-document-features",
    "crates/aterm-effects", "crates/aterm-font", "crates/aterm-getrandom", "crates/aterm-gpu",
    "crates/aterm-gpu-web", "crates/aterm-grapheme", "crates/aterm-grid",
    "crates/aterm-gui", "crates/aterm-gui-consent", "crates/aterm-gui-documents",
    "crates/aterm-gui-fabric", "crates/aterm-gui-tabs", "crates/aterm-gui-timing",
    "crates/aterm-hash", "crates/aterm-http", "crates/aterm-journal", "crates/aterm-jpeg", "crates/aterm-json",
    "crates/aterm-keeper", "crates/aterm-lexicon", "crates/aterm-libc", "crates/aterm-libm",
    "crates/aterm-link", "crates/aterm-log", "crates/aterm-machines", "crates/aterm-log-shim", "crates/aterm-lz4",
    "crates/aterm-macro-support", "crates/aterm-messages", "crates/aterm-net", "crates/aterm-objc",
    "crates/aterm-models-agh", "crates/aterm-models-aos", "crates/aterm-models-atpkg", "crates/aterm-models-core", "crates/aterm-models-effects",
    "crates/aterm-models-db", "crates/aterm-models-gui", "crates/aterm-models-harness", "crates/aterm-models-misc",
    "crates/aterm-models-native", "crates/aterm-models-release", "crates/aterm-models-render",
    "crates/aterm-models-session", "crates/aterm-models-update",
    "crates/aterm-observe", "crates/aterm-once-cell", "crates/aterm-parser",
    "crates/aterm-phase", "crates/aterm-png", "crates/aterm-policy", "crates/aterm-predict",
    "crates/aterm-primer", "crates/aterm-profiling", "crates/aterm-provenance",
    "crates/aterm-pty", "crates/aterm-regex", "crates/aterm-render", "crates/aterm-restore",
    "crates/aterm-rle",
    "crates/aterm-sandbox", "crates/aterm-scene", "crates/aterm-scrollback",
    "crates/aterm-search", "crates/aterm-secrets", "crates/aterm-selection", "crates/aterm-serde", "crates/aterm-serde-derive",
    "crates/aterm-session", "crates/aterm-shell-integration", "crates/aterm-sixel", "crates/aterm-slog",
    "crates/aterm-smallvec", "crates/aterm-spec", "crates/aterm-spec-anchor", "crates/aterm-spec-macros",
    "crates/aterm-spec-models", "crates/aterm-sysprobe", "crates/aterm-tempfile",
    "crates/aterm-theme-pack", "crates/aterm-time", "crates/aterm-toml", "crates/aterm-toolchain",
    "crates/aterm-tracing", "crates/aterm-tty", "crates/aterm-types", "crates/aterm-uds",
    "crates/aterm-unicode-width", "crates/aterm-update", "crates/aterm-update-core", "crates/aterm-vitals",
    "crates/aterm-vz", "crates/aterm-vz-agent",
    "crates/aterm-wasm", "crates/aterm-wasm-abi", "crates/aterm-wasm-abi-macros", "crates/aterm-wayland",
    "crates/aterm-win32", "crates/aterm-window",
    "crates/aterm-x11", "crates/aterm-xkb",
    "crates/aterm-windows-sys-052", "crates/aterm-winit-keymap", "crates/aterm-winres",
    "crates/aterm-zstd", "crates/atpkg",
]
# vendor/astream is a submodule with its own workspace; its crates are path
# dependencies of aterm-link and inherit package fields from its root manifest.
#
# crates/aterm-windows-sys is excluded because it is the package `windows-sys`
# 0.61.2 and crates/aterm-windows-sys-052 is `windows-sys` 0.52.0: cargo refuses
# two members of one name. It is its own root (a `[workspace]` stub, as a
# vendored fork has), and the `windows-sys` patch row reaches it by path.
exclude = ["vendor/astream", "crates/aterm-windows-sys"]
resolver = "2"

# The executable surface read by `atpkg-publish pack`: `expose` names commands
# shimmed onto PATH; `bundle` names additional executables shipped without shims.
# aterm dispatches its verbs in-process, so no sibling executable is bundled.
# Producer, signing and check-runner binaries are development tools only.
[workspace.metadata.atpkg]
expose = ["aterm"]
bundle = []

# The public OWNER/REPO the release cutter publishes to. Installed copies read
# the same slug from aterm_update_core::DEFAULT_OWNER/DEFAULT_REPO, which
# aterm-release's channel tests hold equal to this key. Distinct from
# `repository`, the private source repo. Authenticity comes from the pinned keys
# in aterm-update-core::pins, not from where the bytes are hosted.
[workspace.metadata.aterm]
update_channel = "alabsystems/aterm"

[workspace.package]
version = "0.139.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/alabsystems/aterm"
authors = ["Andrew Yates"]
description = "aterm — a fast, hardened terminal engine"

[workspace.dependencies]
# First-party serde (`crates/aterm-serde` + `crates/aterm-serde-derive`) exposed
# under the `serde` dependency name. Declared as a workspace dependency rather
# than `[patch.crates-io]`, with `derive` off by default so crates that only
# implement or drive the traits (aterm-json, aterm-toml) keep the proc macro out
# of their normal closure for Trust's PM-1 loader; crates that use
# `#[derive(Serialize, Deserialize)]` enable `features = ["derive"]`.
serde = { package = "aterm-serde", path = "crates/aterm-serde" }
# Resolves to crates/aterm-libc through [patch.crates-io] below.
libc = "0.2"
# TLS for aterm-http and aterm-net (the fleet); `ring` backend, no aws-lc C build.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# Shared version floor for every direct `ring` edge; default features off so each
# member enables only what it needs (`alloc` in atpkg for RSA, `default` in
# signing tools and tests).
ring = { version = "0.17.14", default-features = false }

# --- internal aterm crates ---
# agh: aterm's GitHub client, the library and the `aterm agh` CLI (docs/DESIGN-agh-2026-10-19.md).
agh = { path = "crates/agh" }
# agh's loopback GitHub (api, uploads, web and CDN origins over plain HTTP): tests only.
agh-fake = { path = "crates/agh-fake" }
# Headless editor engine.
amacs = { path = "crates/amacs" }
# File I/O and persistence shared by the native view and terminal UI.
amacs-files = { path = "crates/amacs-files" }
# `amacs` client, terminal UI, and machine protocol (outside aterm-gui's closure).
amacs-term = { path = "crates/amacs-term" }
# Accessibility tree model and Linux AT-SPI publisher over aterm-dbus.
aterm-a11y = { path = "crates/aterm-a11y" }
aterm-agent = { path = "crates/aterm-agent" }
aterm-alloc = { path = "crates/aterm-alloc" }
# Aos hosted execution: task checkpoints, the ordered event log, replay and boundary publication.
aterm-aos = { path = "crates/aterm-aos" }
aterm-bidi = { path = "crates/aterm-bidi" }
aterm-bits = { path = "crates/aterm-bits" }
aterm-bootstrap-verify = { path = "crates/aterm-bootstrap-verify" }
aterm-cap = { path = "crates/aterm-cap" }
# The machine's capacity now and the per-user ledger of claims on it (CAP-1).
aterm-capacity = { path = "crates/aterm-capacity" }
aterm-census = { path = "crates/aterm-census" }
aterm-cg = { path = "crates/aterm-cg" }
aterm-codec = { path = "crates/aterm-codec" }
aterm-containment = { path = "crates/aterm-containment" }
aterm-control = { path = "crates/aterm-control" }
# Converge engine for provisioning surfaces.
aterm-converge = { path = "crates/aterm-converge" }
aterm-core = { path = "crates/aterm-core" }
# First-party D-Bus wire format, SASL EXTERNAL, and blocking Unix client.
aterm-dbus = { path = "crates/aterm-dbus" }
aterm-digest = { path = "crates/aterm-digest" }
# Runtime dlopen tables for Linux windowing libraries (libxcb, libX11,
# libwayland-client, libxkbcommon) by versioned soname.
aterm-dl = { path = "crates/aterm-dl" }
# Fd-relative POSIX directory operations over `libc` for TOCTOU-safe traversal.
aterm-dirfd = { path = "crates/aterm-dirfd" }
aterm-diskwalk = { path = "crates/aterm-diskwalk" }
# File durability (F_FULLFSYNC on Apple) or ordering (F_BARRIERFSYNC via
# astream-sys), with a counting seam for tests.
aterm-durable = { path = "crates/aterm-durable" }
aterm-db = { path = "crates/aterm-db" }
aterm-db-core = { path = "crates/aterm-db-core" }
aterm-effects = { path = "crates/aterm-effects" }
# First-party sfnt table reader, GSUB shaper, and optional `hint` autohinter.
# Default features off so only grid-fitting consumers (aterm-render on Linux and
# Windows) pull in `hint`.
aterm-font = { path = "crates/aterm-font", default-features = false }
aterm-forge = { path = "crates/aterm-forge" }
aterm-gpu = { path = "crates/aterm-gpu" }
aterm-grapheme = { path = "crates/aterm-grapheme" }
aterm-grid = { path = "crates/aterm-grid" }
# Split-out window libraries below aterm-gui (re-exported there): consent card,
# document models, fabric endpoint, tab model, and shared timing constants.
aterm-gui-consent = { path = "crates/aterm-gui-consent" }
aterm-gui-documents = { path = "crates/aterm-gui-documents" }
aterm-gui-fabric = { path = "crates/aterm-gui-fabric" }
aterm-gui-tabs = { path = "crates/aterm-gui-tabs" }
aterm-gui-timing = { path = "crates/aterm-gui-timing" }
aterm-hash = { path = "crates/aterm-hash" }
# Deadline-bounded TLS stream verified against the OS trust store
# (`crates/aterm-http/src/verifier.rs`).
aterm-http = { path = "crates/aterm-http" }
aterm-journal = { path = "crates/aterm-journal" }
# Baseline and progressive Huffman JPEG decoder.
aterm-jpeg = { path = "crates/aterm-jpeg" }
# First-party JSON serde Deserializer/Serializer, `Value`, and `json!`.
aterm-json = { path = "crates/aterm-json" }
aterm-keeper = { path = "crates/aterm-keeper" }
# `aterm caffeine` menu-bar keep-awake mug (macOS at run time).
aterm-caffeine = { path = "crates/aterm-caffeine" }
aterm-lexicon = { path = "crates/aterm-lexicon" }
aterm-log = { path = "crates/aterm-log" }
aterm-lz4 = { path = "crates/aterm-lz4" }
# Syn-free parser and template layer shared by workspace proc macros.
aterm-machines = { path = "crates/aterm-machines" }
aterm-macro-support = { path = "crates/aterm-macro-support" }
aterm-messages = { path = "crates/aterm-messages" }
# Formal models, one crate per domain; `aterm-models` aggregates all domains for checks.
aterm-models = { path = "crates/aterm-models" }
aterm-models-agh = { path = "crates/aterm-models-agh" }
aterm-models-aos = { path = "crates/aterm-models-aos" }
aterm-models-atpkg = { path = "crates/aterm-models-atpkg" }
aterm-models-core = { path = "crates/aterm-models-core" }
aterm-models-db = { path = "crates/aterm-models-db" }
aterm-models-effects = { path = "crates/aterm-models-effects" }
aterm-models-gui = { path = "crates/aterm-models-gui" }
aterm-models-harness = { path = "crates/aterm-models-harness" }
aterm-models-misc = { path = "crates/aterm-models-misc" }
aterm-models-native = { path = "crates/aterm-models-native" }
aterm-models-release = { path = "crates/aterm-models-release" }
aterm-models-render = { path = "crates/aterm-models-render" }
aterm-models-session = { path = "crates/aterm-models-session" }
aterm-models-update = { path = "crates/aterm-models-update" }
# Fleet mutual authentication over TLS 1.3, LAN peer listener, and relay.
aterm-net = { path = "crates/aterm-net" }
aterm-objc = { path = "crates/aterm-objc" }
aterm-observe = { path = "crates/aterm-observe" }
aterm-parser = { path = "crates/aterm-parser" }
aterm-phase = { path = "crates/aterm-phase" }
# First-party PNG codec (chunk structure, five filters, Adam7, and DEFLATE compressor).
aterm-png = { path = "crates/aterm-png" }
aterm-policy = { path = "crates/aterm-policy" }
aterm-predict = { path = "crates/aterm-predict" }
aterm-primer = { path = "crates/aterm-primer" }
aterm-provenance = { path = "crates/aterm-provenance" }
aterm-pty = { path = "crates/aterm-pty" }
# First-party regular-expression engine (parse -> NFA -> bounded Pike VM) with
# byte, nesting (250 levels), and step ceilings for untrusted user patterns.
aterm-regex = { path = "crates/aterm-regex" }
aterm-render = { path = "crates/aterm-render" }
# Headless crash-restore journal layout, records, writer, keyframe policy, and recovery.
aterm-restore = { path = "crates/aterm-restore" }
aterm-rle = { path = "crates/aterm-rle" }
aterm-sandbox = { path = "crates/aterm-sandbox" }
aterm-scene = { path = "crates/aterm-scene" }
aterm-scrollback = { path = "crates/aterm-scrollback" }
aterm-search = { path = "crates/aterm-search" }
# The credentials vault, `aterm secrets` (docs/DESIGN-secrets-2026-10-20.md).
aterm-secrets = { path = "crates/aterm-secrets" }
aterm-selection = { path = "crates/aterm-selection" }
aterm-serde-derive = { path = "crates/aterm-serde-derive" }
aterm-session = { path = "crates/aterm-session" }
aterm-shell-integration = { path = "crates/aterm-shell-integration" }
aterm-sixel = { path = "crates/aterm-sixel" }
# Session log engine: records, bounded ring, turn tracker, fold, and `brief`.
aterm-slog = { path = "crates/aterm-slog" }
aterm-spec = { path = "crates/aterm-spec", features = ["anchors"] }
# Spec anchor attributes and registry. Anchored crates mount
# `crates/aterm-spec-anchor/anchor_rules.rs` in `build.rs` so Trust compilers use
# `macro_rules!` attributes (keeping proc macros out of library graphs for PM-1)
# while stock compilers and the lint driver use `aterm-spec-macros`.
aterm-spec-anchor = { path = "crates/aterm-spec-anchor" }
aterm-spec-macros = { path = "crates/aterm-spec-macros" }
aterm-spec-models = { path = "crates/aterm-spec-models" }
aterm-sysprobe = { path = "crates/aterm-sysprobe" }
aterm-tempfile = { path = "crates/aterm-tempfile" }
aterm-theme-pack = { path = "crates/aterm-theme-pack" }
# Workspace clock: `std::time` re-export on native and a
# `performance.now()`/`Date.now()` shim on wasm32 (where `std::time::Instant::now()`
# panics).
aterm-time = { path = "crates/aterm-time" }
# First-party TOML 1.0.0 serde Deserializer/Serializer and comment-preserving
# document model.
aterm-toml = { path = "crates/aterm-toml" }
# Toolchain discovery, rustup, build-cache rule, gone-checkout rule, and lease core.
aterm-toolchain = { path = "crates/aterm-toolchain" }
# Terminal I/O (decoder, raw mode, probe, screen) for amacs's terminal UI.
aterm-tty = { path = "crates/aterm-tty" }
aterm-types = { path = "crates/aterm-types" }
aterm-uds = { path = "crates/aterm-uds" }
aterm-update = { path = "crates/aterm-update" }
aterm-update-core = { path = "crates/aterm-update-core" }
aterm-vitals = { path = "crates/aterm-vitals" }
aterm-verify = { path = "crates/aterm-verify" }
aterm-vz = { path = "crates/aterm-vz" }
# The guest agent's wire codec (`wire`) and ports, which aterm-vz's helper speaks.
aterm-vz-agent = { path = "crates/aterm-vz-agent" }
# Host boundary for the wasm modules: `console.error` panic hook and syn-free
# `#[export]` ABI layer.
aterm-wasm-abi = { path = "crates/aterm-wasm-abi" }
aterm-wasm-abi-macros = { path = "crates/aterm-wasm-abi-macros" }
# Win32 declarations generated from `windows-sys` 0.61.2, plus the COM
# vocabulary and DXGI slice aterm calls; named directly by aterm-gui, aterm-gpu,
# aterm-http and aterm-net, and re-exported by `crates/aterm-windows-sys` below.
aterm-win32 = { path = "crates/aterm-win32" }
# Windowing crate (forked from winit 0.30.13; see NOTICE). Used only by
# aterm-gui and aterm-winit-keymap.
aterm-window = { path = "crates/aterm-window" }
aterm-winit-keymap = { path = "crates/aterm-winit-keymap" }
# First-party Wayland protocol tables and runtime over dlopened libwayland-client.
aterm-wayland = { path = "crates/aterm-wayland" }
# First-party X11 wire codec, dlopened libxcb transport, ICCCM, and Xrm.
aterm-x11 = { path = "crates/aterm-x11" }
# First-party libxkbcommon runtime bindings and keysyms.
aterm-xkb = { path = "crates/aterm-xkb" }
aterm-winres = { path = "crates/aterm-winres" }
# First-party Zstandard: XXH64, raw-block frame writer for test fixtures, and
# `.tar.zst` frame decoder.
aterm-zstd = { path = "crates/aterm-zstd" }
# First-party Brotli: the streaming RFC 7932 decoder atpkg unpacks npm's `.br` with.
aterm-brotli = { path = "crates/aterm-brotli" }
atpkg = { path = "crates/atpkg" }
atpkg-keys = { path = "crates/atpkg-keys" }
atpkg-publish = { path = "crates/atpkg-publish" }
# First-party shims published under upstream package names and wired via
# `[patch.crates-io]`. Root rows let workspace members write
# `<name> = { workspace = true }`, as required by `aterm_census::scan_set`.
tracing = { path = "crates/aterm-tracing" }
profiling = { path = "crates/aterm-profiling" }
cfg-if = { path = "crates/aterm-cfg-if" }
arrayvec = { path = "crates/aterm-arrayvec" }
once_cell = { path = "crates/aterm-once-cell" }
log = { path = "crates/aterm-log-shim" }
smallvec = { path = "crates/aterm-smallvec" }

# The tree is kept clean under
# `targo-tippy --workspace --all-targets --keep-going -- -D warnings`.
# Lints warn, never deny: `verify lint` (-D warnings) enforces them, so a build
# or a test run never fails on one.
[workspace.lints.rust]
# Set for 2021-edition members (default in 2024).
unsafe_op_in_unsafe_fn = "warn"
# Known-cfg union for the Trust lanes so `unexpected_cfgs` warns on undeclared
# cfg names across the workspace. `clean_islands` is declared per-crate from
# `build.rs` (`crates/aterm-log/clean_islands.rs`) so crates that use it without
# opting in still warn.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(trust_verify)', 'cfg(trust_seals)', 'cfg(trust_binding)'] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
ignore_without_reason = "warn"

# Line tables keep file:line backtraces with much smaller test binaries.
# build-override below matches.
[profile.dev]
debug = "line-tables-only"

# Test-loop speed overrides. `targo trust check` (`ship trust run`) compiles
# under its own `trust-lane` profile at opt-level 0 and zeroes every
# `[profile.dev.package.<name>]` row listed here by reading this file:
# rustc's MIR inliner at opt-level >= 1 inlines std slice-iterator and NonNull
# internals into callers and drops proofs (aterm-spec 146 -> 76 proved at
# opt-level 1, aterm-png 285 -> 221 at 2), and custom profiles inherit named
# package rows over `package."*"`.

# Hot test paths optimized in dev; debug assertions and overflow checks stay on.
[profile.dev.package.aterm-census]
opt-level = 2

[profile.dev.package.aterm-regex]
opt-level = 2

# Corpus and colour-type/depth/interlace matrix PNG decoding in dev tests.
[profile.dev.package.aterm-png]
opt-level = 2

# Scrollback search indexing and exhaustive byte-search oracle sweeps in dev
# (`-p aterm-search`: 21.5 -> 4.7 s wall, 23.0 -> 4.5 CPU-s).
[profile.dev.package.aterm-search]
opt-level = 2

# Exhaustive state/byte-pair/UTF-8 split parser sweeps in dev
# (`-p aterm-parser`: 2.7 -> 0.6-0.8 s wall, 6.2 -> 1.1 CPU-s).
[profile.dev.package.aterm-parser]
opt-level = 2

# Full-UCD (1.1M code points) width and grid-column sweeps in dev
# (`-p aterm-grapheme`: 1.0 -> 0.17 CPU-s).
[profile.dev.package.aterm-grapheme]
opt-level = 2

# Font table reader and shaper in dev: speeds up chrome text kern lookups in
# `aterm-gui` (`--lib` 255 -> 187 CPU-s) and `aterm-font`'s host-font outline
# replay and mutation fuzzing (`font_suite` 71.8 -> 2.9 s) while keeping
# overflow checks active.
[profile.dev.package.aterm-font]
opt-level = 2

# Frame rendering (`ribbon_beam_ordered`, `ribbon_profile`, premultiplied blends)
# in dev; at opt-level 2 `share-generics` is off so it stops linking opt-level-0
# generic copies (`effects_suite` 533 -> 240 CPU-s, `render_suite` 19 -> 6 CPU-s).
[profile.dev.package.aterm-render]
opt-level = 2

# Engine and grid (`GlowQuad::is_flat`, `GlowQuad::damage_words`, cell frame) in
# dev (`effects_suite` 240 -> 139 CPU-s, own tests 65 -> 18 CPU-s).
[profile.dev.package.aterm-core]
opt-level = 2

[profile.dev.package.aterm-grid]
opt-level = 2

# THE SCROLLBACK TIERS AT OPT-LEVEL 2 IN DEV, for test speed. Cold
# lines live in LZ4 pages decoded and deserialized on read, and aterm-gui's
# crash-restore ring test reads a million-line export back through them: 68%
# of its CPU sat in `Scrollback::get_line` and the cold tier at opt-level 0.
# Only opt-level moves; debug assertions and overflow checks stay on. Runs
# interleaved, three per side at a load of 150-230 (medians): aterm-scrollback
# --lib 1.4 -> 0.4 CPU-s, aterm-grid --lib 11.6 -> 5.6, aterm-core --lib 8.9 ->
# 7.3, core_suite 5.7 -> 4.7, the ring test 3.2 -> 0.9 (all of crash_restore::
# 10.0 -> 6.5): about 13 CPU-s a pass. Cost: the lib compiles in 3.5-4.6 s
# instead of 2.6-2.9, and one rebuild of the crates above it.
[profile.dev.package.aterm-scrollback]
opt-level = 2

# The predictor in dev: `predict_suite`'s editing-win matrix folds the whole
# corpus through it on every core, the test run's second-largest CPU cost
# (`predict_suite` alone 15.5 -> 3.9-4.3 s wall, 233-239 -> 61-63 CPU-s). Only
# opt-level moves; debug assertions and overflow checks stay on.
[profile.dev.package.aterm-predict]
opt-level = 2

# The bridge in dev: aterm-link's fabric simulation drives the real bridge,
# state dir and astream client through every seeded world, the longest binary
# of the test run (108-112 s in four whole-workspace runs). Alone, interleaved
# at a load of 4-7: --lib 36.2-36.5 -> 28.3 s wall, 105-107 -> 47 user CPU-s
# (system time, the worlds' socket rendezvous, 87 -> 103). A one-line edit
# recompiles in 2.1-3.3 s at either level. Only opt-level moves; debug
# assertions and overflow checks stay on.
[profile.dev.package.aterm-link]
opt-level = 2

# The vault in dev: X25519 is TweetNaCl's sixteen-limb ladder, first-party
# (`aterm-secrets/src/x25519.rs`), and RFC 7748 §5.2's thousand-iteration
# vector, the lib's longest test, ran 5.22 -> 0.42 s alone. Interleaved, two
# per side at a load of 3.6-4.5: `-p aterm-secrets`'s tests 16.4, 15.6 ->
# 9.9, 8.3 s wall (--lib 8.3 -> 4.2-4.8, flows 5.7 -> 3.5-3.9). A whole-crate
# recompile of the lib test takes 3.7 s instead of 1.5. Only opt-level moves;
# debug assertions and overflow checks stay on.
[profile.dev.package.aterm-secrets]
opt-level = 2

[profile.dev.package.aterm-spec]
opt-level = 1

# Paint scanner and PNG inflate for ~500-frame takes in dev (507-frame take:
# decode 5.4 -> 0.4 s, scan 6.7 -> 0.7 s).
[profile.dev.package.aterm-conformance]
opt-level = 2

[profile.dev.package.aterm-codec]
opt-level = 2

# Screen reader panic sweep and fixture scans in dev (`panic_sweep` 200-233 ->
# 41-43 CPU-s, `phase_suite` 13.7 -> 3.5 CPU-s; overflow checks stay on).
[profile.dev.package.aterm-phase]
opt-level = 2

# JSON deserializer in dev for `aterm-agent` conformance walks and supervisor
# seed matrix transcripts.
[profile.dev.package.aterm-json]
opt-level = 2

# Message-band ink and animation raster math (`resolve`, `span_fine`, `lin_mix`)
# in dev (`message_band` tests 11-15 -> 3 s).
[profile.dev.package.aterm-messages]
opt-level = 2

# Startup executable hashing (`aterm_hash::fx_hash_bytes` over ~245 MB debug
# `aterm` binary: 0.69-0.73 s at opt-level 0 -> 12-15 ms at 2).
[profile.dev.package.aterm-hash]
opt-level = 2

# SHA-256 (`astream-digest`) in dev for `aterm-gui` `seamless` screen and wire
# ladder hashing; overflow checks stay on.
[profile.dev.package.astream-digest]
opt-level = 2

# The zstd encoder and decoder in dev: zstd_suite holds the encoder to libzstd's
# ratio at level 19 and re-encodes megabyte inputs cut every way, all through
# the optimal parser. Alone, alternating at a load of 9-21: zstd_suite 14.0 ->
# 1.4 s wall, 97.5 -> 11.3 CPU-s; --lib 5.5 -> 0.5 s, 18.7 -> 1.3 CPU-s;
# atpkg-publish's publish_suite, which compresses through it, 79 -> 72 CPU-s.
# An edit rebuilds the crate's tests in 0.5-0.8 s at either level. Only
# opt-level moves; debug assertions and overflow checks stay on.
[profile.dev.package.aterm-zstd]
opt-level = 2

# Omit debug info in test executables so per-CGU object files in `deps/` stay
# under the directory-entry bound (WindowServer's TCC preflight makes `tccd`
# read the whole `deps/` directory). `targo build|run` keeps `profile.dev`'s
# line tables; pass `--config profile.test.debug="line-tables-only"` for line
# numbers in a single test binary.
#
# NO KNOB HERE REACHES THE aterm-gui EDIT LOOP. After a one-line aterm-gui edit
# its lib-test unit, the test compile's critical path, spends its time in the
# front end: parsing, resolution, the replayed checks and the compiler's
# once-initializer re-entrancy check (`rustc_mir_transform::
# trust_once_reentrancy`, on in every lane), which re-borrow-checks every body
# the incremental replay skipped and so grows with the unit's body count.
# Codegen units, debuginfo and incremental act only on codegen, LLVM and the
# link, a few seconds at the end. The split, on a named trustc build:
# docs/measured/test-compile-tail-2026-10-21.md.
[profile.test]
debug = false

# `aterm-effects` at opt-level 2 in the test profile only (`targo build|run`
# stays at 0): disables `share-generics` so test binaries stop pulling
# opt-level-0 std generic instantiations from sibling crates (lib test 41-44 ->
# 22-23 CPU-s, streak flash test 16-17 -> 5.6-6.1 s).
[profile.test.package.aterm-effects]
opt-level = 2

[profile.dev.build-override]
debug = "line-tables-only"

[profile.release]
# Fat LTO and symbol stripping for size and speed; `panic = "unwind"` is kept
# because panic isolation relies on `catch_unwind`. `opt-level` stays at default
# 3 (`opt-level = "s"` shrank `aterm-gui` 6.74 -> 5.48 MB but cost -12.5% flood
# throughput, 166 -> 146 MiB/s).
lto = true
codegen-units = 1
strip = true

[profile.release.package.aterm-wasm]
opt-level = "z"

[profile.release.package.aterm-gpu-web]
opt-level = "z"

# Release semantics without LTO, for lanes that only need an optimized build.
[profile.gate]
inherits = "release"
lto = false
codegen-units = 16
opt-level = 1

[profile.profiling]
inherits = "release"
strip = false
debug = 1

# Optimized test build (`targo --unverified test --profile opt-test`) with
# `debug-assertions = true` so debug-gated conformance and test seams compile
# in, without fat LTO or single-CGU link cost. Inherits `release` rather than
# `dev` because `[profile.dev.package.<name>]` rows outrank a child profile's
# `package."*"` and would leave those crates below opt-level 3 in
# `verify perf fabric --profile opt`.
[profile.opt-test]
inherits = "release"
debug-assertions = true
lto = false
codegen-units = 16
strip = false

# First-party replacements for third-party transitive dependencies.
# Every shim version must stay >= the highest compatible requirement in the
# graph, or cargo silently leaves the registry crate unpatched (`forge check`
# [OB-12] enforces this).
[patch.crates-io]
tracing = { path = "crates/aterm-tracing" }
profiling = { path = "crates/aterm-profiling" }
cfg-if = { path = "crates/aterm-cfg-if" }

# Re-exports `aterm_alloc::ArrayVec` as `arrayvec` 0.7.8 for naga and wgpu*.
# Deliberate divergences from upstream: `size_of` (backing array is not
# niche-packed) and `Drain` under `mem::forget` (elements are retained rather
# than leaked). Differential tests live in
# `crates/aterm-alloc/tests/arrayvec_differential.rs`.
arrayvec = { path = "crates/aterm-arrayvec" }

# First-party `libc` 0.2.186 declarations (`crates/aterm-libc`), checked against
# registry `=0.2.186` by `libc-oracle/` (its own workspace without this patch
# table). Must cover the full `--all-targets` graph across all six target cells;
# symbols still resolve to the system C library at link time.
libc = { path = "crates/aterm-libc" }

# No-op `log` facade (`crates/aterm-log-shim`). Safe because nothing in the
# workspace installs a `log` logger (`aterm_log` is a separate crate) and no
# cell resolves a `log` backend, so upstream `log` was already a static
# `NopLogger` with `max_level() == Off`. Retire this patch if a `log` backend is
# ever installed.
log = { path = "crates/aterm-log-shim" }

once_cell = { path = "crates/aterm-once-cell" }

# Wraps `aterm_alloc::SmallVec<T, N>` in upstream `smallvec` 1.15.1's
# `SmallVec<[T; N]>` signature via an `Array` trait (`#![forbid(unsafe_code)]`).
smallvec = { path = "crates/aterm-smallvec" }

# Forwards `getrandom` 0.2.17 (used by `ring::rand::SystemRandom`) to
# `aterm_uds::rand::fill`. Omitted from `[workspace.dependencies]` because
# `deny.toml` forbids direct `getrandom` edges outside `ring` ([OB-18]).
getrandom = { path = "crates/aterm-getrandom" }

# Forwards the 68 `libm` functions used by `naga` and `num-traits` to `std`
# float methods (`crates/aterm-libm`), verified against recorded outputs in
# `tests/recorded.rs`.
libm = { path = "crates/aterm-libm" }

# Expands `document_features!()` (used in `#![doc = ...]` by `wgpu` and
# `wgpu-core`) to `""`.
document-features = { path = "crates/aterm-document-features" }

# Answers `unicode-width` (used by `codespan-reporting` in `naga`) from
# `aterm-grapheme`'s width tables.
unicode-width = { path = "crates/aterm-unicode-width" }

# Renamed patch keys (`windows-sys-052`, `windows-sys-061`) allow patching two
# semver majors of `windows-sys` in one manifest (`cargo` matches on `package`,
# and `aterm_forge::policy::in_row_scope` scopes each row to its semver line):
# - 0.52.0 (`crates/aterm-windows-sys-052`): the ARMv8 crypto-extension probe
#   used by `ring` on `win-arm`, imported from `kernel32.dll` via `raw-dylib`
#   and checked against registry 0.52.0 by `tests/oracle/`.
# - 0.61.2 (`crates/aterm-windows-sys`, re-exporting `crates/aterm-win32`): the
#   generated Win32 closure, used through this facade by `aterm-window`
#   (aterm's own crates name `aterm-win32` directly), checked
#   against registry 0.61.2 by `win32-oracle/`.
#   Excluded from `[workspace]` above because cargo forbids two workspace
#   members with package name `windows-sys`.
windows-sys-052 = { package = "windows-sys", path = "crates/aterm-windows-sys-052" }
windows-sys-061 = { package = "windows-sys", path = "crates/aterm-windows-sys" }
