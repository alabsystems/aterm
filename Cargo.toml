[workspace]
members = ["crates/*"]
resolver = "2"

# The AUTHORITATIVE atpkg surface for the `aterm` program (tools/atpkg-pack.sh reads both;
# EXPOSE(env) > this declaration > name-token heuristic). `expose` = bins atpkg SHIMS onto the
# user's PATH; `bundle` = bins SHIPPED in the tarball but NOT shimmed. ONE command lands on PATH
# — `aterm` — the single front door an AI learns; `aterm help` reveals the rest. The siblings are
# BUNDLED (not exposed) so `aterm <verb>` dispatch (aterm ctl/pkg/fleet/drive) resolves them via
# current_exe from the same store bin/ — they ride along, attested by the same signature, without
# adding names to PATH. The producer/dev/signing bins (atpkg-keys — "never shipped to clients",
# aterm-release, aterm-dev, aterm-nest, xtask) are in NEITHER list. Every name must be a bin the
# release build produces, or the pack fails closed.
[workspace.metadata.atpkg]
expose = ["aterm"] # THE one command — window + session + every verb IN ONE BINARY
# One binary since the one-binary collapse: ctl/pkg/fleet/drive/help are
# in-process subcommands of `aterm`, and the window is its no-TTY/--window
# mode. Distribution ships argv0 compat SYMLINKS (aterm-ctl, atpkg,
# aterm-fleet, aterm-drive, aterm-gui, aterm-cli) beside it — dispatched by
# argv[0] — so nothing else lands in `bundle` as a separate binary.
bundle = []
# THE PACKAGE-INDEX ACCOUNT: the GitHub owner atpkg's signed index + program
# releases are published under — the compiled-in default behind atpkg's account
# resolution (env ATPKG_ACCOUNT > `[packages].account` config > this). Its OWN
# key on purpose: `[workspace.package] repository` is the PRIVATE staging repo
# (a default-configured, tokenless install 404s there — no index is ever
# reachable), and `update_channel` above is the APP-update knob the
# ACCOUNT-BOUND index trust (§8) must never follow. crates/aterm-update-core's
# build.rs stamps this into ATERM_ATPKG_INDEX_OWNER (falling back to the
# `repository` owner when the key is absent); atpkg's `resolve_account` reads
# that constant. Repointing it is a HOST change, never a trust change — the
# index verifies against the same pinned root key (`aterm-update-core::pins`)
# wherever it is hosted.
account = "alabsystems"

# THE UPDATE CHANNEL shipped binaries read, as ONE tracked `OWNER/REPO` slug.
#
# This is deliberately NOT `[workspace.package] repository`. The two answer
# different questions:
#   * `repository` = where the SOURCE and the release pipeline live. It stays
#     the private staging repo; `cargo ship cut` publishes there, gated by the
#     ledger/lease/fence protocol, and it is the slug the cutter binds
#     `git remote get-url origin` against.
#   * `update_channel` = where INSTALLED COPIES look for updates. It is the
#     PUBLIC mirror, so a fresh machine can read the channel with no token at
#     all (an unauthenticated `GET /repos/alabsystems/aterm/releases` is 200).
#
# Two consumers read this one key, and a test proves they agree:
#   * crates/aterm-update-core/build.rs stamps it into ATERM_DEFAULT_OWNER /
#     ATERM_DEFAULT_REPO, the compiled-in default behind `Source::resolve`
#     (still overridable per machine by ATERM_UPDATE_OWNER/_REPO env or the
#     `[update] owner/repo` config — this is only the last-resort default);
#   * crates/aterm-release (the `mirror` pipeline step) copies each finished,
#     verified release here after `verify` and before `unlock`.
#
# Repointing this is NOT an authenticity change: trust is the manifest SHA-256,
# the optional pinned Ed25519 key, codesign + the pinned Team ID. The channel
# only decides where bytes come from. DELETING the key is legal and means "no
# public mirror": clients then default to `repository` and the `mirror` step
# becomes an announced no-op.
[workspace.metadata.aterm]
update_channel = "alabsystems/aterm"
# The channel-signing anchor lives in `aterm-update-core::pins`, NOT here. It was
# committed in both places, which meant the key the cutter enforced and the key
# clients verify against were two separately edited values that nothing compared.

[workspace.package]
version = "0.70.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/alabsystems/aterm"
authors = ["Andrew Yates"]
description = "aterm — a fast, hardened terminal engine"

[workspace.dependencies]
# --- external (pinned; present in local cargo cache for offline builds) ---
proc-macro2 = "1.0.106"
quote = "1.0.45"
syn = { version = "2", features = ["full", "extra-traits"] }
proptest = "1"   # dev-dep: property tests in foundation crates
serde = { version = "1", features = ["derive"] }   # optional feature in aterm-types
# aterm-scrollback cold-tier compression (+ atpkg's .tar.zst payloads).
# DEFAULT FEATURES OFF. zstd's default set is ["legacy", "arrays", "zdict_builder"];
# the omitted arms are `legacy` and `zdict_builder`, and only `arrays` is kept.
# COST: 0 packages / 0 .rs lines on ALL FOUR cells — this one is invisible to the
# forge metric (rs-physical-all-files-v1) BY CONSTRUCTION, because neither feature
# gates a Rust package. What it actually removes is C: 31,618 lines of vendored
# libzstd that stop compiling into every binary on every cell.
#   * `legacy`  -> zstd/lib/legacy, 15 files / 26,295 lines (the v0.1-v0.7 frame
#     decoders). zstd-sys-2.0.16/build.rs:67-70 adds that include dir and defines
#     ZSTD_LEGACY_SUPPORT=1 only under the feature; :204-205 defines it to 0
#     otherwise, and :114-115 is what adds the directory to the compile.
#   * `zdict_builder` -> zstd/lib/dictBuilder, 5,323 lines (cover.c + fastcover.c +
#     divsufsort.c + zdict.c + zdict.h), added at build.rs:112-113 and :251, with
#     the bindgen header at :11-12 and :216.
# WHY THE ARMS ARE DEAD HERE: on the Rust side `zdict_builder` gates only
# zstd-0.13.3/src/dict.rs (the from_samples/EncoderDictionary/DecoderDictionary
# builders) and two fns in zstd-safe-7.2.4/src/lib.rs:2284-2308; `legacy` gates
# only a test (zstd-0.13.3/src/stream/tests.rs:192). NOTHING in this tree touches
# either: a grep for from_samples / EncoderDictionary / DecoderDictionary /
# with_dictionary / zstd::dict across crates/ and apps/ returns ZERO, and every
# call site is plain `zstd::encode_all` / `zstd::Encoder::new` / `zstd::Decoder::new`
# (aterm-scrollback codec.rs:99 and :134, disk_memory.rs:398, disk_compaction.rs:128;
# atpkg extract.rs:997 and :1048, install.rs:863, flow.rs:3144, cli.rs:9406).
# `arrays` is KEPT: it is pure-Rust API (zstd-safe `arrays = []`, it forwards
# nothing to zstd-sys) and costs nothing.
# Small live-arm caveat: `legacy` is what lets libzstd DECODE pre-1.0 (2015-era)
# frames. Nothing aterm or atpkg emits them, but a hand-supplied ancient .zst
# would stop decoding.
zstd = { version = "0.13", default-features = false, features = ["arrays"] }
# PACKAGE `libc`, and since the [patch.crates-io] row far below this resolves
# to crates/aterm-libc — the first-party ABI declarations — for every consumer
# in the workspace, ours and third-party alike. The requirement stays `0.2`
# because it is a requirement, not a pin; the shim's own 0.2.186 is what has
# to stay >= everything else in the graph. See the patch row for why.
libc = "0.2"     # aterm-scrollback mmap/disk tier
# aterm-net (L3 network drive): TLS 1.3 (rustls, ring provider) with the RFC 5705
# keying-material exporter. rustls uses the `ring` backend (no aws-lc C build).
# The channel-binding HMAC-SHA256 is first-party — `aterm-digest`.
#
# `hkdf` was declared here for a key schedule that was never written: no crate
# depends on it, so it never resolved into Cargo.lock and never cost a package.
# Removed with `sha2`/`hmac` because it was built on `hmac` — re-deriving it
# would have re-imported the whole tower this change just deleted. When aterm
# needs HKDF it belongs in `aterm-digest`: RFC 5869 is ~30 lines over HMAC.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# ORACLE ONLY — no longer in any shipped graph. This crate WAS aterm's platform
# certificate verifier; `crates/aterm-http/src/verifier.rs` now makes the same OS
# calls directly (SecTrustEvaluateWithError on macOS, CertGetCertificateChain on
# Windows, webpki over /etc/ssl/certs on Linux), which retired 4 packages /
# 19,534 lines from mac-arm and 10 / 29,722 across the four measured cells. The
# trust MODEL is unchanged: the operating system's store, never a root set
# compiled into the binary. It stays here as the differential test's reference
# implementation and is declared ONLY under `[dev-dependencies]`, so it is
# outside every `cargo forge` cell (which resolve with `--edges normal`).
rustls-platform-verifier = "0.6"
# Distributed-slice collection across crates: the #[refines]/#[spec_unmodeled]
# anchor emitters submit RefinementEntry/Waiver records into an inventory slice
# that the spec_xref_closure gate collects at test time (TRUST_NATIVE_TLA, Phase 0).
inventory = "0.3"
# aterm-gui windowing; aterm-winit-keymap reuses its key enums. TWO consumers,
# both of them GUI-side and both hard deps — deliberately never an OPTIONAL dep
# of a platform-free crate, because workspace feature unification turns those on
# for every consumer in the resolve.
winit = "0.30"
# DEV-ONLY (aterm-effects `[dev-dependencies]`): the ORACLE for the 499
# public-domain glyphs PHOSPHOR's material ROM now carries in-tree
# (crates/aterm-effects/src/matrix_rain/bitmap_font.rs), plus the glyph rows the
# effects demo examples draw. The data is public domain, so copying it costs
# nothing and owes nothing; keeping the crate here costs nothing either,
# because a dev-dependency never enters the shipped graph — and it buys an
# all-of-Unicode equality test that keeps the copy honest forever.
font8x8 = { version = "0.3.1", default-features = false, features = ["unicode"] }

# --- internal aterm crates (added by tools/port_crate.sh as each is ported) ---
aterm-render-api = { path = "crates/aterm-render-api" }
# The workspace clock (retired `web-time`): EXACTLY `std::time` on native — a
# re-export, so the engine is byte-identical to one written against std — and a
# performance.now()/Date.now() shim on wasm32, where `std::time::Instant::now()`
# panics "time not implemented". Ten crates sample a clock; this is the one seam
# they all go through, and being first-party it can be verified with the rest of
# the tree instead of trusted.
aterm-time = { path = "crates/aterm-time" }
# L0.5 semantic surface predicates (regex row-match) over the Observation Kernel.
aterm-observe = { path = "crates/aterm-observe" }
# L2 agent interface: turn-completion + self-reflection governor over L0/L0.5/L1.
aterm-agent = { path = "crates/aterm-agent" }
# L3 network transport: relay the control protocol over a network boundary with a
# channel-bound capability (drive a remote aterm; predicates run on its surface).
aterm-net = { path = "crates/aterm-net" }
# Portable control-socket stream: std Unix-domain sockets on Unix, AF_UNIX
# over winsock (afunix.sys) on Windows. Std-only; no external deps.
aterm-uds = { path = "crates/aterm-uds" }
# The coding-agent primer installer (`aterm agents` + the auto-prime every GUI
# session runs). Std-only leaf, so the CLI and the GUI share ONE installer.
aterm-primer = { path = "crates/aterm-primer" }
aterm-pty = { path = "crates/aterm-pty" }
aterm-session = { path = "crates/aterm-session" }
aterm-cap = { path = "crates/aterm-cap" }
aterm-ffi = { path = "crates/aterm-ffi" }
aterm-sandbox = { path = "crates/aterm-sandbox" }
aterm-render = { path = "crates/aterm-render" }
aterm-gpu = { path = "crates/aterm-gpu" }
# The first-party Objective-C runtime layer (macOS): typed message sends,
# ownership, RUNTIME CLASS CREATION and the block ABI. It exists to retire the
# objc2 + block2 + objc2-* cluster (255,335 lines / 20 packages, 44% of
# mac-arm's remaining third-party lines), so it has ZERO dependencies of its own
# — see the crate docs.
aterm-objc = { path = "crates/aterm-objc" }
# Shared deterministic colour/easing, vector-path, and Tile raster primitives
# used by aterm-effects.
aterm-scene = { path = "crates/aterm-scene" }
# The shared cursor-aurora + sparkle-words effect engines (extracted from aterm-gui
# so the web embedders drive the same art).
aterm-effects = { path = "crates/aterm-effects" }
# The mosh-style predictive-echo state machine (extracted from aterm-gui so the
# web embedders drive the same speculative typing).
aterm-predict = { path = "crates/aterm-predict" }
aterm-suggest = { path = "crates/aterm-suggest" }
aterm-core = { path = "crates/aterm-core" }
# The headless half of the control protocol: verb bodies over a `SessionHost`
# trait, so a non-GUI host answers the same wire (no winit in its closure).
aterm-control = { path = "crates/aterm-control" }
aterm-shell-integration = { path = "crates/aterm-shell-integration" }
aterm-search = { path = "crates/aterm-search" }
aterm-selection = { path = "crates/aterm-selection" }
aterm-policy = { path = "crates/aterm-policy" }
aterm-vi = { path = "crates/aterm-vi" }
aterm-containment = { path = "crates/aterm-containment" }
aterm-ffi-types = { path = "crates/aterm-ffi-types" }
aterm-grid = { path = "crates/aterm-grid" }
aterm-scrollback = { path = "crates/aterm-scrollback" }
aterm-parser = { path = "crates/aterm-parser" }
aterm-grapheme = { path = "crates/aterm-grapheme" }
# Multilingual whole-word matching for the sparkle-words text decorations.
aterm-lexicon = { path = "crates/aterm-lexicon" }
aterm-types = { path = "crates/aterm-types" }
# The winit→engine key map (K-2). A CRATE and not a feature of aterm-types on
# purpose: an optional dep unifies across the workspace resolve, which is how the
# dependency-free `aterm-ctl` ended up linking AppKit. Only aterm-gui depends on
# this; every other consumer of aterm-types stays platform-free by construction.
aterm-winit-keymap = { path = "crates/aterm-winit-keymap" }
aterm-spec = { path = "crates/aterm-spec" }
aterm-spec-macros = { path = "crates/aterm-spec-macros" }
aterm-spec-models = { path = "crates/aterm-spec-models" }
aterm-provenance = { path = "crates/aterm-provenance" }
aterm-error = { path = "crates/aterm-error" }
aterm-error-derive = { path = "crates/aterm-error-derive" }
aterm-tempfile = { path = "crates/aterm-tempfile" }
# Fd-relative POSIX directory operations (openat/fstat/mkdirat/renameat[2 or
# renameatx_np]/unlinkat/linkat/fchmod/fsync + a readdir stream) over `libc`,
# which was already in the graph. Replaces `rustix`, 72,832 lines across 2
# packages (with `errno`) for a dozen wrappers used by exactly two files. The
# property it exists to keep is TOCTOU safety: every operation is fd-relative
# and re-resolves no path, so a same-uid process cannot swap an ancestor between
# a check and the use. `rustix` survives as this crate's [dev-dependencies]
# ORACLE, driven over real directory trees and required to agree on every
# result, errno, stat field and listing.
aterm-dirfd = { path = "crates/aterm-dirfd" }
aterm-bidi = { path = "crates/aterm-bidi" }
aterm-lz4 = { path = "crates/aterm-lz4" }
aterm-rle = { path = "crates/aterm-rle" }
aterm-codec = { path = "crates/aterm-codec" }
# First-party JSON: a serde Deserializer/Serializer plus the untyped `Value`
# and `json!`. Replaces `serde_json` and `zmij`, the float formatter behind it —
# 2 packages, 24,936 lines — across aterm-gui, aterm-update, aterm-release and
# atpkg. `serde_json` survives as this crate's [dev-dependencies] ORACLE, which
# is what proves the replacement byte-identical rather than merely equivalent.
aterm-json = { path = "crates/aterm-json" }
# First-party PNG: chunk structure, the five filters, Adam7, and a DEFLATE
# COMPRESSOR — the half `aterm-codec` never had. Replaces `png`, which was the
# largest single import left in the shipped graph at 7 packages / 33,439 lines
# (`png` + `flate2` + `miniz_oxide` + `fdeflate` + `simd-adler32` + `crc32fast`
# + `adler2`), most of it a SECOND compression stack beside the inflate aterm
# already owned. `png` survives as this crate's [dev-dependencies] ORACLE: the
# differential decodes the repository's own 969-file PNG corpus plus a
# synthesized every-colour-type/depth/interlace matrix and asserts the pixel
# buffers are byte-identical.
aterm-png = { path = "crates/aterm-png" }
# First-party HTTP/1.1 client. Retired `ureq` and the stack behind it
# (ureq-proto, http, bytes, httparse, utf8-zero, percent-encoding, webpki-roots)
# — 8 packages, 69,546 lines — from the shipped graph. The OS trust store is
# UNCHANGED: see `rustls-platform-verifier` above.
aterm-http = { path = "crates/aterm-http" }
aterm-bits = { path = "crates/aterm-bits" }
aterm-hash = { path = "crates/aterm-hash" }
# Cryptographic digests: SHA-256 and HMAC-SHA256, first-party and dependency-free.
# Replaces `sha2` + `hmac`, which dragged 8 packages / 49,474 lines of third-party
# source into the shipped graph — `digest` and its const-generic tower dominate at
# 45,734, of which `typenum` alone is 40,601 — to expose the four methods every call
# site here actually uses. Measured with `cargo forge survey --cell mac-arm`:
# 161 → 153 third-party packages. `subtle` is NOT among them; rustls depends on it
# directly, so it stays and `aterm_digest::ct_eq` replaces our USE of it. Strictly
# separate from `aterm-hash`, which is and stays NON-cryptographic.
aterm-digest = { path = "crates/aterm-digest" }
# The workspace regular-expression engine: parse → NFA → bounded Pike VM,
# first-party and dependency-free. Replaces `regex`, the largest single import
# left in the shipped graph at 4 packages / 158,471 lines of third-party source
# (regex 11,973 + regex-automata 67,074 + regex-syntax 58,501 + aho-corasick
# 20,923) for a surface of six call sites — `Regex::new`, the
# `size_limit`/`dfa_size_limit` builder, `find_iter`, `is_match` and
# `Error::Syntax`.
#
# It is a replacement and not a reduction: `regex` is a finite-automaton engine
# with a linear-time guarantee, no backreferences and no look-around, and
# leftmost-first semantics — a Pike VM has exactly those properties, which is why
# the size ceilings the call sites already pass carry over unchanged. Patterns
# here are user input (selection rules, `await match <re>`, the search verb), so
# the engine is bounded on every axis: a byte ceiling on the compiled program,
# re-checked per instruction; a 250-level nesting cap; and linear match time.
#
# `regex` stays on as this crate's dev-dependency ORACLE, exactly as `aterm-digest`
# keeps sha2/hmac: every match is proved identical to the reference over the eleven
# shipped selection patterns, a hand-written corpus, all of Unicode for `\d`/`\w`/`\s`
# and case folding, and a deterministic-LCG fuzz loop. A dev-dependency never enters
# the shipped graph, so the proof costs nothing at ship time.
aterm-regex = { path = "crates/aterm-regex" }
# TOML 1.0.0, first-party, in two halves: a `serde::Deserializer`/`Serializer`
# replacing `toml`, and a comment-preserving document model replacing
# `toml_edit`. MEASURED by `forge survey` before and after: SIX packages and
# 64,783 lines of third-party source left EVERY cell — toml_edit 0.22.27,
# winnow 0.7.15, toml_write 0.1.2, toml 0.8.23, and serde_spanned +
# toml_datetime, which the planning estimate missed because they are reached
# only through `toml` itself. mac-arm: 136 -> 130 third-party packages,
# 1,871,883 -> 1,807,100 lines.
#
# It also RETIRED A VENDORED FORK, which is the part that matters beyond the
# line count. `winnow`'s only parent in this graph was `toml_edit` (verified
# with `cargo tree -i -p winnow@0.7.15`), and aterm carried a patched copy at
# vendor/winnow to fix an `offset_from` divide-by-zero and underflow. Retiring
# toml_edit took the fork with it — the vendored tree, its [patch.crates-io]
# entry, its REVIEWED_VENDORED_CRATES row, its NOTICE line and its
# vendor/forge.toml block — leaving five forks where there were six, and one
# fewer piece of third-party code this repository must keep reviewing forever
# in order to read a config file.
#
# serde STAYS, deliberately: 168 `from_str` call sites stand on 161
# `#[derive(Deserialize)]` models, so the replacement had to BE a
# `Deserializer`. serde_derive is a proc macro and contributes no machine code
# to the shipped binary.
#
# `toml` and `toml_edit` live on as this crate's dev-dependency ORACLES, exactly
# as aterm-digest keeps sha2/hmac and aterm-regex keeps regex: every one of the
# repository's own .toml files is proved to parse to the same value and to
# round-trip byte-for-byte, backed by a deterministic-LCG differential fuzz.
aterm-toml = { path = "crates/aterm-toml" }
aterm-log = { path = "crates/aterm-log" }
aterm-alloc = { path = "crates/aterm-alloc" }
aterm-update = { path = "crates/aterm-update" }
# Artifact-agnostic, portable POSIX update primitives (source resolution, file
# lock, curl/token plumbing, private-dir hardening, sha256). aterm-update layers
# the macOS/.app-only logic on top; atpkg will reuse these too.
aterm-update-core = { path = "crates/aterm-update-core" }
# The toolchain package manager (Settings ▸ Packages reads its status/link state
# in-process; the network verbs still run only via the co-located `atpkg` binary).
atpkg = { path = "crates/atpkg" }
# The owner-side provisioning/signing engine — a LIBRARY here so `cargo ship
# provision` can drive the join ceremony in-process (one /dev/tty phrase prompt,
# no second binary). Never shipped to clients; POSIX-only (#![cfg(unix)]).
atpkg-keys = { path = "crates/atpkg-keys" }
aterm-sixel = { path = "crates/aterm-sixel" }
# The main-loop completeness census (L0 whole-Mac-freeze class): ONE shared
# implementation consumed by `xtask gate mainloop` (manual verb) AND
# tools/freeze-safety-gate/build.rs (the automatic, build-blocking obligation).
aterm-census = { path = "crates/aterm-census" }
# The merge gate's own crate. Depended on ONLY for its toolchain resolution
# (`aterm_verify::Toolchain`), so `xtask gate lint` and `tools/verify.sh` cannot
# disagree about which directory THE toolchain is — the same reason `gate lint`
# shells to that verb rather than re-deriving tippy in shell. Safe to depend on:
# aterm-verify itself has no dependencies, by charter.
aterm-verify = { path = "crates/aterm-verify" }
# The first-party no-op `tracing` facade, DIRECTORY crates/aterm-tracing but
# PACKAGE `tracing` — [patch.crates-io] matches on package name, and the four
# consumers (winit, softbuffer, and on Linux zbus + tiny-xlib) reach it through
# that patch, not through these rows. Both rows exist so a workspace member that
# ever wants the shim can write `tracing = { workspace = true }` instead of a
# bare path (aterm_census::scan_set hard-errors on a `workspace = true` edge with
# no root row here), and so `grep tracing Cargo.toml` finds the crates.
tracing = { path = "crates/aterm-tracing" }
aterm-tracing-attributes = { path = "crates/aterm-tracing-attributes" }
# The first-party no-op `profiling` facade, DIRECTORY crates/aterm-profiling but
# PACKAGE `profiling` — same reason as the row above: [patch.crates-io] matches
# on package name, and the three consumers (wgpu, wgpu-core, wgpu-hal) reach it
# through that patch rather than through this row. It exists for the same two
# reasons the `tracing` one does: so a member that ever wants the shim can write
# `profiling = { workspace = true }` (aterm_census::scan_set hard-errors on a
# `workspace = true` edge with no root row here), and so `grep profiling
# Cargo.toml` finds the crate rather than only the unrelated `[profile.profiling]`
# cargo profile further down.
profiling = { path = "crates/aterm-profiling" }
# The first-party `cfg_if!` macro, DIRECTORY crates/aterm-cfg-if but PACKAGE
# `cfg-if` — same reason as the two rows above. No workspace member consumes it
# (`grep -rn cfg_if crates/ tools/ apps/ --include='*.rs'` returns ZERO), and
# that is exactly why the patch table is the only lever: all 23 consumers are
# third-party, so a call-site census reports nothing to rewrite. This row exists
# so `grep cfg-if Cargo.toml` finds the crate, and so a future member can write
# `cfg-if = { workspace = true }` without tripping the census's hard error on a
# `workspace = true` edge with no root row.
cfg-if = { path = "crates/aterm-cfg-if" }
# The first-party `arrayvec` replacement, DIRECTORY crates/aterm-arrayvec but
# PACKAGE `arrayvec` — same reason as the three rows above. It is a pure
# re-export of `aterm_alloc::ArrayVec`, which aterm's VT parser has used on
# every byte of terminal output since long before the shim existed; the six
# consumers (naga, wgpu, wgpu-core, wgpu-hal, tiny-skia on Linux, and vte
# through dev edges) reach it through [patch.crates-io], not through this row.
# It exists so `grep arrayvec Cargo.toml` finds the crate, and so a member that
# ever wants the shim can write `arrayvec = { workspace = true }` without
# tripping the census's hard error on a `workspace = true` edge with no root row.
arrayvec = { path = "crates/aterm-arrayvec" }
# The first-party `core_maths` replacement, DIRECTORY crates/aterm-core-maths
# but PACKAGE `core_maths` — same reason as the rows above. No workspace member
# consumes it (`grep -rn core_maths crates/ tools/ apps/ --include='*.rs'`
# returns ZERO outside the shim itself), and both consumers are third-party, so
# the patch table is the only lever. This row exists so `grep core_maths
# Cargo.toml` finds the crate, and so a member that ever wants it can write
# `core_maths = { workspace = true }` without tripping the census's hard error
# on a `workspace = true` edge with no root row.
core_maths = { path = "crates/aterm-core-maths" }
# The first-party `once_cell` replacement, DIRECTORY crates/aterm-once-cell but
# PACKAGE `once_cell` 1.21.4 — same reason as the rows above. No workspace
# member consumes it (`grep -rn once_cell crates/ tools/ apps/ --include='*.rs'`
# returns ZERO outside the shim itself) and all thirteen consumers are
# third-party, so the patch table is the only lever. This row exists so
# `grep once_cell Cargo.toml` finds the crate, and so a member that ever wants
# it can write `once_cell = { workspace = true }` without tripping the census's
# hard error on a `workspace = true` edge with no root row.
once_cell = { path = "crates/aterm-once-cell" }
# The first-party `log` facade, DIRECTORY crates/aterm-log-shim but PACKAGE
# `log` 0.4.32 — same reason as the four rows above. The directory could not be
# `crates/aterm-log`: that name is taken by aterm's REAL logger, the one every
# member above writes `aterm-log = { workspace = true }` for, and the shim
# deliberately does NOT delegate to it (see crates/aterm-log-shim/src/lib.rs —
# `Display for Level` pads and `LevelFilter::parse` does not exist upstream, so
# re-exporting aterm-log's types would publish a WRONG `log` API, not merely an
# inelegant one). Twenty consumers reach it through [patch.crates-io], none of
# them first-party; this row exists so `grep '^log' Cargo.toml` finds the crate
# and so a member that ever wants the shim can write `log = { workspace = true }`
# without tripping the census's hard error on a `workspace = true` edge with no
# root row.
log = { path = "crates/aterm-log-shim" }
# (none yet — populated bottom-up)

# --- workspace-wide lint policy (inherited via `[lints] workspace = true`) ---
# One central ratchet for every crate. The whole tree is kept clean under
# `targo-tippy --workspace --all-targets --keep-going -- -D warnings` (tools/verify.sh
# and `cargo xtask gate lint` both run exactly that, from one argv builder —
# `aterm_verify::stages::tippy_args`); there is no CI, so this local gate IS the
# contract. TWO WORDS IN IT ARE LOAD-BEARING. `targo-tippy`, not `cargo clippy`: the
# pinned stage2 ships no `cargo-clippy`, so `cargo clippy` finds stock Rust's on PATH
# or nothing at all. And `--keep-going`, without which cargo stops at the FIRST crate
# that trips `-D warnings` and the rest of the workspace is never linted — a run that
# reports three findings and reads like it reported all of them.
[workspace.lints.rust]
# Edition 2024 already warns here; deny it workspace-wide so an unsafe op outside an
# explicit `unsafe {}` inside an `unsafe fn` can never sneak in.
unsafe_op_in_unsafe_fn = "deny"
# Centralized known-cfg superset (was declared per-crate). Verification/fuzzing
# tools gate code behind these cfgs (kani proofs, loom interleavings, miri, fuzz
# harnesses; `aterm_ffi_catch_unwind!` also expands a `#[cfg(kani)]` arm). Declaring
# the union here keeps `unexpected_cfgs` honest in every crate from one place — an
# undeclared cfg name still warns; an unused-but-declared one is harmless.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)', 'cfg(loom)', 'cfg(miri)', 'cfg(fuzzing)', 'cfg(trust_verify)', 'cfg(clean_islands)'] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# aterm-census is a DEV-ONLY lexical scanner (11k lines of pure std over the
# 1425 .rs files under crates/) that never ships — nothing in `expose` or
# `bundle` depends on it. It is also on the critical path of every local gate
# run: `cargo test -p aterm-census` runs 98 tests that each walk the real tree,
# and `cargo xtask gate mainloop` is one of the three verbs
# `tools/verify.sh` executes. Unoptimized, that scanning dominates both.
#
# Measured on this tree, arms alternated ABBA across 3 rounds, 98/98 tests
# passing in both:
#   cargo test -p aterm-census   2.98 s -> 0.65 s   (-2.33 s per verify.sh run)
#   xtask gate mainloop census   0.77 s -> 0.14 s   (-0.63 s per verify.sh run)
# Cost side, measured the same way (3 cold builds per arm, alternated):
# +1.64 s of codegen, paid only when this crate is recompiled, not per run.
#
# `debug-assertions` is deliberately left inheriting `true` from profile.dev:
# this crate is a build-BLOCKING safety gate and its arithmetic must keep
# panicking on overflow. Only opt-level moves, and opt-level is not a proof
# obligation — verified, not assumed: all four censuses emit byte-identical
# logs and exit codes at opt-level 0 and 2.
#
# The gate's OTHER consumer, tools/freeze-safety-gate, is its own workspace and
# carries the matching `[profile.dev.build-override]` in its own manifest.
[profile.dev.package.aterm-census]
opt-level = 2

[profile.release]
# Aggressive size+speed, functionality-preserving: fat LTO (whole-program
# optimization across crates → smaller + often faster) + strip symbols. NOT
# panic="abort" — aterm relies on catch_unwind for FFI-boundary panic isolation
# (aterm_ffi_catch_unwind!), which abort would break.
#
# opt-level is left at the default 3 BY DELIBERATE OWNER DECISION (2026-06-14):
# opt-level="s" was measured to shrink aterm-gui 6.74 → 5.48 MB (-18.7%) but cost
# -12.5% flood throughput (166 → 146 MiB/s). aterm stays #1 of 5 on BOTH axes either
# way (next-smallest competitor 13.3 MB; next-fastest 102 MiB/s), so the owner kept
# the throughput crown — the binary already crushes every competitor on size. Do
# not switch to "s"/"z" without re-confirming this tradeoff is wanted.
lto = true
codegen-units = 1
strip = true

# The web-render frontends ship as browser download assets, so size beats
# throughput for them: build ONLY these two for size (opt-level="z"). The engine
# profile above (opt-level 3, owner's throughput decision) is untouched. orc's
# build-aterm-wasm.mjs compiles these to wasm32 and wasm-opt's the result.
[profile.release.package.aterm-wasm]
opt-level = "z"

[profile.release.package.aterm-gpu-web]
opt-level = "z"

# Same codegen as release but keeps symbols, for sampling profilers (sample/samply):
#   cargo build --profile profiling -p aterm-gui
[profile.profiling]
inherits = "release"
strip = false
debug = 1

# --- Vendored, patched winit -------------------------------------------------
# winit 0.30 ships file drag-and-drop ONLY on macOS (NSDraggingDestination) and
# X11 (XDND); its Wayland backend has NO data-device support, so a native-Wayland
# session never delivers `WindowEvent::DroppedFile`/`HoveredFile`/`HoveredFileCancelled`
# and aterm's drop-to-paste (the iTerm-style file drop) silently does nothing there.
# We vendor winit 0.30.13 verbatim under `vendor/winit` and add the missing Wayland
# DnD (sctk `data_device_manager`, `text/uri-list`), so the SAME three events fire on
# Wayland as on X11/macOS. `[patch.crates-io]` redirects every `winit = "0.30"` in the
# workspace to the local copy without touching any crate's own dependency line; the
# vendored manifest keeps version 0.30.13, so the `^0.30` requirement still resolves.
[patch.crates-io]
winit = { path = "vendor/winit" }

# --- aterm-owned forks of upstream crates (vendored for Trust verification) ---
# These crates carried genuine latent panics/overflows that Trust (verification
# by default) correctly refuses to compile (e.g. libm `i64::abs` overflow at MIN,
# indexmap `RangeInclusive` index, pkg-config). We vendor + fix them at the root
# (see vendor/<crate>, marked "// aterm-trust:") so a fully verified build needs
# NO verification-bypass flags. Each fork keeps its upstream version so the
# existing `^` requirements still resolve.
libm = { path = "vendor/libm" }
indexmap = { path = "vendor/indexmap" }
pkg-config = { path = "vendor/pkg-config" }
smol_str = { path = "vendor/smol_str" }

# --- FIRST-PARTY replacement, not a fork -------------------------------------
# `tracing` is 3 packages / 84,483 lines on mac-arm (tracing + tracing-core +
# tracing-attributes) whose every event dispatches to `NoSubscriber`: aterm
# installs no subscriber anywhere, and `tracing-subscriber` is in no cell's
# graph, so every callsite in the tree is disabled for the whole process
# lifetime and upstream does not evaluate a disabled callsite's arguments. A
# facade that evaluates nothing is therefore IDENTICAL in behaviour, not an
# approximation — re-check with
# `cargo tree -p aterm -e normal | grep -c tracing-subscriber` == 0, and RETIRE
# this entry the day a subscriber is installed, or the logs go quietly empty.
# FOUR consumers pull the crate in — winit and softbuffer everywhere, zbus and
# tiny-xlib on Linux — so a patch reaches all four at once, where editing our
# winit fork would reach exactly one and leave the other three on the registry
# copy. The replacement is code WE WROTE (crates/aterm-tracing, package
# `tracing` 0.1.44 so the four `^0.1.3x/4x` requirements still resolve): it is
# NOT vendored upstream source, so it carries none of the redistribution
# obligations `vendor/` does — no NOTICE row, no REVIEWED_VENDORED_CRATES row,
# no `vendor/forge.toml` block. `cargo forge attest`/`check` and the census
# classify a `crates/` patch target as first-party for exactly that reason.
tracing = { path = "crates/aterm-tracing" }

# `profiling` is a PROFILER FACADE that is already compiling to nothing here,
# which is what makes this the cheapest entry in the table. All three consumers
# — wgpu, wgpu-core and wgpu-hal 29.0.3 — take it `default-features = false`,
# `profiling-procmacros` is in no cell's lock, and `cargo tree -e features -i
# profiling` reports ZERO enabled features on all four cells, so upstream
# already compiles its own `src/empty_impl.rs` and all 198 `profiling::scope!`
# sites expand to nothing today. crates/aterm-profiling (package `profiling`
# 1.0.18) reproduces those matchers and empty transcribers byte-for-byte, so the
# tokens at every one of the 198 sites are the same tokens. RETIRE this entry
# the day a `profile-with-*` backend is actually wanted — the shim accepts all
# eight upstream feature names and ignores them, so turning one on would go
# quietly nowhere.
profiling = { path = "crates/aterm-profiling" }

# `cfg-if` is the entry that ONLY a patch table can reach, and it is worth
# saying why out loud: `grep -rn cfg_if crates/ tools/ apps/ --include='*.rs'`
# returns ZERO. Every one of its 23 consumers is third-party, so the call-site
# census that retired base64, memchr and serde_json reports nothing to rewrite
# here and moves on — the package stays in the shipped graph forever on a
# census that is working correctly. crates/aterm-cfg-if is package `cfg-if`
# 1.0.4: one `macro_rules!`, `tt` on both the predicate and the body, first
# match wins by negating the previous arms, each arm's items grouped through one
# recursive call so a dead arm cannot leak an item (upstream issue #90). The
# oracle carries all 24 invocation shapes the census found, verbatim.
cfg-if = { path = "crates/aterm-cfg-if" }

# `arrayvec` is the one replacement here that is not a facade over nothing: it
# is a real data structure, and aterm already had it. crates/aterm-arrayvec
# (package `arrayvec` 0.7.8) is a pure re-export of `aterm_alloc::ArrayVec`,
# which aterm's VT parser has run on every byte of terminal output since long
# before this table did. Six consumers reach it — naga, wgpu, wgpu-core,
# wgpu-hal, tiny-skia on Linux, and vte through dev edges. Because it carries
# BEHAVIOUR rather than silence, it is the entry that owes a real differential:
# crates/aterm-alloc/tests/arrayvec_differential.rs drives both implementations
# through a scripted sequence and a seeded op fuzz and compares contents, len,
# capacity, `Debug` and raw `Hash` output after every step, against a `=0.7.7`
# dev-only copy of the registry crate that this patch cannot redirect. THAT PIN
# IS LOAD-BEARING IN A SECOND WAY, learned by getting it wrong: the shim first
# declared 0.7.6 against a `=0.7.8` oracle, and cargo — which hides only the
# registry version a patch names, not the rest — satisfied all six consumers
# from the 0.7.8 the oracle had forced into the graph. The row replaced NOTHING,
# `cargo tree -i arrayvec` printed a source-less `v0.7.8` under naga, and no
# warning was emitted. The shim's version must stay >= every other `0.7.x` this
# workspace pins. Two
# divergences are deliberate and pinned there: `size_of` (the backing array is
# not niche-packed the way upstream's is) and `Drain` under `mem::forget`
# (aterm's keeps the elements; upstream loses them).
arrayvec = { path = "crates/aterm-arrayvec" }

# `libc` is the substrate row, and the biggest single package left in the
# shipped graph (127,772 lines by the survey metric). It is CLASS B: nine
# third-party parents on mac-arm alone (ring, wgpu-hal, objc2-app-kit,
# objc2-foundation, parking_lot_core, getrandom, core-graphics,
# core-graphics-types, core-foundation) and ten on Linux, so rewriting aterm's
# own 1,480 call sites would remove nothing — only a patch row reaches it.
#
# crates/aterm-libc (package `libc` 0.2.186) is DECLARATIONS, not an
# implementation: constants, `extern "C"` signatures, struct layouts and type
# aliases, generated per (OS, arch) from measurements of that platform's ABI and
# checked item-by-item by libc-oracle/ against a `=0.2.186` copy of the registry
# crate the patch cannot reach — that oracle is its OWN workspace precisely so it
# has no patch table, which is what lets it pin the SAME version rather than skew
# a release apart to escape. The symbols still resolve to the system C library at
# link time.
#
# THE VERSION IS A CONTRACT AND IT MUST NOT DRIFT DOWN. The strictest
# requirement in the graph is `^0.2.182` (rustix 1.1.4), then `^0.2.172`
# (wgpu-hal) and `^0.2.171` (jobserver); the lock held 0.2.186. A shim numbered
# below any of those makes the row silently inert — cargo emits no warning,
# `cargo forge check` does. crates/aterm-alloc records that happening to
# `arrayvec`.
#
# THE OBLIGATION IS THE `--all-targets` GRAPH, NOT THE SHIPPED ONE, and that is
# what this row was mis-scoped on. Dev edges pull in nix 0.29 (termwiz ->
# mac_address -> nix, a dev-dependency of aterm-bench), and nix both turns
# `extra_traits` ON for the whole graph and needs several hundred items nothing
# shipped touches. Measured by compiling the workspace against the crate: 1,203
# items on each Darwin cell, 1,224 on x86_64 GNU Linux and 1,234 on aarch64 GNU
# Linux, against the 272 / 318 a shipped-graph-only survey reports.
#
# SIX CELLS, NOT FOUR. The original survey missed two architectures the tree
# builds: x86_64-apple-darwin, the compat slice `lipo`d into the universal
# binary, and aarch64-unknown-linux-gnu, the native target of
# tools/linux-runtime.sh. Neither is a copy of its sibling: the mac compat slice
# has 12 linker-symbol redirections, while arm64 Linux has different open flags,
# syscall numbers, layouts, and HWCAP declarations required by cpufeatures and
# ring. The type-level oracle and separate symbol gate cover both distinctions.
# Windows and wasm are primitive-only target smokes, not declaration cells: the
# shim exports the 14 unconditional `core::ffi` aliases but no generated,
# target-specific libc ABI declarations there. A new non-primitive target-side
# use therefore fails closed at compilation. The oracle proves that exact
# emitted surface; it does not claim a live compile of every Windows/wasm
# `--all-targets` consumer, because existing platform-only tests and native C
# build dependencies stop those complete graphs on this host before every
# consumer can emit an artifact.
libc = { path = "crates/aterm-libc" }

# `log` is the same argument as `tracing` above, at a different address. Nothing
# in this repository installs a `log` logger: every `set_logger` call in the
# tree is `aterm_log::set_logger` — aterm's OWN logger, crates/aterm-log, a
# different package that this entry does not touch — and no cell's lock holds
# env_logger, fern, simplelog, tracing-log or any other backend. So upstream's
# global is `NopLogger` with `max_level() == Off` for the whole process
# lifetime, every macro is already a dead branch, and a facade that expands to
# nothing is IDENTICAL in behaviour rather than an approximation. Re-check with
# `grep -rn 'log::set_logger' crates/ tools/ apps/ --include='*.rs'` == 0, and
# RETIRE this entry the day something installs one, or third-party diagnostics
# go quietly empty. TWENTY consumers pull it in across the four cells (naga,
# the five wgpu crates and rustybuzz everywhere; gpu-allocator on win+linux;
# calloop, sctk-adwaita, smithay-client-toolkit, tiny-skia, wayland-sys and
# xkbcommon-dl on Linux; gl_generator as a Windows build-dep; and
# alacritty_terminal, termwiz, vte, wezterm-bidi and wezterm-dynamic through the
# dev edges that make aterm's differential oracles), which is why the patch
# table is the lever and editing any one consumer is not.
log = { path = "crates/aterm-log-shim" }

# `core_maths` is the entry whose PRIZE IS SOMEBODY ELSE'S FORK. The package is
# 1,221 lines of extension trait; what it drags in is `libm`, which this
# repository VENDORS (vendor/libm — 19,867 lines and a build script, forked
# because upstream carried an `i64::abs` overflow at MIN that Trust refuses to
# compile). `core_maths` is libm's SOLE parent on mac-arm and on wasm-cpu, so
# retiring it takes 2 packages / 21,088 lines / 1 build script off each of those
# two cells; linux, win and wasm-gpu keep libm through naga and num-traits and
# lose only core_maths itself.
#
# THE SWAP MOVES NO CODE THAT RUNS, and that is measured rather than hoped. The
# string `core_maths` appears exactly four times in the two consumers' sources —
# rustybuzz's face.rs, aat_layout_trak_table.rs and ot_layout_gpos_table.rs, and
# ttf-parser's lib.rs — and every one is a `use core_maths::CoreFloat;` sitting
# directly under `#[cfg(not(feature = "std"))]`. `std` is ON for both crates in
# all five cells (rustybuzz defaults to it; `std = ["ttf-parser/std"]` forwards
# it), so the trait is never imported and rustybuzz's eleven `.round()` calls
# and ttf-parser's `.sin()`/`.cos()`/`.tan()`/`.abs()` already resolve to std's
# inherent methods. crates/aterm-core-maths therefore replaces a crate that is
# LINKED AND NEVER CALLED, and its tests/consumers.rs re-checks both halves of
# that per cell so the day it stops being true is the day the suite goes red.
#
# The replacement forwards to `std` where upstream forwards to `libm`, which is
# a real divergence for a genuine no_std build and no divergence at all for
# aterm (every cell has std, wasm32 included). `powi` is copied from upstream
# verbatim instead, because libm has no `powi` and std's is an LLVM intrinsic
# that may round differently. Full fidelity table in the crate's header.
core_maths = { path = "crates/aterm-core-maths" }

# `once_cell` is the row the post-flip sweep MISSED and its judge found, and the
# first entry in this table whose replacement is REAL RUNNING CODE on four of
# the five cells. 1 package / 3,950 lines / 53 unsafe tokens comes off every
# cell — identical everywhere because `once_cell` is a LEAF, which is also why
# the flip did not create this opportunity: a leaf's dominator is itself no
# matter who its parents are, so the row was worth exactly as much before W6b as
# after. What the flip changed is only the blame line on mac-arm (three parents
# -> one, `rustls` alone). Re-measured with `cargo forge blame once_cell`:
# dom 1 package / 3,950 LOC on every one of the five.
#
# THE CONSUMERS DO NOT AGREE ABOUT LIVENESS, and the census had to be per-cell
# rather than per-crate. Three of the thirteen import it under a `cfg` that is
# off — rustls and read-fonts under `#[cfg(not(feature = "std"))]`, naga under
# `#[cfg(no_std)]`, with naga's build script deriving `std` from the `wgsl-in`
# feature every cell turns on — so on MAC-ARM, where rustls is the only parent,
# this is the same "linked and never called" trade `core_maths` made. On the
# other four cells it is NOT: ahash, wgpu-core, wgpu-hal, wayland-sys, x11-dl,
# x11rb, xkbcommon-dl, js-sys, wasm-bindgen and wasm-bindgen-futures all CALL
# these types, and wgpu-core's resource pool depends on `get_or_try_init`
# running its closure exactly once under contention — two calls would hand it
# two `Arc`s for one bind group layout, which is the invariant the pool exists
# to provide. crates/aterm-once-cell is therefore a BEHAVIOUR-carrying
# replacement like `arrayvec`, not a facade like `cfg-if`, and it owes what
# arrayvec owes: a real differential against a registry copy this table cannot
# reach (`=1.21.3`, dev-only — the `[OB-15]` version-pin escape, which that
# obligation reports as a NOTE).
#
# The prize beyond the line count is the unsafe. Upstream is `AtomicPtr`,
# `UnsafeCell` and a hand-rolled parking queue: 53 unsafe tokens, written before
# `std` had `OnceLock` or `LazyLock`. `std` has both now, so the replacement is
# those same cells re-expressed over `OnceLock`/`Mutex`/`Cell` under
# `#![forbid(unsafe_code)]` — 53 tokens to zero. THE VERSION IS A CONTRACT:
# `read-fonts 0.43.2` requires `^1.21.4`, so a shim numbered any lower makes
# this row silently inert (see the arrayvec note above for that failure mode).
once_cell = { path = "crates/aterm-once-cell" }
