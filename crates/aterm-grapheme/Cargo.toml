[package]
name = "aterm-grapheme"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Unicode grapheme cluster segmentation and width calculation for terminal text"
# Integration tests are declared below, not discovered. With autotests off a
# `tests/*.rs` file listed nowhere never compiles.
autotests = false

[dependencies]
# TextShapingConfig used in production (width.rs) and in tests
aterm-types = { workspace = true }

[dev-dependencies]
aterm-spec = { workspace = true }
# The models its tests drive (a model edit rebuilds only their tests).
aterm-models-core = { workspace = true }

[lints]
workspace = true

[[test]]
name = "grapheme_suite"
path = "tests/grapheme_suite.rs"
