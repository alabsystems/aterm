[package]
name = "aterm-spec"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "TLA+ specification coverage tracking for aterm verification"
# The integration tests compile as one suite (tests/spec_suite.rs): a tests/*.rs that is
# neither a [[test]] below nor a `mod` of the suite compiles into nothing.
autotests = false

[dependencies]
# The authoring macros (`ty_model!`, `#[model]`, `#[liveness]`), a proc macro. Behind
# `anchors` so `-p aterm-spec`'s lib closure holds no proc macro and Trust's
# loader admits it (PM-1, docs/PLAN-pm1-proc-macro-reach-2026-10-16.md); the
# workspace row turns `anchors` on, so every consumer keeps them.
aterm-spec-macros = { workspace = true, optional = true }
# The anchor half (the registry, the anchor records, the entered-anchor record),
# re-exported as `aterm_spec::{registry, xref}` so there is one registry. Anchored
# crates name the anchor attributes through `aterm_spec_anchor` itself.
aterm-spec-anchor = { workspace = true }
# The `ty` co-process protocol (`--cases`, `capabilities --json`) is one JSON object per line
# (docs/design/TY-TRACE-CASES-AND-FAIL-CLOSED-2026-10-01.md §9.10).
aterm-json.workspace = true
# The pooled `ty --cases` co-process outlives its caller, so `spawnfd::command` spawns it with
# stdio and nothing else inherited.
aterm-uds.workspace = true
# Where `spec-check ay` finds the proof bundles: the running package's directory, read when it
# runs (`manifest_dir`); and the tests' scratch HOME/prefix trees, removed on drop.
aterm-tempfile.workspace = true

# The account's home for tool discovery (`verify::account_home`): one
# `getpwuid_r`, which a test process cannot move the way it moves `$HOME`.
[target.'cfg(unix)'.dependencies]
libc.workspace = true
# `host::oversubscribed` reads the machine's load and logical cores (`load_average`,
# `cpu_layout`), the one reader of each. Workspace crate; aterm-uds depends on it already, so it
# is no new edge, and its own dependency on this crate is dev-only.
aterm-sysprobe.workspace = true

# Descriptor-backed pool identity uses Windows' 128-bit FILE_ID_INFO through the shared dirfd
# boundary instead of unstable std metadata extensions.
[target.'cfg(windows)'.dependencies]
aterm-dirfd.workspace = true

[features]
# Re-export the authoring macros. On through the workspace row.
anchors = ["dep:aterm-spec-macros"]

[dev-dependencies]
# The tests use the macros.
aterm-spec = { path = ".", features = ["anchors"] }

[lints]
workspace = true

# ---- integration tests (autotests = false above) ----------------------------

[[test]]
name = "spec_suite"
path = "tests/spec_suite.rs"
