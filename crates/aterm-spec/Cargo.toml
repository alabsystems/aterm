[package]
name = "aterm-spec"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "TLA+ specification coverage tracking for aterm verification"
# The integration tests compile as ONE suite (tests/spec_suite.rs), not one
# binary per file. With auto-discovery off, a tests/*.rs that is neither a
# [[test]] below nor a `mod` of the suite compiles into nothing.
autotests = false

[dependencies]
aterm-spec-macros.workspace = true
# Distributed-slice collection: #[refines]/#[spec_unmodeled] anchor records are
# submitted into an inventory slice (crate `xref` module) that the cross-crate
# spec_xref_closure gate collects (TRUST_NATIVE_TLA, Phase 0). Re-exported so the
# proc-macro-generated `::aterm_spec::inventory::submit!` resolves in any
# downstream crate without that crate needing its own inventory dependency.
inventory.workspace = true
# The `ty` co-process protocol (`verify::ty_trace_verdict`'s `--cases` pool and
# the `ty capabilities --json` probe) is one JSON object per line; first-party,
# serde its only dependency (docs/design/TY-TRACE-CASES-AND-FAIL-CLOSED-2026-10-01.md §9.10).
aterm-json.workspace = true
# The pooled `ty --cases` co-process outlives the call that starts it, so it is
# built by aterm-uds's `spawnfd::command` (stdio and nothing else inherited),
# never a plain `std::process::Command` (AGENTS.md, grep_guard B27).
aterm-uds.workspace = true

# The account's home for tool discovery (`verify::account_home`): one
# `getpwuid_r`, which a test process cannot move the way it moves `$HOME`.
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
# Scratch HOME/prefix trees removed on drop.
aterm-tempfile.workspace = true

[lints]
workspace = true

# ---- integration tests (autotests = false above) ----------------------------

[[test]]
name = "spec_suite"
path = "tests/spec_suite.rs"

# Alone: installs a process-wide panic hook for its per-thread `quietly` probe.
[[test]]
name = "non_vacuity_ratchet"
path = "tests/non_vacuity_ratchet.rs"
