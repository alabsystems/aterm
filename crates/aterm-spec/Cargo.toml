[package]
name = "aterm-spec"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "TLA+ specification coverage tracking for aterm verification"
# The integration tests compile as ONE suite (tests/spec_suite.rs), not one
# binary per file. With auto-discovery off, a tests/*.rs that is neither a
# [[test]] below nor a `mod` of the suite compiles into nothing.
autotests = false

[dependencies]
# The authoring macros (`ty_model!`, `#[model]`, `#[liveness]`), a proc macro. Behind
# `anchors` so `-p aterm-spec`'s lib closure holds no proc macro and Trust's
# loader admits it (PM-1, docs/PLAN-pm1-proc-macro-reach-2026-10-16.md); the
# workspace row turns `anchors` on, so every consumer keeps them.
aterm-spec-macros = { workspace = true, optional = true }
# The anchor half (the registry, the anchor records, the entered-anchor record),
# re-exported as `aterm_spec::{registry, xref}` so there is one registry. Anchored
# crates name the anchor attributes through `aterm_spec_anchor` itself.
aterm-spec-anchor = { workspace = true }
# The `ty` co-process protocol (`verify::ty_trace_verdict`'s `--cases` pool and
# the `ty capabilities --json` probe) is one JSON object per line; first-party,
# serde its only dependency (docs/design/TY-TRACE-CASES-AND-FAIL-CLOSED-2026-10-01.md §9.10).
aterm-json.workspace = true
# The pooled `ty --cases` co-process outlives the call that starts it, so it is
# built by aterm-uds's `spawnfd::command` (stdio and nothing else inherited),
# never a plain `std::process::Command` (clippy.toml: one child constructor).
aterm-uds.workspace = true

# The account's home for tool discovery (`verify::account_home`): one
# `getpwuid_r`, which a test process cannot move the way it moves `$HOME`.
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[features]
# Every test that discharges a model through a tiered helper also runs the Trust
# checkers and must agree with the interpreter: `targo --unverified test
# --workspace --features aterm-spec/checkers` (`verify::checkers_required`).
# A feature, not an environment variable: nothing a process inherits changes a
# plain run's verdict.
checkers = []
# Re-export the authoring macros. On through the workspace row.
anchors = ["dep:aterm-spec-macros"]

[dev-dependencies]
# The tests use the macros.
aterm-spec = { path = ".", features = ["anchors"] }
# Scratch HOME/prefix trees removed on drop.
aterm-tempfile.workspace = true

[lints]
workspace = true

# ---- integration tests (autotests = false above) ----------------------------

[[test]]
name = "spec_suite"
path = "tests/spec_suite.rs"
