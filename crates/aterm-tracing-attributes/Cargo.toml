[package]
# Keeps its aterm- name: nothing patches `tracing-attributes`; the shim reaches
# this crate through a renamed path dependency (../aterm-tracing/Cargo.toml).
name = "aterm-tracing-attributes"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Pass-through #[instrument] for the aterm `tracing` shim (replaces tracing-attributes)"

[lib]
proc-macro = true
# No unit tests in src/; doctests still run.
test = false

[dependencies]
# None: the item is returned unchanged, so no proc-macro2 / quote / syn.

[lints]
workspace = true
