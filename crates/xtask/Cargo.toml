[package]
name = "xtask"
version.workspace = true
edition = "2024"
license = "Apache-2.0"
publish = false
description = "aterm build-graph tasks: the merge gate's xtask verbs, perf, verify"

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
# `aterm_log::env`, the binary's one env lock, for driver.rs's `$CARGO` handoff.
# Not used as a logger.
aterm-log = { workspace = true }
# `aterm_verify::Toolchain`, shared with tools/verify.sh's driver, so a verb the
# gate runs resolves the same toolchain the gate did.
aterm-verify = { workspace = true }
# The third-party surface policy (`gate forge`) and the cell list (`gate cells`),
# shared with `targo --unverified forge check`. A path dep: the root
# [workspace.dependencies] table has no `aterm-forge` row.
aterm-forge = { path = "../aterm-forge" }
# `gate cells` reads cargo's `--message-format=json`, the only channel that
# reports a FRESH unit (a warm re-run prints no `Checking` line).
aterm-json = { workspace = true }
# The workspace's one FNV-1a/64 (the gate's per-checkout cache key, `perf`'s
# machine fingerprint). First-party, dependency-free.
aterm-hash = { workspace = true }

[dev-dependencies]
# Test scratch directories removed on drop.
aterm-tempfile = { workspace = true }

[lints]
workspace = true
