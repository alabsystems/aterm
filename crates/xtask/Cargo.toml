[package]
name = "xtask"
version.workspace = true
edition = "2024"
license = "Apache-2.0"
publish = false
description = "aterm build-graph tasks: harness-manifest, the merge gate's xtask verbs, perf, verify"

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
# The shared source walk (`collect_rs_files`) the harness manifest reads the
# tree with — the same walk the censuses use.
aterm-census = { workspace = true }
# THE workspace's one lock-scoped environment helper (`aterm_log::env`), for the
# single `$CARGO` handoff in driver.rs. A direct edge to the dependency-free leaf
# that is already in this binary's graph — the point of the shared helper is that
# the binary has ONE lock, which a per-crate copy would not give (see that
# module's docs). Nothing here uses aterm-log as a logger.
aterm-log = { workspace = true }
# ONE definition of "which directory is THE toolchain" (`aterm_verify::Toolchain`),
# shared with tools/verify.sh's driver, so a verb the gate runs cannot resolve a
# different toolchain than the gate did.
aterm-verify = { workspace = true }
# aterm-forge: the third-party surface policy (`gate forge`) and the cell list
# (`gate cells`), one implementation shared with `cargo forge check`. A PATH dep:
# the root [workspace.dependencies] table has no `aterm-forge` row.
aterm-forge = { path = "../aterm-forge" }
# `gate cells` reads cargo's `--message-format=json` stream, because that is the
# only channel that reports a FRESH unit: a warm re-run prints no `Checking`
# line at all, so a coverage count parsed from the human output would read as a
# collapse to zero. First-party, and already resolved in this graph through
# aterm-forge — net-new third-party packages: ZERO.
aterm-json = { workspace = true }

[lints]
workspace = true
