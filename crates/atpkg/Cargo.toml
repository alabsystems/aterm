[package]
name = "atpkg"
# Integration tests are declared at the end of this file, not discovered: the
# files are modules of the one `atpkg_suite` binary, and the four that time or
# race real children on a lock, open a pty or re-execute themselves are their
# own targets. With autotests off a `tests/*.rs` file listed nowhere never
# compiles.
autotests = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "aterm toolchain package manager: signed manifests, staged installs, atomic activation and rollback, authorized by the shared paper-master-signed machine roster."

[lib]
path = "src/lib.rs"

[[bin]]
name = "atpkg"
path = "src/main.rs"
# A shim over `atpkg::cli::main_entry` with no test of its own (its libtest
# harness ran 0 tests); the integration tests still get the built binary.
test = false

[features]
# Development seams in an optimized build (`aterm_types::dev_seam!`: ATPKG_REGISTRY,
# ATPKG_STAGE_DISK_REVERIFY; `config::DEV_SEAMS`: `[packages]`
# prefix/account and the owner/repo form of `[packages.links]`). Debug builds compile
# them anyway; the release cutter never enables this — aterm-release's buildplan pins it.
# `aterm-types/dev-seams` too: atpkg asks aterm-types' own seam readers — the log folder
# (`dirs::logs_dir`) and, at a pass's `[machine]` edge, whether it runs under a private
# state root (`dirs::runs_under_private_state_root`, ruling 409) — which expand there.
dev-seams = ["aterm-update-core/dev-seams", "aterm-types/dev-seams"]

[dependencies]
# THE load-bearing crypto root, for both signatures atpkg checks: Ed25519 over every
# signed index and manifest (the anchor, docs/TOOLCHAIN-PACKAGE-MANAGER.md S8/S13), and
# RSA-4096 PKCS#1 v1.5 over SHA-512 for a vendor's OpenPGP-signed digest document
# (`openpgp`, docs/DESIGN-atpkg-vendor-direct-updates-2026-09-22.md §1.2). ring is
# already in the compiled tree TRANSITIVELY (via rustls), but promoting it to a HARD
# DIRECT dependency is a deliberate supply-chain decision: it pins the verify
# primitive to an explicit floor so a future rustls bump that switches its backend to
# aws-lc-rs (dropping ring) cannot silently break the only crypto we depend on. The
# matching `deny.toml` [bans] floor blocks drift BELOW this version; presence is
# guaranteed structurally by this direct edge. `alloc` is the one feature atpkg's edge
# enables, because ring gates all of RSA behind it (the shipped binary already compiles
# it through rustls); `std` and the RNG fallback stay off — verification needs neither.
# Also the BULK SHA-256 (`tree::BulkSha256`: the signed archive digest and the extract
# fold over every installed byte), for its hardware SHA-256 — ~6x aterm-digest's scalar
# transcription on 1 GiB. `ring::digest` needs no feature.
ring = { workspace = true, features = ["alloc"] }
# Decode the base64 root + release Ed25519 public keys (32 raw bytes each).
# Standard padded Base64 — first-party and zero-dependency. `decode_strict` is
# the entry point every trust path uses: canonical padding REQUIRED and no
# trailing bits, so a pinned key has exactly one spelling.
aterm-codec = { workspace = true }
# The workspace's one FNV-1a/64, for `root_key_fingerprint`'s operator-facing
# digest (never a security primitive). First-party, dependency-free.
aterm-hash = { workspace = true }
# getuid() for the 0600, owned-by-uid durable high-water floor file (mirrors
# aterm-update-core's privatedir hardening). Already a workspace dependency.
libc = { workspace = true }
# The shared, platform-free ownership predicate (dir_safe_for_private_write) reused
# for the floor file's directory, so atpkg and the updater cannot drift on what
# "private" means.
aterm-types = { workspace = true }
# The workspace's one epoch-clock read (`aterm_time::unix_secs` and kin). Already in
# the graph via aterm-types.
aterm-time = { workspace = true }
# The shared advisory file lock (flock LOCK_EX) — the SAME primitive aterm-update uses
# for its apply/stage critical sections — serializes the high-water floor's
# read->compare->write so a racing advance across concurrent atpkg processes cannot be
# clobbered down (anti-rollback monotonicity, CWE-362). Brings the artifact-agnostic
# core in as the design's shared substrate (§13). Also supplies pick_slug/is_valid_slug
# for resolve_account() (the configurable index account, R3/§5).
aterm-update-core = { workspace = true }
# Parse index.toml / pkg-*.toml — but ONLY after signature verification. The parsers
# take `&sig::VerifiedBytes` (no public constructor), so an unverified-bytes parse does
# not type-check; serde derives the schema structs and the real `aterm-toml` parser replaces
# Phase 1's [keys] line-scanner, getting table-scoping + duplicate-key rejection for
# free (docs/TOOLCHAIN-PACKAGE-MANAGER.md §4/§5). reject-newer via SUPPORTED_SCHEMA.
serde = { workspace = true, features = ["derive"] }
aterm-toml = { workspace = true }
# Parse the GitHub Releases API JSON when wiring the production network Fetcher (the
# release listing + per-asset url/name). Scoped to the net adapter; the verify/parse
# core never touches JSON. Already a workspace dependency (aterm-update uses it too).
# First-party JSON (crates/aterm-json): the serde Deserializer/Serializer plus the
# untyped `Value` and `json!`. Replaces `serde_json` and the `zmij` float formatter
# behind it.
aterm-json = { workspace = true }
# In-process SHA-256 for the apply-time `tree_root` re-verify (§4.2/§8): the fold over
# the sorted (relpath, mode, sha) list, symlink targets and the lineage receipts. Each
# file's CONTENT sha is `tree::BulkSha256` (ring, above), held to this crate's digests
# by a differential test. NOT the signature root — that stays `ring` (§8);
# content-integrity only.
aterm-digest = { workspace = true }
# The bundle extractor reads a `.tar.zst` and lays it down through the tar-slip-safe
# `vet_entry` gate (§9/§15). Both halves are first-party: the zstd decoder is
# `aterm_zstd::Decoder` (no dependencies; it replaced the zstd / zstd-safe / zstd-sys
# family and libzstd's C at ZC.5, docs/AUDIT-third-party-2026-10-15.md), and the TAR
# side is `src/tarread.rs`, a read-only USTAR/PAX/GNU parser, which retired the `tar`
# crate the design flagged for supply-chain audit (§13/§15), along with the `xattr` and
# `filetime` packages it dragged in for metadata restoration this extractor never
# wanted. aterm-zstd also writes the test fixtures' frames (`frame::write_raw`, ZC.3).
# aterm NEVER WRITES a tar archive, so nothing here needed a writer. Per-entry
# extraction is still driven manually so EVERY entry is vetted before a byte is
# written, modes are sanitized, and a single escape aborts the whole stage.
aterm-zstd = { workspace = true }
# The window's Claude Code defaults (`aterm_primer::CLAUDE_DEFAULTS`) and the rules that
# hold them back, which the doctor's (10h) rows report by — the table itself, never a
# copy, so a row says only what a window start does. The top-effort key among them is
# spelled once, from parts, in that crate (the publication baseline bans the word,
# joined, in every exported file). aterm-primer is a std-only leaf with no dependencies
# of its own: the edge brings nothing else in.
aterm-primer = { workspace = true }
# `aterm_uds::spawnfd::command`: the `Command` every child here is built with, so
# none inherits a descriptor of this process above stdio (clippy.toml: one child
# constructor), and on Windows a caller with no console (a pass the window starts,
# a detached `pkg update`) gives it a WINDOWLESS console, where a bare console child
# opened a visible one (measured 2026-09-30). A dependency-free leaf the one
# binary links already.
aterm-uds = { workspace = true }
# The Developer Tools list's detector (`consent::devtool_grant` over the system TCC.db's
# row and tccd's answers), for the `devtools:` row both doctors print (`crate::devtools`).
# A small first-party leaf (aterm-log, aterm-uds, libc) already in the one binary's graph.
aterm-containment = { workspace = true }

[dev-dependencies]
# Tier-1 conformance drives the real index-probe stamp/lock against the derived
# bounded model; this edge exists only while compiling tests, never in atpkg.
aterm-spec = { workspace = true }
# Test fixtures SIGN: deterministic Ed25519 manifests (Ed25519KeyPair::from_seed_unchecked
# + .sign) and the `openpgp` RSA vectors (RsaKeyPair::sign under a committed test key).
# Re-declaring ring here with DEFAULT features adds the rest of ring's defaults to the
# TEST build only (feature unification across normal+dev within this leaf package); the
# normal build keeps the minimal edge above.
ring = { workspace = true, features = ["default"] }
# Test scratch directories removed on drop. First-party with zero dependencies of its
# own, and already in the shipped graph (aterm-grid's): the edge adds nothing to the
# supply chain.
aterm-tempfile = { workspace = true }
# The tty test's pseudo-terminal, both ends close-on-exec from birth
# (`open_pty_pair`): an `openpty(3)` pair is inheritable, and the child spawned onto
# it kept a copy of its own master. First-party, and in the one shipped binary that
# links atpkg already; no cycle (aterm-pty's graph names no atpkg). Tests only.
aterm-pty = { workspace = true }
# The forge cell matrix, so a published triple with no compile cell fails a test.
# std-only and never in atpkg's shipped graph.
aterm-forge = { workspace = true }

[lints]
workspace = true

# ---- integration tests (autotests = false above) ----------------------------

[[test]]
name = "atpkg_suite"
path = "tests/atpkg_suite.rs"

# Alone: re-executes itself with `--exact concurrent_appender_child`.
[[test]]
name = "packages_log_lanes"
path = "tests/packages_log_lanes.rs"

# Alone: races real `atpkg` children for the cross-process store lock.
[[test]]
name = "selfupdate_intercept"
path = "tests/selfupdate_intercept.rs"

# Alone: times real `atpkg` children waiting on the cross-process store lock.
[[test]]
name = "store_lock_wait"
path = "tests/store_lock_wait.rs"

# Alone: opens a pty (`ptsname(3)` answers from a static buffer) and times a child waiting on a held lock.
[[test]]
name = "typed_lock_wait_tty"
path = "tests/typed_lock_wait_tty.rs"
