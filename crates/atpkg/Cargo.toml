[package]
name = "atpkg"
# Integration tests are listed at the end of this file: most are modules of the one
# `atpkg_suite` binary; the four that time or race real children on a lock, open a pty or
# re-execute themselves are their own targets. A `tests/*.rs` file listed nowhere never
# compiles.
autotests = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "aterm toolchain package manager: signed manifests, staged installs, atomic activation and rollback, authorized by the shared paper-master-signed machine roster."

[lib]
path = "src/lib.rs"

[[bin]]
name = "atpkg"
path = "src/main.rs"
# A shim over `atpkg::cli::main_entry` with no tests; the integration tests still get the
# built binary.
test = false

# abrew (docs/DESIGN-abrew-2026-10-19.md): same dev-only shim shape as
# `atpkg` above; the shipped name is an argv0 symlink onto `aterm`.
[[bin]]
name = "atpkg-abrew"
path = "src/abrew_main.rs"
test = false

[features]
# Development seams in an optimized build (`aterm_types::dev_seam!`: ATPKG_REGISTRY,
# ATPKG_STAGE_DISK_REVERIFY, ATPKG_WAIT_ANNOUNCE_GRACE_MS; `config::DEV_SEAMS`: `[packages]`
# prefix/account and the owner/repo form of `[packages.links]`). Debug builds have them
# anyway; aterm-release's buildplan keeps a release build from enabling this. It forwards to
# aterm-types' own seam readers (`dirs::logs_dir`, `dirs::runs_under_private_state_root`).
dev-seams = ["aterm-update-core/dev-seams", "aterm-types/dev-seams"]

[dependencies]
# The crypto root for both signatures atpkg checks: Ed25519 over every signed index and
# manifest (docs/TOOLCHAIN-PACKAGE-MANAGER.md S8/S13), and RSA-4096 PKCS#1 v1.5 over SHA-512
# for a vendor's OpenPGP-signed digest document (`openpgp`,
# docs/DESIGN-atpkg-vendor-direct-updates-2026-09-22.md §1.2). A direct edge, not only
# rustls's transitive one, so a rustls switch to aws-lc-rs cannot drop it; `deny.toml`
# floors its version. `alloc` because ring gates RSA behind it; `std` and the RNG fallback
# stay off. Also `tree::BulkSha256`, the bulk-content SHA-256 (the signed archive digest and
# every extracted file), for the CPU's SHA-256 instructions; `ring::digest` needs no feature.
ring = { workspace = true, features = ["alloc"] }
# Decode the base64 root + release Ed25519 public keys (32 raw bytes each).
# Standard padded Base64 — first-party; its one dependency is astream-wire
# (dependency-free, vendor/astream). `decode_strict` is
# the entry point every trust path uses: canonical padding REQUIRED and no
# trailing bits, so a pinned key has exactly one spelling.
aterm-codec = { workspace = true }
# The workspace's one FNV-1a/64, for `root_key_fingerprint`'s operator-facing
# digest (never a security primitive). First-party; its one dependency is
# astream-wire (dependency-free, vendor/astream), whose byte loop it runs.
aterm-hash = { workspace = true }
libc = { workspace = true }
# How each write is finished: durable (F_FULLFSYNC) or ordered (F_BARRIERFSYNC).
aterm-durable = { workspace = true }
# The shared, platform-free ownership predicate (dir_safe_for_private_write) reused
# for the floor file's directory, so atpkg and the updater cannot drift on what
# "private" means.
aterm-types = { workspace = true }
# The workspace's one epoch-clock read (`aterm_time::unix_secs` and kin).
aterm-time = { workspace = true }
# First-party bounded regex engine for abrew's `search /regex/` form. It
# refuses constructs it cannot evaluate (look-around, backreferences,
# \p{…}) instead of reinterpreting them, which is what lets admission
# keep delegating those spellings to real Homebrew.
aterm-regex = { workspace = true }
# THE toolchain's discovery, rustup's home, the build-cache rule, the gone-checkout rule
# and the lease core, std only; `toolchain`, `build_cache` and `lease` re-export them.
aterm-toolchain = { workspace = true }
# The shared advisory file lock (flock LOCK_EX) — the SAME primitive aterm-update uses
# for its apply/stage critical sections — serializes the high-water floor's
# read->compare->write so a racing advance across concurrent atpkg processes cannot be
# clobbered down (anti-rollback monotonicity, CWE-362). Brings the artifact-agnostic
# core in as the design's shared substrate (§13). Also supplies pick_slug/is_valid_slug
# for resolve_account() (the configurable index account, R3/§5).
aterm-update-core = { workspace = true }
# Parse index.toml / pkg-*.toml only after signature verification: the parsers take
# `&sig::VerifiedBytes` (no public constructor), so parsing unverified bytes does not
# type-check. aterm-toml rejects duplicate keys; `SUPPORTED_SCHEMA` rejects a newer schema
# (docs/TOOLCHAIN-PACKAGE-MANAGER.md §4/§5).
serde = { workspace = true, features = ["derive"] }
aterm-toml = { workspace = true }
# First-party JSON: the progress file, `lane`'s stdin, the doctor's read of Claude Code
# settings and the vendor-direct resolver's manifests. The signature verify/parse core
# never touches JSON.
aterm-json = { workspace = true }
# In-process SHA-256 for the apply-time `tree_root` re-verify: the fold over the sorted
# (relpath, mode, sha) list, symlink targets and lineage receipts. File content goes through
# `tree::BulkSha256` (ring), which a differential test holds to this crate's digest.
# Content integrity only, never a signature primitive.
aterm-digest = { workspace = true }
# The bundle extractor reads a `.tar.zst`: the first-party `aterm_zstd::Decoder` decodes it
# and `src/tarread.rs` (read-only USTAR/PAX/GNU) parses it. Extraction runs per entry so
# every entry passes the tar-slip-safe `vet_entry` gate before a byte is written, modes are
# sanitized, and one escape aborts the whole stage. aterm-zstd also writes the test
# fixtures' frames (`frame::write_raw`).
aterm-zstd = { workspace = true }
# The window's Claude Code defaults (`aterm_primer::CLAUDE_DEFAULTS`) and the rules that
# hold them back: the doctor reads the table itself, so a row says only what a window start
# does. Use `CLAUDE_TOP_EFFORT_KEY`, never the key spelled out: the publication baseline
# bans the joined word in exported files.
aterm-primer = { workspace = true }
# `aterm_uds::spawnfd::command` builds every child here: none inherits a descriptor above
# stdio, and on Windows a caller with no console gives the child a windowless console
# instead of a visible one.
aterm-uds = { workspace = true }
# The Developer Tools list's detector (`consent::devtool_grant`), for the `devtools:` row
# both doctors print (`crate::devtools`).
aterm-containment = { workspace = true }

# Private per-operation download and extraction staging, removed on drop.
aterm-tempfile = { workspace = true }
# The converge engine's model (docs/DESIGN-init-system-2026-10-20.md §3): `machine`'s
# tri-state `defaults` read is its `Read<T>`, one rule with the machines families. serde,
# aterm-json and aterm-durable, which it adds, atpkg links already.
aterm-converge = { workspace = true }

# On Windows, the one reader of another process's environment block
# (`aterm_sysprobe::peb::parameters`), which `caller_shell::process_args`
# splits, and the case fold a variable's name is looked up by
# (`aterm_sysprobe::paths::fold_case`, `RtlUpcaseUnicodeChar`'s), for
# `caller_shell::ProcArgs::env_var`. Already in atpkg's Windows graph through
# aterm-toolchain and aterm-uds; pure Rust and kernel32/ntdll FFI there.
[target.'cfg(windows)'.dependencies]
aterm-sysprobe = { workspace = true }

[dev-dependencies]
# Tier-1 conformance drives the real index-probe stamp/lock against the derived
# bounded model, and `aterm_spec::host::test_shell` finds the real shells the hook
# tests run; this edge exists only while compiling tests, never in atpkg.
aterm-spec = { workspace = true }
# The models its tests drive (a model edit rebuilds only their tests).
aterm-models-atpkg = { workspace = true }
# Test fixtures SIGN: deterministic Ed25519 manifests (Ed25519KeyPair::from_seed_unchecked
# + .sign) and the `openpgp` RSA vectors (RsaKeyPair::sign under a committed test key).
# Re-declaring ring here with DEFAULT features adds the rest of ring's defaults to the
# TEST build only (feature unification across normal+dev within this leaf package); the
# normal build keeps the minimal edge above.
ring = { workspace = true, features = ["default"] }
# The tty test's pseudo-terminal, both ends close-on-exec from birth
# (`open_pty_pair`): an `openpty(3)` pair is inheritable, and the child spawned onto
# it kept a copy of its own master. First-party, and in the one shipped binary that
# links atpkg already; no cycle (aterm-pty's graph names no atpkg). Tests only.
aterm-pty = { workspace = true }
# The forge cell matrix: a published triple that no forge cell compiles fails a test.
aterm-forge = { workspace = true }
# The lock-wait tests read a waiter's parent from the kernel's process table (`kproc`, the
# sweep off macOS), not through `ps`. First-party, libc only. Tests only.
aterm-sysprobe = { workspace = true }

[lints]
workspace = true

# ---- integration tests (autotests = false above) ----------------------------

[[test]]
name = "atpkg_suite"
path = "tests/atpkg_suite.rs"

# Alone: re-executes itself with `--exact concurrent_appender_child`.
[[test]]
name = "packages_log_lanes"
path = "tests/packages_log_lanes.rs"

# Alone: opens a pty (`ptsname(3)` uses a static buffer) and times a child on a held lock.
[[test]]
name = "typed_lock_wait_tty"
path = "tests/typed_lock_wait_tty.rs"

# Explicit mounted-volume acceptance; not an ordinary test or a release dependency.
[[bench]]
name = "dmg_acceptance"
harness = false
test = false
