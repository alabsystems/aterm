[package]
# The package must be `tracing`: `[patch.crates-io]` matches on package name.
# The directory keeps the `aterm-` prefix so it reads as ours, not vendored.
name = "tracing"
# Not `version.workspace = true`: a semver contract with the consumers
# (softbuffer ^0.1.41, winit ^0.1.40, tiny-xlib ^0.1.37, zbus ^0.1.40).
version = "0.1.44"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "First-party no-op `tracing` facade for aterm (replaces tracing + tracing-core + tracing-attributes; also pin-project-lite on mac/windows)"

[dependencies]
# Optional; off on mac, windows and wasm. Renamed so the implicit feature is
# spelled `tracing-attributes`, as upstream's: on Linux zbus takes default
# features and the resolver enables `attributes, default, std,
# tracing-attributes`.
tracing-attributes = { package = "aterm-tracing-attributes", path = "../aterm-tracing-attributes", optional = true }

[features]
# Upstream's feature table. Only `default`, `std`, `attributes` and
# `tracing-attributes` are reachable today (Linux, via zbus); the rest are
# no-ops declared so a transitive `tracing/log` request still resolves.
default = ["std", "attributes"]
attributes = ["tracing-attributes"]
# Ignored: the shim is `no_std` regardless.
std = []
async-await = []
log = []
log-always = ["log"]
valuable = []
max_level_off = []
max_level_error = []
max_level_warn = []
max_level_info = []
max_level_debug = []
max_level_trace = []
release_max_level_off = []
release_max_level_error = []
release_max_level_warn = []
release_max_level_info = []
release_max_level_debug = []
release_max_level_trace = []

[lints]
workspace = true

[lib]
# No unit tests in src/; doctests still run.
test = false
