[package]
# The package must be `tracing`: `[patch.crates-io]` matches on package name.
# The directory keeps the `aterm-` prefix so it reads as ours, not vendored.
name = "tracing"
# Not `version.workspace = true`: a semver contract with the consumers
# (softbuffer ^0.1.41, winit ^0.1.40; zbus ^0.1.40 until A11Y.4, and
# tiny-xlib ^0.1.37 until it left with softbuffer's Linux arm at LW.6).
version = "0.1.44"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "First-party no-op `tracing` facade for aterm (replaces tracing + tracing-core + tracing-attributes; also pin-project-lite on mac/windows)"

[features]
# Upstream's feature table, without `attributes`: `std` is reachable; the
# rest are no-ops declared so a transitive `tracing/log` request still
# resolves. No `default` key (upstream's is `std`): an inert default still
# forked the build, since a `--workspace` build selects this member with it
# and the shipped graph's consumers ask for none, so the two compiled two
# tracings and everything above them (P4). No consumer writes `#[instrument]`
# since zbus, the one that did, left the graph at A11Y.4, so `attributes` and
# its pass-through proc macro (crates/aterm-tracing-attributes) were deleted
# at A11Y.6 (docs/AUDIT-third-party-2026-10-15.md, unit a11y): a crate that
# asks for it again fails to resolve, loudly.
# Ignored: the shim is `no_std` regardless.
std = []
async-await = []
log = []
log-always = ["log"]
valuable = []
max_level_off = []
max_level_error = []
max_level_warn = []
max_level_info = []
max_level_debug = []
max_level_trace = []
release_max_level_off = []
release_max_level_error = []
release_max_level_warn = []
release_max_level_info = []
release_max_level_debug = []
release_max_level_trace = []

[lints]
workspace = true

[lib]
# No unit tests in src/; doctests still run.
test = false
