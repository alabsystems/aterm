[package]
# Must be `tracing` so `[patch.crates-io]` matches on package name; the
# directory keeps the `aterm-` prefix to mark it as first-party.
name = "tracing"
# Semver contract with transitive consumers (softbuffer ^0.1.41, winit ^0.1.40).
version = "0.1.44"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "First-party no-op `tracing` facade for aterm (replaces tracing + tracing-core + tracing-attributes; also pin-project-lite on mac/windows)"

[features]
# Upstream's feature table, without `attributes` (no consumer uses
# `#[instrument]`): `std` is reachable and the rest are no-ops so transitive
# feature requests still resolve. No `default` key: `--workspace` builds would
# select it while the shipped graph's consumers ask for none, compiling `tracing`
# and its dependents twice. The shim is `no_std` regardless.
std = []
async-await = []
log = []
log-always = ["log"]
valuable = []
max_level_off = []
max_level_error = []
max_level_warn = []
max_level_info = []
max_level_debug = []
max_level_trace = []
release_max_level_off = []
release_max_level_error = []
release_max_level_warn = []
release_max_level_info = []
release_max_level_debug = []
release_max_level_trace = []

[lints]
workspace = true

[lib]
# No unit tests in src/; doctests still run.
test = false
