[package]
name = "aterm-phase"
# Integration tests are declared below, not discovered. With autotests off a
# `tests/*.rs` file listed nowhere never compiles.
autotests = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "aterm — the worker-phase reader: busy | prompt | limited | idle | question, the context indicator and the approval box, read from one screen of a Claude Code or Codex session; shared by `aterm drive phase` and the fabric bridge's presence rows"

[lints]
workspace = true

# NO DEPENDENCIES, and that is the point of the crate. The reader is pure
# functions over `&[String]` rows; `aterm-agent` (the supervisor, `aterm drive`)
# and `aterm-link` (the fabric bridge, whose presence rows carry `phase=`)
# both link it, and neither should pull the other. See src/lib.rs.
[dependencies]

[[test]]
name = "phase_suite"
path = "tests/phase_suite.rs"

# Alone: installs a process-wide panic hook for the length of its sweep.
[[test]]
name = "panic_sweep"
path = "tests/panic_sweep.rs"
