[package]
name = "aterm-phase"
# Integration tests are declared below, not discovered: a `tests/*.rs` file listed nowhere
# never compiles.
autotests = false
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "aterm — the worker-phase reader: busy | prompt | limited | idle | question, the context indicator and the approval box, read from one screen of a Claude Code, Codex, agy or Muse Code session; shared by `aterm drive phase` and the server's agent verdict"

[lints]
workspace = true

# One dependency, by design: the reader is pure functions over `&[String]` rows, linked by
# `aterm-agent` (`aterm drive`) and `aterm-gui` (the server's agent verdict, relayed by the
# fabric as `phase=`). It names a program's agent by aterm-agent-names, the one name table,
# which a crate deny.toml keeps from the reader reads directly.
[dependencies]
aterm-agent-names = { workspace = true }

[dev-dependencies]
# aterm-cores: the cores a test's pool may use (`available_parallelism`, bounded by its grant).
aterm-cores = { workspace = true }
# `text_hash` is spelled out, so the library stays clear of astream-wire, which the prover its
# floors.tsv row names cannot compile; a test holds it to the workspace's FNV-1a.
aterm-hash = { workspace = true }
# The grid's layout of a row (`aterm_grapheme::str_grid_columns`, the model of aterm-core's
# write path, and the tables it reads: `char_width`, `is_vs16_emoji_capable`,
# `is_emoji_modifier_base`): `question::Columns` and its tables are spelled out, so the library
# stays clear of aterm-types and astream-wire, and tests hold them to these over every code point.
aterm-grapheme = { workspace = true }
# The grid itself (`aterm_core::terminal::Terminal`): the readers count a row as the grid reads
# it back (`Terminal::row_text`, the text the server's `screen_rows` hands them), which is not
# the text written to it where a VS15 narrows a two-cell character, so tests write rows through
# it and hold `question::Columns` to the columns it paints. A dev-dependency only, so the library
# keeps its one dependency.
aterm-core = { workspace = true }
aterm-regex = { workspace = true }
aterm-tempfile = { workspace = true }
# The explicit vendor_drift bench resolves managed builds through
# `aterm pkg which` using the workspace's child builder. The library does not;
# ordinary fixtures do not resolve host-installed builds.
aterm-uds = { workspace = true }

[[test]]
name = "phase_suite"
path = "tests/phase_suite.rs"

# Alone: installs a process-wide panic hook for the length of its sweep.
[[test]]
name = "panic_sweep"
path = "tests/panic_sweep.rs"

[[bench]]
name = "vendor_drift"
path = "benches/vendor_drift.rs"
harness = false
test = false
