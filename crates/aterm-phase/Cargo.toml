[package]
name = "aterm-phase"
# Integration tests are declared below, not discovered. With autotests off a
# `tests/*.rs` file listed nowhere never compiles.
autotests = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "aterm — the worker-phase reader: busy | prompt | limited | idle | question, the context indicator and the approval box, read from one screen of a Claude Code, Codex, agy or Muse Code session; shared by `aterm drive phase` and the server's agent verdict"

[lints]
workspace = true

# NO DEPENDENCIES, and that is the point of the crate. The reader is pure
# functions over `&[String]` rows, linked by `aterm-agent` (the supervisor,
# `aterm drive`) and `aterm-gui` (the server, whose agent verdict the fabric
# relays as `phase=`); `aterm-link`, the fabric, links no screen reader. See
# src/lib.rs.
[dependencies]

[[test]]
name = "phase_suite"
path = "tests/phase_suite.rs"

# Alone: installs a process-wide panic hook for the length of its sweep.
[[test]]
name = "panic_sweep"
path = "tests/panic_sweep.rs"
