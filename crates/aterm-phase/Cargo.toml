[package]
name = "aterm-phase"
# Integration tests are declared below, not discovered: a `tests/*.rs` file listed nowhere
# never compiles.
autotests = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "aterm — the worker-phase reader: busy | prompt | limited | idle | question, the context indicator and the approval box, read from one screen of a Claude Code, Codex, agy or Muse Code session; shared by `aterm drive phase` and the server's agent verdict"

[lints]
workspace = true

# One dependency, by design: the reader is pure functions over `&[String]` rows, linked by
# `aterm-agent` (`aterm drive`) and `aterm-gui` (the server's agent verdict, relayed by the
# fabric as `phase=`). It names a program's agent by aterm-agent-names, the one name table,
# which a crate deny.toml keeps from the reader reads directly.
[dependencies]
aterm-agent-names = { workspace = true }

[dev-dependencies]
aterm-tempfile = { workspace = true }
# The explicit vendor_drift bench resolves managed builds through
# `aterm pkg which` using the workspace's child builder. The library remains
# dependency-free; ordinary fixtures do not resolve host-installed builds.
aterm-uds = { workspace = true }

[[test]]
name = "phase_suite"
path = "tests/phase_suite.rs"

# Alone: installs a process-wide panic hook for the length of its sweep.
[[test]]
name = "panic_sweep"
path = "tests/panic_sweep.rs"

[[bench]]
name = "vendor_drift"
path = "benches/vendor_drift.rs"
harness = false
test = false
