[package]
name = "aterm-json"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "First-party JSON for aterm: a serde Deserializer/Serializer and an untyped Value (replaces `serde_json` and the `zmij` float formatter behind it)"

[dependencies]
# `serde` (first-party `crates/aterm-serde`) for typed `Deserialize` support.
serde = { workspace = true }

[dev-dependencies]
# The tests and doctests derive their models, as a dependent would. The normal
# row stays derive-free so the lib's closure holds no proc macro (Trust PM-1).
serde = { workspace = true, features = ["derive"] }

[lints]
workspace = true

[lib]
# Tests live in `tests/` and doctests.
test = false
