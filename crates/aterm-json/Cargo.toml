[package]
name = "aterm-json"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "First-party JSON for aterm: a serde Deserializer/Serializer and an untyped Value (replaces `serde_json` and the `zmij` float formatter behind it)"

[dependencies]
# serde is the ONLY dependency, and it is deliberate — the same reasoning
# `aterm-toml` records. The typed call sites in this tree are `from_str::<T>`
# against `#[derive(Deserialize)]` models, so the replacement has to BE a
# `serde::Deserializer`; a parser that returned a value tree would mean
# rewriting every model by hand. serde_derive is a proc macro and contributes
# zero machine code to the shipped binary, and `serde` itself is already in the
# graph for a dozen other reasons. Retiring serde is explicitly NOT in scope.
serde = { workspace = true }

[dev-dependencies]
# THE ORACLE — never in the shipped graph. The crate this one retires, kept so
# every parse and every serialization is proved equal to the reference: the
# same accept-or-reject verdict on malformed input, and BYTE-IDENTICAL output,
# which matters because some of this JSON is hashed into a checkpoint
# fingerprint and some of it is a request body a server reads. Pinned here
# rather than inherited from [workspace.dependencies]: the point of this crate
# is that no shipped member declares it any more.
serde_json = "1"
serde = { workspace = true }

[lints]
workspace = true
