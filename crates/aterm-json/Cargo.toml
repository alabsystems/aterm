[package]
name = "aterm-json"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "First-party JSON for aterm: a serde Deserializer/Serializer and an untyped Value (replaces `serde_json` and the `zmij` float formatter behind it)"

[dependencies]
# serde is the ONLY dependency, and it is deliberate — the same reasoning
# `aterm-toml` records. The typed call sites in this tree are `from_str::<T>`
# against `#[derive(Deserialize)]` models, so the replacement has to BE a
# `serde::Deserializer`; a parser that returned a value tree would mean
# rewriting every model by hand. `serde` is the workspace row: first-party
# crates/aterm-serde and its derive since docs/AUDIT-third-party-2026-10-15.md
# SP.6, so this crate's whole graph is aterm's own.
serde = { workspace = true }

[dev-dependencies]
# The tests and doctests derive their models, as a dependent would. The normal
# row stays derive-free so the lib's closure holds no proc macro (Trust PM-1).
serde = { workspace = true, features = ["derive"] }

[lints]
workspace = true

[lib]
# No unit tests live in src/, so this lib's libtest harness ran 0 tests in every
# gate while still being linked and executed. Off; doctests are governed
# separately and still run.
test = false
