[package]
name = "aterm-session"
# Integration tests are declared below, not discovered. With autotests off a
# `tests/*.rs` file listed nowhere never compiles.
autotests = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Hierarchical-session routing fabric: stable session ids, the per-edge op-scoped fail-closed authority table (EdgeToken/decide_edge), and the single whole-frame-atomic byte sink to a PTY master."

[features]

[dependencies]
aterm-pty = { workspace = true }
# THE workspace's one audited entropy surface (`aterm_uds::rand::fill`:
# getentropy(2) with a bounded read_exact fallback, BCryptGenRandom on Windows,
# hex encoding checked exhaustively by
# `rand::tests::hex_encode_is_exact_lowercase_and_injective`). Session ids and
# launch nonces mint through it — and it is why this crate needs no `rand_core`.
# Dependency-free leaf, so it adds no third-party package.
aterm-uds = { workspace = true }
# The anchor attributes' registry (std-only): `#[cfg_attr(any(test, debug_assertions),
# aterm_spec_anchor::refines(…))]` expands in every test and debug build; release strips it.
aterm-spec-anchor = { workspace = true }

[dev-dependencies]
# Derived-spec models (ty_model!) + the in-process interpreter for the fabric's
# bounded state machines (the edge gate, the sink no-loss loop). The exhaustive
# TLA+ `ty` model-check is gated on the external `ty` binary; the interpreter-driven
# proves/catches run unconditionally. Also makes the fd-lifecycle anchors expand
# under plain `cargo test -p aterm-session` (the `test` cfg in the cfg_attr gate).
aterm-spec = { workspace = true }
# The models its tests drive (a model edit rebuilds only their tests).
aterm-models-core = { workspace = true }
aterm-models-session = { workspace = true }
# spill_bound.rs regression test only: `pipe(2)` to build a blocking fd whose read
# end is never drained (a wedged foreground), so the non-parking spill path is
# exercised end-to-end against a full kernel buffer.
libc = { workspace = true }

[lints]
workspace = true

[[test]]
name = "session_suite"
path = "tests/session_suite.rs"

# Alone: a counting #[global_allocator].
[[test]]
name = "spill_bound"
path = "tests/spill_bound.rs"

# Alone: reads the process-wide owned-master count that any sink moves.
[[test]]
name = "owned_master_census"
path = "tests/owned_master_census.rs"

# Alone: (macOS) inheritable pty slaves, and concurrent `openpty` calls across
# files race.
[[test]]
name = "input_backlog_pty"
path = "tests/input_backlog_pty.rs"

# Alone: (macOS) opens inheritable ptys that a sibling's child could hold.
[[test]]
name = "conformance_input_unread"
path = "tests/conformance_input_unread.rs"
