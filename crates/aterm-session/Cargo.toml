[package]
name = "aterm-session"
# Integration tests are declared below: with autotests off, an unlisted `tests/*.rs`
# never compiles.
autotests = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Hierarchical-session routing fabric: stable session ids, the per-edge op-scoped fail-closed authority table (EdgeToken/decide_edge), and the single whole-frame-atomic byte sink to a PTY master."

[features]

[dependencies]
aterm-pty = { workspace = true }
# The workspace's audited entropy source (`aterm_uds::rand::fill`): session ids and
# launch nonces mint through it, so this crate needs no `rand_core`.
aterm-uds = { workspace = true }
# The anchor attributes' registry (std-only): `#[cfg_attr(any(test, debug_assertions),
# aterm_spec_anchor::refines(…))]` expands in every test and debug build; release strips it.
aterm-spec-anchor = { workspace = true }

[dev-dependencies]
# `ty_model!` models and the interpreter for the conformance tests; the `test` cfg also
# expands the fd-lifecycle anchors.
aterm-spec = { workspace = true }
# The models its tests drive (a model edit rebuilds only their tests).
aterm-models-core = { workspace = true }
aterm-models-session = { workspace = true }
# Tests only: raw fds (pipes, termios, fcntl) and errno values.
libc = { workspace = true }

# The Windows suite spawns its programs in real ConPTY sessions
# (`tests/windows_input_release.rs`), minting the capabilities a spawn takes.
[target.'cfg(windows)'.dev-dependencies]
aterm-cap = { workspace = true, features = ["launcher-mint"] }
aterm-sandbox = { workspace = true }
aterm-tempfile = { workspace = true }

[lints]
workspace = true

[[test]]
name = "session_suite"
path = "tests/session_suite.rs"

# Alone: a counting #[global_allocator].
[[test]]
name = "spill_bound"
path = "tests/spill_bound.rs"

# Alone: reads the process-wide owned-master count that any sink moves.
[[test]]
name = "owned_master_census"
path = "tests/owned_master_census.rs"

# Alone: (macOS) inheritable pty slaves, and concurrent `openpty` calls across
# files race.
[[test]]
name = "input_backlog_pty"
path = "tests/input_backlog_pty.rs"

# Alone: (macOS) opens inheritable ptys that a sibling's child could hold.
[[test]]
name = "conformance_input_unread"
path = "tests/conformance_input_unread.rs"
