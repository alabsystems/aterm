[package]
# The package must be named `smallvec`: `[patch.crates-io]` matches on package
# name. The directory keeps the `aterm-` prefix so it is not mistaken for
# vendored upstream (`vendor/`), as with crates/aterm-arrayvec.
name = "smallvec"
# Not `version.workspace = true`: this is a semver contract with the consumers.
# (rustybuzz 0.20.1 asked `^1.6` until TF.6.) parking_lot_core 0.9.12 `^1.6.1`, wayland-backend
# 0.3.15 `^1.9`, and wgpu, wgpu-core and wgpu-hal 29.0.3 `^1.14`. 1.15.1 is what
# the lock held before the swap. It must also stay >= any other `1.x` smallvec
# the workspace forces into the graph (nothing does: no dev-dependency oracle
# holds one, see tests/), or cargo satisfies the consumers from the registry
# copy and the patch row is silently inert. `targo --unverified forge check`
# fails if that happens.
version = "1.15.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "First-party `smallvec` replacement for aterm (SmallVec<[T; N]> over aterm_alloc::SmallVec<T, N>; replaces the crates.io smallvec package)"

# Declared explicitly so the crate name consumers write cannot drift.
[lib]
name = "smallvec"
path = "src/lib.rs"
# No unit tests: they live in tests/.
test = false

[dependencies]
# The implementation: aterm's own inline-then-heap vector, `#![no_std]` and
# under the workspace's Trust gate. This crate adds no unsafe code of its own.
aterm-alloc = { workspace = true }

[features]
# The feature names consumers ask for, declared (a `[patch]` target must accept
# every feature a consumer names, at resolution time, whether or not it is ever
# activated) and inert:
# - `union` (wgpu-hal, wayland-backend) picks upstream's storage layout; the
#   layout here is aterm_alloc's either way.
# - `const_generics` (wayland-backend) is how `[T; N]` implements `Array` for
#   every N; here that is the only implementation.
# - `const_new` (wayland-backend) adds `new_const`, which is always present.
# - `serde` is named by wgpu-core's own `serde` feature (`smallvec/serde`),
#   which no cell turns on. If one ever does, the build fails at wgpu-core's
#   derive with a missing `Serialize` impl, not silently.
const_generics = []
const_new = ["const_generics"]
union = []
serde = []

[lints]
workspace = true
