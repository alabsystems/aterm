[package]
name = "aterm-types"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared types for aterm terminal engine (Rgb, CursorStyle, BiDiMode, ColorPalette)"

[features]
default = []
serde = ["dep:serde"]
# NO PLATFORM FEATURE LIVES HERE, and that is load-bearing. The K-2 winit->engine
# key map used to sit behind an optional `winit-keymap = ["dep:winit"]` feature
# whose comment promised that "the FFI/bridge consumers of aterm-types never pull
# winit". Cargo unifies features across a workspace resolve, so `cargo build
# --workspace` enabled it for every consumer and `aterm-ctl` — which declares
# only aterm-types + aterm-uds — linked AppKit/Carbon/ApplicationServices/
# CoreGraphics/CoreVideo/CoreFoundation/Foundation/libobjc, ~1.7 ms of dyld work
# per exec before `main`, on a route that calls none of it. The map now lives in
# its own crate (`crates/aterm-winit-keymap`), which is the version of that
# promise Cargo can actually keep. Adding an optional platform dependency back to
# THIS manifest re-opens the hole for every consumer at once; put it in a crate
# of its own instead.

[dependencies]
aterm-alloc = { workspace = true }
aterm-error = { workspace = true }
# F11-4 (#7941): MutexExt::lock_or_recover logs poison recoveries so
# silently-recovered poisoning is never invisible to observability.
aterm-log = { workspace = true }
# Internal clock seam: std::time on native (byte-identical), JS clock on wasm32 so
# `current_time_ms()` doesn't panic "time not implemented".
aterm-time = { workspace = true }
serde = { workspace = true, optional = true }

[dev-dependencies]
aterm-spec = { workspace = true }
proptest = { workspace = true }

[lints]
workspace = true
