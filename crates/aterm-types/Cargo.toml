[package]
name = "aterm-types"
# Integration tests are declared below, not discovered: every file is a module of
# the one `types_suite` binary, so an unlisted `tests/*.rs` never compiles.
autotests = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared types for aterm terminal engine (Rgb, CursorStyle, BiDiMode, ColorPalette)"

[features]
serde = ["dep:serde"]
# Development seams (`aterm_types::dev_seam!`) in an optimized build; debug builds
# compile them anyway and the release build never enables this. `dev_seam!` reads
# the calling crate's `dev-seams` feature, and this crate's own test calls it.
dev-seams = []
# No platform feature here: Cargo unifies features across the workspace, so an
# optional platform dependency would link into every consumer. Platform code gets
# a crate of its own, as `aterm-winit-keymap` does.

[dependencies]
# Hex for the loaded-code subject attached to Local Network observations.
aterm-codec = { workspace = true }
# Exclusive owned staging for the shared atomic theme writer.
aterm-tempfile = { workspace = true }
# The theme writer's full flush and its folder's best-effort one (aterm-durable: std plus
# astream-sys, no other code).
aterm-durable = { workspace = true }
aterm-alloc = { workspace = true }
# The fabric's nine `in` kinds are astream-wire's `WakeClass` (`fabric_grammar::KINDS`,
# `is_kind`) and its three receipt verdicts are `ReceiptVerdict` (`VERDICTS`,
# `is_verdict`): one list each, astream's. astream-wire has no dependencies and no platform
# code, and it is in this graph already through aterm-codec and aterm-hash.
astream-wire = { path = "../../vendor/astream/crates/astream-wire" }
# FNV-1a/64 for `RowsFence::hash_rows`: server and clients must compute one hash.
aterm-hash = { workspace = true }
# MutexExt::lock_or_recover logs each poison recovery.
aterm-log = { workspace = true }
# Clock seam: std::time on native, the JS clock on wasm32 (std's panics there).
aterm-time = { workspace = true }
serde = { workspace = true, optional = true, features = ["derive"] }
# The machine-number anchors on `settle`, `choose` and `check`: `#[cfg_attr(any(test,
# debug_assertions), aterm_spec_anchor::refines(…))]` expands in every test and debug build;
# release strips it.
aterm-spec-anchor = { workspace = true }

# A Cargo test binary's own per-user root (`aterm_uds::test_binary`): in a test the
# state, data, log and config folders (`dirs`) answer under it, never the person's.
# Not on wasm, which has none of those folders.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
aterm-uds = { workspace = true }

[dev-dependencies]
aterm-spec = { workspace = true }
# The machine-number models `machine_name::model_tests` holds `settle`, `choose` and `check` to.
aterm-models-swarm = { workspace = true }
# Test-only: a serializer for the `serde` feature's round-trip tests.
aterm-json = { workspace = true }

[lints]
workspace = true

[[test]]
name = "types_suite"
path = "tests/types_suite.rs"
