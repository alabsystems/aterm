[package]
name = "aterm-net"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "aterm L3 — the fleet: a mutual, exporter-bound proof of one fleet secret over TLS 1.3, the listener that serves proved LAN peers, and the relay that bridges a proved stream to a local socket."

[lints]
workspace = true

[features]
# Let optimized isolated lab instances advance the fleet lifetime clock.
dev-seams = ["aterm-types/dev-seams"]

[dependencies]
# The portable local-socket type the relay bridges to (Unix: a pure std
# UnixStream alias — zero behavioral change; Windows: AF_UNIX over winsock),
# and this user's uid, which the key file must carry.
aterm-uds = { workspace = true }
# The fleet's proofs: HMAC-SHA256 over the channel exporter, HKDF over it, and
# a constant-time compare, all astream-digest's (re-exported by aterm-digest).
# SHA-256 also fingerprints the pinned certificate (tls.rs).
aterm-digest = { workspace = true }
# The workspace's one hex codec: a proof's tag and the certificate fingerprint.
aterm-codec = { workspace = true }
# Portable fleet-name vocabulary is shared with census readers on every platform;
# `reach`, the person's ports (the fleet's and LAN toolset sharing's), which a
# private aterm neither listens on nor dials, asked first by loopback.rs.
aterm-types = { workspace = true }
rustls = { workspace = true }
# Each node's own key (fleet.rs, the module doc's Nodes): Ed25519 signing. ring is
# already rustls's provider here (the workspace row's `ring` feature), so this adds
# an edge, not a crate; Ed25519 takes none of its features.
ring = { workspace = true }
# Every Ed25519 verification (`NodeKey::verifies`): astream's strict check, which
# refuses the small-order keys and commitments ring alone takes. Its `signature`
# feature is ring, zeroize and getrandom, all already in this graph.
astream-aead = { path = "../../vendor/astream/crates/astream-aead", default-features = false, features = ["signature"] }
# The anchor attributes' registry (std-only): the `#[cfg_attr(any(test,
# debug_assertions), aterm_spec_anchor::refines(…))]` anchors of
# `NetSlotDisplacement` (the listener's slots and the watchdog's claim,
# slots.rs) expand in every test and debug build, where the source-spec
# closure collects them; a release build strips them.
aterm-spec-anchor = { workspace = true }

[target.'cfg(unix)'.dependencies]
# Readiness wait for the non-blocking fleet listener, and the key file's
# no-follow open. `libc` is already
# present in every native aterm binary; this adds no package to that graph.
libc = { workspace = true }
# This Mac's network place: a heartbeat round notes each member that answered, the round and
# the book's members into its evidence (`fleet_member::note_place`). It depends on no aterm-net.
aterm-netplace = { workspace = true }

[target.'cfg(windows)'.dependencies]
# `WSAPoll` is Winsock's readiness primitive: aterm-win32's declaration,
# generated from windows-sys 0.61.2 (WB.2 of docs/AUDIT-third-party-2026-10-15.md).
aterm-win32 = { workspace = true }

[dev-dependencies]
# Plain durable flushes for this test binary's process tree.
aterm-durable = { workspace = true }
# The interpreter, `verify`, `wait` and `host` the conformance tests drive.
aterm-spec = { workspace = true }
# The models those tests bind the code to: `NetSlotDisplacement` (slots.rs)
# and `TlsBufferedRelay` (tls.rs). A model edit rebuilds only these tests.
aterm-models-core = { workspace = true }
aterm-models-session = { workspace = true }
# Scratch folders for the stand-in LAN brokers the Bonjour tests serve.
aterm-tempfile = { workspace = true }

[target.'cfg(target_os = "macos")'.dev-dependencies]
# The LAN broker, served in-process at this test binary's own socket: on macOS every LAN socket
# of aterm's is the broker's (`aterm_uds::lan`).
aterm-lan = { workspace = true }
