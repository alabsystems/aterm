aterm-keeper = { workspace = true, features = ["spec-anchors"] }

[target.'cfg(windows)'.dependencies]
# HDR-on-Windows (M3 phase B): query the display's panel MaxLuminance via DXGI
# `IDXGIOutput6::GetDesc1` for the cursor-aurora EDR headroom. DXGI is genuinely
# COM (vtable dispatch), so the `windows` crate is the right tool (the house-rule
# carve-out); already in the tree via wgpu-hal 0.62.2, so this is a direct dep, not
# a new crate. The DisplayConfig SDR-white/HDR-state query is FLAT C (not COM) and
# is hand-rolled in hdr_win.rs (house style), so those features are not pulled here.
# `Win32_Storage_FileSystem` is the one non-DXGI use: `pinned_dir.rs`'s Windows arm
# disposes and renames through `SetFileInformationByHandle`, whose variable-length
# `FILE_RENAME_INFO` layout the crate carries (docs/NATIVE_WINDOWS_DESIGN.md §3.1).
windows = { version = "0.62", features = [
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
] }

[target.'cfg(unix)'.dependencies]
# `video frames` and the confined artifact store (`pinned_dir.rs`) open every
# path component relative to a RETAINED directory descriptor and never re-resolve
# a name afterwards. aterm-dirfd supplies those fd-relative `*at` wrappers over
# libc; it retired `rustix`, which cost 72,832 lines across two packages to serve
# these two files and nothing else. `rustix` lives on as aterm-dirfd's
# [dev-dependencies] differential oracle.
aterm-dirfd = { workspace = true }
# THE PTY KEEPER's client (P3, opt-in: `[keeper] enabled`): the window's link
# registers every master with the keeper and takes its offers at boot
# (`keeper_link.rs`). The keeper itself links no GUI framework (grep_guard B19).
aterm-keeper = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
# Native X11 clipboard (clipboard_x11.rs) over the pure-Rust x11rb RustConnection,
# so copy / paste / OSC-52 yank work on Linux WITHOUT an external helper binary
# (xclip / xsel / wl-copy — none of which are guaranteed installed) and WITHOUT a
# heavy new dependency. x11rb is ALREADY in this binary's tree (winit's X11 backend
# pulls it), so this adds bindings, not weight. `default-features = false` selects
# only the pure-Rust connection (no libxcb FFI).
x11rb = { version = "0.13", default-features = false }
# The accessibility tree, unconditionally — see the note beside the optional
# entries above. AccessKit's Unix backend is what reaches AT-SPI, which is what
# Orca reads; without it a Linux build exposes nothing at all.
accesskit = "0.24"
accesskit_winit = "=0.33.1"

# THE ROW, softbuffer half: the CPU present path is FIRST-PARTY on macOS, so
# this dependency is target-gated OFF that cell.
#
# `crates/aterm-gui/src/present/` is the seam. `softbuffer_surface.rs` is
# already `#[cfg(not(target_os = "macos"))]` and `CpuSurface` already resolves
# to `mac::MacCpuPresenter` there (hand-written CoreGraphics + CoreAnimation
# FFI, landed with the seam), so on macOS this crate was compiling softbuffer
# and then naming it from ZERO lines. Moving the row here removes the compile,
# not a call: the macOS present path does not change by one instruction, and
# linux/windows keep softbuffer byte-for-byte behind the same seam.
#
# MEASURED, `cargo forge survey --cell mac-arm`, before -> after:
#   91 -> 89 packages, 1,275,882 -> 1,248,254 lines (-27,628), 60,309 -> 58,435
#   unsafe tokens (-1,874). That is `dom(softbuffer)` from
#   docs/measured/wgpu-metal-decision-2026-08-30.md §2 to the package, the line
#   and the token.
#
# WHICH TWO PACKAGES, from a package-set diff of
# `cargo tree -p aterm --target aarch64-apple-darwin -e normal --no-dedupe`
# rather than from the dominator prediction: `softbuffer 0.4.8` and
# `objc2-core-graphics 0.3.2`. NOT `raw-window-metal 1.1.0`, which an earlier
# draft of this comment named — it has a SECOND parent, `wgpu-hal 29.0.3`
# (`cargo tree -i raw-window-metal`), so it stays until wgpu goes. dom() gives
# the right count and says nothing about which members; only the diff does.
#
# The 0.3.x/0.6.x `objc2` stack does NOT leave, and that is the row's whole
# point rather than a shortfall: it is a JOINT hostage of softbuffer and wgpu
# (`objc2-quartz-core <- softbuffer` and `objc2-metal <- wgpu-hal` are disjoint
# paths), so it is held by wgpu alone now and only falls — 199,233 lines, 6
# packages — when the Metal renderer retires wgpu here too. Same for
# raw-window-metal. See that document's §2.
#
# DEFAULT FEATURES OFF, and the omission that matters is `kms`. softbuffer's
# default set is [kms, x11, x11-dlopen, wayland, wayland-dlopen]; `kms` pulls
# drm + drm-ffi + drm-sys + drm-fourcc + linux-raw-sys 0.9.4 — 5 packages,
# 376,763 lines and 6,046 unsafe tokens, ALL of it on the linux cell only, to
# drive a DRM/KMS framebuffer aterm never presents to (it presents to a winit
# window). `kms = ["bytemuck", "drm", "rustix"]` and both bytemuck and rustix
# are ALSO held by the x11 and wayland arms, so nothing else falls out with it.
# The feature list is `vendor/winit/Cargo.toml:332-340` verbatim — winit already
# made exactly this trim for exactly this reason.
[target.'cfg(not(target_os = "macos"))'.dependencies]
softbuffer = { version = "0.4", default-features = false, features = [
    "x11",
    "x11-dlopen",
    "wayland",
    "wayland-dlopen",
] }

[target.'cfg(target_os = "macos")'.dependencies]
# THE FOUR objc2-FAMILY ROWS THAT STOOD HERE ARE RETIRED — `objc2-app-kit`,
# `objc2-foundation`, `objc2` and `block2`. `block2` went first, with the
# NSException containment (2026-09-05): its two sites here — the alert key
# monitor in alert_keys.rs and the paste sheet's completion handler in lib.rs —
# are `aterm_objc::RcBlock` now, whose `invoke` contains an NSException instead
# of aborting from a `nounwind` frame. The other three went with W13: this
# crate's last five family files (`alert_keys.rs`, `menu.rs`, `lib.rs`'s paste
# sheet, `app_introspect.rs` and `appkit.rs`) ported to `aterm-objc`, so the
# rows were declaring dependencies no line of this crate could reach. What they backed is unchanged
# and is now first-party: the audible bell and `setColorSpace`, the always-on
# native menu bar, the per-window COMPACT toolbar and its tab strip, the
# in-process pasteboard, the local-file panels, the full-window bitmap capture,
# the menu-bar operator status item, the modal paste-confirm sheet, and the
# `+[NSEvent keyEventWithType:…]` hardware-key injector.
#
# WHAT RETIRING THEM BUYS, MEASURED RATHER THAN CLAIMED: **nothing yet — zero
# packages, zero lines, zero unsafe tokens.** `cargo forge survey --cell
# mac-arm` is byte-identical across this commit. All six family packages are
# held by a SECOND parent that is still live: the winit fork's own four macOS
# rows (`vendor/winit/Cargo.toml`), whose backend has eight files still using
# them. `cargo tree -i -p objc2-app-kit` answers `winit` and nothing else once
# these rows are gone.
#
# So this row's removal is an HONESTY fix, not a size win: it stops this crate
# claiming a dependency it does not have, and it makes the fork the single
# remaining parent, which is what the next wave has to port. The packages leave
# `mac-arm` on the commit that empties `vendor/winit/src/platform_impl/macos`,
# at no earlier one. Pinned by `objc2_exit_condition`'s
# `the_manifest_rows_are_live_or_dead_exactly_as_the_file_counts_say`.
#
# THAT COMMIT IS THE W12 + W13 MERGE onto the containment (2026-09-05): the
# fork's rows are gone too (see the retirement note in vendor/winit/Cargo.toml),
# and the mac-arm cell moved by the packages and lines tools/forge-budget.tsv
# records with its dated note (6).

# THE FIRST-PARTY REPLACEMENT for the four rows retired above (and for the
# objc2-* binding crates): typed message sends, ownership, runtime class creation
# and the block ABI, with zero dependencies of its own. W1 ported ONE of the
# seven `declare_class!` sites onto it — `platform.rs`'s `ReduceMotionTarget`;
# as of W13 it carries every macOS site this crate has. Not optional and not
# feature-gated: it is the shipping path.
aterm-objc = { workspace = true }

# The macOS display-free event loop (`--headless`), driven on the MAIN thread —
# which libtest never gives a test — so a `main` of its own. It checks the loop
# never creates the NSApplication that opens a WindowServer connection, that every
# proxy clone wakes it, and that it keeps the main dispatch queue drained. It
# speaks libtest's command line for its one test (`headless_event_loop`): the
# filters, `--skip`, `--exact`, `--ignored` and `--list` select and list it as
# libtest would, the merge contract's test run hands it the same argv as every
# other binary (`aterm_verify::stages::test_run_args`), and an option it does
# not handle is refused, never ignored. No test off macOS.
[[test]]
name = "headless_event_loop"
harness = false

[lints]
workspace = true
