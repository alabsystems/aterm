[package]
name = "aterm-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "aterm — a native windowed terminal: winit presenting the aterm-render framebuffer over a real PTY shell (first-party CPU presenters: CoreGraphics on macOS, MIT-SHM and wl_shm on Linux, GDI on Windows)."

[[bin]]
name = "aterm-gui"
path = "src/main.rs"
# main.rs holds no tests; integration tests still get the binary.
test = false

# The Phase 1a redraw gate. A BINARY because `EventLoop` construction panics off
# the process main thread and libtest runs every `#[test]` on a spawned one, so
# only a target owning `fn main` can hand `GuiHost` a real `EventLoopProxy` — see
# `src/control_redraw_conformance.rs`. The gate (and the verb matrix it links)
# compiles in a debug build only (`cfg(debug_assertions)`), so it builds in the
# same target as every other dev build and a release build carries neither; run it
# with `targo --unverified run -p aterm-gui --bin aterm-redraw-conformance`.
[[bin]]
name = "aterm-redraw-conformance"
path = "src/bin/aterm-redraw-conformance.rs"

# The Claude Code footer's per-frame pass, timed: a measurement, not a
# gate, so it is a bench, not an #[ignore]d test in every test build. It drives
# the headless test App, which only the `bench-support` feature lends a
# non-test build; by hand it is
# `targo --unverified bench -p aterm-gui --features bench-support --bench footer_pass_cost`.
[[bench]]
name = "footer_pass_cost"
path = "benches/footer_pass_cost.rs"
harness = false
required-features = ["bench-support"]

# A Settings page's frame of a preview's clock at short and shipped windows,
# timed: a measurement, not a gate; by hand it is
# `targo --unverified bench -p aterm-gui --features bench-support --bench settings_frame_cost`.
[[bench]]
name = "settings_frame_cost"
path = "benches/settings_frame_cost.rs"
harness = false
required-features = ["bench-support"]

# The byte arm's C cut (card engine §3.6), timed over `verify perf
# throughput`'s corpus without and with the cut; by hand it is
# `targo --unverified bench -p aterm-gui --features bench-support --bench c_cut_cost`.
[[bench]]
name = "c_cut_cost"
path = "benches/c_cut_cost.rs"
harness = false
required-features = ["bench-support"]

# THE LIVE-CLASS AUDITOR (D1). `crates/aterm-window`'s ported `WinitWindowDelegate` had
# NOTHING IN CI READING THE REGISTERED CLASS: two compile-verified plants — an
# argument retyped `Id` -> `Bool`, and `NSWindowDelegate` deleted from the
# `protocols:` list — both left `cargo build` at 0 and the seam census at 6/6,
# because that census checks a mirror class it declares itself. An EXAMPLE and
# not a `#[test]` for the same reason `aterm-redraw-conformance` is a binary:
# libtest runs every test body on a spawned thread, `pthread_main_np()` answers
# 0 there, and `EventLoop` construction panics — so only a target owning
# `fn main` can create the NSWindow whose delegate this reads. Run by
# `targo --unverified verify appkit`; by hand it is
# `targo --unverified run -p aterm-gui --example objc_live_class_audit`.
[[example]]
name = "objc_live_class_audit"
path = "examples/objc_live_class_audit.rs"

# THE IME DRIVER, the auditor's other half, DECLARED like every objc driver:
# its row in `aterm-verify`'s `OBJC_DRIVES` names the target, and the build,
# the built file and the drive all read that name, which is only true of a
# target this file names. The auditor asks whether the class is SHAPED right;
# this one drives a whole composition through it — marked text, cursor ranges,
# commit, doCommandBySelector: — and asks whether it BEHAVES right. Also run by
# `targo --unverified verify appkit`; by hand it is
# `targo --unverified run -p aterm-gui --example objc_ime_drive`.
[[example]]
name = "objc_ime_drive"
path = "examples/objc_ime_drive.rs"

# THE TOOLBAR DRIVER, and it closes the same D1 gap ONE FILE OVER. The auditor
# above drives FIVE targets, all of them `crates/aterm-window`'s; `src/toolbar.rs` is
# the largest ported file in the tree — four declared classes, and after W7
# every AppKit binding call in it — and NOTHING IN THE TREE DROVE IT. Its
# classes were checked by `#[cfg(test)] mod objc_tests`, whose central case is
# thirty-two registered encodings against a literal written in the same file:
# a plant that registered `controlTextDidChange:` as `v@:B` AND edited the
# table to agree left that test GREEN. This installs the real toolbar in a real
# NSWindow, enters the registered IMPs through AppKit's own dispatch, captures
# 26 drawing states with `-cacheDisplayInRect:`, and reads all four classes off
# the live objects. DECLARED and not auto-discovered for the same reason as its
# siblings (`aterm-verify`'s `OBJC_DRIVES`). Run by `targo --unverified verify
# appkit`; by hand it is
# `targo --unverified run -p aterm-gui --example objc_toolbar_drive`.
[[example]]
name = "objc_toolbar_drive"
path = "examples/objc_toolbar_drive.rs"

# The Developer Tools helper panel's driver: builds `devtools_helper::live`'s views as
# the live arm does, in no window and under the Prohibited activation policy, so it may
# run beside a person; captures every state to PNG in the directory given as its
# argument and reads back the panel window it never shows. Not an `OBJC_DRIVES` row; by
# hand it is
# `targo --unverified run -p aterm-gui --example objc_devtools_helper_drive -- <dir>`.
[[example]]
name = "objc_devtools_helper_drive"
path = "examples/objc_devtools_helper_drive.rs"

# THE WINDOW DRIVER (W8), and it closes the same D1 gap one file over again.
# `window_delegate.rs` is the largest file in the mac-arm endgame and W8 moved
# all 177 of its AppKit BINDING calls off `objc2-app-kit`. The live auditor
# checks that file's DECLARED rows; it cannot see a correct send of the wrong
# selector, an inverted boolean, or a constant that encodes fine and means
# something else — which is precisely the defect W7 shipped and pixels caught.
# This drives the window surface for real: title, style mask, geometry, size
# limits, visibility, focus, theme, drag-and-drop, close and fullscreen.
# Also run by `targo --unverified verify appkit`; by hand it is
#   targo --unverified run -q -p aterm-gui --example objc_window_drive
[[example]]
name = "objc_window_drive"
path = "examples/objc_window_drive.rs"

# THE EVENT DRIVER, the fourth row of the same obligation. The auditor proves
# the ported `WinitView` is SHAPED right, the IME drive composes through it,
# the window drive resizes and focuses it — and v0.72.0 still aborted on the
# first `mouseMoved:` AppKit delivered, because no gate had ever sent a MOUSE
# event through a mouse IMP. This one builds a real `NSEvent` of every type
# each event-taking row can receive (AppKit's factories and CoreGraphics),
# enters the IMP as AppKit does, and re-executes itself as a control child
# that makes the v0.72.0 send inside a trampoline and must die by SIGABRT.
# Also run by `targo --unverified verify appkit`; by hand it is
# `targo --unverified run -p aterm-gui --example objc_event_drive`.
[[example]]
name = "objc_event_drive"
path = "examples/objc_event_drive.rs"

[features]
# Accessibility delivery is native and unconditional on supported platforms:
# macOS NSAccessibility, Linux AT-SPI and Windows UIA use one semantic tree.
# Lends the `footer_pass_cost` bench the headless test App and the footer's
# probe fixture (`claude_footer::probe`). Bench builds only; the release cutter
# never names it.
bench-support = []
# DEVELOPMENT SEAMS in an optimized build: the `aterm_types::dev_seam!` reads this
# crate makes (the `ATERM_DEBUG_*` screenshot seams, the handoff deadlines) and the
# development settings (`[update] require_team_id`), forwarded to the updater and atpkg,
# which read their own (`ATERM_UPDATE_ROOT`, the `[update]` repoint, `ATPKG_REGISTRY`,
# `[packages]` prefix/account/repo links), to the renderers' own (the
# `ATERM_GPU_*` / `ATERM_RASTERIZER` seams), to the PTY seam
# (`ATERM_PTY_IDLE_POLL_US`, `ATERM_TRACE_BOOST`) and to the state-root rule
# (`ATERM_STATE_HOME`, aterm-types), to the harness's live-upgrade settle
# (`ATERM_UPGRADE_QUIET_S`, aterm-agent) and to the fabric endpoint's stale
# horizon (`ATERM_FABRIC_STALE_AFTER_MS`, aterm-gui-fabric). A debug build
# compiles them anyway. The release cutter NEVER enables it — `aterm-release`'s
# buildplan pins that — so a shipped binary reads none of them.
dev-seams = [
    "aterm-agent/dev-seams",
    "aterm-update/dev-seams",
    "atpkg/dev-seams",
    "aterm-gpu/dev-seams",
    "aterm-render/dev-seams",
    "aterm-pty/dev-seams",
    "aterm-types/dev-seams",
    "aterm-gui-timing/dev-seams",
    "aterm-gui-fabric/dev-seams",
]

[dependencies]
aterm-core = { workspace = true, features = ["serde"] }
# The anchor attributes' registry (std-only): this crate's own
# `#[cfg_attr(any(test, debug_assertions), aterm_spec_anchor::refines(…))]` anchors expand in
# every test and debug build, so aterm-models' closure gate sees them; release strips them.
aterm-spec-anchor = { workspace = true }
# The selection/block control verbs + the shared response-framing primitives,
# hosted here through `control_host::GuiHost`'s `SessionHost` impl.
aterm-control = { workspace = true }
# The in-GUI supervisor (`harness_host`) and the agent harness readers. This
# crate remains host-agnostic and has no GUI edge.
aterm-agent = { workspace = true }
# The control client's one token reader (no-follow, regular file, bounded) and its
# connect-then-read order, for dials to a sibling instance. Already linked via
# aterm-agent.
aterm-ctl = { path = "../aterm-ctl" }
# `await match <re>` compiles its regex here (`row_matcher`), so the engine core stays
# regex-free.
aterm-observe = { workspace = true }
# Multilingual whole-word matching for the sparkle-words text decorations.
aterm-lexicon = { workspace = true }
# Cursor effects and sparkle-words state machines (shared with the web embedders).
aterm-effects = { workspace = true }
# The `aos` verb's refusals, witness and trace decode (the momentum glow's Aos
# boundary). Not a new edge in the BUILD graph: `aterm-effects` above links it.
aterm-aos = { workspace = true }
# The predictive-echo state machine (shared with the web embedders), aliased as
# `crate::predict`.
aterm-predict = { workspace = true }
# The ONE timing value: the production lengths of the fabric's fence and
# notice waits and the harness host's cadences, or their millisecond test values
# (`ATERM_DEV_FAST_TIMERS` in a debug build, the unit tests' helpers).
aterm-gui-timing = { workspace = true }
# The document models (rope text, document store, the native editor's reducer,
# the Markdown reader's model), extracted below this crate and
# re-exported under their old module names.
aterm-gui-documents = { workspace = true }
# amacs: its input reducer (`amacs::input`), which the native Editor hands
# every key, text commit, paste and pointer press, the one path from an input
# to an editor command (docs/DESIGN-amacs-2026-10-19.md §4.4); and the wire
# forms the `edit` and `await edit` verbs serve, the edit request and ticket
# replies and the file-URI codec (`amacs::protocol`).
amacs = { workspace = true }
# The document host and its pure persistence contracts (admission, atomic save,
# the advisory-lock door), shared with amacs's terminal face and re-exported
# under their old module names.
amacs-files = { workspace = true }
# The access card's decision and words, its marker files and the durability
# flushes, extracted below this crate and re-exported under their old
# module names.
aterm-gui-consent = { workspace = true }
# How each write is finished: durable (F_FULLFSYNC) or ordered (F_BARRIERFSYNC).
aterm-durable = { workspace = true }
# The tab model (stable ids, the view store, the pane tree, the front content),
# extracted below this crate and re-exported under its old names.
aterm-gui-tabs = { workspace = true }
# The fabric endpoint (each session's inbox ring, posts and hold gate, the
# bridge link), extracted below this crate and re-exported as
# `crate::fabric`; it reaches a session and the registry through two traits.
aterm-gui-fabric = { workspace = true }
# The unified message engine (docs/DESIGN-unified-messages-2026-09-21.md): message
# model, glass policy, single-row width law, tagged log ring. Host-agnostic, so it
# tests without a window or a clock.
aterm-messages = { workspace = true }
# In-process readers of another process (`process_cwd` for the Claude Code
# footer and session queries) and of the machine's memory (the agent memory
# ceiling in `harness_host.rs`, the scrollback budget). Every platform `cfg` of
# those readers lives in that crate, so the host adds none.
aterm-sysprobe = { workspace = true }
aterm-vitals = { workspace = true }
# The boot identity bounds delegated process ownership carried over live updates.
astream-sys = { path = "../../vendor/astream/crates/astream-sys" }
# The subtree walker: per-folder sizes and entry counts for `sys disk` and the
# System panel, on the disk walker thread (`diskwalk_host`).
aterm-diskwalk = { workspace = true }
aterm-buffer = { path = "../aterm-buffer" }
aterm-grapheme = { workspace = true }
aterm-codec = { workspace = true }
aterm-pty = { workspace = true }
aterm-session = { workspace = true }
# The worker-phase classifier (busy / prompt / question / limited / idle) the
# presence band reads off the last rows of the screen — run only when a
# session's status revision moves (`presence::classify`), never per frame.
aterm-phase = { workspace = true }
# The session log engine behind `crate::session_log`: each session's hierarchical
# record (session > run > turn > step), its turn tracker, fold and brief. Pure (no
# clock, file, thread or socket); time enters as the host's `Stamp`.
aterm-slog = { workspace = true }
# The fleet: the opt-in (secure-default-OFF) TLS listener whose proved LAN
# peers the control server serves as `Scope::Fleet` (see fleet_listen.rs).
aterm-net = { workspace = true }
# Portable control-socket stream (std Unix sockets on Unix, AF_UNIX-over-winsock
# on Windows) + the latest-alias/CSPRNG/pid-liveness helpers control_auth uses.
aterm-uds = { workspace = true }
# The coding-agent primer (context files, skills, hooks): each spawn's fail-soft
# `auto_prime` (spawn.rs), identity priming, the harness's upkeep and the diagnostics
# status line.
aterm-primer = { workspace = true }
aterm-cap = { workspace = true, features = ["launcher-mint"] }
aterm-sandbox = { workspace = true }
aterm-containment = { workspace = true }
aterm-log = { workspace = true }
aterm-render = { workspace = true }
aterm-gpu = { workspace = true }
# The find bar's search over screen and scrollback (trigram/Bloom; app_search.rs).
aterm-search = { workspace = true }
# build_info: FxHash the running binary into a content signature off macOS (no crypto dep).
aterm-hash = { workspace = true }
# Keep this edge featureless: a feature enabled here turns on for every consumer of
# aterm-types in the same resolve.
aterm-types = { workspace = true }
# Settings ▸ Themes ▸ Community: the community theme pack, embedded.
aterm-theme-pack = { workspace = true }
# The workspace's one epoch-clock read (`aterm_time::unix_secs` and kin).
aterm-time = { workspace = true }
# The winit-to-engine key map, one shared table.
aterm-winit-keymap = { workspace = true }
# `toml` (the serde derives on Policy, `Policy::to_toml`) is asked for here,
# where serde's derive is already in the closure, and not only by the
# `serde_corpus_tests.rs` and aterm-policy's own test rows: a dev row turns it
# on for every `--workspace` test build, so a shipped-graph build that left it
# off recompiled aterm-policy and every crate above it, aterm-core first (P4).
# aterm-policy's and aterm-core's own closures still carry no proc macro (PM-1).
aterm-policy = { workspace = true, features = ["toml"] }
# In-app self-update: checks the release channel, verifies the notarized, Team-ID-pinned
# DMG and stages it for the in-session apply lane (the next-launch swap is the fallback).
# Inert without a pinned Team ID and outside an installed .app.
aterm-update = { workspace = true }
# The updater's shared core (handoff policy, pins, settings, the package-check schedule,
# the URL-safe slug predicate atpkg also uses), so this crate grows no second copy.
aterm-update-core = { workspace = true }
# Settings ▸ Packages reads atpkg's own durable state (status.toml, dev-link markers,
# posture) in-process. Network and install verbs run only through the co-located `atpkg`
# binary; the one in-process fetch is the vendor head watch's GET, a hint that the
# `atpkg update` it triggers re-verifies.
atpkg = { workspace = true }
libc = { workspace = true }
aterm-window = { workspace = true }
# Config file parsing. Both crates are ALREADY in this binary's tree (via the
# engine's config + policy crates), so this adds bindings, not weight.
serde = { workspace = true, features = ["derive"] }
# First-party JSON: serde (de)serializer, untyped `Value`, `json!`.
aterm-json = { workspace = true }
# SHA-256 for the seamless/config-completion proof digests and the
# control-socket token digest. First-party; no third-party crypto in this binary.
aterm-digest = { workspace = true }
aterm-toml = { workspace = true }
# The first-party TLS layer. Its user here is the supervisor's network probe
# (`harness_netprobe.rs`): a TLS handshake to the API host that the OPERATING
# SYSTEM's trust store verifies (`aterm_http::tls` over `aterm_http::verifier`),
# under one deadline.
aterm-http = { workspace = true }
# PNG codec: the `window` verb's full-window capture and wallpaper decoding.
aterm-png = { workspace = true }
# First-party JPEG decode: the wallpaper lane reads PNG and JPEG on every
# platform (`app_config::decode_wallpaper_portable`), not PNG alone off macOS.
aterm-jpeg = { workspace = true }
# The credentials vault's client (docs/DESIGN-secrets-2026-10-20.md §7): a first
# launch on a Mac with no vault asks whether the ALab vault answers on the LAN and
# offers the join (`secrets_join`). Not a new package in the shipped graph: the
# `aterm` binary links it already for `aterm secrets`.
aterm-secrets = { workspace = true }
# The development Security-posture catalog owns its scratch bundle through the
# existing exclusive directory guard; the shipped catalog is compiled out.
aterm-tempfile = { workspace = true }
# The tray's glyph rasterization takes no font dependency of its own: it draws
# with `aterm_render::font::Font` (first-party: the aterm-font reader + this
# workspace's own coverage fill).

[build-dependencies]
# The build script derives the exact 64-byte lowercase updater-key fingerprint
# record embedded in a dedicated Mach-O section.  It deliberately hashes the
# same raw Ed25519 key bytes that `aterm-update` verifies at runtime — read from
# the committed anchor in `aterm-update-core`'s `pins.rs`, never from the
# environment, so the embedded record cannot disagree with the key actually
# trusted. build.rs compiles that one file in by `#[path]` rather than naming
# `aterm-update-core` here: as a build-dependency it was built a second time for
# the host with its closure (ring under a second feature set, so a second C/asm
# build-script run; aterm-types), 7.8 unit-s of a clean mac dev build, to read
# one constant.
# Standard padded Base64 — first-party; its one dependency is astream-wire
# (dependency-free, vendor/astream). `decode_strict` is
# the entry point every trust path uses: canonical padding REQUIRED and no
# trailing bits, so a pinned key has exactly one spelling.
aterm-codec = { workspace = true }
aterm-digest = { workspace = true }
# Windows only: links assets/aterm.ico into the dev `aterm-gui.exe` (the shipped
# `aterm.exe` gets its resources from crates/aterm/build.rs). A missing resource
# compiler is a warning.
aterm-winres = { workspace = true }

[dev-dependencies]
# `verify perf throughput`'s corpus, for the `c_cut_cost` bench (a lib with no
# dependencies of its own).
aterm-bench = { path = "../aterm-bench" }
# The engine's own parser, the oracle the byte arm's C-cut scan is held to
# (`holder_image`'s tests: where it dispatches each OSC 133/633 C).
aterm-parser = { workspace = true }
aterm-provenance = { workspace = true }
# Scratch home directories for the auto-prime pass test (spawn.rs): the pass
# must be driven against a directory that is NOT the developer's real $HOME;
# and the harness tests' stand-in programs (`stand_in`).
aterm-tempfile = { workspace = true }

# Binds the real `App` window lifecycle to aterm-spec's `window_routing_model()`, the
# model `ty check` proves.
aterm-spec = { workspace = true }
# The models its tests drive (a model edit rebuilds only their tests).
aterm-models-atpkg = { workspace = true }
aterm-models-core = { workspace = true }
aterm-models-effects = { workspace = true }
aterm-models-gui = { workspace = true }
aterm-models-harness = { workspace = true }
aterm-models-misc = { workspace = true }
aterm-models-native = { workspace = true }
aterm-models-release = { workspace = true }
aterm-models-render = { workspace = true }
aterm-models-session = { workspace = true }
aterm-models-update = { workspace = true }
# The corruption seam (`inject_corrupted_warm_block`, a debug build's) the native
# search's dense-history tests stage a corrupt tiered segment with
# (`control_query::dense_history_tests`).
aterm-scrollback = { workspace = true }
# The grid's tiered-scrollback reflow, staged directly by `session_waits`' tests.
aterm-grid = { workspace = true }
# The keeper's handlers, named by tests on every target (the normal edge is unix-only).
aterm-keeper = { workspace = true }

[target.'cfg(windows)'.dependencies]
# aterm's Win32 declarations (WB.2 of docs/AUDIT-third-party-2026-10-15.md; no
# `windows` crate here): the COM vocabulary behind the file picker, the imaging
# decoder and the jump list (`win_ffi.rs`); DXGI's `IDXGIOutput6::GetDesc1` for
# the panel's MaxLuminance, the cursor aurora's EDR headroom (`hdr_win.rs`;
# aterm-win32's oracle holds its vtable slots to `windows` 0.62.2's); and
# `SetFileInformationByHandle` with the variable-length `FILE_RENAME_INFO`
# family behind `pinned_dir.rs`'s Windows arm (docs/NATIVE_WINDOWS_DESIGN.md
# §3.1). The DisplayConfig SDR-white/HDR-state query is flat C, hand-rolled in
# hdr_win.rs.
aterm-win32 = { workspace = true }

# softbuffer left at LW.3 of docs/AUDIT-third-party-2026-10-15.md: the CPU
# present path is first-party on every cell, macOS (`present/mac.rs`,
# CoreGraphics + CoreAnimation), Linux since LW.6 (`present/x11.rs` over
# aterm-x11's MIT-SHM, `present/wayland.rs` over aterm-wayland's wl_shm) and
# Windows since LW.3 (`present/win32.rs`, GDI over aterm-win32 above).

[target.'cfg(unix)'.dependencies]
# `video frames` and the confined artifact store (`pinned_dir.rs`) open every
# path component relative to a RETAINED directory descriptor and never re-resolve
# a name afterwards. aterm-dirfd supplies those fd-relative `*at` wrappers over
# libc; it retired `rustix`, which cost 72,832 lines across two packages to serve
# these two files and nothing else. (`rustix` lived on as a differential
# oracle, aterm-dirfd's and then the rustix 0.38 facade's, until it left the
# lock at linux-windowing LW.7.)
aterm-dirfd = { workspace = true }
# The PTY keeper's client (opt-in, `[keeper] enabled`): `keeper_link.rs` registers each
# master with the keeper and takes its offers at boot. The keeper itself links no GUI
# framework (census guards `keeper-gui`, `keeper-gui-deps`).
aterm-keeper = { workspace = true }
# THE CRASH-RESTORE JOURNAL (`crash_restore.rs`, on wherever the keeper link is):
# each session's region layout, its single-writer protocols and keyframe policy,
# and the panic-free recovery a restoring window runs over a dead window's
# region. Headless (no file, thread, socket or clock); the window creates and
# maps the region (aterm-uds) and runs its threads. Local only: no control verb
# reads a region, and the census guard `restore-stays-local` keeps it out of the
# closure of every crate that carries bytes off the host.
aterm-restore = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
# First-party X11 (docs/AUDIT-third-party-2026-10-15.md, linux-windowing LW.6),
# libxcb opened at run time: the CPU presenter's MIT-SHM drawing (present/x11.rs)
# over the window's own connection, and the native X11 clipboard
# (clipboard_x11.rs) over a connection of its own, so copy / paste / OSC-52 yank
# work on Linux WITHOUT an external helper binary (xclip / xsel / wl-copy, none of
# which are guaranteed installed). It replaced this crate's x11rb row, and since
# LW.7 the winit fork's X11 backend speaks through it as well.
aterm-x11 = { workspace = true }
# First-party Wayland (LW.6): the CPU presenter's wl_shm buffers
# (present/wayland.rs) on winit's display, over libwayland-client opened at
# run time. With it and aterm-x11 softbuffer left Linux (the row below).
aterm-wayland = { workspace = true }
# Desktop notifications (notify.rs `freedesktop`): org.freedesktop.Notifications
# Notify over the session bus, through the first-party blocking client — no
# libnotify, no `notify-send` subprocess.
aterm-dbus = { workspace = true }

[target.'cfg(not(any(target_os = "macos", target_os = "linux")))'.dependencies]
# aterm-window's raw-window-handle traits, for the presenters that take a window
# through them here: wgpu's surface (`aterm_gpu::WindowTarget`), the GDI CPU
# presenter's HWND (`present/win32.rs`) and the other Win32 HWND reads. `rwh_06` is not an aterm-window default: on
# macOS the Metal presenter and the AppKit chrome take the content view through
# first-party `aterm_objc::HasNsView`, and on Linux the GL arm and the X11 and
# Wayland CPU presenters take the window's handles through first-party
# `aterm_types::native_window::HasNativeWindow`, so raw-window-handle is out of
# both graphs (docs/AUDIT-third-party-2026-10-15.md, winit-core step 6; mac-arm
# and linux each -1 package, -1,984 lines).
aterm-window = { workspace = true, features = ["rwh_06"] }

[target.'cfg(any(target_os = "macos", target_os = "linux", windows))'.dependencies]
# Shared semantic model and target-native publisher; macOS does not load D-Bus.
aterm-a11y = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
# First-party Objective-C bindings (typed sends, ownership, runtime class creation, the
# block ABI; no dependencies of its own): every AppKit call in this crate goes through it.
aterm-objc = { workspace = true }

# The `window` capture's `CGImage` layout reads (`app_introspect.rs`'s AppKit
# chrome copy, `lib.rs`'s `cg_capture`), which `aterm-cg` holds to the SDK.
# CoreGraphics is linked here by AppKit already, so the crate adds no framework.
aterm-cg = { workspace = true }

# The macOS display-free event loop (`--headless`), driven on the MAIN thread —
# which libtest never gives a test — so a `main` of its own. It checks the loop
# never creates the NSApplication that opens a WindowServer connection, that every
# proxy clone wakes it, and that it keeps the main dispatch queue drained. It
# speaks libtest's command line for its one test (`headless_event_loop`): the
# filters, `--skip`, `--exact`, `--ignored` and `--list` select and list it as
# libtest would, `verify test` hands it the same argv as every other binary
# (`aterm_verify::stages::test_run_args`), and an option it does
# not handle is refused, never ignored. No test off macOS.
[[test]]
name = "headless_event_loop"
harness = false

[lints]
workspace = true

# Explicit shell-profile acceptance under a test identity; never an ordinary test.
[[bench]]
name = "jumplist_acceptance"
harness = false
test = false
