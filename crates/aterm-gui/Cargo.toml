[package]
name = "aterm-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "aterm — a native windowed terminal: winit presenting the aterm-render framebuffer over a real PTY shell (first-party CoreGraphics on macOS, softbuffer elsewhere)."

[[bin]]
name = "aterm-gui"
path = "src/main.rs"
# No test lives in main.rs (no #[test], no cfg(test), no `mod`); its libtest
# harness ran 0 tests in every gate. Integration tests still get the binary.
test = false

# The Phase 1a redraw gate. A BINARY because `EventLoop` construction panics off
# the process main thread and libtest runs every `#[test]` on a spawned one, so
# only a target owning `fn main` can hand `GuiHost` a real `EventLoopProxy` — see
# `src/control_redraw_conformance.rs`. `required-features` keeps it (and the verb
# matrix it links) out of every default build; run it with
# `cargo run -p aterm-gui --features control-conformance --bin aterm-redraw-conformance`.
[[bin]]
name = "aterm-redraw-conformance"
path = "src/bin/aterm-redraw-conformance.rs"
required-features = ["control-conformance"]

# THE LIVE-CLASS AUDITOR (D1). `vendor/winit`'s ported `WinitWindowDelegate` had
# NOTHING IN CI READING THE REGISTERED CLASS: two compile-verified plants — an
# argument retyped `Id` -> `Bool`, and `NSWindowDelegate` deleted from the
# `protocols:` list — both left `cargo build` at 0 and the seam census at 6/6,
# because that census checks a mirror class it declares itself. An EXAMPLE and
# not a `#[test]` for the same reason `aterm-redraw-conformance` is a binary:
# libtest runs every test body on a spawned thread, `pthread_main_np()` answers
# 0 there, and `EventLoop` construction panics — so only a target owning
# `fn main` can create the NSWindow whose delegate this reads. Run by
# `aterm verify`; by hand it is
# `cargo run -p aterm-gui --example objc_live_class_audit`.
[[example]]
name = "objc_live_class_audit"
path = "examples/objc_live_class_audit.rs"

# THE IME DRIVER, the auditor's other half, DECLARED like every objc driver:
# its row in `aterm-verify`'s `OBJC_DRIVES` names the target, and the build,
# the built file and the drive all read that name, which is only true of a
# target this file names. The auditor asks whether the class is SHAPED right;
# this one drives a whole composition through it — marked text, cursor ranges,
# commit, doCommandBySelector: — and asks whether it BEHAVES right. Also run by
# `aterm verify`; by hand it is
# `cargo run -p aterm-gui --example objc_ime_drive`.
[[example]]
name = "objc_ime_drive"
path = "examples/objc_ime_drive.rs"

# THE TOOLBAR DRIVER, and it closes the same D1 gap ONE FILE OVER. The auditor
# above drives FIVE targets, all of them `vendor/winit`'s; `src/toolbar.rs` is
# the largest ported file in the tree — four declared classes, and after W7
# every AppKit binding call in it — and NOTHING IN THE TREE DROVE IT. Its
# classes were checked by `#[cfg(test)] mod objc_tests`, whose central case is
# thirty-two registered encodings against a literal written in the same file:
# a plant that registered `controlTextDidChange:` as `v@:B` AND edited the
# table to agree left that test GREEN. This installs the real toolbar in a real
# NSWindow, enters the registered IMPs through AppKit's own dispatch, captures
# 26 drawing states with `-cacheDisplayInRect:`, and reads all four classes off
# the live objects. DECLARED and not auto-discovered for the same reason as its
# siblings (`aterm-verify`'s `OBJC_DRIVES`). Run by `aterm verify`; by hand it is
# `cargo run -p aterm-gui --example objc_toolbar_drive`.
[[example]]
name = "objc_toolbar_drive"
path = "examples/objc_toolbar_drive.rs"

# THE WINDOW DRIVER (W8), and it closes the same D1 gap one file over again.
# `window_delegate.rs` is the largest file in the mac-arm endgame and W8 moved
# all 177 of its AppKit BINDING calls off `objc2-app-kit`. The live auditor
# checks that file's DECLARED rows and `winit_sent_prototypes.rs` checks the
# ENCODINGS of the rows it sends; neither can see a correct send of the wrong
# selector, an inverted boolean, or a constant that encodes fine and means
# something else — which is precisely the defect W7 shipped and pixels caught.
# This drives the window surface for real: title, style mask, geometry, size
# limits, visibility, focus, theme, tabs, drag-and-drop, close and fullscreen.
# Also run by `aterm verify`; by hand it is
#   cargo run -q -p aterm-gui --example objc_window_drive
[[example]]
name = "objc_window_drive"
path = "examples/objc_window_drive.rs"

# THE EVENT DRIVER, the fourth row of the same obligation. The auditor proves
# the ported `WinitView` is SHAPED right, the IME drive composes through it,
# the window drive resizes and focuses it — and v0.72.0 still aborted on the
# first `mouseMoved:` AppKit delivered, because no gate had ever sent a MOUSE
# event through a mouse IMP. This one builds a real `NSEvent` of every type
# each event-taking row can receive (AppKit's factories and CoreGraphics),
# enters the IMP as AppKit does, and re-executes itself as a control child
# that makes the v0.72.0 send inside a trampoline and must die by SIGABRT.
# Also run by `aterm verify`; by hand it is
# `cargo run -p aterm-gui --example objc_event_drive`.
[[example]]
name = "objc_event_drive"
path = "examples/objc_event_drive.rs"

[features]
# `sixel` is ON by default so the SHIPPED GUI binary decodes + renders sixel
# graphics and DA1 advertises code 4. It forwards to aterm-core's `sixel`
# feature (which pulls in the `aterm-sixel` decoder and routes a decoded raster
# into the inline-image placement/blit path). The production `cargo build
# -p aterm-gui` therefore renders sixel; a consumer that wants the byte-identical
# no-sixel engine can still build with `--no-default-features`.
# `a11y-accesskit` WAS on by default and is NOT any more (2026-08-25, owner
# decision, docs/THIRD_PARTY_SURFACE_PLAN.md). It was the single largest
# dependency-surface item aterm could retire with one line, MEASURED by
# `targo --unverified forge survey`:
#
#   * macOS  — 5 packages / 26,680 lines (accesskit, accesskit_consumer,
#     accesskit_macos, accesskit_winit, and uuid, which is in the binary only
#     because `accesskit::TreeId(pub Uuid)` exists and aterm's only constructor
#     is the constant `TreeId::ROOT`).
#   * Linux  — 57 packages / 241,084 lines, i.e. 22% of that target's whole
#     third-party package count: accesskit_unix drags an entire D-Bus IPC
#     runtime (zbus, zvariant, atspi) with its own async executor into a
#     terminal.
#   * And it removed one path by which an UNPATCHED `winnow 1.0.3` reached the
#     shipped Linux graph, back when aterm forked winnow at 0.7.15 to fix an
#     `offset_from` underflow: a 0.7 fork cannot satisfy `^1.0`, so the unfixed
#     copy linked in through accesskit_unix -> zbus and `forge check`'s
#     patch-liveness obligation was RED on exactly this. That finding is closed
#     from the other end as of 2026-08-27 — retiring `toml_edit` for the
#     first-party `aterm-toml` retired the winnow fork itself — so it is no
#     longer a reason to keep AccessKit off.
#
# WHAT THIS COSTS, stated plainly: no cross-platform screen-reader tree. On
# Linux and Windows that is the whole of it. On macOS the aterm-owned
# `a11y-appkit` publisher below is a drop-in replacement carrying ZERO
# third-party lines — it is still OFF by default because it adds a per-frame
# publish cost, not because it is unavailable. Enable it with
# `--no-default-features --features sixel,a11y-appkit`.
#
# The feature itself is retained, not deleted: `--features a11y-accesskit`
# restores the previous build exactly.
default = ["sixel"]
# Sixel graphics rendering in the shipped app (see `default` above). A thin
# forward to aterm-core/sixel: aterm-gui carries no sixel code of its own, so
# this only flips the engine feature on for this binary.
sixel = ["aterm-core/sixel"]
# Opt-in macOS NSAccessibility publishing (accessibility.rs): publishes the
# visible grid text / role / label to the content NSView so VoiceOver can read
# the terminal. OFF by default — the pure accessibility snapshot builder always
# compiles (and is unit-tested), but the AppKit imperative wiring is only built
# when this is enabled, so the default GUI build is byte-identical and carries
# no per-frame a11y publish cost.
#
# W13: THE LIST IS EMPTY, AND THAT IS THE POINT. It used to name four binding
# features — `objc2-app-kit/NSAccessibility`, `/NSAccessibilityProtocols`,
# `/NSAccessibilityConstants` and `objc2-foundation/NSRange` (the last for the
# caret's AXSelectedTextRange) — which is what made this a feature that pulled
# EXTRA third-party bindings into the build. The publisher is first-party now:
# it sends `NSAccessibility*` through `aterm-objc`, and the caret range is an
# `aterm_objc::NSRange`, so enabling this adds aterm code and no dependency at
# all. The FEATURE STAYS: `accesskit_tree.rs` gates a `compile_error!` on it to
# keep it mutually exclusive with `a11y-accesskit`, `diagnostics.rs` reports it,
# and `--no-default-features --features sixel,a11y-appkit` is the documented way
# to build the VoiceOver path. An empty list is a real feature; deleting the row
# would break all three.
a11y-appkit = []
# CROSS-PLATFORM accessibility via AccessKit: native tab apps and the command palette
# map their renderer-owned semantic models to native a11y trees (UIA on Windows, AT-SPI
# on Linux, NSAccessibility on macOS) from the SAME data the pixels consume.
# OFF by default since 2026-08-25 (see the `default` note above, which measures what
# dropping it saved). It is NOT the whole story of whether the tree is built: `build.rs`
# folds this feature together with a Linux PLATFORM FACT into one `a11y_tree` cfg, so a
# LINUX build publishes the tree whether or not the feature is named, and on macOS and
# Windows this row is the only way to get it. It links cleanly against the vendored winit
# 0.30.13 (single winit instance via the workspace patch). Mutually exclusive with
# `a11y-appkit` on macOS (both would claim the content view's accessibility tree), enforced
# by a `compile_error!` in `accesskit_tree.rs`.
a11y-accesskit = ["dep:accesskit", "dep:accesskit_winit"]
# Compiles the `aterm-redraw-conformance` gate and, through it, aterm-control's
# verb matrix into a NON-test build — the only way a target with its own `fn main`
# can run the suite (a bin gets no dev-dependencies). OFF by default: the shipped
# GUI carries neither the gate nor the suite.
control-conformance = ["aterm-control/conformance"]
# DEVELOPMENT SEAMS in an optimized build: the `aterm_types::dev_seam!` reads this
# crate makes (the `ATERM_DEBUG_*` screenshot seams, the handoff deadlines) and the
# development settings (`[update] require_team_id`), forwarded to the updater and atpkg,
# which read their own (`ATERM_UPDATE_ROOT`, the `[update]` repoint, `ATPKG_REGISTRY`,
# `[packages]` prefix/account/repo links), to the renderers' own (the
# `ATERM_GPU_*` / `ATERM_RASTERIZER` seams), to the PTY seam
# (`ATERM_PTY_IDLE_POLL_US`, `ATERM_TRACE_BOOST`) and to the state-root rule
# (`ATERM_STATE_HOME`, aterm-types) and to the harness's live-upgrade settle
# (`ATERM_UPGRADE_QUIET_S`, aterm-agent). A debug build compiles them anyway. The
# release cutter NEVER enables it — `aterm-release`'s buildplan pins that — so a
# shipped binary reads none of them.
dev-seams = [
    "aterm-agent/dev-seams",
    "aterm-update/dev-seams",
    "atpkg/dev-seams",
    "aterm-gpu/dev-seams",
    "aterm-render/dev-seams",
    "aterm-pty/dev-seams",
    "aterm-types/dev-seams",
]

[dependencies]
# `bidi`: compile in the UAX #9 visual-reordering bridge so RTL (Hebrew/Arabic)
# displays in correct visual order. The render-time application lives in
# aterm-core (cell_frame_into -> apply_bidi_reorder); pure-LTR frames are
# untouched. Runtime-gated by BiDiMode (default Implicit).
aterm-core = { workspace = true, features = ["bidi", "serde"] }
# The selection/block control verbs + the shared response-framing primitives,
# hosted here through `control_host::GuiHost`'s `SessionHost` impl.
aterm-control = { workspace = true }
# Durable event claims/WAL for the operator observer embedded in every normal
# GUI/headless process. This crate remains host-agnostic and has no GUI edge.
aterm-agent = { workspace = true }
# The control client's ONE token reader (no-follow, regular file, bounded) and
# its connect-then-read order, for this instance's own dials to a sibling. Not
# a new edge in the BUILD graph: `aterm-agent` above already links it.
aterm-ctl = { path = "../aterm-ctl" }
# L0.5 semantic predicates: the `await match <re>` verb compiles its regex here,
# so the engine core stays regex-free (RFC R2 purity).
aterm-observe = { workspace = true }
# Multilingual whole-word matching for the sparkle-words text decorations.
aterm-lexicon = { workspace = true }
# The cursor aurora/comet-trail + sparkle-words state machines (extracted so the
# web embedders share them); re-exported at the crate root as `crate::<module>`.
aterm-effects = { workspace = true }
# The mosh-style predictive-echo state machine (extracted so the web embedders
# share it); aliased at the crate root so `crate::predict::*` reads unchanged.
aterm-predict = { workspace = true }
# The unified message engine (docs/DESIGN-unified-messages-2026-09-21.md): the
# message model, the glass policy, the single-row width law, the tagged log
# ring and its line codec. Lives in its own crate for the same reason
# `aterm-predict` does — it is host-agnostic (aterm-time only; no fs, threads or
# cells), so the native GUI paints the layouts it emits and appends the lines
# it drains, and the engine stays unit-testable without a window or a clock.
aterm-messages = { workspace = true }
# The strain row's samplers (design §10.14, ruling 210): one reading of the
# machine and one bounded process sweep, taken on the strain host's probe
# thread only while the engine suspects felt lag. Every platform `cfg` of the
# feature lives in that crate, so the host glue adds none. Linked here ahead of
# `strain_host.rs` so the census and forge baselines move once, with the crate.
aterm-sysprobe = { workspace = true }
aterm-buffer = { path = "../aterm-buffer" }
aterm-grapheme = { workspace = true }
aterm-codec = { workspace = true }
aterm-pty = { workspace = true }
aterm-session = { workspace = true }
# The worker-phase classifier (busy / prompt / question / limited / idle) the
# presence band reads off the last rows of the screen — run only when a
# session's status revision moves (`presence::classify`), never per frame.
aterm-phase = { workspace = true }
# L3 network drive: the opt-in (secure-default-OFF) TLS front-end that relays a
# channel-bound remote driver into the local control socket (see net_listen.rs).
aterm-net = { workspace = true }
# Portable control-socket stream (std Unix sockets on Unix, AF_UNIX-over-winsock
# on Windows) + the latest-alias/CSPRNG/pid-liveness helpers control_auth uses.
aterm-uds = { workspace = true }
# The coding-agent primer installer: every fresh session spawn runs its
# fail-soft `auto_prime` on a detached thread (spawn.rs), so the primer is
# installed by aterm itself and never by a manual step nobody runs.
aterm-primer = { workspace = true }
aterm-cap = { workspace = true, features = ["launcher-mint"] }
aterm-sandbox = { workspace = true }
aterm-containment = { workspace = true }
aterm-log = { workspace = true }
aterm-render = { workspace = true }
aterm-gpu = { workspace = true }
# Cmd-F find bar: back the find over the live screen + scrollback with the shared
# trigram/Bloom search engine instead of a hand-rolled scan (app_search.rs).
aterm-search = { workspace = true }
# build_info: FxHash the running binary into a content signature (no crypto dep).
aterm-hash = { workspace = true }
# POL-1: install a default OSC policy. NO FEATURES — the winit→engine key map
# this used to enable here (`features = ["winit-keymap"]`) is its own crate now,
# `aterm-winit-keymap` below. Enabling it from here turned it on for every OTHER
# consumer of aterm-types in the same resolve too, which is how `aterm-ctl`
# acquired AppKit; keep this edge featureless.
aterm-types = { workspace = true }
# The workspace's one epoch-clock read (`aterm_time::unix_secs` and kin), already in
# the graph via aterm-types.
aterm-time = { workspace = true }
# K-2: the winit→engine key map, so the GUI and the future native shell share one
# table instead of an inline match that drifts.
aterm-winit-keymap = { workspace = true }
aterm-policy = { workspace = true }
# Silent in-app self-update: checks the release channel, verifies the notarized +
# Team-ID-pinned DMG, and stages it for the in-session apply lane (the next-launch
# swap is only the fallback). Inert in a plain build (no pinned Team ID) and a
# no-op outside an installed .app.
aterm-update = { workspace = true }
# Manual's config language service validates package-owner slugs with the exact
# URL-safety predicate consumed by both the updater and atpkg. The crate is
# already present through those dependencies; naming it here prevents a second,
# subtly different validator from drifting into the editor.
aterm-update-core = { workspace = true }
# Settings ▸ Packages: read the co-located toolchain manager's OWN durable state
# (status.toml, dev-link markers, inert/enabled posture) in-process — same source
# of truth as the `atpkg` verbs, no parallel parser to drift. Network/install
# verbs still run ONLY via the co-located `atpkg` binary, never in this process;
# the one in-process fetch is the vendor head watch's conditional GET (a hint —
# the `atpkg update <program>` it triggers re-verifies everything).
atpkg = { workspace = true }
libc = { workspace = true }
winit = { workspace = true }
# Cross-platform accessibility tree (behind the opt-in `a11y-accesskit` feature —
# NOT default-on since 2026-08-25; see the `[features]` note above).
# accesskit_winit =0.33.1 targets winit ^0.30.5, satisfied by the vendored winit 0.30.13
# through the workspace `[patch.crates-io]` redirect (so a SINGLE winit instance links).
# EXACT-pinned: a bump to winit 0.31 would split the winit graph and break the patch (see
# the vendored-winit note in the root Cargo.toml). `dep:` so the feature, not the dep
# presence, gates compilation.
accesskit = { version = "0.24", optional = true }
accesskit_winit = { version = "=0.33.1", optional = true }

# LINUX CARRIES THE TREE UNCONDITIONALLY (owner's call, 2026-08-26). On macOS the
# accessibility surface is native (`a11y-appkit`), so the AccessKit stack there is
# genuinely optional weight. On Linux it is the ONLY surface: measured on a stock
# build with the feature off, the AT-SPI registry reports ZERO applications for
# aterm while a GTK app sits in the same registry, found by the same walker — i.e.
# a blind Linux user gets no terminal at all, not a degraded one. A default that
# ships an unusable product to save 61 packages is the wrong trade, so these are
# plain dependencies here and the `a11y-accesskit` feature stays as the opt-in for
# the platforms that do not need it. `build.rs` folds both into one `a11y_tree`
# cfg so the code never has to spell the platform.
# Config file parsing. Both crates are ALREADY in this binary's tree (via the
# engine's config + policy crates), so this adds bindings, not weight.
serde = { workspace = true }
# Seamless-update screen carry: the checkpoint meta rides the TOML manifest as a
# JSON string (TOML cannot represent its `None` fields). Same workspace version
# aterm-update already uses.
# First-party JSON (crates/aterm-json): the serde Deserializer/Serializer plus the
# untyped `Value` and `json!`. Replaces `serde_json` and the `zmij` float formatter
# behind it.
aterm-json = { workspace = true }
# SHA-256 for the operator/seamless/config-completion proof digests and the
# managed-model blob check. First-party; no third-party crypto in this binary.
aterm-digest = { workspace = true }
aterm-toml = { workspace = true }
# Smart-title inference runs on one bounded worker, never the UI thread. The
# first-party HTTP/1.1 client serves both the local Ollama and the opt-in
# OpenAI-compatible provider; TLS stays enabled for remote endpoints and JSON
# bodies are bounded. It replaced `ureq`, which was this binary's largest single
# third-party import at 12 packages / 89,080 lines. THE TRUST MODEL IS
# UNCHANGED: `platform-verifier` was requested here on purpose so remote
# certificates verify against the OS trust store, and aterm-http keeps exactly
# that (`rustls-platform-verifier`, now a direct dependency). What left is
# ureq's own HTTP stack — ureq, ureq-proto, http, bytes, httparse, utf8-zero,
# percent-encoding — plus the bundled `webpki-roots` it carried: 8 packages,
# 69,546 lines.
aterm-http = { workspace = true }
# PNG encode/decode for the control-socket `window` verb (the macOS full-window
# capture): it draws the front NSWindow's on-screen pixels into a tightly-packed
# RGBA8 buffer and encodes them here, and decodes AppKit's own PNG normalization
# on the way in. The SAME first-party crate aterm-render uses for the `image`
# verb's framebuffer PNG, so this adds no dep to the tree.
aterm-png = { workspace = true }
# NOTE: the tray's glyph rasterization no longer takes a font dependency of its
# own — `aterm_render::font::Font` (first-party, ttf-parser + this workspace's
# own coverage fill) retired `fontdue` here and in aterm-render together.

[build-dependencies]
# The build script derives the exact 64-byte lowercase updater-key fingerprint
# record embedded in a dedicated Mach-O section.  It deliberately hashes the
# same raw Ed25519 key bytes that `aterm-update` verifies at runtime — read from
# the committed anchor in `aterm-update-core::pins`, never from the environment,
# so the embedded record cannot disagree with the key actually trusted.
aterm-update-core = { workspace = true }
# Standard padded Base64 — first-party and zero-dependency. `decode_strict` is
# the entry point every trust path uses: canonical padding REQUIRED and no
# trailing bits, so a pinned key has exactly one spelling.
aterm-codec = { workspace = true }
aterm-digest = { workspace = true }
# Windows only: compile + link the application .ico (assets/aterm.rc → assets/
# aterm.ico) into the DEV `aterm-gui.exe` so the shell shows the aterm icon
# (taskbar button, Alt-Tab, titlebar, Explorer) instead of the generic exe
# glyph; the shipped `aterm.exe` gets its resources from crates/aterm/build.rs.
# First-party (crates/aterm-winres) — that crate's root says why
# `embed-resource` left. build.rs gates the call on CARGO_CFG_TARGET_OS =
# "windows" and a missing resource compiler is a warning, so non-Windows
# targets and toolchain-less builds are entirely unaffected.
aterm-winres = { workspace = true }

[dev-dependencies]
# Scratch home directories for the auto-prime pass test (spawn.rs): the pass
# must be driven against a directory that is NOT the developer's real $HOME.
aterm-tempfile = { workspace = true, features = ["stand-in"] }
# Re-declared with `conformance` ON so this crate's TEST build carries the
# verb-matrix suite (`aterm_control::conformance::run_all`) and can be run against
# `GuiHost`. Production `cargo build -p aterm-gui` keeps the feature off.
aterm-control = { workspace = true, features = ["conformance"] }
# Enables a path-filtered, thread-local counter at the actual visual-feed
# platform-open seam. It is used only by same-read/ABA conformance tests.
aterm-effects = { workspace = true, features = ["test-open-probe"] }
# The seal on a persistent message hold has no public constructor: a fixture
# that needs a bare `Hold::STANDING` / `Hold::asking(..)` takes them from this
# feature, which lends it the engine's own adopted ask. TEST builds only.
aterm-messages = { workspace = true, features = ["test-fixtures"] }
# VISUAL CAPTURE (`message_band_visual_capture` and its #[ignore]d siblings): dump
# real rendered frames to PNG so the chrome can be reviewed as pixels, not asserts —
# the same pattern `aterm-gpu`'s rain screenshot harness uses. (Redundant with the
# hard dependency above, but kept explicit so the dev target's need is recorded.)
aterm-png = { workspace = true }

# The GUI's physical-key Tier-1 test drives `App::on_key` itself. Winit's native
# platform payload is intentionally private, so its narrowly gated synthetic
# constructor is enabled only for test/bench targets, never the shipped binary.
winit = { workspace = true, features = ["aterm-test-key-event"] }
# Tier-1 conformance: bind the real `App` window lifecycle to the ty-proven
# `window_routing_model()`. Same model that is Tier-0 `ty check`ed in
# aterm-spec, so the spec the conformance test writes cannot drift from it.
aterm-spec = { workspace = true }
# TRUST_NATIVE_TLA Phase 2: the relocated `spec_xref_closure` gate lives in this
# binary's TEST build (`#[cfg(test)] mod spec_xref_gate` in main.rs). It collects
# the ISOLATION-family `#[refines]`/`#[spec_unmodeled]` anchors via `inventory`, so
# every anchor-bearing crate must be LINKED WITH ITS `spec-anchors` FEATURE ON in
# this test build. Re-declaring these (already normal `[dependencies]`) here with
# `features = ["spec-anchors"]` turns the anchors on ONLY for aterm-gui's test/bench
# build (Cargo unifies dev-dep features into the test build) — the production
# `cargo build -p aterm-gui` stays byte-identical (feature OFF). aterm-core supplies
# the `terminal_modes` + `alt_screen` anchors, aterm-sandbox the `sandbox`, aterm-pty
# the `write_all` + `fork_exec`, aterm-gpu the `gpu_encode`; aterm-gui's own
# `path_confine` anchor expands via this crate's `cfg(test)` directly.
# `fault-injection` arms aterm-core's thread-local fault points in this test build
# only: the seamless capture's tests prove a successor's `carry = "repaint"` policy
# never projects a live session's grids by making that projection fail
# (`checkpoint.carry_projection`). The production build keeps the const-false stub.
aterm-core = { workspace = true, features = ["spec-anchors", "fault-injection"] }
# `testing` exposes the debugger change's real order
# (`consent::devtools_change_with_for_test`) to `debugger_access`'s Tier-1 bind.
aterm-containment = { workspace = true, features = ["testing"] }
aterm-sandbox = { workspace = true, features = ["spec-anchors"] }
aterm-pty = { workspace = true, features = ["spec-anchors"] }
aterm-gpu = { workspace = true, features = ["spec-anchors"] }
# aterm-session supplies the `fd_lifecycle` anchors (the SinkWriter PTY-master
