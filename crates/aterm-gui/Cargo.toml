# waivers). Re-declared here with `spec-anchors` ON so `inventory` collects them
# into this gate's test binary (initiative A7, WS-G), and `testing` ON for the
# sink's read-only accounting the egress-contract suite asserts on.
aterm-session = { workspace = true, features = ["spec-anchors", "testing"] }
# aterm-scrollback's `testing` adds the corruption seam
# (`inject_corrupted_warm_block`) the native search's dense-history tests stage a
# corrupt tiered segment with (`control_query::dense_history_tests`).
aterm-scrollback = { workspace = true, features = ["testing"] }
# aterm-grid supplies the page-store, row and resize-undo `#[refines]` anchors,
# aterm-search the `streaming_search` ones (the derived StreamingSearch machine)
# and aterm-selection the `text_selection_lifecycle` ones (TextSelection's five
