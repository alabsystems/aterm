aterm-grid = { workspace = true, features = ["spec-anchors"] }
aterm-search = { workspace = true, features = ["spec-anchors"] }
aterm-selection = { workspace = true, features = ["spec-anchors"] }
# aterm-agent supplies the `#[refines]`/`#[spec_unmodeled]` anchors of five
# derived machines — the live upgrade's ladder (`HarnessUpgradeLadder`), its
