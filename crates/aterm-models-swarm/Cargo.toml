[package]
name = "aterm-models-swarm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "aterm's formal models of ALab swarm ledger publishing, lease, pool assignment, join phrases and the membership log (ty_model!)"
