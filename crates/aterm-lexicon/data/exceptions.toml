#
# CJK compounds whose MAXIMAL-MUNCH match would be a false positive.
#
# The scanner is maximal-munch from the run start, so a listed surface that is
# a PREFIX of an ordinary compound fires on that compound. This file suppresses
# those. The mechanism is CLASS-AGNOSTIC (consulted before forms at each
# length) even though it began life as a feline-only list.
#
# 1. FELINE: compounds that CONTAIN a cat character (猫 / 貓) but do NOT denote
#    a domestic cat, so the cat ideograph inside e.g. "panda" never sparkles.
#    Excluded by design: 子猫 / 小猫 (genuine kittens) ARE real cats and are
#    intentionally NOT listed.
#
# 2. PROFANITY: 我操 ("I fuck") is a listed non-ambiguous zh expletive, and it
#    is a prefix of the extremely common 我操作… ("I operate…"). Maximal munch
#    tries 我操作电脑 -> 我操作 -> 我操 and stops at the expletive before 操作
#    ("operate") is ever considered, so "我操作电脑" — "I operate the computer"
#    — detonated an f-bomb. Suppressing the benign compounds fixes it while
#    "我操这也太慢了" still fires.

# (2026-08-10) 熊猫 / 貓熊 left this list: they are POSITIVE panda forms in
# the animal-multilingual lexicon group now. The suppression job they did —
# keeping the cat ideograph inside 'panda' from sparkling — is done better by
# the longer compound winning the maximal munch and showing an actual panda.

[[exception]]
word = "山猫"
lang = "ja"
meaning = "lynx / wildcat"

[[exception]]
word = "山猫"
lang = "zh"
meaning = "lynx / wildcat"

[[exception]]
word = "猫車"
lang = "ja"
meaning = "wheelbarrow"

[[exception]]
word = "猫背"
lang = "ja"
meaning = "stoop; round-shouldered posture"

[[exception]]
word = "招き猫"
lang = "ja"
meaning = "beckoning-cat figurine (lucky charm)"

[[exception]]
word = "猫舌"
lang = "ja"
meaning = "sensitivity to hot food/drink"

[[exception]]
word = "猫目"
lang = "ja"
meaning = "cat's-eye (gemstone / road reflector)"

[[exception]]
word = "海猫"
lang = "ja"
meaning = "black-tailed gull"

# --- profanity false positives (2026-07-24) ------------------------------
# 我操 is a real expletive, but it prefixes these ordinary verbs.

[[exception]]
word = "我操作"
lang = "zh"
meaning = "I operate / I use (操作 = to operate)"

[[exception]]
word = "我操控"
lang = "zh"
meaning = "I control (操控 = to control)"

[[exception]]
word = "我操心"
lang = "zh"
meaning = "I worry about (操心 = to be concerned)"

# --- animal-multilingual prefix bombs (2026-08-10) ---------------------------
# The zh/ja/ko/th menagerie expansion listed short kana/hangul/Thai animal
# words that are real, typed, and worth keeping — but sit at the head of a
# SMALL, FINITE set of everyday compounds. Maximal munch would fire the animal
# inside them (カメラ grew a turtle in review). Where the set is open-ended
# (トラ→トラブル, りす→リスト, とり→とりあえず) the form was SKIPPED in the
# lexicon instead — this file is only for bomb lists short enough to enumerate.
# Stub entries (メカニ, インコー, ハチャ, ปลาย) deliberately suppress a
# non-word prefix so one line covers the whole family behind it.

