# ===================== group: animal (2026-08-10) =====================
# The ambient animal-word roster: ordinary English animal nouns, each entry
# tagged with the species id that names its authored sprite (see
# crates/aterm-effects/art/animal/ and the Animal collection in
# word_decorations). EVERY entry rides ambiguous = true by design: these
# surfaces ARE ordinary English prose, so the live-caret deferral is the
# mid-typing guard ('bee' inside 'been' never fires) and the fold-collision
# gate's unambiguous set stays clean; the default languages = ["en"]
# un-gates them for everyone. Homograph law: profanity > feline > orca >
# animal, so cat/kitty keep the cat and orca keeps its splash. One surface ->
# one species, pinned by animal_surface_species_are_unique.
