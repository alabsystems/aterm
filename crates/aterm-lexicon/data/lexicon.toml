# ===================== group: animal-multilingual (2026-08-10) =====================
# The menagerie's zh / ja / ko (+ hi / th / vi / id) expansion. Owner verbatim:
# "these need to work for Chinese and Korean and Japanese and other asian
# languages." Laws, extending the animal group's:
#
#  * Multi-character CJK compounds load PLAIN (ambiguous = false) — the
#    feline/canine CJK precedent: they are not ordinary Latin prose, so the
#    class's live-caret-deferral rationale does not apply, and a language gate
#    would leave them silent for every default (languages = ["en"]) user,
#    which is exactly the bug this group fixes.
#  * SINGLE-character han/kana/hangul forms are listed but ride the scanner's
#    class-agnostic `cjk_single_char` opt-in (the scanner drops 1-char CJK
#    hits without it, for every class): a lone ideograph fires anywhere the
#    character appears, including inside un-listed compounds, and most are
#    real homographs (말 = horse AND speech, 새 = bird AND new, 象 sits inside
#    印象/对象). Notes call out the worst offenders.
#  * Latin-script languages here (vi, id) stay ambiguous = true like the en
#    group: their folded surfaces are typable mid-English-word (caret
#    deferral) and several fold into other languages' ordinary words, so they
#    load only for users who list the language. Devanagari (hi) loads plain
#    per the canine hi precedent: a spaced script that cannot appear
#    mid-English-typing and cannot fold-collide with ASCII.
#  * In-language homograph bombs get the kuma treatment (an ambiguous = true
#    sibling entry) when the collision is open-ended, or an exceptions.toml
#    suppression when the bomb list is small and finite (カメラ for カメ,
#    오리지널 for 오리). A species with no clean form in a language is SKIPPED,
#    never force-fitted; skips are recorded in the surviving entry's notes.
#  * One surface -> one species still holds across languages (獅子 is the lion
#    for zh AND ja: same species, language sets union).
#
# Not expanded here: cat and dog words are Class::Feline / Class::Canine and
# already speak zh/ja/ko (th/lo/km cats too); this group is the OTHER 67 heads.

# ---- zh: Mandarin (Hans + Hant surfaces in one entry, the feline precedent) ----

[[entry]]
