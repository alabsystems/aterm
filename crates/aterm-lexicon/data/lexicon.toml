#
# Sparkle-words lexicon. Each [[entry]] declares surface forms for one
# (class, language). class = "profanity" | "feline" | "canine" | "orca" | "animal" | "emphasis".
# Cross-class homographs resolve by total order: profanity > feline > canine > orca > animal > emphasis.
# class = "animal" entries additionally carry species = "<id>" naming the authored sprite.
# mode="suffix": surfaces = stems x suffixes (+ forms[]). mode="forms": forms[] only.
# cjk=true: no-space script; forms[] are whole compounds matched by maximal run.
# ambiguous=true: only loaded when the entry's lang is in the configured `languages`.
# Seed authored with machine assistance; best-effort, extend via PR. See docs/sparkle-words-design.md

# ===================== group: en =====================
[[entry]]
class    = "profanity"
lang     = "en"
mode     = "suffix"
stems    = ["fuck"]
suffixes = ["", "ing", "ed", "s", "er", "ers", "in"]
forms    = ["motherfucker", "motherfucking", "clusterfuck", "fuckwit", "fuckup", "fuckhead", "unfuck", "fuckface", "fuckboy"]
cjk      = false
ambiguous= false
notes    = "Strong general-purpose English expletive. Concatenative suffixing is clean. 'fuckin' is the common dropped-g colloquial spelling. Irregular compounds enumerated in forms[]."

[[entry]]
class    = "orca"
lang     = "en"
mode     = "forms"
forms    = ["orca", "orcas"]
cjk      = false
ambiguous= false
notes    = "Orca / killer whale family — drawn as the randomized water-droplet 'splash'. Low-ambiguity whole word (also a name/brand; word-boundary matching handles those)."

[[entry]]
class    = "feline"
lang     = "en"
mode     = "forms"
forms    = ["cat", "cats", "kitty", "kitties", "kitten", "kittens", "kittycat", "pussycat", "meow", "meows", "mew", "mews"]
cjk      = false
ambiguous= false
notes    = "Bare 'cat' is highly ambiguous (substring of many words: category, catch, scatter, etc.; also acronym CAT, name; collides across languages) and 'kit' is a common English word; ambiguous=false here because external guards/word-boundary matching handle those collisions. 'kitty' can also be a name/poker pool but listed as common feline term. meow/mew (+ plurals) are the onomatopoeic cat-calls; 'meow' is also listed under ms, so its language set unions to en+ms. Bare 'mew' is 3 folded chars and rides the bare-cat opt-in."

