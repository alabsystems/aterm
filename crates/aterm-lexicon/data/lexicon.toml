# ---- vi: Vietnamese (Latin, spaced). fold.rs strips the Latin-1/Extended-A
# ---- accents (ó/ù/è → o/u/e) but KEEPS Latin Extended Additional (ấ/ị/ộ/ự
# ---- survive), so only some surfaces land on bare ASCII — each entry's note
# ---- says which. ambiguous=true like the en group: these load for users who
# ---- list vi. Skipped as unsalvageable after folding: khỉ (monkey → 'khi',
# ---- the vi word for 'when'), cáo (fox → 'cao', 'tall'), hổ/cọp (tiger →
# ---- 'ho'/'cop'), gà (chicken → 'ga', 'station'), cá (fish → 'ca'), chim
# ---- (bird — the anatomy slang), and all multiword forms (con voi, sư tử,
# ---- cá sấu — spaced surfaces never match; the canine vi entry's documented
# ---- limitation). ----

[[entry]]
class    = "animal"
lang     = "vi"
mode     = "forms"
species  = "elephant"
forms    = ["voi"]
cjk      = false
ambiguous= true
notes    = "voi = elephant (folds clean; 'con voi' would never match — multiword)."

