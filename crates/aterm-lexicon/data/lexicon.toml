# ---- hi: Hindi (Devanagari). Loads plain per the canine hi precedent: a
# ---- spaced script that cannot appear mid-English-typing and cannot
# ---- fold-collide with ASCII. Romanized forms deliberately absent — the
# ---- profanity-class romanization precedent covers words people genuinely
# ---- type in Latin script, and Hindi speakers reach for the English animal
# ---- word in that situation. बिल्ली (cat) and कुत्ता (dog) live in their
# ---- own classes. ----

