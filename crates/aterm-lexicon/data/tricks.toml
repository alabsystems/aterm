[[trick]]
id       = "treat"
lang     = "en"
words    = ["treat", "treats", "treato", "treatos", "snack", "snacks", "snacc", "yummy", "nom", "noms", "nomnom", "catnip", "kibble", "churu", "tuna", "milk", "breakfast", "dinner", "dinnertime", "snacktime", "salmon", "sardines", "din-din", "dindin", "lunch", "supper", "tasty", "delicious", "nomnomnom", "omnomnom", "cronch", "biscuit", "bone", "cream", "hungry", "chow"]
address  = ["eat", "feed", "food", "cookie", "cookies"]
gated    = false
cjk      = false
notes    = "Praise is ALWAYS address (law 1): `good catch`, `nice`, `great`, `perfect` are what people say to the assistant, and they must not move the cat until the line names it - `good kitty`, `who's a good boy`, `such a clever girl`. The plain forms are the food itself and the one-token compounds that carry their own vocative (goodboy, attagirl). `treat warnings as errors` blinks `treat` and is revoked at `warnings`: the bare word is plain (an iconic word, law 1). `yum` is NOT here (the package manager), nor `fish` (a shared animal surface and a shell). Praise moved to purr (`good kitty` purrs); this trick is the FOOD and the celebration that follows it."

[[vocative]]
lang     = "en"
words    = ["kitty", "kitties", "kittie", "kitteh", "kittycat", "kitten", "cat", "catto", "puss", "pussycat", "moggy", "moggie", "floof", "fluffy", "furball", "fuzzball", "chonk", "dog", "doggy", "doggie", "doggo", "doge", "pup", "puppy", "pupper", "pooch", "woofer", "boy", "girl", "buddy", "baby", "sweetie", "cutie", "sweetheart", "darling", "kitty-cat", "bud", "pal", "friend", "fren", "boi", "kiddo", "angel", "honey", "fluffball", "furbaby", "mister", "missy"]
gated    = false
cjk      = false
notes    = "Names for the pet, cat first, then the dog skin's, then endearments. Vocatives are EXEMPT from the shared-lexicon law (law 5): they are the feline / canine words on purpose, and a vocative never flashes. boy / girl are here for `good boy` / `good girl`. `cat` is also cat(1); that is safe because a vocative fires nothing by itself and `cat notes.txt` is impure at the next word. `void` (cat-speak for a black cat) is NOT here: it is a C keyword."

[[filler]]
lang     = "en"
words    = ["please", "pls", "plz", "ok", "okay", "now", "oh", "ooh", "aw", "aww", "awww", "and", "go", "to", "my", "you", "a", "whos", "such", "so", "very", "big", "little", "lil", "high", "up", "time", "job", "gimme", "alright", "omg", "wow", "lol", "haha", "your", "smol", "heckin", "u", "ur"]
gated    = false
cjk      = false
notes    = "A filler fires NOTHING; it only keeps a pet-directed line pure, so the cost of a common word here is near zero (`go build` is impure at `build`, `for f in ...` at `f`). They exist for the phrases people actually type: `please sit`, `now jump`, `go to sleep kitty`, `whos a good boy`, `such a good girl`, `love you kitty`, `thank you kitty`, `nap time`, `big stretch`, `high five`, `gimme paw`, `wake up`, `good job kitty`. `the` is NOT here: it is how a command turns into a sentence (`stretch the image`) and must end the line's purity. Nor are the words that would hurt someone who presses Enter or that glue ordinary prose together: `yes` (`yes kitty` floods the terminal), `for` (`time for dinner` leaves zsh at a `for>` continuation and `wait for cat to finish` would sit the pet), `then`, `it`, `me`, `i`, `what` (`now play it` would confirm a play)."

