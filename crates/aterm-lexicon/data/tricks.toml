[[trick]]
id       = "boo"
lang     = "en"
words    = ["boo", "eek", "scare", "jumpscare", "bang", "boom", "rawr", "hiss", "cucumber", "vacuum", "kaboom", "eep", "aah", "ahh", "spooky", "ghost", "thunder", "fireworks", "achoo", "spritz", "shoo", "scat", "scram", "begone", "skedaddle", "spraybottle"]
