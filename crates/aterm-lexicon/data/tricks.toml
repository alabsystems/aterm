cjk      = false
notes    = "pspsps is the universal cat summons and the plain word. `look` is BSD look(1) and the commonest assistant opener there is (`look at this file`), `watch` is watch(1): address. Greetings are address words of THIS trick rather than fillers, so `hey kitty` / `hello kitty` / `here kitty kitty` get the perk-up-and-look they are asking for, while `hello world` and `hey claude` stay silent. `come` has no trick of its own (the pet lives at the caret); the honest answer to `come here kitty` is a look."

[[trick]]
id       = "paw"
lang     = "en"
words    = ["paw", "paws", "shake", "highfive", "high-five", "five", "fistbump", "boop", "bap", "swat", "hifive", "bop", "swipe", "whack", "attack", "punch", "poke", "knock", "yeet", "claw", "claws", "beans", "toebeans", "mittens", "murdermittens", "wave"]
