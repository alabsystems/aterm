address  = ["talk", "voice"]
gated    = false
cjk      = false
notes    = "meow / mew / miaow are the ONLY surfaces allowed to overlap the shared sparkle lexicon (feline): the cat's own voice, answered in kind. `woof` and `miau` are shared surfaces and are NOT here (law 5); bark / arf / bork / awoo carry the dog. `ruff` is NOT here - it is the Python linter. `say` is NOT here - it is the macOS speech command. ekekek = the chatter at a bird through the window. talk (`talk me through it`; also a Unix command) and voice are address."

[[trick]]
id       = "look"
lang     = "en"
words    = ["pspsps", "psps", "pspspsps", "pspspspsps", "psst", "pst", "yoohoo", "cmere", "pss", "pspspspspsps", "ahem", "whistle", "henlo", "owo"]
