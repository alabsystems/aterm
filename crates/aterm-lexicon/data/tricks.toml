# SPDX-License-Identifier: Apache-2.0
# Copyright 2026 Andrew Yates
#
# Kitty-command vocabulary ("tricks"): the words a person TYPES to the cursor
# pet. Compiled by crates/aterm-lexicon/src/tricks.rs into a table the SCREEN
# scanner never sees - these are ordinary verbs, and as sparkle classes they
# would light up every build log. Only the typed-line listener asks, one token
# at a word boundary.
#
# [[trick]]     id = one of: sit down sleep stretch jump play roll purr groom
#               speak look paw hide boo scold treat
#   words    = PLAIN surfaces: may fire unaddressed, on a line that holds
#              nothing but pet vocabulary (tentatively - the fire is revoked if
#              the line then turns into prose).
#   address  = ADDRESS surfaces: fire only when the same line also names the
#              pet (`kitty sleep`, `good boy`).
# [[vocative]]  words = names for the pet. Fire nothing by themselves.
# [[filler]]    words = words that may sit in a pet-directed line without
#               breaking it (`please`, `now`, `whos a`). Fire nothing, ever.
# Every row:  lang, gated (true => loads only when [sparkle_words] languages
#             lists this lang, or "all"), cjk (true => no-space script: RAW
#             keys, the whole typed run must equal the surface), notes.
#
# THE LAWS (pinned by crates/aterm-lexicon/tests/tricks.rs):
#
#  1. WORDS vs ADDRESS - THE FIRST-WORD TEST. Imagine the surface as the FIRST
#     word of a shell command, or of a chat message to a coding assistant. If
#     that line is ordinary (`sleep 5`, `look at this`, `roll back the commit`,
#     `hide the sidebar`, `treat warnings as errors`, `wait`, `stop`), the
#     surface is an ADDRESS word. PRAISE AND SCOLDING ARE ALWAYS ADDRESS WORDS:
#     `good`, `nice`, `no`, `bad`, `stop` open half of all prose. A word is
#     PLAIN only when a line that starts with it is overwhelmingly someone
#     talking to the pet (`nap`, `zoomies`, `pspsps`, `boop`). The ICONIC bare
#     verbs are plain on purpose although they fail the test now and then -
#     sit, stay, down, sleep, jump, play, roll, hide, stretch, treat - because
#     they are what a person types FIRST, and a silent non-answer reads as
#     broken (the owner's law: a direct request is answered every time). The
#     tentative tier pays for them: `sleep 5`, `roll back the commit` and
#     `hide the sidebar` blink the word for one word-gap and are revoked at
#     the next token; the pet never moves.
#  2. EVERY trick has at least one PLAIN English word.
#  3. ONE TOKEN per surface: letters / digits / _ with - as an interior
#     joiner. NO APOSTROPHE SURFACES (`who's`, `c'mere`): submitted at a real
#     shell they open a `quote>` continuation; list the bare twin (`whos`). `roll over` can never be typed as one word; list `rollover`,
#     and make the second word of the phrase a surface of the SAME trick
#     (`over` -> roll, `down` -> down) or a filler (`up`, `time`), so the
#     natural two-word phrase keeps the line pure and still lands.
#  4. WHOLE-WORD ONLY, no inflection sweep: `sitting`, `sleepy`, `site` are
#     absent on purpose. List an inflection only when it is itself what people
#     say to a pet (`treats`, `scritches`, `pets`).
#  5. NO SURFACE OF THE SHARED SPARKLE LEXICON (any class, all languages) may
#     be a trick / address / filler surface: the screen scanner already owns
#     that word, and one word gets one emitter. So `bat`, `duck`, `fish`,
#     `woof`, `miau` are NOT here. The only exceptions are the cat's own
#     voice, meow / mew / miaow (speak). Vocatives are exempt - they SHOULD be
#     the feline / canine words. Nothing here may be profanity in any language.
#  6. A surface has ONE role. The same word under two tricks (or as a trick
#     and a filler) is a conflict and the first claimant wins. Two LANGUAGES
#     sharing an imperative under the same trick and list is fine.
#  7. ENGLISH IS NEVER GATED and is the FIRST language in the file. A
#     non-English PLAIN surface that is also a word English speakers really
#     type (id `main`, tr `gel`, de `spring`, ro `vino`) must ride a gated
#     sibling row (the sparkle lexicon's `ambiguous` remedy): ungated it would
#     blink at the first space of every English line that opens with it. An
#     obscure dictionary headword that is THE command of its language (fr
#     `assis`, sv `sov`) stays ungated and is excused BY NAME, with a reason,
#     in the test. Address words, vocatives and fillers fire nothing alone and
#     are not charged.
#  8. MARKS-REQUIRED: a surface that loses diacritics into a bare-ASCII key
#     matches only marked typing, unless the bare spelling is listed too. List
#     both when people type without accents and the bare form is safe; omit
#     the bare form when it is another word.
#  9. A single-character no-space surface ALWAYS needs the vocative,
#     whichever list it sits in.
# 10. Lowercase; no duplicate surface within a language; at most 32 characters.
#
# Seed authored with machine assistance; best-effort, extend via PR. New
# languages are APPENDED as dated groups after English.

# ===================== group: en (2026-09-16) =====================
# The priority language. Cat-first (the pet is the cursor CAT), with the dog
# school words a dog-skin owner reaches for (heel, beg, fetch, shake, walkies)
# and the internet's cat-speak (pspsps, zoomies, loaf, sploot, boop, bap, mlem,
# blep, biscuits, chonk, floof).

[[trick]]
id       = "sit"
lang     = "en"
words    = ["sit", "stay", "beg", "heel"]
address  = ["wait", "freeze", "hold", "still", "steady", "pose"]
gated    = false
cjk      = false
notes    = "`sit` is the owner's own example and must answer unaddressed; `sit tight while I check` is what the tentative tier is for (revoked at `tight`). `stay` is the other half of the pair everyone says and is plain with it (`stay on this branch` is revoked at `on`). beg = sit up and beg, heel = come to attention: dog-school words nobody opens a command line with. wait / freeze open ordinary lines (the shell builtin `wait`, `freeze the dependencies`), so they need the pet named."

[[trick]]
id       = "down"
lang     = "en"
words    = ["down", "loaf", "catloaf", "sploot", "flop", "lie", "settle", "bread", "purrito", "plop", "comfy", "cozy", "cosy"]
address  = ["lay", "rest", "relax", "chill", "calm", "easy"]
gated    = false
cjk      = false
notes    = "The commanded pose IS the loaf, so the cat-speak is plain: loaf, catloaf, sploot (flat out, legs behind), flop. `down` is the dog-school word and plain: almost no ordinary line STARTS with it, and inside a phrase the listener's one-phrase-one-trick law absorbs it (`sit down` is a sit, `lie down` / `settle down` / `calm down` are one down). lay (`lay out the grid`), rest (`REST API`, `rest of the file`), relax (`relax the constraint`), chill and calm are ordinary openers."

[[trick]]
id       = "sleep"
lang     = "en"
words    = ["sleep", "nap", "naptime", "catnap", "snooze", "doze", "siesta", "bedtime", "goodnight", "nighty", "nightnight", "night-night", "lullaby", "snore", "slumber", "nightynight", "dream", "dreams"]
address  = ["night", "bed"]
gated    = false
cjk      = false
notes    = "`sleep` IS a shell command typed by hand (`sleep 5 && ...`), and it is plain anyway: it is THE thing one tells a cat, and the tentative tier makes the collision cheap - `sleep 5` blinks the word and is revoked at `5`, the pet never moves (`time sleep 1` is impure before it starts). `zzz` is NOT here: bare `zzz` is a real suspend command on FreeBSD / OpenBSD / Void, and people press Enter. `good night kitty` lands here through `night` (the later held word wins over `good`); `goodnight` and `night-night` are the one-token forms. siesta is an English loanword too; a Spanish row may list it again under the same trick and list (law 6)."

[[trick]]
id       = "stretch"
lang     = "en"
words    = ["stretch", "stretchies", "bigstretch", "yawn", "wake", "wakeup", "wakey", "rise", "wakeywakey", "awake", "arise", "morning", "goodmorning", "yoga"]
address  = ["shine", "stand"]
gated    = false
cjk      = false
notes    = "Stretch is also how a sleeper is woken, so the wake words live here. `stretch` is one of the four deliberate plain verbs (`stretch the image to fit` is rare and the tentative tier revokes it). `big stretch` is what everyone says to a stretching cat: `big` is a filler and `bigstretch` the one-token form. `wake up` works because `up` is a filler, not a jump word. `shine` exists only so `rise and shine` stays pure."

[[trick]]
id       = "jump"
lang     = "en"
words    = ["jump", "hop", "hup", "leap", "pounce", "bounce", "boing", "uppies", "alleyoop", "sproing", "parkour", "liftoff"]
address  = ["spring"]
gated    = false
cjk      = false
notes    = "`jump` is one of the four deliberate plain verbs (`jump to line 40` is editor talk, rare at a prompt, and revoked at `line`). hup = the handler's cue for a jump; pounce = the crouch-leap-land this trick performs; uppies = pet-speak. `spring` opens `spring boot ...` lines, so it is address. `up` is deliberately NOT a jump word: it is a filler, or `wake up kitty` and `sit up kitty` would make the cat jump."

[[trick]]
id       = "play"
lang     = "en"
words    = ["play", "playtime", "zoomies", "frolic", "romp", "toy", "ball", "laser", "feather", "dance", "twirl", "chase", "hunt", "walkies", "boogie", "shimmy", "zoomie", "scamper", "party", "bow", "toys", "mousie", "celebrate", "yay", "woohoo", "hooray", "hurray", "yippee", "whee"]
address  = ["run", "zoom", "fetch", "catch", "walk"]
gated    = false
cjk      = false
notes    = "`play` is one of the four deliberate plain verbs (sox's `play song.wav` and `play with the layout` are rare, and revoked at the next word; `play.py` is refused by the listener's code-context rule). zoomies is the word for exactly what the cat does. toy / ball / laser / feather are what one waves at a cat. run (`run the tests`), zoom, fetch (`fetch the latest docs`; BSD fetch), catch (`catch the exception`), walk (`walk me through`), spin (`spin up a server`) are everyday openers. `yarn` is NOT here - it is the package manager."

[[trick]]
id       = "roll"
lang     = "en"
words    = ["roll", "rollover", "roll-over", "barrelroll", "wriggle", "wiggle", "tumble", "somersault", "belly", "tummy", "playdead", "squirm", "pirouette", "cartwheel", "backflip"]
address  = ["over", "flip", "barrel", "dead", "spin"]
gated    = false
cjk      = false
notes    = "`roll back the last commit` is among the commonest things typed to a coding assistant, and bare `roll` is plain anyway (an iconic verb, law 1): that line blinks `roll` and is revoked at `back`. `over` is an address surface of the SAME trick so `roll over` stays pure and is one roll (the phrase law absorbs it). flip (`flip the flag`) is address. belly / tummy = show me the belly. playdead is the one-token dog trick; `play dead` as two words is a play. `dead` is an address surface so `play dead` stays pure and is one play (the phrase law absorbs it); `playdead` is the roll."

[[trick]]
id       = "purr"
lang     = "en"
words    = ["purr", "purrr", "prrr", "pet", "pets", "pat", "pats", "headpat", "headpats", "scritch", "scritches", "snuggle", "snuggles", "cuddle", "cuddles", "nuzzle", "hug", "hugs", "kiss", "kisses", "smooch", "rub", "rubs", "prr", "patpat", "bellyrub", "bellyrubs", "scratches", "smooches", "mwah", "xoxo", "headbutt", "tickle", "tickles", "luv", "ily", "uwu", "pawsome", "goodboi", "goodkitty", "goodcat", "gooddog", "goodboy", "goodgirl", "attaboy", "attagirl", "knead", "biscuits"]
address  = ["love", "thanks", "thank", "thankyou", "good", "goodest", "nice", "great", "bravo", "clever", "smart", "pretty", "cute", "sweet", "lovely", "beautiful", "adorable", "best", "bestest", "awesome", "perfect", "wonderful", "brilliant", "amazing", "precious", "gorgeous", "handsome", "cutest", "happy", "soft", "warm", "silly", "thx"]
gated    = false
cjk      = false
notes    = "This trick is the petting beat, so the words for petting are plain: pet / pat / scritches / headpats / cuddles. `belly rubs` fires roll then purr; the newer one wins, either is right. love and thanks are affection but open ordinary lines (`thanks, that works`), so they are address: `thank you kitty` purrs (`you` is a filler), a bare `thanks` to the assistant does nothing. PRAISE lives here: `good kitty` is answered with a purr and a heart. Praise is ALWAYS address (law 1) - `good catch`, `nice`, `great`, `perfect` are what people say to the assistant all day - and the one-token compounds that carry their own vocative (goodboy, attagirl) are plain."

[[trick]]
id       = "groom"
lang     = "en"
words    = ["groom", "wash", "bath", "bathtime", "lick", "mlem", "blep", "preen", "brush", "bathe", "primp", "shampoo", "comb"]
