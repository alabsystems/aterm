[package]
name = "aterm-lexicon"
# Integration tests are declared below, not discovered: the files are modules of
# one suite binary where they can share a process. With autotests off a
# `tests/*.rs` file listed nowhere never compiles.
autotests = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Multilingual whole-word lexical matching for the sparkle-words text decorations (profanity + feline families)"

[dependencies]
serde = { workspace = true }
aterm-toml = { workspace = true }
aterm-hash = { workspace = true }

[lints]
workspace = true

[[test]]
name = "lexicon_suite"
path = "tests/lexicon_suite.rs"

# Alone: the exact-allocation pins own a counting #[global_allocator].
[[test]]
name = "lexicon_alloc"
path = "tests/lexicon_alloc.rs"
