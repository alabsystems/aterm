[package]
name = "aterm-lexicon"
# Integration tests are modules of the suite binaries declared below; with autotests off, a
# `tests/*.rs` file listed nowhere never compiles.
autotests = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Multilingual whole-word lexical matching for the sparkle-words text decorations (profanity + feline families)"

[dependencies]
serde = { workspace = true, features = ["derive"] }
aterm-toml = { workspace = true }
aterm-hash = { workspace = true }

# The build script decodes the embedded lexicon (`build.rs`) through the same
# shapes and TOML reader as the run-time decoder.
[build-dependencies]
serde = { workspace = true, features = ["derive"] }
aterm-toml = { workspace = true }

[dev-dependencies]
# `host::could_not_run`: the dictionary gates end COULD NOT RUN on a host without
# Webster's Second, never as a pass.
aterm-spec = { workspace = true }

[lints]
workspace = true

[[test]]
name = "lexicon_suite"
path = "tests/lexicon_suite.rs"

# Alone: the exact-allocation pins own a counting #[global_allocator].
[[test]]
name = "lexicon_alloc"
path = "tests/lexicon_alloc.rs"
