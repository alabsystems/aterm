[package]
name = "aterm-scrollback"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Tiered scrollback storage with LZ4 compression"

[features]
# Headless hot(RAM)+warm(LZ4)+cold(LZ4) scrollback. NO libc / std::fs in the
# dependency closure (the §2.7 "no-platform" engine invariant). Every compressed
# tier uses the one first-party LZ4 codec (aterm-lz4).

[dependencies]
aterm-rle = { workspace = true }
aterm-types = { workspace = true }
aterm-alloc = { workspace = true }
aterm-lz4 = { workspace = true }
aterm-log = { workspace = true }

[dev-dependencies]
# The seeded `XorShift` the generated tests draw from.
aterm-spec = { workspace = true }

[lints]
workspace = true
