[package]
name = "aterm-scrollback"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Tiered scrollback storage with LZ4 compression and disk offload"

[features]
# Default = headless hot(RAM)+warm(LZ4)+cold(LZ4) scrollback. NO libc / std::fs
# in the dependency closure (the §2.7 "no-platform" engine invariant). The disk
# tier is opt-in below. Every compressed tier uses the one first-party LZ4 codec
# (aterm-lz4).
default = []
# Exposes the fuzz-only decode API (`lz4` becomes `pub`) to the cargo-fuzz crate
# in fuzz/, and runs src/decode_fuzz_tests.rs at its deep counts
# (90k/90k/90k/40k inputs instead of 10k per loop).
fuzz = []
# Opt-in disk-backed cold tier: pulls in `libc` (mmap/munmap/msync), `std::fs`,
# and the memory-mapped `.dtrm` cold store, whose pages use the same LZ4 cold
# codec as the in-memory cold tier. Off by default per §2.7.
disk-tier = ["dep:libc"]

[dependencies]
aterm-rle = { workspace = true }
aterm-types = { workspace = true }
aterm-alloc = { workspace = true }
aterm-lz4 = { workspace = true }
libc = { workspace = true, optional = true }
aterm-log = { workspace = true }

[dev-dependencies]
aterm-tempfile = { workspace = true }
# The seeded `XorShift` the generated and disk-backed tests draw from.
aterm-spec = { workspace = true }

[lints]
workspace = true
