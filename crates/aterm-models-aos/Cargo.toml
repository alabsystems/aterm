[package]
name = "aterm-models-aos"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "aterm's model of Aos hosted execution's boundary publication (ty_model!), for aterm-aos's Tier-1 test and spec-check"
# The Tier-0 tests compile as ONE suite (tests/suite.rs): a tests/*.rs that is neither
# the suite nor a `mod` of it compiles into nothing.
autotests = false

[lib]
# No unit tests and no doctests live in src/: the models' tests are tests/suite.rs.
test = false
doctest = false

[[test]]
name = "suite"
path = "tests/suite.rs"

[dependencies]
aterm-spec.workspace = true

[lints]
workspace = true
