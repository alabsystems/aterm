[package]
name = "aterm-models-aos"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "aterm's models of Aos hosted execution (ty_model!): the boundary publication, for aterm-aos's Tier-1 test, and the key hold, for aterm-effects' and aterm-gui's Tier-1 tests; and spec-check"
# The Tier-0 tests compile as ONE suite (tests/suite.rs): a tests/*.rs that is neither
# the suite nor a `mod` of it compiles into nothing.
autotests = false

[package.metadata.aterm.test-inputs]
read-only = true
bounded = true
content-only = true
volatile-environment = []
paths = []

[lib]
# No unit tests and no doctests live in src/: the models' tests are tests/suite.rs.
test = false
doctest = false

[[test]]
name = "suite"
path = "tests/suite.rs"

[dependencies]
aterm-spec.workspace = true

[lints]
workspace = true
