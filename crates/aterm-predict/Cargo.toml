[package]
name = "aterm-predict"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "aterm predictive local echo — the mosh-modeled, pure, clock-injected speculative-typing state machine, extracted from aterm-gui so the native GUI and the web embedders (aterm-wasm / aterm-gpu-web) drive ONE implementation."

[dependencies]
# The engine-wide injected-clock idiom: EXACTLY std::time::Instant on native
# (byte-identical to the pre-extraction aterm-gui build), a JS clock on wasm32 —
# the state machine stays clockless (the host injects `now`), but wasm hosts
# need a constructible Instant to sample their real monotonic clock.
web-time = { workspace = true }

[dev-dependencies]
aterm-spec = { workspace = true }

[lints]
workspace = true
