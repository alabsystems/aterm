[package]
name = "aterm-predict"
# Integration tests are declared below, not discovered: the files are modules of
# one suite binary where they can share a process. With autotests off a
# `tests/*.rs` file listed nowhere never compiles.
autotests = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "aterm predictive local echo: the mosh-modeled, pure, clock-injected speculative-typing state machine shared by the native GUI and the web embedders."

[dependencies]
# The ONE width authority: which characters are predictable is a WIDTH question
# (one cell, self-echoing), and a second range table here would drift from the
# grid's. Already in the pinned wasm closure, so this adds no crate to web builds.
aterm-grapheme = { workspace = true }
# std::time::Instant on native, a JS clock on wasm32. The state machine is
# clockless (the host injects `now`); wasm hosts need a constructible Instant.
aterm-time = { workspace = true }
# The ONE bidi-class authority: a glyph is placed only on a row the engine's own
# UAX #9 reorder leaves in logical order, and which characters make a row reorder
# is that crate's question. Dependency-free, and already in the wasm closure
# through aterm-core.
aterm-bidi = { workspace = true }

[dev-dependencies]
# The headless engine the safety theorem (`tests/reconciled_view_safety.rs`) folds
# real program output through: the authoritative screen a prediction overlays is
# aterm-core's, read the way the GUI reads it. A dev-dependency only, so the
# shipped crate and the wasm closure stay engine-free.
aterm-core = { workspace = true }
aterm-spec = { workspace = true }
# The models its tests drive (a model edit rebuilds only their tests).
aterm-models-core = { workspace = true }

[[test]]
name = "predict_suite"
path = "tests/predict_suite.rs"

[lints]
workspace = true
