[package]
name = "aterm-gpu-web"
version.workspace = true
edition = "2021"
description = "The browser binding of the aterm engine drawn by aterm-gpu (WebGL2) onto a <canvas>, exported through aterm-wasm-abi. The GPU sibling of aterm-wasm (the CPU path)."
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
aterm-core = { path = "../aterm-core", default-features = false }
aterm-render = { path = "../aterm-render", default-features = false }
# The cursor-wake and sparkle-words engines the native app runs.
aterm-effects = { path = "../aterm-effects" }
# The predictive-echo state machine the native app runs (aterm-wasm/src/predict_api.rs).
aterm-predict = { workspace = true }
# The message band (aterm-wasm/src/messages_api.rs, mounted by `#[path]`).
aterm-messages = { workspace = true }
# Real monotonic clock for predict_api (performance.now() on wasm32): echo
# reconciliation runs on real time, unlike the deterministic effects clock.
aterm-time = { workspace = true }
aterm-gpu = { path = "../aterm-gpu" }
# aterm_types::Appearance for set_color_scheme (aterm-core does not re-export it).
aterm-types = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# The host boundary, with no dependency of its own: `#[export]` marks what JS
# sees and `verify glue` writes the glue (no wasm-bindgen:
# docs/AUDIT-third-party-2026-10-15.md, wasm-platform WP.8, as WP.7 did for
# aterm-wasm); the panic hook reports `console.error` with the JS stack, in
# console_error_panic_hook's format, through the `aterm_host` imports
# src/host.rs names (WP.3). No GPU backend row: aterm-gpu's GL arm draws on
# WebGL2 through its own `aterm_gl` imports, and `init` and `init_offscreen`
# reach it through `aterm_gpu::web` (`GpuContext::for_canvas`,
# `CanvasTarget`, `GpuRenderer::configure_canvas_surface`), whose canvas
# types are aterm-wasm-abi JS objects. No wasm-bindgen, web-sys, js-sys or
# wgpu in this module's graph.
aterm-wasm-abi = { workspace = true, features = ["export"] }
# No getrandom row: nothing here needs entropy, and aterm's own manifests were
# its only parents on this cell, so a defensive row alone shipped it
# (deny.toml bans it outside ring; `forge check` [OB-18]).

# No [profile.release]: profiles apply only at the workspace root. A wasm size
# build (opt-level = "z") is chosen by the build tool's --profile.

[dev-dependencies]
# TEST-ONLY: `aterm_spec::host::could_not_run`, so a test the host cannot run
# (no system font, no GPU) ends COULD NOT RUN, never a silent pass.
aterm-spec = { workspace = true }

[lints]
workspace = true
