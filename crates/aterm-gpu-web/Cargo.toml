[package]
name = "aterm-gpu-web"
version.workspace = true
edition = "2021"
description = "wasm-bindgen binding: the aterm engine drawn by aterm-gpu (wgpu WebGL2) onto a <canvas>. The GPU sibling of aterm-wasm (the CPU path)."
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# default-features = false drops the engine's disk-tier cold scrollback (libc
# mmap + zstd-sys C), which cannot target wasm32; a renderer needs only the
# RAM/LZ4 tiers.
aterm-core = { path = "../aterm-core", default-features = false, features = ["sixel"] }
aterm-render = { path = "../aterm-render", default-features = false }
# The cursor-wake and sparkle-words engines the native app runs.
aterm-effects = { path = "../aterm-effects" }
# The predictive-echo state machine the native app runs (src/predict_api.rs).
aterm-predict = { workspace = true }
# The message band (src/messages_api.rs, the CPU twin's file line for line).
aterm-messages = { workspace = true }
# Real monotonic clock for predict_api (performance.now() on wasm32): echo
# reconciliation runs on real time, unlike the deterministic effects clock.
aterm-time = { workspace = true }
aterm-gpu = { path = "../aterm-gpu" }
# aterm_types::Appearance for set_color_scheme (aterm-core does not re-export it).
aterm-types = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# WebGL2 only: production refuses unsafe-WebGPU, and WebGL2 runs the same
# instanced-quad + R8/Rgba8 atlas pipeline. fragile-send-sync-non-atomic-wasm
# lets the !Send GPU handles meet wgpu's Send/Sync bounds on the single-threaded
# browser main thread. Under the wasm32 table so the native build never pulls
# the WebGL closure.
wgpu = { version = "29", default-features = false, features = ["webgl", "wgsl", "fragile-send-sync-non-atomic-wasm"] }

# wgpu 29 requires wasm-bindgen >= 0.2.108. Pinned exact so the generated glue
# matches the wasm-bindgen CLI (`--target web` refuses a mismatch); aterm-wasm
# shares the pin.
wasm-bindgen = "=0.2.108"
# Required though nothing names it: `#[wasm_bindgen] pub async fn` (`init`,
# `init_offscreen`) expands to `wasm_bindgen_futures::future_to_promise`.
# Default features off: `std` adds only futures-util, used solely by the
# catch_unwind `future_to_promise` variant (panic = "unwind"); the ungated
# variant has a looser bound. Saves 5 packages / 36,126 lines in the shipped
# wasm. wasm-bindgen/js-sys/web-sys keep `std` through their own rows here.
wasm-bindgen-futures = { version = "0.4", default-features = false }
console_error_panic_hook = "0.1"
# Only the DOM types this crate's signatures name: `init`'s HtmlCanvasElement
# and `init_offscreen`'s OffscreenCanvas (declared, not borrowed from wgpu's
# `webgl` feature table).
web-sys = { version = "0.3", features = ["HtmlCanvasElement", "OffscreenCanvas"] }
# No getrandom row: nothing here needs entropy, and aterm's own manifests were
# its only parents on this cell, so a defensive row alone shipped it
# (tools/grep_guard.sh B18).

# No [profile.release]: profiles apply only at the workspace root. A wasm size
# build (opt-level = "z") is chosen by the build tool's --profile.

[lints]
workspace = true
