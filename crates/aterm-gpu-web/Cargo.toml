[package]
name = "aterm-gpu-web"
version.workspace = true
edition = "2021"
description = "wasm-bindgen binding: the aterm engine (aterm-core) + the aterm-gpu WebGPU renderer (wgpu -> WebGPU on wasm32), rendering a terminal onto a <canvas> in the Electron renderer. The GPU sibling of the aterm-wasm crate (which is the CPU/putImageData path)."
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# aterm engine + the GPU renderer (vendored under rust/aterm). default-features =
# false drops the engine's disk-tier cold scrollback (libc mmap + zstd-sys C), which
# cannot target wasm32 — a renderer needs only the RAM/LZ4 tiers. aterm-gpu itself
# now also stops FORCING disk-tier (its deps are default-features = false), so the
# GPU crate's whole closure is wasm32-clean.
aterm-core = { path = "../aterm-core", default-features = false, features = ["sixel"] }
aterm-render = { path = "../aterm-render", default-features = false }
aterm-render-api = { path = "../aterm-render-api", default-features = false }
# The shared cursor-wake + sparkle-words engines (the SAME art the native app
# runs — extracted from aterm-gui). Closure is wasm32-clean (aterm-time clock).
aterm-effects = { path = "../aterm-effects" }
# The shared mosh-style predictive-echo state machine (the SAME predictor the
# native app runs — extracted from aterm-gui). Pure + clock-injected; the
# predict_api module samples the real monotonic clock for it (aterm-time below).
aterm-predict = { workspace = true }
# Real monotonic clock for the predict_api host seam: std Instant on native,
# performance.now() on wasm32 — the predictor's echo reconciliation runs on
# REAL time (the glitch-expiry self-heal), unlike the deterministic effects clock.
aterm-time = { workspace = true }
aterm-gpu = { path = "../aterm-gpu" }
# aterm_types::Appearance for the set_color_scheme binding (aterm-core does not
# re-export it). default-features = false pins out serde/winit -> wasm32-clean.
aterm-types = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# wgpu's WebGL2 backend on wasm32 — orca's deliberate terminal-acceleration target
# (the renderer accelerates via WebGL; production refuses unsafe-WebGPU). WebGL2
# supports the same instanced-quad + R8/Rgba8 glyph-atlas pipeline as WebGPU, so no
# pipeline code changes. default-features = false drops the native backends
# (metal/vulkan/dx12/gles); the wasm closure pulls only the WebGL path via
# wasm-bindgen/web-sys. fragile-send-sync-non-atomic-wasm lets the !Send GPU handles
# satisfy wgpu's Send/Sync bounds on the single-threaded browser main thread.
# Kept under the wasm32 target table so the native workspace build of this crate
# never pulls wgpu's WebGL closure — it only needs the engine deps above to compile.
wgpu = { version = "29", default-features = false, features = ["webgl", "wgsl", "fragile-send-sync-non-atomic-wasm"] }

# wgpu 29 requires wasm-bindgen >= 0.2.108; pin it exact so the generated glue
# matches the wasm-bindgen CLI version (a mismatch makes `wasm-bindgen --target web`
# refuse). aterm-wasm is aligned to the same 0.2.108 so both web crates share the
# one workspace lock.
wasm-bindgen = "=0.2.108"
# NOT optional and NOT removable, despite no `use` of it anywhere in this crate:
# the two `#[wasm_bindgen] pub async fn` exports on GpuWeb (src/lib.rs:2793 `init`,
# :2803 `init_offscreen`, under the `#[wasm_bindgen]` impl at :2774) expand to
# `wasm_bindgen_futures::future_to_promise(async move { .. }).into()` —
# wasm-bindgen-macro-support-0.2.108/src/codegen.rs:772, with the path defaulting
# to a bare `wasm_bindgen_futures` at that crate's lib.rs:184. A source-level grep
# finds only comments; the reference is MACRO-GENERATED. Deleting this line is a
# hard compile error on wasm32, not a dead edge.
# DEFAULT FEATURES OFF, though. The default set is just ["std"], and `std` =
# ["wasm-bindgen/std", "js-sys/std", "web-sys/std", "futures-util"] — that last,
# OPTIONAL `futures-util` is the omitted arm, and it is unreachable here.
# COST: -5 packages / -36,126 lines from the SHIPPED BROWSER ARTIFACT (futures-util
# 26,215 + futures-core 840 + futures-task 815 + slab 2,609 + pin-project-lite
# 5,647). None of the four forge cells move — aterm-gpu-web is not in `-p aterm`.
# WHY THE ARM IS DEAD: `futures_util` is named once in the crate
# (wasm-bindgen-futures-0.4.58/src/lib.rs:50) under
# `cfg(all(wasm32, feature = "std", panic = "unwind"))`, feeding ONLY the
# catch_unwind variant of `future_to_promise` at :261. The macro call above still
# resolves — the ungated variant at :223 is compiled instead, and its bound is
# strictly LOOSER (no `UnwindSafe` on the future), so nothing that compiles today
# stops compiling. The crate is no_std-clean: `#![cfg_attr(not(feature = "std"),
# no_std)]` at src/lib.rs:33, and its only `std::` path is :263, inside that cfg.
# `wasm-bindgen/std`, `js-sys/std` and `web-sys/std` are not lost — this crate
# declares wasm-bindgen, web-sys and js-sys directly, with defaults on, right here.
wasm-bindgen-futures = { version = "0.4", default-features = false }
console_error_panic_hook = "0.1"
# The browser DOM types THIS CRATE'S OWN SIGNATURES NAME, and only those: the
# <canvas> handed in from JS (`init`, src/lib.rs:2793 `web_sys::HtmlCanvasElement`)
# and the worker-side surface (`init_offscreen`, :2803 `web_sys::OffscreenCanvas`).
# `OffscreenCanvas` was NOT declared here before and compiled only because wgpu's
# `webgl` feature table happens to activate it — a borrowed activation that would
# vanish silently with a wgpu backend change. It is stated in aterm's own manifest
# now. `Window` and `Document` went the other way: declared, never named (no
# `web_sys::Window` or `web_sys::Document` occurs in this crate), reserved for a
# window/raf present loop that is driven from JS. Deleted.
web-sys = { version = "0.3", features = ["HtmlCanvasElement", "OffscreenCanvas"] }
# NO getrandom ROW — see crates/aterm-wasm/Cargo.toml for the measurement. Its
# only parents on this cell were aterm's own manifests, so the defensive line
# was the dependency: -1 package / -1,997 lines here (js-sys stays, held by
# web-sys and wgpu). Guarded by tools/grep_guard.sh B13.

# NOTE: no per-crate [profile.release] — profiles only take effect from the
# workspace root, which already sets lto/codegen-units=1/strip for release. A wasm
# size build (opt-level="z") is driven by the build tool's --profile, not here.
