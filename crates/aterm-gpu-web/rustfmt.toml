#
# THIS CRATE IS NOT AT THE WORKSPACE EDITION, and `rustfmt` learns a file's
# edition from the nearest `rustfmt.toml` — never from `Cargo.toml`. Without
# this file `trustfmt <path>` by hand, `targo-fmt -- <paths>`, format-on-save
# and rust-analyzer format these sources at the workspace's 2024, which invents
# drift and, for a file using `gen` as an identifier, does not parse at all.
# Keep it equal to the manifest's edition.
edition = "2021"
