[package]
name = "aterm-spec-anchor"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The registry and anchor records that aterm's #[refines] attributes reference"

# The anchor attributes on a stock compiler, and under Trust's lint driver: the
# proc macros (`refines`, `spec_unmodeled`), re-exported so an
# anchored crate names one path. A Trust compiler's cfg query answers
# `trust_verify` in every other lane, so there this row is not in the graph (Trust's
# PM-1 boundary refuses to verify a library whose graph holds a proc macro) and the
# attributes are this crate's own `macro_rules!` ones (src/attrs.rs), chosen by the
# same fact through `cfg(anchor_rules)` (anchor_rules.rs).
[target.'cfg(not(trust_verify))'.dependencies]
aterm-spec-macros = { workspace = true }

[dev-dependencies]
# tests/attrs.rs runs the proc macros' own suite (aterm-spec-macros
# tests/anchors/suite.rs) against the attributes this crate exports; the suite reads
# the evidence windows through `aterm_spec::xref`. A dev-only cycle, which Cargo
# permits.
aterm-spec = { workspace = true }

[lints]
workspace = true
