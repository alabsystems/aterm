[package]
name = "aterm-buffer"
# Integration tests are declared below, not discovered: every file is a module
# of the one `buffer_suite` binary, which mounts `tests/support/` once. With
# autotests off a `tests/*.rs` file listed nowhere never compiles.
autotests = false
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "aterm buffer-primitives kernel: a text-line Surface over one bounded event-log spine (apply, read_text, snapshot, subscribe/poll, transact)."

[package.metadata.aterm.test-inputs]
read-only = true
bounded = true
content-only = true
volatile-environment = []
paths = []

# The suite's tiered conformance tests launch the Trust `ty` checker when the
# release verifier enables spec checkers; that transitive tool is not bounded.
[package.metadata.aterm.test-inputs.targets."test:buffer_suite"]
bounded = false

[dependencies]
# The capability witnesses: `ReadCap`/`WriteCap` are `aterm_cap::Cap<E>`, so
# only a holder of the launcher-minted `Authority` can call a verb.
aterm-cap = { workspace = true }

[dev-dependencies]
# The tests are their own trusted launcher: `launcher-mint` on the dev edge
# only: in production this crate receives `Cap`s and never mints.
aterm-cap = { workspace = true, features = ["launcher-mint"] }
# Tier-1 conformance: the derived models in `aterm_spec::derive`, checked
# against the real `Surface`/`EventLog`.
aterm-spec = { workspace = true }
# The models its tests drive (a model edit rebuilds only their tests).
aterm-models-core = { workspace = true }
aterm-models-session = { workspace = true }

[lints]
workspace = true

[[test]]
name = "buffer_suite"
path = "tests/buffer_suite.rs"
