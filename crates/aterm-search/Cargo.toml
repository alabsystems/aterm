[package]
name = "aterm-search"
# Integration tests are modules of one suite binary, declared below; with
# autotests off a `tests/*.rs` file listed nowhere never compiles.
autotests = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Search primitives for aterm terminal content"

[features]
default = []
# Compile the streaming-search `#[refines]` anchors into the library so aterm-gui's
# `spec_xref_closure` test can collect them via `aterm_spec::registry`. Off by default.
spec-anchors = ["dep:aterm-spec"]

[dependencies]
aterm-types = { workspace = true }
aterm-hash = { workspace = true }
# The index logs a one-time eviction warning so truncated results are observable.
aterm-log = { workspace = true }
aterm-grapheme = { workspace = true }
# Regex-mode search (`is_regex = true`).
aterm-regex = { workspace = true }
# Library dependency only under `spec-anchors` (the anchors emit
# `::aterm_spec::registry::submit!`).
aterm-spec = { workspace = true, optional = true }

[dev-dependencies]
# The spec anchors expand in the unit-test build; tests/conformance_streaming.rs
# drives the derived StreamingSearch model.
aterm-spec = { workspace = true }

[lints]
workspace = true

[[test]]
name = "search_suite"
path = "tests/search_suite.rs"

# Alone: installs a counting #[global_allocator] and asserts net heap bytes.
[[test]]
name = "index_release_memory"
path = "tests/index_release_memory.rs"

# Alone: installs a counting #[global_allocator] and asserts net heap bytes.
[[test]]
name = "index_column_map_memory"
path = "tests/index_column_map_memory.rs"
