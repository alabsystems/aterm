[package]
name = "aterm-search"
# Integration tests are modules of one suite binary, declared below; with
# autotests off a `tests/*.rs` file listed nowhere never compiles.
autotests = false
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Search primitives for aterm terminal content"

[package.metadata.aterm.test-inputs]
read-only = true
bounded = true
content-only = true
volatile-environment = []
paths = []

# Both current test targets read the monotonic clock for cost diagnostics. The
# clock and scheduler are not bounded runtime inputs, so neither may carry.
[package.metadata.aterm.test-inputs.targets.lib]
bounded = false

[package.metadata.aterm.test-inputs.targets."test:search_suite"]
bounded = false

[dependencies]
aterm-types = { workspace = true }
aterm-hash = { workspace = true }
# The index logs a one-time eviction warning so truncated results are observable.
aterm-log = { workspace = true }
aterm-grapheme = { workspace = true }
# Regex-mode search (`is_regex = true`).
aterm-regex = { workspace = true }

[dev-dependencies]
aterm-bench = { path = "../aterm-bench" }
# The seeded `XorShift` tests/search_vs_bruteforce.rs draws from.
aterm-spec = { workspace = true }
libc = { workspace = true }

[lints]
workspace = true

[[test]]
name = "search_suite"
path = "tests/search_suite.rs"
