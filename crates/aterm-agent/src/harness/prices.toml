# ---------------------------------------------------------------------------
# OpenAI, Standard tier. Prices and ids: https://developers.openai.com/api/docs/pricing
# (every gpt-5 and later row of the text-token table; gpt-5.3-codex from its
# "Specialized models" table). Older rows (gpt-4.x, the o-series, gpt-3.5) are
# not here: unpriced, never guessed. Not on the page: gpt-6-pro, which Codex
# 0.163.0 names, and three slugs of that build's model catalog, each hidden
# from its picker (`visibility: hide`): gpt-daybreak-blue-latest,
# gpt-daybreak-red-latest and codex-auto-review. No public price exists for
# them, so the Codex fold shows their tokens unpriced. A Codex build carries no
# price: `lab prices` checks these rows by id against its catalog (0.163.0: 8
# of its 11 slugs priced, those 3 not), and every row here was read off the
# page again on 2026-10-16, unchanged.
# "Short context: ≤272K input tokens. Long context: >272K input tokens." The
# page does not say how cached input counts toward it; OpenAI's own
# `input_tokens` include the cached ones, which is the prompt this table's
# rule counts. A "-" column (cache writes; cached input of the pro rows) is
# left out, and a "-" long-context column means no `long` table.
# ---------------------------------------------------------------------------

