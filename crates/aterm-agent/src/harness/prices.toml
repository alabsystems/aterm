#
# LIST PRICES, for the account stats' `≈$ (list)` figures
# (docs/DESIGN-account-stats-2026-10-15.md §3.6). Dollars per million tokens.
#
# Every row was read by a person from the vendor's PUBLIC pricing page on the
# date in `as_of`, and names that page in `source`; the model id itself is
# taken from the page named in `id_from`. Never copy a row from a vendor
# binary: the managed build's own catalog and the vendor's own per-process cost
# are checks, never sources.
#
# A model id that is not here is UNPRICED: its tokens are counted and shown,
# never priced at a guess. A class a page lists no price for ("-") is left out
# of its row, and a message with tokens in that class is unpriced too.
#
# Classes: `input`, `output`, `cache_read` (Anthropic's "cache hits and
# refreshes", OpenAI's "cached input"), `cache_write` (Anthropic's 5-minute
# cache writes, OpenAI's cache writes) and `cache_write_1h` (Anthropic's 1-hour
# cache writes). A `long` table prices a request whose prompt (input, cache
# reads and cache writes together) is over `over` tokens, as the page says.
# Fast mode, US-only inference, web search and the batch tier are not priced:
# the fold counts those messages as approximate.
#
# Change a row only from the page, and move `as_of` with it: the spend files
# priced by an older table are folded again from their transcripts.

format = 1
as_of = "2026-10-15"

