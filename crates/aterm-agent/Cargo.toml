[package]
name = "aterm-agent"
# Integration tests are declared at the end, not discovered: they are modules of
# the one `agent_suite` binary, except the two that count process-wide allocations.
# With autotests off, a `tests/*.rs` file listed nowhere never compiles.
autotests = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "aterm L2 — agent interface: the window harness's supervisor, its readings and the live upgrade, composed over the L0/L0.5 observation predicates"

[lints]
workspace = true

[features]
# DEVELOPMENT SEAMS in an optimized build: this crate's `aterm_types::dev_seam!`
# read (the live upgrade's settle, `ATERM_UPGRADE_QUIET_S`, which the live suite
# shortens). A debug build compiles it anyway; the release cutter never enables
# this (aterm's and aterm-gui's `dev-seams` forward here), so a shipped binary
# settles the full `upgrade::QUIET_S`.
dev-seams = []

[dependencies]
# The anchor attributes' registry (std-only): `#[cfg_attr(any(test, debug_assertions),
# aterm_spec_anchor::refines(…))]` expands in every test and debug build; release strips it.
aterm-spec-anchor = { workspace = true }
# Predicate constructors (idle/seq/block/row-match). Agent knowledge lives HERE;
# the engine core knows nothing of "a turn" or "a Claude prompt".
aterm-observe = { workspace = true }
# The one grammar of machine terms (`sys::predicate::AwaitSys`): a declared wake's
# `need=` and its `when=`'s machine atoms parse through `await sys`'s parser and
# are kept in its canonical spelling (`supervise::occupancy::wakes`). A pure model
# crate with no dependencies; not a new edge in the build graph (aterm-uds links it).
aterm-vitals = { workspace = true }
# The worker-phase reader and approval-box parser (`supervise::phase` and
# `supervise::prompt` re-export them), shared so the fabric bridge publishes
# `phase=` from the reader `aterm drive phase` prints.
aterm-phase = { workspace = true }
# The portable control-socket stream (std-only): `RelayClient`'s local-connect
# constructors talk raw control protocol over a `CtlStream`. No external deps.
aterm-uds = { workspace = true }
# The client's own discovery and connect (`fleet_sessions`, `local_instances`,
# `connect_then_read_token`) and its exit codes (`EXIT_REPLACED`), in process,
# so the fleet and drive surfaces depend on no shipped sibling binary.
aterm-ctl = { path = "../aterm-ctl" }
# SHA-256 for the approval ledger's command digests (`supervise::approvals`).
# `libc` is Unix-only at the call sites and supplies O_NOFOLLOW for private files.
aterm-digest = { workspace = true }
# The workspace's one hex codec (digests) and the
# control wire's one percent escape (`pct`, every `status`/`history` field the
# supervisor decodes). First-party; its one dependency is astream-wire
# (dependency-free, vendor/astream), for the CRC-32.
aterm-codec = { workspace = true }
# The fleet document from a URL (src/ai/fleet.rs): its HTTPS-only, size-capped fetch
# (`http::download_bytes`) and its Ed25519 check (`roster::verify_roster`), the verifier the
# updater's own roster uses. Already in the graph through atpkg.
aterm-update-core = { workspace = true }
# First-party HTTP/1.1 client for Codex's native OAuth token exchange/refresh and `/wham/usage`
# read (`src/harness/codex_app_login.rs`), avoiding any external `codex app-server` subprocess.
# Already in the shipped graph through `aterm-update-core` / `atpkg`.
aterm-http = { workspace = true }
# The fleet document's owner tools (`aterm ai fleet keygen|sign`): an Ed25519 keypair and a
# detached signature. The shipped binary already carries ring with these features (TLS).
ring = { workspace = true, features = ["alloc"] }
# The workspace's one FNV-1a/64 (the upgrade markers and still-prints, the bake
# cache's file names, a dialog's answer key). First-party; its one dependency
# is astream-wire (dependency-free, vendor/astream), whose byte loop it runs.
aterm-hash = { workspace = true }
libc = { workspace = true }
# How each write is finished: durable (F_FULLFSYNC) or ordered (F_BARRIERFSYNC).
aterm-durable = { workspace = true }
# The control protocol's shared halves, so the supervisor speaks the wire the
# server does instead of a copy of it: the verb table (`framing_of`, `spec`,
# the artifact-ack rule, `META_ATTENTION_KEYED_MAX`) and the ONE reader of a
# screen generation (`control_verbs::ScreenGen`), which decides whether a read's
# `gen` may go back as the `if-gen=` fence on a typed act — the fence a `key`
# or `send` carries. Plus the state/home directories and the RFC 3339 calendar.
# Not a new edge in the BUILD graph: `aterm-ctl` above already pulls aterm-types.
aterm-types = { workspace = true }
# The workspace's one epoch-clock read (`aterm_time::unix_secs` and kin).
aterm-time = { workspace = true }
# Claude Code's statusLine input and transcript usage rows.
aterm-json = { workspace = true }
# Selective transcript deserialization validates discarded tool payloads without
# constructing their Value trees. Already in aterm-json's shipped closure.
serde = { workspace = true, features = ["derive"] }
# The box escalation cuts the badge's line by terminal CELLS, not chars (a wide
# character is two): the workspace's own width tables, `char_width`. Not a new
# edge in the shipped graph — aterm-core already links it — and its one
# dependency, aterm-types, is already this crate's.
aterm-grapheme = { workspace = true }
# `aterm harness upgrade` reads another process's argv and environment (launch
# flags, tab id) through atpkg's KERN_PROCARGS2/procfs reader, finds the managed
# twin through the store layout, and heals the relaunched shell with atpkg's hook.
# No cycle: atpkg does not depend on aterm-agent.
atpkg = { workspace = true }
# The gone-checkout rule the disk watch shares with atpkg's build cache sweep.
aterm-toolchain = { workspace = true }
# `aterm harness upgrade` reads another process's working directory and
# executable in process (`process_cwd`, `process_path`: libproc on macOS,
# procfs on Linux; on Windows the working directory from the process
# environment block) instead of forking two `lsof`s per agent it inspects.
# Not a new edge in the shipped graph — aterm-gui already links it.
aterm-sysprobe = { workspace = true }
# The volume's lines (warning, floor, emergency, the room's bounds): one
# definition the disk watch and every tool that admits a disk need read
# (`aterm_capacity::floor`, docs/DESIGN-adaptive-build-2026-10-24.md CAP-1).
# Workspace crate over aterm-sysprobe, aterm-toolchain, aterm-json and
# aterm-time, which this crate links already.
aterm-capacity = { workspace = true }
# `aterm_primer::CLAUDE_TOP_EFFORT_KEY`: the one spelling of Claude Code's top-effort
# mode. The publication baseline bans the joined word in exported files, so the
# source spells it once, from parts, in the crate that writes the key.
aterm-primer = { workspace = true }
# aterm.toml's `[harness]` and `[disk]` tables
# (`supervise::SupervisorConfig::from_aterm_toml`, `harness::cli::disk_config_read`)
# go through the parser the GUI's Settings page uses, so the two cannot disagree.
aterm-toml = { workspace = true }
# The live upgrade's relaunch line re-keys an older shell (`upgrade::with_rekey`)
# with the text that lives beside the scripts that own those globals.
aterm-shell-integration = { workspace = true }
# The upgrade's words tests hand every arm to the exceptions door
# (`aterm_messages::exceptions::Entry::message`) the window's host hands them
# to. Not a new edge in the shipped graph — aterm-gui already links it — and
# its one dependency, aterm-time, is already this crate's.
aterm-messages = { workspace = true }

# Exclusive owned staging directories for atomic replacements; already a test dependency,
# first-party and zero dependencies. No new package or dependency cycle.
aterm-tempfile = { workspace = true }

# THE HARNESS TAPE (`supervise::tape`): a supervising loop recorded so it can be
# run again offline. Its records ARE astream-effects' `EffectRecord`s — the
# Effects rung's typed tape of every clock, file, reply door, output and raised
# flag a cooperative program crossed — so a replay feeds them back through the
# same crate's `ReplaySeam`, and nothing re-spells the record kinds. From
# `vendor/astream` (a git submodule pinned to one commit, as aterm-link's
# broker), zero dependencies of its own; the framing, the codec and the
# recovery are aterm's (the crate says recording never needs the wire frame).
astream-effects = { path = "../../vendor/astream/crates/astream-effects" }
# THE BOOT a count of the machine's sleep is on (`supervise::fx`'s `os_asleep`,
# `policy::sleeps::Boot`): `boot_session`, the kernel's boot id as 16 bytes,
# and `parse_boot_id`, astream's reader of its text (the UUID in either case;
# the all-zero id refused), which the ledger's and the tape's `boot` go
# through. The same reading aterm-link's broker opens its log in, so the
# supervisor and the bus name a boot one way. Zero dependencies; its two
# cordoned `unsafe` modules (astream claim `os.cordon`) are the owner-only file
# rule's (`geteuid`, and on Apple the ACL reads) and five Apple FFI calls:
# `fcntl` for the barrier, `fsync` for a test's plain flush (compiled only with
# debug assertions), `sysctlbyname` for the boot id, `poll` for a socket's
# hang-up, and `signal` for the `SIGHUP` handler only astream's revocation file
# installs, which aterm never does. This crate calls the boot readers and opens
# local account discovery files nonblocking, refusing final symlinks on Unix.
# Not a new edge in the shipped graph: aterm-durable links it on every target
# (its directory flush's classification, `dir_flush_unavailable`), and
# aterm-link on Unix; on Windows no `unsafe` of it is compiled.
astream-sys = { path = "../../vendor/astream/crates/astream-sys" }
# A tape's frames: LZ4 blocks for a frame that compression shrinks by an eighth
# or more, and each frame's xxh64. Both first-party and dependency-free, and
# neither a new edge in the shipped graph: aterm-scrollback's warm tier links
# aterm-lz4, atpkg links aterm-zstd.
aterm-lz4 = { workspace = true }
aterm-zstd = { workspace = true }
# The disk reclaim (`harness::disk::target`) reaches every profile, lock and
# cache of a build directory through directory handles it opened without
# following a link, and deletes with handle-relative calls — fd-relative `*at`
# calls on unix, NT relative opens and POSIX-semantics deletes held to each
# entry's listed identity on Windows — the crate that owns them (and their
# `unsafe`), so this one writes none. One edge on every target: the crate has
# a unix half and a Windows half under the same names (`disk_target::fd`), and
# its tests are cfg'd per half. Not a new package in the shipped graph on
# unix, where aterm-gui already links it; on Windows it is one, a workspace
# crate with no dependencies (its FFI is kernel32, ntdll and advapi32).
aterm-dirfd = { workspace = true }

[target.'cfg(unix)'.dependencies]
# `aterm fleet init|join|peers|allow|leave` (`fleet_member`): the fleet's key
# file, join code, book of peers and the join's handshake and registration. Not
# a new edge in the shipped graph — aterm-gui already links it — and unix-only,
# as the key file's reader is.
aterm-net = { workspace = true }
# The default ALab fleet's join code is read from and published to the signed
# vault without materializing it as a plaintext secret file.
aterm-secrets = { workspace = true }

[dev-dependencies]
aterm-spec = { workspace = true }
# The models its tests drive (a model edit rebuilds only their tests).
aterm-models-harness = { workspace = true }
# The upgrade tests' pseudo-terminals, both ends close-on-exec from birth
# (`open_pty_pair`): an `openpty(3)` pair is inheritable, and the shell spawned
# onto it kept a copy of its own master. No cycle (aterm-pty does not depend
# on aterm-agent).
aterm-pty = { workspace = true }
# The session log's `word=` vocabulary, which every act word a self-claim's
# act gets must hold (`harness::acts::self_claim_act`'s table test). No
# cycle: aterm-slog depends on neither aterm-agent nor anything above it.
aterm-slog = { workspace = true }

# ---- integration tests (autotests = false above) ----------------------------

[[test]]
name = "agent_suite"
path = "tests/agent_suite.rs"

# Alone: installs a #[global_allocator] and asserts process-wide byte counts.
[[test]]
name = "footer_window_allocations"
path = "tests/footer_window_allocations.rs"

# Alone: installs a #[global_allocator] and asserts process-wide allocation counts.
[[test]]
name = "transcript_allocations"
path = "tests/transcript_allocations.rs"

# Alone: counts large allocator requests while parsing composed profile secrets.
# Never inspects allocation payloads or uninitialized spare capacity.
[[test]]
name = "profile_sentinels"
path = "tests/profile_sentinels.rs"

# What the session log's step tap costs the footer thread (Phase 3B plan §9
# M1), run by hand (`targo --unverified bench -p aterm-agent --bench
# step_tap_cost`), never a gate.
[[bench]]
name = "step_tap_cost"
harness = false
