[package]
name = "aterm-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "aterm L2 — agent interface: turn-completion (idle ∧ prompt-ready) and the self-reflection feedback governor, composed over the L0/L0.5 observation predicates"

[lints]
workspace = true

# The AI-friendly drive CLI (the "sugar" interface over the core `await`/`send`
# primitives). The library is the reusable Turn/SelfGovernor API.
[[bin]]
name = "aterm-drive"
path = "src/bin/aterm-drive.rs"

# The fleet-federation bridge: merge every live session's `subscribe events` into
# one astream-subject-addressed stream, and dispatch commands back to the fleet.
[[bin]]
name = "aterm-fleet"
path = "src/bin/aterm-fleet.rs"

[dependencies]
# Predicate constructors (idle/seq/block/row-match). Agent knowledge lives HERE;
# the engine core knows nothing of "a turn" or "a Claude prompt".
aterm-observe = { workspace = true }
# The worker-phase reader and the approval-box parser (`supervise::phase`,
# `supervise::prompt` are re-exports of it). A crate of its own since round 13
# so the fabric bridge publishes `phase=` from the SAME reader `aterm drive
# phase` prints. No dependencies.
aterm-phase = { workspace = true }
# The portable control-socket stream (std-only): `RelayClient`'s local-connect /
# `dial` constructors talk raw control protocol over a `CtlStream`. No external deps.
aterm-uds = { workspace = true }
# `aterm fleet status|manage|...` is a one-binary in-process client of the
# embedded operator. The legacy federation modes still launch per-instance
# streamers, but the operator surface must not depend on a shipped sibling.
aterm-ctl = { path = "../aterm-ctl" }
# The operator WAL uses the workspace's audited SHA-256 implementation for
# independently checksummed frames. `libc` is Unix-only at the call sites and
# supplies O_NOFOLLOW/O_DIRECTORY for private state and WAL admission.
aterm-digest = { workspace = true }
libc = { workspace = true }
# The ONE identity token the alignment tuple is keyed by: `APP_VERSION`, which
# design §3.1 of the wrapper defines as what `aterm --version` prints after the
# `aterm ` prefix. Not a new edge in the BUILD graph — `aterm-ctl` above already
# pulls aterm-types — and the alternative was guessing the token or inventing an
# environment variable to carry it, either of which would key a cached probe
# verdict by a string nothing measured.
aterm-types = { workspace = true }
# The harness core reads two JSON shapes Claude Code writes (the statusLine
# input and the transcript's usage rows) through the workspace's own parser.
# A leaf: its one dependency is `serde`, already in the shipped graph.
aterm-json = { workspace = true }
# THE launch-nonce reader. `turn id=<epoch>:<producer>:<seq>` is parsed
# server-side by `LaunchNonce::from_hex(epoch)?`, and a harness that mints an
# `<epoch>` the server cannot parse types nothing at all — so the fence on a
# typed act asks the SAME reader rather than re-deriving "32 lowercase hex".
# Already in this crate's dev graph and in the lock; a leaf pair
# (aterm-pty + aterm-uds) with no third-party package behind it, and no cycle:
# aterm-session does not depend on aterm-agent.
aterm-session = { workspace = true }

[dev-dependencies]
aterm-spec = { workspace = true }
# The E2E loopback-TLS remote-Turn test drives a real `dial_and_relay` bridge and a
# channel-bound capability. Transport-only test deps; no cycle (aterm-net ⊄ aterm-agent).
aterm-net = { workspace = true }
