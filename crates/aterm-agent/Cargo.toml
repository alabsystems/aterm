[package]
name = "aterm-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "aterm L2 — agent interface: turn-completion (idle ∧ prompt-ready) and the self-reflection feedback governor, composed over the L0/L0.5 observation predicates"

[lints]
workspace = true

# The AI-friendly drive CLI (the "sugar" interface over the core `await`/`send`
# primitives). The library is the reusable Turn/SelfGovernor API.
[[bin]]
name = "aterm-drive"
path = "src/bin/aterm-drive.rs"

# The fleet-federation bridge: merge every live session's `subscribe events` into
# one astream-subject-addressed stream, and dispatch commands back to the fleet.
[[bin]]
name = "aterm-fleet"
path = "src/bin/aterm-fleet.rs"

[features]
# Compile this crate's source↔spec anchors into the LIBRARY, for a
# downstream test binary that collects them via `inventory` (aterm-gui's
# `spec_xref_closure` gate): `#[refines]` on the live upgrade's ladder (its
# gate, its rung, the repaint-proof settle's look and the Codex daemon's pin,
# machine `HarnessUpgradeLadder`) and its goal pause (the pause's step, its
# owed resume and the daemon's turn, `HarnessUpgradeGoalPause`), on the
# Claude Code footer's reader
# (`ClaudeFooterModel`) and on the Codex rate-limit nudge's deciders
# (`SupervisorCodexRateNudge`), each machine's other actions waived by name.
# OFF by default: the shipped build carries no `aterm-spec` and no probe.
# This crate's own test build expands the anchors through `cfg(test)`, and
# its integration tests through the dev edge on itself below.
spec-anchors = ["dep:aterm-spec"]

[dependencies]
# Optional: pulled into the LIBRARY only by the off-by-default `spec-anchors`
# feature (the anchor macros emit `::aterm_spec::inventory::submit!`).
aterm-spec = { workspace = true, optional = true }
# Predicate constructors (idle/seq/block/row-match). Agent knowledge lives HERE;
# the engine core knows nothing of "a turn" or "a Claude prompt".
aterm-observe = { workspace = true }
# The worker-phase reader and the approval-box parser (`supervise::phase`,
# `supervise::prompt` are re-exports of it). A crate of its own since round 13
# so the fabric bridge publishes `phase=` from the SAME reader `aterm drive
# phase` prints. No dependencies.
aterm-phase = { workspace = true }
# The portable control-socket stream (std-only): `RelayClient`'s local-connect /
# `dial` constructors talk raw control protocol over a `CtlStream`. No external deps.
aterm-uds = { workspace = true }
# `aterm fleet status|manage|...` is a one-binary in-process client of the
# embedded operator. The legacy federation modes still launch per-instance
# streamers, but the operator surface must not depend on a shipped sibling.
aterm-ctl = { path = "../aterm-ctl" }
# The operator WAL uses the workspace's audited SHA-256 implementation for
# independently checksummed frames. `libc` is Unix-only at the call sites and
# supplies O_NOFOLLOW/O_DIRECTORY for private state and WAL admission.
aterm-digest = { workspace = true }
libc = { workspace = true }
# The control protocol's shared halves, so the supervisor speaks the wire the
# server does instead of a copy of it: the verb table (`framing_of`, `spec`,
# the artifact-ack rule, `META_ATTENTION_KEYED_MAX`) and the ONE reader of a
# screen generation (`control_verbs::ScreenGen`), which decides whether a read's
# `gen` may go back as the `if-gen=` fence on a typed act — the fence a `key`
# or `send` carries. Plus the state/home directories and the RFC 3339 calendar.
# Not a new edge in the BUILD graph: `aterm-ctl` above already pulls aterm-types.
aterm-types = { workspace = true }
# The harness core reads two JSON shapes Claude Code writes (the statusLine
# input and the transcript's usage rows) through the workspace's own parser.
# A leaf: its one dependency is `serde`, already in the shipped graph.
aterm-json = { workspace = true }
# Selective transcript deserialization validates discarded tool payloads without
# constructing their Value trees. Already in aterm-json's shipped closure.
serde = { workspace = true }
# The box escalation cuts the badge's line by terminal CELLS, not chars (a wide
# character is two): the workspace's own width tables, `char_width`. Not a new
# edge in the shipped graph — aterm-core already links it — and its one
# dependency, aterm-types, is already this crate's.
aterm-grapheme = { workspace = true }
# `aterm harness upgrade` reads another process's argv and environment (the
# launch flags a resume must carry, the tab id the process was started in)
# through atpkg's one KERN_PROCARGS2 / procfs reader, finds the managed twin
# through the store layout, and heals the relaunched shell with the hook atpkg
# writes. No cycle: atpkg depends on no aterm-agent; aterm-cli and aterm-gui,
# this crate's two binary consumers, already link it.
atpkg = { workspace = true }
# The ONE spelling of Claude Code's top-effort mode, `aterm_primer::CLAUDE_TOP_EFFORT_KEY`
# (its settings key and the name `/effort` and the footer's effort results use): the
# footer reads that name as `xhigh`. The publication baseline bans the word, joined,
# in every exported file, so the source spells it once, from parts, in the crate that
# writes the key. Not a new edge in the shipped graph — atpkg above already depends on
# it — and aterm-primer is a std-only leaf with no dependencies of its own.
aterm-primer = { workspace = true }
# The harness's master switch (`harness.enabled`) and `disk.apply` are read out
# of aterm.toml with the SAME parser the GUI's Settings page seeds from, so the
# switch cannot read OFF on the glass and ON here (`harness::cli::toml_bool`).
# Not a new edge in the shipped graph — atpkg above already depends on it — and
# its one dependency is `serde`.
aterm-toml = { workspace = true }
# The live upgrade's relaunch line re-keys a shell spawned before the re-key
# channel (`upgrade::with_rekey`): the text that sets the globals a script signs
# its marks with lives beside the scripts, which own those names. Not a new edge
# in the shipped graph — aterm-core links it into both binaries — and its own
# dependencies (aterm-digest, aterm-uds) are already this crate's.
aterm-shell-integration = { workspace = true }

[target.'cfg(unix)'.dependencies]
# The disk reclaim (`harness::disk::target`) reaches every profile, lock and
# cache of a build directory through directory handles it opened without
# following a symlink, and deletes an idle profile's `incremental/` with the
# fd-relative `*at` calls — the crate that owns them (and their `unsafe`), so
# this one writes none. Not a new edge in the shipped graph: aterm-gui already
# links it, under the same `cfg(unix)`. Unix-only, like the crate itself
# (`#![cfg(unix)]`) and its one user here (`disk_target::fd`); elsewhere the
# reclaim refuses. Declared for every target, it pulled aterm-dirfd into the
# Windows cells' graph, whose test-target pass then compiled its Unix-only
# differential oracle (`tests/oracle.rs`) for Windows — 135 errors per cell.
aterm-dirfd = { workspace = true }

[dev-dependencies]
aterm-spec = { workspace = true }
# This crate's INTEGRATION tests link the library with its source↔spec
# anchors on (`spec-anchors`), so a Tier-1 bind in `tests/` (the footer's
# `conformance_footer_model`, the Codex nudge's
# `supervise_conformance_codex_rate_nudge`) sees its machine's anchors and
# proves each one ENTERED — the unit-test build expands them through
# `cfg(test)` already. A dev edge: `cargo build -p aterm` never follows it,
# so the shipped library carries no aterm-spec and no probe (as aterm-gpu's
# own `wgpu-oracle` edge).
aterm-agent = { path = ".", features = ["spec-anchors"] }
# The loopback-TLS remote-Turn test mints its capability's `EdgeToken`. Test-only:
# the library names nothing from aterm-session. No cycle (aterm-session does not
# depend on aterm-agent).
aterm-session = { workspace = true }
# The E2E loopback-TLS remote-Turn test drives a real `dial_and_relay_pinned` bridge and a
# channel-bound capability. Transport-only test deps; no cycle (aterm-net ⊄ aterm-agent).
aterm-net = { workspace = true }
