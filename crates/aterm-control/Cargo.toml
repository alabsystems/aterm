[package]
name = "aterm-control"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "aterm control verbs parameterized over a SessionHost — the headless half of the control protocol (no winit, no GUI)"

[lints]
workspace = true

[dependencies]
# The engine the verbs read and mutate. Every item used here is unconditional
# (no feature gate), so a consumer's feature selection cannot change this crate.
aterm-core = { workspace = true }
# The wire's percent escape (`wire::pct_*` re-export it): its one copy lives in
# this leaf (std plus the dependency-free astream-wire, no platform code) so
# clients that cannot link this crate share it.
# Already in the graph through aterm-core.
aterm-codec = { workspace = true }
# The request grammar (`control_request`): a roster id is addressable exactly
# when the wire reads it as a stable id. Already in the graph through aterm-core.
aterm-types = { workspace = true }
# `hangup`: whether the client of the connection a lane serves has closed it
# (a zero-timeout poll). Dependency-free, and already in the GUI's graph.
aterm-uds = { workspace = true }

[dev-dependencies]
# A real JSON reader for the tests that read a reply back (`blocks --json`'s
# escaped cwd decodes to the bytes the program sent). Workspace crate; serde is
# its one dependency, already in the graph.
aterm-json = { workspace = true }
# The hang detector `park`'s and `conformance`'s tests wait under. Already a
# dev-dependency of the crates above this one.
aterm-spec = { workspace = true }
