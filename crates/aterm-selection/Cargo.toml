[package]
name = "aterm-selection"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Smart semantic selection and text selection state machines for terminal text"

[package.metadata.aterm.test-inputs]
read-only = true
bounded = true
content-only = true
volatile-environment = []
paths = []

# This target's tiered conformance test launches the Trust `ty` checker when
# the release verifier enables spec checkers; that transitive tool is unbounded.
[package.metadata.aterm.test-inputs.targets."test:conformance_text_selection"]
bounded = false

[dependencies]
aterm-grapheme = { workspace = true }
aterm-types = { workspace = true }
# The first-party regular-expression engine (bounded Pike VM). Selection rules
# are regexes — the eleven built-ins in `builtin_patterns.rs` plus user-defined
# custom rules — so this crate is the engine's largest syntax consumer.
aterm-regex = { workspace = true }
# The anchor attributes' registry (std-only): `#[cfg_attr(any(test, debug_assertions),
# aterm_spec_anchor::refines(…))]` expands in every test and debug build; release strips it.
aterm-spec-anchor = { workspace = true }

[dev-dependencies]
# The anchors under a plain test run, and the TextSelectionLifecycle model the
# Tier-1 conformance drives.
aterm-spec = { workspace = true }
# The models its tests drive (a model edit rebuilds only their tests).
aterm-models-core = { workspace = true }

[lints]
workspace = true
