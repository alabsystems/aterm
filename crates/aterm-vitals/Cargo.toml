[package]
name = "aterm-vitals"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "aterm's system-awareness model: what the machine, aterm and each tab are doing (per-core load with momentum and variance, GPU, memory, disk, scope attribution) and the words every surface prints. Pure: no clock, no platform, no dependencies; the host feeds it samples from aterm-sysprobe."

[dependencies]
# None: a pure model. The host (aterm-gui's vitals_host) reads the machine
# through aterm-sysprobe and hands this crate plain numbers.

[dev-dependencies]
# The stuck verdict's Tier-1 conformance (tests/conformance_stuck_verdict.rs)
# replays the engine against its model.
aterm-models-misc.workspace = true
aterm-spec.workspace = true

[lints]
workspace = true
