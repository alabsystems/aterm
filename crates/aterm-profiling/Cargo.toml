[package]
# `[patch.crates-io]` matches on package name, so this must be called
# `profiling`; the directory keeps the `aterm-` prefix so it reads as ours
# (precedent: crates/aterm-tracing).
name = "profiling"
# A semver contract with wgpu/wgpu-core/wgpu-hal (`profiling = "1.0.1"`, so
# ^1.0.1), not an aterm release number; outside that range cargo rejects the
# patch.
version = "1.0.18"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "First-party no-op `profiling` shim for aterm (replaces the profiling crate behind wgpu / wgpu-core / wgpu-hal)"

[dependencies]
# None on purpose: keeping crates.io profilers out of the graph is the point.

[features]
# Upstream's feature names, with no effect. aterm enables none of them, but a
# missing name some dependency asks for is a resolve error, so all are
# declared. None may ever gain a `dep:`. `default` is empty (upstream:
# `["procmacros"]`) because this crate has no attribute macros; see src/lib.rs.
default = []
procmacros = []
profile-with-optick = []
profile-with-puffin = []
profile-with-superluminal = []
profile-with-tracing = []
profile-with-tracy = []
type-check = []

[lints]
workspace = true

[lib]
# No unit tests in src/; doctests still run.
test = false
