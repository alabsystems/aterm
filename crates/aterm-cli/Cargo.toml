[package]
name = "aterm-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "aterm — the transparent session: runs your shell unchanged, byte for byte, through the protected spawn seam. The live model an AI reads is WINDOW mode; a session's own VT model is demand-driven and off by default (U1)."

[dependencies]
aterm-core = { workspace = true }
# P0: the daily-driver CLI runs the shell through the PROTECTED spawn seam
# (cap-gated + setrlimit-bounded + fail-closed fork/exec + OS-sandbox-wrapped when
# the mode demands it), exactly like aterm-gui — not raw forkpty/execvp.
aterm-pty = { workspace = true }
aterm-cap = { workspace = true, features = ["launcher-mint"] }
aterm-sandbox = { workspace = true }
aterm-containment = { workspace = true }
# Read-only introspection sources for the `aterm` diagnostic subcommands
# (CLI-DIAG): font enumeration / face metrics for `list-fonts` / `show-face`
# (aterm-render), and the built-in colour-scheme registry for `list-themes`
# (aterm-types). Neither is on the shell hot path — they are only reached by a
# diagnostic subcommand that prints and exits before any PTY spawn.
aterm-render = { workspace = true }
aterm-types = { workspace = true }
# The workspace's one lock-scoped process-environment helper (`aterm_log::env`):
# `--containment` hands its selection to the init funnel through the env var that
# funnel reads, and every mutation in the workspace routes through that helper
# rather than a raw `set_var`. Dependency-free leaf, already linked transitively.
aterm-log = { workspace = true }
# `aterm agents`: the coding-agent primer installer. Its own std-only crate so the
# GUI (auto-prime on every session) and this CLI verb drive ONE installer.
aterm-primer = { workspace = true }
# `aterm --version` names WHICH COPY of aterm is running (S12 of
# docs/DESIGN-which-copy-runs-2026-08-27.md): the running bundle's path and, per other
# aterm.app in the usual places, the one "another copy: …" sentence — spelled by the
# updater's own `which_copy` module so About and --version cannot drift. Reached only
# by the print-and-exit path, never the shell hot path; the one binary links the
# updater already.
aterm-update = { workspace = true }

# The POSIX console driver (driver_unix.rs: termios raw mode + poll(2) loop);
# the Windows driver is kernel32 console FFI with no libc.
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
# TEST ONLY. `manual.rs` documents atpkg's verbs, and the prose gate in its
# test module pins what the manual PRESCRIBES against `atpkg::dispatch_roster()`
# — the dispatch table itself. Not a runtime dependency: the router composes
# these crates, aterm-cli does not call atpkg.
atpkg = { workspace = true }
