[package]
name = "aterm-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "aterm — the transparent session: runs your shell unchanged, byte for byte, through the protected spawn seam. The live model an AI reads is WINDOW mode; a session models nothing (U1)."

[dependencies]
# P0: the daily-driver CLI runs the shell through the PROTECTED spawn seam
# (cap-gated + fail-closed fork/exec + OS-sandbox-wrapped when the mode demands
# it + resource-bounded in the confinement modes only, safety/containment — see
# `session_limits` in lib.rs), exactly like aterm-gui — not raw forkpty/execvp.
aterm-pty = { workspace = true }
aterm-cap = { workspace = true, features = ["launcher-mint"] }
aterm-sandbox = { workspace = true }
aterm-containment = { workspace = true }
# Read-only introspection sources for the `aterm` diagnostic subcommands
# (CLI-DIAG): font enumeration / face metrics for `list-fonts` / `show-face`
# (aterm-render), and the built-in colour-scheme registry for `list-themes`
# (aterm-types). Neither is on the shell hot path — they are only reached by a
# diagnostic subcommand that prints and exits before any PTY spawn.
aterm-render = { workspace = true }
aterm-types = { workspace = true }
# `aterm help rust` calls the REAL toolchain discovery (`atpkg::toolchain`) rather
# than restating it. The one `aterm` binary links atpkg already.
atpkg = { workspace = true }
# `aterm agents`: the coding-agent primer installer. Its own std-only crate so the
# GUI (auto-prime on every session) and this CLI verb drive ONE installer.
aterm-primer = { workspace = true }
# `aterm --version` names WHICH COPY of aterm is running (S12 of
# docs/DESIGN-which-copy-runs-2026-08-27.md): the running bundle's path and, per other
# aterm.app in the usual places, the one "another copy: …" sentence — spelled by the
# updater's own `which_copy` module so About and --version cannot drift. Reached only
# by the print-and-exit path, never the shell hot path; the one binary links the
# updater already.
aterm-update = { workspace = true }
# `aterm list-kitty-commands` and `aterm help kitty` print the kitty-command
# vocabulary FROM the table the typed-line listener compiles (aterm-lexicon's
# `tricks` module), so the listing cannot drift from the words that fire. Pure
# data and a fold: reached only by those two print-and-exit paths, never the shell
# hot path, and the one binary links the lexicon already (through the window).
aterm-lexicon = { workspace = true }
# `aterm doctor`'s `instances:` row: the aterm windows and headless instances no
# control socket reaches, counted by aterm-ctl's census over the SAME rendezvous walk
# `aterm ctl instances`/`ls`/`windows` make, so the doctor and the client cannot
# disagree about what is reachable. Reached only by that print-and-exit path; the
# one binary links aterm-ctl already, and it brings only aterm-types and aterm-uds.
aterm-ctl = { path = "../aterm-ctl" }
# `aterm exceptions` and `aterm doctor`'s `exceptions:` row: what needs a look but not
# now, read from `messages.log` with NO window running, decoded and replayed by the
# SAME engine the window loads its log with (`LogLine::decode`, `MessageLog::replay_all`)
# and worded by its pure `exceptions_report`, so the terminal, Settings ▸ Messages and
# `aterm ctl messages need=later` cannot disagree. Reached only by those print-and-exit
# paths; the one binary links it already (through aterm-render and the window).
aterm-messages = { workspace = true }
# `aterm_uds::spawnfd::command`: the `Command` every child here is built with, so
# none inherits a descriptor of this process above stdio (`tools/grep_guard.sh`
# B27), and on Windows a caller with no console gives it a WINDOWLESS console,
# where a bare console child opened a visible one (measured 2026-09-30; B28). A
# dependency-free leaf the one binary links already.
aterm-uds = { workspace = true }
# aterm.toml, read through the parser the window loads the file with: on Windows
# for `shell` (`aterm doctor` / `show-config` report the shell the WINDOW will
# spawn), and for `[privacy] observer`, which `aterm doctor`'s `devtools:` row
# honours as the window's Developer Tools row does (debugger design §9.1 O11).
# First-party, and already in this binary's graph (aterm-containment and
# aterm-update link it), so it adds no package; a hand-rolled line scan would be
# the second parser of one file.
aterm-toml = { workspace = true }

# The POSIX console driver (driver_unix.rs: termios raw mode + poll(2) loop);
# the Windows driver is kernel32 console FFI with no libc.
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
# The tests' scratch-directory stamp: the workspace's one epoch-clock read, already
# in the graph via aterm-types.
aterm-time = { workspace = true }
