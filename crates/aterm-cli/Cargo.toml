[package]
name = "aterm-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "aterm — the transparent session: runs your shell unchanged, byte for byte, through the protected spawn seam. The live model an AI reads is WINDOW mode; a session models nothing (U1)."

[features]
# Development seams in an optimized build, forwarded from aterm's `dev-seams`:
# the amacs terminal face's (`amacs-term`).
dev-seams = ["amacs-term/dev-seams"]

[dependencies]
# Protected PTY spawn seam (cap-gated, fail-closed, sandbox-wrapped).
aterm-pty = { workspace = true }
aterm-cap = { workspace = true, features = ["launcher-mint"] }
aterm-sandbox = { workspace = true }
aterm-containment = { workspace = true }
# Font/face and built-in theme introspection for diagnostic subcommands.
aterm-render = { workspace = true }
aterm-types = { workspace = true }
# `aterm theme pack | install`: the community theme pack, embedded (no network).
aterm-theme-pack = { workspace = true }
# `aterm help rust` calls `atpkg::toolchain` discovery rather than restating it.
atpkg = { workspace = true }
# `aterm help agh`: the manual is generated from agh's verb and exit tables.
agh = { workspace = true }
# `aterm doctor`'s rows are converge items (docs/DESIGN-init-system-2026-10-20.md S5);
# `crates/aterm` composes them with atpkg's.
aterm-converge = { workspace = true }
# `aterm agents`: the primer installer, shared with the GUI's auto-prime.
aterm-primer = { workspace = true }
# `aterm --version` bundle path and duplicate-install reporting (`which_copy`).
aterm-update = { workspace = true }
# Canonical update setting labels for `aterm help update`.
aterm-update-core = { workspace = true }
# Kitty-command vocabulary table for `aterm list-kitty-commands` and `aterm help kitty`.
aterm-lexicon = { workspace = true }
# Control-socket instance discovery for `aterm doctor`.
aterm-ctl = { path = "../aterm-ctl" }
# Offline `messages.log` reader for `aterm exceptions` and `aterm doctor`.
aterm-messages = { workspace = true }
# `aterm_uds::spawnfd::command` child-process builder.
aterm-uds = { workspace = true }
# `aterm.toml` parser for `aterm doctor` and `show-config`.
aterm-toml = { workspace = true }
# `aterm help sys` reads THIS machine at the moment of the call (its OS and CPU
# words, the cluster layout, memory and swap, the GPU, the load and the home
# volume) through the readers the window's sampler calls, so the page never
# states a remembered fact. First-party, std plus libc, and already in this
# binary's graph through the window.
aterm-sysprobe = { workspace = true }

# `aterm theme check --format json` and `aterm theme schema`: the documents an agent
# reads, built and printed by the workspace's one JSON crate (first-party; the one
# binary links it already through the window).
aterm-json = { workspace = true }

# `aterm edit` and the `amacs` argv0 alias: the amacs program (its face
# decision, and the client that hands a file to the window hosting the tab).
# First-party; the one binary links aterm-ctl and amacs already.
amacs-term = { workspace = true }

# driver_unix.rs: termios raw mode and a poll(2) loop. The Windows driver is kernel32 FFI.
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }
# `aterm_link::fabric::doctor_summary` probe for `aterm doctor`.
aterm-link = { path = "../aterm-link" }

# The Mac setup doctor's typed, per-key preference backups reuse the machine
# provisioning library's plist codec.
[target.'cfg(target_os = "macos")'.dependencies]
aterm-machines = { workspace = true }
aterm-secrets = { workspace = true }
aterm-digest = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
# `plain_durable_flushes_in_tests!`: the doctor's journal tests make thousands of
# durable flushes, which this test binary takes as plain `fsync(2)`s.
aterm-durable = { workspace = true }
aterm-tempfile = { workspace = true }
# The tests' scratch-directory stamp (the workspace's one epoch-clock read).
aterm-time = { workspace = true }
# `aterm_spec::host::could_not_run`: a test this host cannot run (as root, no
# zsh, no font) ends COULD NOT RUN, never a silent pass; and
# `wait::past_text_busy`: the shim tests exec files they just wrote while sibling
# test threads fork (Linux's ETXTBSY).
aterm-spec = { workspace = true }
