[package]
name = "aterm-alloc"
# Integration tests are declared below, not discovered: the files are modules of
# one suite binary where they can share a process. With autotests off a
# `tests/*.rs` file listed nowhere never compiles.
autotests = false
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Inline-optimized collections for aterm: SmallVec + ArrayVec with zero external deps"

[package.metadata.aterm.test-inputs]
read-only = true
bounded = true
content-only = true
volatile-environment = []
paths = []

[package.metadata.aterm.test-inputs.targets."test:alloc_suite"]
bounded = false

[dependencies]
# None — `#![no_std]`, core + alloc only

[[test]]
name = "alloc_suite"
path = "tests/alloc_suite.rs"

[lints]
workspace = true
