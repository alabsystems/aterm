[package]
name = "aterm-alloc"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Inline-optimized collections for aterm: SmallVec + ArrayVec with zero external deps"

[dependencies]
# None — `#![no_std]`, core + alloc only

[dev-dependencies]
# THE DIFFERENTIAL ORACLE for `ArrayVec` — the real crates.io `arrayvec`,
# a dev-dependency so it is invisible to the shipped graph, exactly as
# aterm-digest keeps sha2/hmac and aterm-toml keeps toml/toml_edit.
# `tests/arrayvec_differential.rs` runs both types through the same operation
# scripts and asserts they agree.
#
# IT LIVES ON THIS PACKAGE, NOT ON THE `arrayvec` SHIM, and both halves of that
# are measured rather than preferred:
#
#   * NOT ON THE SHIM, because a dev-dep on the registry `arrayvec` declared by
#     the package that is itself named `arrayvec` makes `cargo test -p arrayvec`
#     fail with "specification `arrayvec` is ambiguous" — cargo cannot tell the
#     member from the registry copy. Declared here it does not: probed both
#     ways in this worktree. The subject under test is `aterm_alloc::ArrayVec`
#     either way; the shim contains no code.
#   * `=0.7.7`, NOT a caret requirement, because `[patch.crates-io] arrayvec =
#     { path = "crates/aterm-arrayvec" }` captures dev edges too: any
#     requirement the shim satisfies resolves AT the shim, and every assertion
#     below would compare it with itself. Measured in a probe workspace — with
#     the patch row live, a dev-dep on `arrayvec 0.7.6` resolved to
#     `path+…/shim`. A `=` requirement the shim cannot satisfy is what keeps the
#     oracle real, and `tests/arrayvec_differential.rs` re-checks the oracle's
#     identity at runtime rather than trusting this comment.
#   * `=0.7.7` and not `=0.7.8`, and this is the half that had to be MEASURED
#     rather than reasoned about. The pin does not merely add a node: it forces
#     a real `0.7.x` into the graph, and cargo then satisfies the six consumers'
#     `^0.7.x` from that same node rather than carrying two semver-compatible
#     copies. Pinned at `=0.7.8` against a shim declaring 0.7.6, that is exactly
#     what happened — `cargo tree -p aterm -e normal -i arrayvec` printed
#     `arrayvec v0.7.8` with NO path under naga, the patch row did nothing, and
#     cargo warned about none of it. So the oracle's pin must sit BELOW the
#     shim's version (0.7.8), not above it.
#
# 0.7.7 costs nothing in fidelity against the 0.7.8 it replaces: `diff -r` over
# the two extracted `src/` trees is EMPTY — the crates are byte-identical there,
# and the release differs only outside `src/`. The oracle stays in Cargo.lock as
# a dev-only node, exactly as aterm-digest keeps sha2/hmac and aterm-toml keeps
# toml/toml_edit; it is invisible to the shipped graph, which is what
# `cargo forge survey` measures.
arrayvec_upstream = { package = "arrayvec", version = "=0.7.7" }
# THE SHIM ITSELF, on the same package, and this edge is what lets
# `targo test -p aterm-alloc -p <anything that reaches wgpu or naga>` resolve
# (2026-09-25). Without it that selection died with "failed to select a
# version for `arrayvec` … all possible versions conflict with previously
# selected packages", while `--workspace` resolved fine. The root cause is
# cargo's resolver, read in targo's copy of it
# (core/resolver/context.rs `flag_activated`) and reproduced in a four-crate
# probe with stock cargo 1.95 too:
#
#   * when a package is FIRST activated through a dependency whose source
#     differs from its own — a crates-io `arrayvec ^0.7` answered by the
#     `[patch.crates-io]` path shim — cargo also claims the (arrayvec, 0.7,
#     crates-io) activation slot for it, so that a patch cannot smuggle a
#     second semver-compatible "crates.io" copy into the graph;
#   * the oracle's registry `=0.7.7` sits in exactly that slot, so whichever
#     comes second is refused as a semver duplicate;
#   * a package already activated through its OWN source takes the early
#     "already active" path and never claims the alias slot. `--workspace`
#     makes the shim a ROOT, activated before any crates-io edge reaches it;
#     a narrowed `-p` set without the shim reaches it first through naga or
#     wgpu, and conflicts.
#
# This path edge makes every selection that holds the oracle activate the shim
# through its own source first: a root's dependencies are resolved before any
# deeper frame's (the resolver drains frames oldest-first among equally
# constrained ones, and both edges here have one candidate). It is load-bearing
# in the test too — `tests/arrayvec_differential.rs` checks that the shim's
# `ArrayVec` IS this crate's, the type-level half of "the patch row points at
# our code". A dev-dependency cycle (the shim depends on this crate) is one
# cargo permits; it adds nothing to the shipped graph.
arrayvec_shim = { package = "arrayvec", path = "../aterm-arrayvec" }

[lints]
workspace = true
