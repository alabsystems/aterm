[package]
name = "aterm-cg"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "aterm's CoreGraphics declarations (active displays, bounds, modes; CGImage layout reads) for the windowing backend and the GUI's window capture, held to the SDK headers."

# ZERO third-party dependencies, like aterm-objc, which it builds on. Its own
# crate rather than a feature of aterm-objc: CoreGraphics is a GUI framework
# whose link is not dead-stripped, so only the binaries that link the windowing
# backend (crates/aterm-window) or the GUI (crates/aterm-gui, whose AppKit links
# CoreGraphics already) may load it. A feature was unified into every binary of
# a build that also compiled winit, and forked aterm-objc between `-p` and
# `--workspace` selections.
autotests = false

[lints]
workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
aterm-objc = { workspace = true }

[dev-dependencies]
# The SDK probe's scratch directories (`tests/cg_sdk.rs`, through aterm-objc's
# shared `sdk_consts`), removed on drop.
aterm-tempfile = { workspace = true }

# Every CoreGraphics declaration held to the SDK headers by clang, both arches,
# with aterm-objc's shared declaration probe.
[[test]]
name = "cg_sdk"
path = "tests/cg_sdk.rs"
