[package]
name = "aterm-gui-documents"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "aterm-gui's document models, below the window: the Markdown reader's model, and amacs's editor engine (the rope, the document store and the reducer) re-exported under their old module names. No App, window or event loop; aterm-gui re-exports them under those names."

[dependencies]
# amacs, the editor engine: its reducer, store and rope moved there, and this
# crate re-exports them under their old module names
# (docs/DESIGN-amacs-2026-10-19.md §3).
amacs = { workspace = true }

[dev-dependencies]
# The Markdown reader's Tier-1 binds to its derived models.
aterm-spec = { workspace = true }
aterm-models-native = { workspace = true }

[lints]
workspace = true
