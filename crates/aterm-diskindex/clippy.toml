#
# Workspace disallowed methods and types. Sanctioned call sites annotate the
# single statement or item with `#[expect(clippy::disallowed_methods, reason = "…")]`
# (or `disallowed_types`), never an entire module or function.
#
# A crate that keeps its own clippy.toml lints by that file alone (clippy reads only the
# nearest), so that file repeats these rows word for word: every row of std and core, and
# every row of a crate it names or depends on. Census guard `clippy-mirror` fails a file
# that leaves one out.
#
# Policy summary:
# * **Flock release**: `flock` locks an open file description across `fork` /
#   `posix_spawn`; take locks only through guards that call `File::unlock`
#   (`LOCK_UN`) before closing (`HeldAdvisoryLock`, `lock::Flock`, `FileLock`).
# * **Fsync tier**: `File::sync_all` / `sync_data` issue `F_FULLFSYNC` on Apple
#   targets; use `aterm-durable` (`durable` vs `ordered` `F_BARRIERFSYNC`). A
#   plain flush is `aterm_durable::primitive::fsync` (any descriptor), never
#   `libc::fsync` / `fdatasync`: astream-sys counts and times only its own calls
#   (`flush_tally`, `flush_times`), and calls `fsync` through its own FFI, never
#   libc's, so no sanctioned site of these rows exists.
# * **Confined shell**: spawn shells and open PTYs via `aterm-pty`, never raw
#   `forkpty`/`openpty`/`execvp`.
# * **No core-dump abort**: use `aterm_uds::process::kill_self_now()` (`SIGKILL`)
#   instead of `abort()` / `raise()` so macOS does not raise crash-report dialogs.
# * **Child processes**: construct children with `aterm_uds::spawnfd::command`
#   (closing non-stdio descriptors and setting Windows console flags), never
#   bare `std::process::Command::new` or direct `creation_flags`.
# * **Kept-out pipes**: make a pipe with `aterm_uds::pipe`, which makes both ends
#   close-on-exec and marks them `FD_CLOFORK` under the spawn lock (`aterm_uds::kept_out`). A
#   `libc::pipe` end has neither flag, `pipe2` sets close-on-exec alone, and Apple's std pipe is
#   flagged only after `pipe(2)`: a fork or spawn on another thread copies the end, and its
#   reader waits for an EOF that never comes (aterm-gui's handoff_progress read `EAGAIN` where
#   it expected EOF, its write end held by a sibling test's child). A deliberate bare pipe (a
#   capability probe that needs one unmarked) says why on its one statement.
# * **Accepted socket mode**: accept TCP and Unix-domain connections through
#   `aterm_uds::accept`, with both its wait and its stream mode stated. BSD inherits
#   `O_NONBLOCK` from a listener while Linux does not, so a raw accepted stream has
#   platform- and listener-dependent read semantics.
# * **The exec gate**: on macOS an `execve` waits, with no way to end the wait, for every other
#   thread of its process, and a `kern.proc` read waits the same way on any process in exec, so
#   a process that replaces itself over its own read never finishes.
#   Replace the process through `aterm_uds::spawnfd`'s `exec`, which closes
#   `aterm_sysprobe::exec_gate` first and refuses where it does not close. An exec in a forked
#   child has one thread and says so on its one statement.
# * **Checked Objective-C sends**: use `aterm_objc::checked_msg` rather than
#   unchecked `aterm_objc::msg`.
# * **Window & event loop doors**: build event loops via
#   `driver_event_loop_builder`, launch windows via `crates/aterm`'s
#   `run_window`, and restrict macOS TCC prompts to the approved setup revision's
#   steps and the owner's own presses.
# * **Stable spellings**: the foreign cells (`verify cells`) build with stock
#   stable Rust, where `Option::map_or_default` and `Result::map_or_default` are
#   unstable; spell `.map(..).unwrap_or_default()`.
# * **A wait that wakes**: a thread that waits for another's progress sleeps on its wake (a
#   `Condvar`, a channel, aterm-gui's registered `pause_for_handover`, or a bounded sleep slice
#   where std has no timed wait), never on `std::thread::yield_now`: on macOS a yield while other
#   work is runnable sets the thread aside for a whole 10 ms scheduling quantum. A test's poll
#   pauses with `aterm_uds::deadline::poll_yield`; any other yield says why it waits for nobody.
#   The row sees only a yield spelled in this workspace: std's channels yield inside themselves
#   (`sync::mpmc::utils::Backoff::spin_heavy`) when a receive meets a send part-way through its
#   slot, so a thread that must not lose a quantum receives from a queue that never waits on a
#   sender (aterm-window's `macos-proxy-queue`), each such receive audited where it is.
# * **A granted pool**: size a thread pool with `aterm_cores::available_parallelism`, never
#   `std::thread::available_parallelism`: it is std's answer bounded by the cores aterm-verify
#   grants a test binary (`ATERM_TEST_CORES`), so a test's pool, and an `aterm` a test boots,
#   stays within what its binary is charged (ATERM-KI-1103-3). With nothing granted it is
#   std's answer exactly. A reading of the machine itself (not a pool) says so on its statement.
# * **Strict Ed25519**: ring's verifier takes a small-order key (the identity's
#   one signature verifies every message); verify Ed25519 with
#   `astream_aead::signature::verify`, which refuses it. ring's
#   `UnparsedPublicKey` stays for another algorithm (ECDSA, RSA), for the static
#   bootstrap verifier and for aterm-secrets' test oracle (`ed25519::ring_takes`,
#   which shows a refused forgery is one ring alone takes), each on its one statement.
# * **One owner act**: an owner's word to a shared file's outbox (a write, a requeue, a drop)
#   needs an `aterm_file::OwnerAct`, and only an explicit verb of `aterm file`, an `aterm goals`
#   claim or done of a package named on its command line, or a rename of this Mac asked for by
#   name, makes one (docs/DESIGN-shared-files-2026-11-11.md §5, "In Rust"). Harness and observer
#   code states its own Mac's row (`File::state_mine`). Each sanctioned call names its verb on
#   its one statement: `OwnerAct::verb` in aterm-db's `file::write::run` and in aterm-file's
#   `outbox drop`; `file::write::verb`, the wrapper every write verb runs through, in `aterm
#   file`'s own entry (`file::command::main_entry`), in `file::rename`, the one door a rename
#   of this Mac asked for by name takes, and in `file::yield_held`, the one door its held name
#   write gives way to the registry's value through; and `file::write::set_seen`, the same
#   wrapper for a `set` at the snapshot revision its caller read, in `aterm goals`' claim and
#   done (`lab::tracker::command`); aterm-agent's `machine_name::registry`
#   alone runs both (`aterm name nick|set|undo`, Rename This Mac…). `owner_act_for_test` is for tests
#   only, each crate's one helper. The publisher's verbs (`File::claim`, `mark_done`, `dequeue`) settle
#   or remove a queued intent, so only aterm-db's `file::publish` calls them.
