[package]
name = "aterm-pty"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "aterm's single PTY spawn + IO seam (ATERM_DESIGN WS-G): all raw libc forkpty/read/write/ioctl contained in one auditable place."

[features]
# Development seams (`aterm_types::dev_seam!`: `ATERM_PTY_IDLE_POLL_US`, Windows'
# `ATERM_TRACE_BOOST`) in an optimized build; debug builds always have them. Releases
# never enable it.
dev-seams = []

[dependencies]
aterm-cap = { workspace = true }
aterm-sandbox = { workspace = true }
# `domain::is_ai_env_key`: the env deny-list applied parent-side before the fork.
aterm-types = { workspace = true }
# The anchor attributes' registry (std-only): `#[cfg_attr(any(test, debug_assertions),
# aterm_spec_anchor::refines(…))]` expands in every test and debug build; release strips it.
aterm-spec-anchor = { workspace = true }

# The Windows backend calls kernel32 directly and needs no libc.
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }
# The child's inheritance strip (`spawnfd::InheritStrip`).
aterm-uds = { workspace = true }

# Tests mint a root `Authority`; `launcher-mint` makes it nameable in this crate's test
# build only. The production seam receives its `Cap`s by argument.
[dev-dependencies]
aterm-cap = { workspace = true, features = ["launcher-mint"] }
# `aterm_spec::host::could_not_run` (a host that cannot run a test, the Windows smoke
# included) and `aterm_spec::wait::within`, the hang detector for must-happen waits.
aterm-spec = { workspace = true }

[target.'cfg(unix)'.dev-dependencies]
# Exclusive ownership of shell resolver fixture directories.
aterm-tempfile = { workspace = true }
# The sandbox-wrap enforcement tests reuse the policy crate's base profile.
aterm-containment = { workspace = true }
# `spawn_locale_model` conformance check (`unix_tests::spawn_locale_conformance_child_always_utf8_ctype`).
aterm-models-session = { workspace = true }

[lints]
workspace = true

# The Windows tests' stand-ins (dev-only, never shipped; plain programs off
# Windows): the console clients `aterm.exe` serves, for a test binary that has
# none beside it, and a GUI-subsystem program, which never connects to its
# console (`tests/windows_openconsole.rs`).
[[bin]]
name = "aterm-pty-console-client"
path = "src/bin/console_client.rs"
test = false

[[bin]]
name = "aterm-pty-gui-standin"
path = "src/bin/gui_standin.rs"
test = false
