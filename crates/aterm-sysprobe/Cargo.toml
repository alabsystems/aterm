[package]
name = "aterm-sysprobe"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "aterm's in-process readers of another process (working directory, executable, process-group footprint) and of the machine's memory (physical, available and in use, pressure level, swap rate). Every platform cfg of those readers lives here; it holds no timer and no thread."

# The macOS arm: libproc, `sysctlbyname` and Mach host statistics (declared in
# the first-party `libc`, each with its oracle row). No other platform links
# anything: the Linux arm reads `/proc` through std alone (bounded 4 KiB reads;
# the page size from `/proc/self/auxv`).
[target.'cfg(target_os = "macos")'.dependencies]
libc = { workspace = true }

[lints]
workspace = true
