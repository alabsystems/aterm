[package]
name = "aterm-sysprobe"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "aterm's in-process readers of another process (working directory, executable, process-group footprint), of the machine (per-core CPU ticks and the cluster layout, memory by page class, swap, pressure, the GPU's device-wide use) and of its volumes (the mount table, one volume's free space). Every platform cfg of those readers lives here; it holds no timer and no thread."

# The macOS arm: libproc, `sysctlbyname`, Mach host and processor statistics
# and `statfs` (declared in the first-party `libc`, each with its oracle row),
# `getfsstat`, and the IORegistry through IOKit and CoreFoundation (declared in
# `src/iokit.rs`, held to the SDK by `tests/iokit_sdk.rs`). The Linux arm reads
# `/proc` and `/sys` through std (bounded reads; the page size from
# `/proc/self/auxv`) and a volume's free space by `statvfs`.
[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
libc = { workspace = true }

# Scratch directories removed on drop: the Linux readers' fixture roots
# (`src/tests.rs`) and the shared SDK probe's (`tests/iokit_sdk.rs`, through
# aterm-objc's `sdk_consts`, mounted by path). Workspace crate, std-only.
[dev-dependencies]
aterm-tempfile = { workspace = true }

[lints]
workspace = true
