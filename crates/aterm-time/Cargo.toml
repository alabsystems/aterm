[package]
name = "aterm-time"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "aterm's portable clock: exactly `std::time` on every target that has one (a re-export, byte-identical), a performance.now()/Date.now() shim on wasm32-unknown-unknown where std's clock panics."

# Native has no dependencies: the crate is `pub use std::time::…` there.
[dependencies]

# The browser clocks are JS functions, reached through the wasm-bindgen the
# wasm frontends (aterm-wasm, aterm-gpu-web) link, pinned to their exact
# version because the generated glue and the CLI must agree. Only
# wasm32-unknown-unknown: wasm32-wasip1 and wasm32-unknown-emscripten have a
# working `std::time` and take the native arm.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
wasm-bindgen = "=0.2.108"

[lints]
workspace = true
