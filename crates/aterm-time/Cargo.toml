[package]
name = "aterm-time"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "aterm's portable clock: `std::time` where it exists, a performance.now()/Date.now() shim on wasm32-unknown-unknown over clocks the wasm module links in."

# No dependencies on any target. Natively the crate is `pub use
# std::time::…`. On wasm32-unknown-unknown the two browser clocks are link-time
# symbols that the wasm module defines from its own JS bindings with
# `aterm_time::wasm_clock_host!` (src/lib.rs).
