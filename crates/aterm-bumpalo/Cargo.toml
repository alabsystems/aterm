[package]
# `[patch.crates-io]` matches on PACKAGE name, so this must be called
# `bumpalo`; the directory keeps the `aterm-` prefix so it reads as ours
# (precedent: crates/aterm-document-features, another proc-macro-side facade).
name = "bumpalo"
# A SEMVER CONTRACT with wasm-bindgen-macro-support 0.2.108 (`bumpalo =
# "3.0.0"`, so ^3.0.0), its only consumer in the lock, not an aterm release
# number. 3.20.3 is what the lock held and upstream's latest, so no registry
# 3.x in the graph can outrank the shim.
version = "3.20.3"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "First-party `Bump::new` + `alloc_str` for aterm (replaces the bumpalo arena behind wasm-bindgen's macro)"

[lib]
name = "bumpalo"
path = "src/lib.rs"
# No unit tests live in src/; tests/ holds the contract.
test = false

[dependencies]
# None: upstream's optional allocator-api2 and serde edges have no consumer.

[features]
# Upstream's feature names, with no effect: the one consumer takes the default
# set. None may ever gain a `dep:`; an API they gate upstream (`collections`,
# `boxed`, `allocator_api`) is absent here, so a consumer that needs it fails
# to compile rather than run on a stand-in.
default = []
allocator_api = []
bench_allocator_api = []
boxed = []
collections = []
serde = []
std = []

[lints]
workspace = true
