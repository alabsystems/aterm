[package]
name = "aterm-policy"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "OSC / escape-sequence policy engine data model and built-in profiles"

[features]
default = []
# Optional TOML serialization (`serde/derive` + `aterm-toml`), off by default
# so the default library closure stays proc-macro-free (Trust PM-1).
toml = ["dep:aterm-toml", "dep:serde", "serde/derive"]

[dependencies]
serde = { workspace = true, optional = true }
aterm-toml = { workspace = true, optional = true }
# std's Instant on native; the JS clock on wasm32, where std's panics.
aterm-time = { workspace = true }

[dev-dependencies]
# The unit tests and tests/serde_corpus.rs round-trip policies through TOML.
aterm-policy = { path = ".", features = ["toml"] }

[lints]
workspace = true
