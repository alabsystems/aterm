[package]
# THE DIRECTORY AND THE PACKAGE NAME DIFFER ON PURPOSE, as with
# crates/aterm-cfg-if, crates/aterm-getrandom and crates/aterm-smallvec:
# `[patch.crates-io]` matches on PACKAGE name, so the package must be called
# `rustix` to take the four `^0.38` edges; the directory keeps the `aterm-`
# prefix, and says `compat`, so nobody mistakes it for a vendored upstream or
# for rustix 1.x, a separate registry package in the same Linux graph.
name = "rustix"
# NOT `version.workspace = true`: a SEMVER CONTRACT with the consumers.
# calloop 0.13.0 asks `^0.38`, calloop-wayland-source 0.3.0 and
# crates/aterm-window (the absorbed winit, package `winit`) `^0.38.4`,
# smithay-client-toolkit 0.19.2 `^0.38.15`; 0.38.44 is what the lock held. It
# must stay >= every other `0.38.x` in the graph, or cargo resolves the
# registry copy and the patch row replaces nothing with no warning
# (`targo --unverified forge check` [OB-12] says so). rustix 1.x is another
# major: the row does not reach it, and it stays a registry package.
version = "0.38.44"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "First-party `rustix` 0.38 for aterm (the calls calloop, sctk and aterm-window make, over aterm-libc on Linux; replaces the crates.io rustix 0.38)"

[lib]
name = "rustix"
path = "src/lib.rs"
# No unit tests: they live in tests/.
test = false

[features]
# Upstream's feature table, declared (a `[patch]` target must accept every
# feature its consumers ask for) and INERT: every module below is compiled
# whatever is on. Resolved on linux (`targo tree --target
# x86_64-unknown-linux-gnu -e features -i rustix@0.38.44`): default, std,
# alloc, libc-extra-traits, use-libc-auxv, event, fs, pipe, shm, process,
# system and thread. `libc-extra-traits` stays inert too: upstream's is
# `libc?/extra_traits`, weak on a libc dependency its Linux backend never turns
# on, so libc's Linux feature set (default, std) is what it was before the swap.
default = ["std", "use-libc-auxv"]
std = ["alloc", "libc-extra-traits"]
alloc = []
libc-extra-traits = []
use-libc-auxv = []
use-explicitly-provided-auxv = []
use-libc = ["libc-extra-traits"]
all-apis = ["event", "fs", "io_uring", "mm", "mount", "net", "param", "pipe", "process", "procfs", "pty", "rand", "runtime", "shm", "stdio", "system", "termios", "thread", "time"]
cc = []
event = []
fs = []
io_uring = ["event", "fs", "net"]
linux_4_11 = []
linux_latest = ["linux_4_11"]
mm = []
mount = []
net = []
param = ["fs"]
pipe = []
process = []
procfs = ["fs"]
pty = ["fs"]
rand = []
runtime = []
rustc-dep-of-std = []
shm = ["fs"]
stdio = []
system = []
termios = []
thread = []
time = []
try_close = []

# The syscall layer aterm already owns. Only Linux: every consumer is a Linux
# windowing crate, and elsewhere this crate is empty.
[target.'cfg(target_os = "linux")'.dependencies]
libc = { workspace = true }

# THE ORACLE, Linux only. rustix 0.38 cannot be one: the patch row would capture
# it and the tests would compare this crate with itself ([OB-15]). rustix 1.1.4
# makes the same calls, is pinned exactly to the copy the shipped Linux graph
# already holds (x11rb, wayland-*, softbuffer, polling, gethostname, zbus and
# the async-* crates), and escapes the row because `^1` does not match 0.38.44.
# It goes when this crate does (LW.7).
[target.'cfg(target_os = "linux")'.dev-dependencies]
rustix1 = { package = "rustix", version = "=1.1.4", default-features = false, features = ["std", "event", "fs", "pipe", "process", "shm", "system", "thread"] }

[lints]
workspace = true
