[package]
name = "aterm-spec-closure"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "The source-spec closure over every anchored crate, and spec-check, the Trust checkers' run over every registered model"
# The integration test is its own [[test]] below.
autotests = false

[dependencies]
aterm-spec.workspace = true
# The spec-check binary borrows auxiliary worker tokens from its caller's existing pool.
aterm-capacity.workspace = true
# `link_all`: every domain crate's models, registered in the binary that calls it.
aterm-models = { path = "../aterm-models" }

[dev-dependencies]
aterm-tempfile.workspace = true
# The source-spec closure (`tests/spec_xref_closure.rs`) links every anchored crate, so the
# registry holds every anchor, waiver and model in one binary. Test-only: nothing ships this
# crate, and no library depends on it. Being every anchored crate's dependent is also what
# brings the closure into `verify`'s change cone for a change to any of them. It is this
# crate's alone: aterm-models' sweeps (`non_vacuity`, `derived_ring_ty`) read the models and
# no anchored source, and are not rebuilt or rerun for such a change.
agh.workspace = true
aterm-agent.workspace = true
aterm-cli = { path = "../aterm-cli" }
aterm-core.workspace = true
aterm-db.workspace = true
aterm-db-core.workspace = true
aterm-effects.workspace = true
aterm-gpu.workspace = true
aterm-grid.workspace = true
aterm-gui = { path = "../aterm-gui" }
aterm-keeper.workspace = true
aterm-mesh.workspace = true
aterm-pty.workspace = true
aterm-render.workspace = true
aterm-restore.workspace = true
aterm-sandbox.workspace = true
aterm-search.workspace = true
aterm-secrets.workspace = true
aterm-selection.workspace = true
aterm-session.workspace = true
aterm-types.workspace = true
aterm-update.workspace = true
aterm-update-core.workspace = true

# Unix only, as the closure's `aterm_vz` items are (`#[cfg(unix)]`): its guest agent's library
# is Linux's and the macOS seam's, and builds on no Windows host.
[target.'cfg(unix)'.dev-dependencies]
aterm-vz.workspace = true

[lints]
workspace = true

# The checker run (`aterm_spec::check`): the obligations only `ty` and `ay` discharge, over
# every registered model, run on purpose. Dev-only; nothing ships it.
[[bin]]
name = "spec-check"
path = "src/bin/spec-check.rs"
# Its unit tests exercise worker admission without invoking checker tools.
test = true

# The toolchain-free source-spec closure over every anchored crate.
[[test]]
name = "spec_xref_closure"
path = "tests/spec_xref_closure.rs"
