[package]
name = "aterm-sandbox"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Resource sandbox for spawned children (ATERM_DESIGN WS-G): POSIX rlimits applied before exec, gated on an aterm-cap capability."

[dependencies]
aterm-cap = { workspace = true }
# The anchor attributes' registry (std-only): `#[cfg_attr(any(test, debug_assertions),
# aterm_spec_anchor::refines(…))]` expands in every test and debug build; release strips it.
aterm-spec-anchor = { workspace = true }

# POSIX-only: the setrlimit actuator (src/unix.rs). The Windows actuator is a
# documented, capability-gated no-op (src/windows.rs) with zero FFI.
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
aterm-models-core = { workspace = true }
# Test-only: sandbox tests mint a root `Authority`; `launcher-mint` makes the sealed
# mint nameable for this crate's own test build. The production `apply`/`restore`
# seam receives a `Cap<Sandbox>` by argument and never mints.
aterm-cap = { workspace = true, features = ["launcher-mint"] }

[lints]
workspace = true
