[package]
name = "aterm-sandbox"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Resource sandbox for spawned children (ATERM_DESIGN WS-G): POSIX rlimits applied before exec, gated on an aterm-cap capability."

[features]
default = []
# Compiles the `#[refines]` anchors binding `Limits::apply` to `Sandbox.tla`.
# Off by default, so production builds carry no `aterm-spec`; the workspace
# `spec_xref_closure` gate (aterm-gui's test build) enables it.
spec-anchors = ["dep:aterm-spec"]

[dependencies]
aterm-cap = { workspace = true }
# Only for `spec-anchors`.
aterm-spec = { workspace = true, optional = true }

# POSIX-only: the setrlimit actuator (src/unix.rs). The Windows actuator is a
# documented, capability-gated no-op (src/windows.rs) with zero FFI.
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
# The `#[refines]` anchor on `Limits::apply` compiles in the crate's own test
# build (`cfg(test)`), so the test build names `aterm_spec`.
aterm-spec = { workspace = true }
# Test-only: sandbox tests mint a root `Authority`; `launcher-mint` makes the sealed
# mint nameable for this crate's own test build. The production `apply`/`restore`
# seam receives a `Cap<Sandbox>` by argument and never mints. See aterm-cap's
# tests/mint_reachability.rs gate.
aterm-cap = { workspace = true, features = ["launcher-mint"] }

[lints]
workspace = true
