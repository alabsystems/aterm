[package]
name = "aterm-signin-window"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "aterm's sign-in window: one web page in a small window of aterm's own, with a website data store per account, driven over standard input and output by the sign-in that opened it."

[dependencies]
# The wire's lines (`wire`), on every platform.
aterm-json = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
aterm-objc = { workspace = true }
# AppKit's and WebKit's classes, loaded when the window is made.
aterm-macos-ui = { workspace = true }

[lints]
workspace = true
