[package]
name = "aterm-seal"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Generated-file seals: the digest line a generator stamps on what it writes, and its check"

[dependencies]
# The FNV-1a/64 offset and prime the seal's digest folds with (astream-wire's, its one
# dependency). A leaf of its own, so the generators and the lab's exports that stamp a seal
# depend on it alone and not on the census that checks it.
aterm-hash = { workspace = true }

[lints]
workspace = true
