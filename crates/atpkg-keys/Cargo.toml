[package]
name = "atpkg-keys"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "aterm — OWNER-side Ed25519 signing for atpkg manifests (provisioning + detached sign over exact raw bytes). Produces signatures the verify-only atpkg client accepts; never shipped to clients."

[lib]
path = "src/lib.rs"
# The pinned custom `trust` toolchain (rust-toolchain.toml) ships no rustdoc, and a
# linked custom toolchain cannot `rustup component add` one — so `cargo test`'s
# doc-test phase aborts the whole run on this tree even with every real test green.
# Same constraint (and comment) as crates/atpkg: bare `cargo test` must be able to pass.
doctest = false

[[bin]]
name = "atpkg-keys"
path = "src/main.rs"

[dependencies]
# Producer-side: the FULL ring crate (RNG for keygen + the signing op). The CLIENT
# (atpkg) deliberately uses `default-features = false` (verify-only, no RNG/alloc); this
# tool is owner-only and never shipped, so it carries the full crate. At/above the
# deny.toml ring floor, so no ban is tripped.
ring = "0.17.14"
# Encode the 32-byte raw public key (for PINNED_PKG_ROOTKEY / the index release_key_pubkey).
# Standard padded Base64 — first-party, zero-dependency, and held byte-identical
# to the retired `base64` package's `general_purpose::STANDARD` engine by
# `crates/aterm-codec/tests/base64_oracle.rs`. `decode_strict` is the entry
# point every trust path uses: canonical padding REQUIRED and no trailing bits,
# so a pinned key has exactly one spelling.
aterm-codec = { workspace = true }
# The MACHINE ROSTER type + its client verifier. The minting tool emits the roster through
# the very same `Roster` struct the updater parses, so producer and client cannot drift on
# what a valid roster is — the same reason the release manifest is a shared serde type.
aterm-update-core = { workspace = true }
# RFC3339 formatting for `added_at` / `valid_until` (`aterm_types::rfc3339`), already in
# the graph via aterm-update-core.
aterm-types = { workspace = true }
# The master is read from /dev/tty with ECHO off (`tcgetattr`/`tcsetattr`), kept out of
# swap best-effort (`mlock`), and protected from core dumps (`setrlimit(RLIMIT_CORE, 0)`).
# Four narrow syscalls with no safe std wrapper; POSIX-only, like the rest of this tool.
libc = { workspace = true }

[dev-dependencies]
# Prove the producer↔client contract: sign here, verify + INSTALL with the ACTUAL client.
atpkg = { path = "../atpkg" }
# The owner→client integration test builds a real `.tar.zst` to drive the client install.
zstd = { workspace = true }

[lints]
workspace = true
