[package]
name = "atpkg-keys"
# Integration tests are declared, not discovered: every file is a module of the one
# `keys_suite` binary, so a `tests/*.rs` file listed nowhere never compiles.
autotests = false
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "aterm — OWNER-side Ed25519 signing for atpkg manifests (provisioning + detached sign over exact raw bytes), distributed as a separate managed release-host tool."

[package.metadata.atpkg]
expose = ["atpkg-keys"]
build-args = ["--locked", "-p", "atpkg-keys", "--bin", "atpkg-keys"]

# What a build of aterm main is held to before the tip lane (`atpkg-publish lane run tip`)
# stages atpkg-keys and moves its pin; this package's list is read ahead of the workspace's.
# The source step runs in the frozen checkout, the build is the pack itself (`build-args`
# above), and the packed step runs the packed binary from a scratch directory outside the
# checkout, so its signed fixture travels in the step: the manifest of atpkg-keys 105144
# and the roster that authorized its signer, byte for byte as published on alabsystems/aterm
# (`atpkg-atpkg-keys-105144`, `atpkg-index-149`), checked under the paper master of
# crates/aterm-update-core/src/pins.rs. The roster is valid until 9999 and names no machine
# expiry, and the master is an argument, so the fixture does not age out.
[[package.metadata.atpkg.qualify]]
name = "tests"
stage = "source"
run = ["targo", "--unverified", "test", "--locked", "-p", "atpkg-keys"]
within-secs = 1800
min-tests = 100

[[package.metadata.atpkg.qualify]]
name = "build"
stage = "build"
within-secs = 3600

# The published manifest verifies as machine m22 under roster seq 5, and a copy with one
# field changed under the same signature is refused.
[[package.metadata.atpkg.qualify]]
name = "verify-signed"
stage = "packed"
run = ["/bin/sh", "-c", '''
set -u
PATH=/usr/bin:/bin; export PATH
d=$(mktemp -d) || exit 1; trap 'rm -rf "$d"' EXIT; cd "$d" || exit 1
verify() { env -i PATH=/usr/bin:/bin HOME="$d" "{bin}/atpkg-keys" verify-signed \
  DtiLfpk0iUSrK1/LkyIVf+4C2eGjD2Myf4Sr/FCoMPQ= "$1" "$1.sig" roster.toml roster.toml.sig \
  >out 2>err </dev/null; }
cat > roster.toml <<'EOF'
schema = 1
roster_seq = 5
valid_until = "9999-12-31T00:00:00Z"
revoked = []

[[machine]]
id = "incumbent-head"
pubkey = "cw5gIGYQzX6xrhTXjXU9nYfLWeoIkiZ1yUX7d1wmdz8="
added_at = "2026-08-15T21:55:04Z"

[[machine]]
id = "m3"
pubkey = "YOHw0OoefQ79NdE8qsQFobIMR7QXChpreYBi2Of74Uo="
added_at = "2026-08-15T21:55:04Z"

[[machine]]
id = "m2"
pubkey = "vwy2UpnNw2R8nTAsb+eTlC9p2RZmvBITgUnXWGIk5J8="
added_at = "2026-08-16T23:29:37Z"

[[machine]]
id = "m22"
pubkey = "woDdkghTGzQBIJWwja4jCWYo+k8NJV8Eg92KPxMHkys="
added_at = "2026-08-21T19:45:42Z"

[[machine]]
id = "m23"
pubkey = "vCP3MSvEwdoHlmv/nLAf/7KirCUOVF06hHldokrvDGs="
added_at = "2026-10-20T00:48:15Z"
EOF
printf %s 'Fg0EPzhWaOw0s0DA/3SMvvyLgT5MqYVXZ9Bo5dIWpvl7Y4RbGYtMcUVV5QY7ll0BFEqZdxRTiwJABYfE/MSWDQ==' \
  | base64 -d > roster.toml.sig || exit 1
cat > manifest.toml <<'EOF'
# Generated by atpkg-publish — DO NOT edit (the signature covers the exact bytes).
schema = 1
program = "atpkg-keys"
version = "0.0.0"
build_number = 105144
exposes = ["atpkg-keys"]

[[artifact]]
target = "aarch64-apple-darwin"
kind = "binary"
protocol = "github-release"
asset = "atpkg-keys-105144.tar.zst"
sha256 = "421ba58c7d8e9b03ef5a1e477b0eb36d358e4f16f82a95ac4fc01ec858308544"
tree_root = "6962ca6c89fd6f92bebc724590001582fd6d8548cae21a3da3339bfc12a341bb"
size = 3020647
[artifact.cost]
download_bytes = 3020647
disk_installed = 6796088
build_seconds = 0
[artifact.provenance]
compiler_release = "1.101.0-dev"
compiler_commit = "29ebb403de7a102850d6cb10a62d5cc3baf723ed"
compiler_trust = "0.12.0+g29ebb403d"
compiler_host = "aarch64-apple-darwin"
trustc_sha256 = "0acc4862fe98d55f71585dd2e651ad166ce789f049d77b78dfe3d11112889c34"
targo_sha256 = "e8592cdacfbd112d38a6f338665c0e130fb10e9fe67c1c0e031acb50bd32fb2a"
driver_sha256 = "3966ffe983822848115d0482f79acc19b30df5c809d317730ad97ee905a0d04b"
lineage = "lineage"
lineage_receipt_sha256 = "4cd1415f6a19170ee60a26f5fdb2e799e3fc2dbfc939caff1c64a83fa554c620"
ddc_seed_relation = "lineage-disjoint"
scan_objects = "1"
scan_findings = "0"
EOF
printf %s 'oEfYpxXhi8FXvxY1QDe2C77JlG2+HP+mIKCaAY4GDANoyu/grPGRUNN0zxs4zqGvI9LRQGOr7i0QeWKMg8oNAw==' \
  | base64 -d > manifest.toml.sig || exit 1
verify manifest.toml; rc=$?
if [ "$rc" -ne 0 ] || [ "$(cat out)" != "OK: signed by machine m22 under roster seq 5" ]; then
  echo "the published manifest did not verify (exit $rc)" >&2; cat out err >&2; exit 1
fi
sed 's/^build_number = 105144$/build_number = 105145/' manifest.toml > tampered.toml || exit 1
cp manifest.toml.sig tampered.toml.sig || exit 1
if cmp -s manifest.toml tampered.toml; then echo "the tampered copy is unchanged" >&2; exit 1; fi
verify tampered.toml; rc=$?
if [ "$rc" -ne 1 ] || ! grep -q '^atpkg-keys: FAIL: ' err; then
  echo "a tampered copy was not refused (exit $rc)" >&2; cat out err >&2; exit 1
fi
echo "verify-signed: the published manifest verifies as m22 under roster seq 5; a tampered copy FAILs"
''']
within-secs = 120

[lib]
path = "src/lib.rs"

[[bin]]
name = "atpkg-keys"
path = "src/main.rs"
# A shim over the library with no unit tests; the integration tests still get the binary.
test = false

[dependencies]
# The full ring crate (RNG for keygen, the signing op). The client, atpkg, is verify-only
# (`default-features = false`); this owner tool ships separately, never in the client. At or above the
# deny.toml ring floor.
ring = { workspace = true, features = ["default"] }
# Encode the 32-byte raw public keys of the paper master and the machine keys (the pins.rs
# anchor, the roster entries).
# Standard padded Base64 — first-party; its one dependency is astream-wire
# (dependency-free, vendor/astream). `decode_strict` is
# the entry point every trust path uses: canonical padding REQUIRED and no
# trailing bits, so a pinned key has exactly one spelling.
aterm-codec = { workspace = true }
# The roster type and its client verifier: the tool emits the roster through the same
# `Roster` the updater parses, so producer and client cannot drift.
aterm-update-core = { workspace = true }
# RFC3339 timestamps (`aterm_types::rfc3339`), already in the graph via aterm-update-core.
aterm-types = { workspace = true }
# The binary's mint clock (`aterm_time::unix_secs`), already in the graph via aterm-types.
aterm-time = { workspace = true }
# The master is kept out of swap best-effort (`mlock`/`munlock`) and out of core dumps
# (`setrlimit`): syscalls with no safe std wrapper; POSIX-only, like the rest of this tool.
libc = { workspace = true }
# The master phrase's one store, the vault: its grammar, the registry read (else the
# `paper-master` need) and the admin publish that keeps a new one (`aterm_secrets::paper_master`).
aterm-secrets = { workspace = true }
# How each write is finished: durable (F_FULLFSYNC) or ordered (F_BARRIERFSYNC).
aterm-durable = { workspace = true }

[dev-dependencies]
# The producer-client contract: sign here, verify and install with the actual client.
atpkg = { path = "../atpkg" }
# Binds the real roster redo/snapshot-CAS transaction to the derived model aterm-spec proves.
aterm-spec = { workspace = true }
# The models its tests drive (a model edit rebuilds only their tests).
aterm-models-release = { workspace = true }
# owner_to_client builds a real `.tar.zst` for the client install: one raw-block zstd frame
# from the first-party writer (docs/AUDIT-third-party-2026-10-15.md ZC.3).
aterm-zstd = { workspace = true }
# Fixture directories removed on drop.
aterm-tempfile = { workspace = true }

[lints]
workspace = true

[[test]]
name = "keys_suite"
path = "tests/keys_suite.rs"
