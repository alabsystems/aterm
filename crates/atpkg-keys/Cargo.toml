[package]
name = "atpkg-keys"
# Integration tests are declared, not discovered: every file is a module of the one
# `keys_suite` binary, so a `tests/*.rs` file listed nowhere never compiles.
autotests = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "aterm — OWNER-side Ed25519 signing for atpkg manifests (provisioning + detached sign over exact raw bytes). Produces signatures the verify-only atpkg client accepts; never shipped to clients."

[lib]
path = "src/lib.rs"

[[bin]]
name = "atpkg-keys"
path = "src/main.rs"
# A shim over the library with no unit tests; the integration tests still get the binary.
test = false

[dependencies]
# The full ring crate (RNG for keygen, the signing op). The client, atpkg, is verify-only
# (`default-features = false`); this owner-only tool is never shipped. At or above the
# deny.toml ring floor.
ring = { workspace = true, features = ["default"] }
# Encode the 32-byte raw public keys of the paper master and the machine keys (the pins.rs
# anchor, the roster entries).
# Standard padded Base64 — first-party; its one dependency is astream-wire
# (dependency-free, vendor/astream). `decode_strict` is
# the entry point every trust path uses: canonical padding REQUIRED and no
# trailing bits, so a pinned key has exactly one spelling.
aterm-codec = { workspace = true }
# The roster type and its client verifier: the tool emits the roster through the same
# `Roster` the updater parses, so producer and client cannot drift.
aterm-update-core = { workspace = true }
# RFC3339 timestamps (`aterm_types::rfc3339`), already in the graph via aterm-update-core.
aterm-types = { workspace = true }
# The binary's mint clock (`aterm_time::unix_secs`), already in the graph via aterm-types.
aterm-time = { workspace = true }
# The master is read from /dev/tty with echo off (`isatty`, `tcgetattr`/`tcsetattr`), kept
# out of swap best-effort (`mlock`/`munlock`) and out of core dumps (`setrlimit`): syscalls
# with no safe std wrapper; POSIX-only, like the rest of this tool.
libc = { workspace = true }
# How each write is finished: durable (F_FULLFSYNC) or ordered (F_BARRIERFSYNC).
aterm-durable = { workspace = true }

[dev-dependencies]
# The producer-client contract: sign here, verify and install with the actual client.
atpkg = { path = "../atpkg" }
# Binds the real roster redo/snapshot-CAS transaction to the derived model aterm-spec proves.
aterm-spec = { workspace = true }
# The models its tests drive (a model edit rebuilds only their tests).
aterm-models-release = { workspace = true }
# The owner→client integration test builds a real `.tar.zst` to drive the client install:
# one raw-block zstd frame from the first-party writer (docs/AUDIT-third-party-2026-10-15.md
# ZC.3), which atpkg's extractor decodes.
aterm-zstd = { workspace = true }
# Fixture directories removed on drop.
aterm-tempfile = { workspace = true }
# The real terminal the setup/join tests run the binary on (tests/pty.rs).
aterm-pty = { workspace = true }
# `spawnfd::InheritNothing`, which tests/pty.rs installs in the child first (already in the
# dev graph through aterm-pty and atpkg).
aterm-uds = { workspace = true }

[lints]
workspace = true

[[test]]
name = "keys_suite"
path = "tests/keys_suite.rs"
