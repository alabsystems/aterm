[package]
# `[patch.crates-io]` matches on PACKAGE name, so this must be called
# `unicode-width`; the directory keeps the `aterm-` prefix so it reads as ours
# (precedent: crates/aterm-arrayvec, also a facade over a first-party crate).
name = "unicode-width"
# A SEMVER CONTRACT with codespan-reporting 0.13 (`>=0.1, <0.3`), its only
# consumer, not an aterm release number. 0.2.2 is what the lock held and
# upstream's latest, so no registry 0.2.x in the graph can outrank the shim.
version = "0.2.2"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "First-party `UnicodeWidthChar` for aterm over aterm-grapheme's width tables (replaces the unicode-width crate behind naga's codespan-reporting)"

[lib]
name = "unicode_width"
path = "src/lib.rs"
# No unit tests live in src/; tests/ holds the contract.
test = false

[dependencies]
# The width tables aterm's terminal grid already uses.
aterm-grapheme = { workspace = true }

[features]
# Upstream's feature names, with no effect: codespan-reporting takes the
# default set. `cjk` does NOT bring `width_cjk` (no caller; src/lib.rs says
# why). None may ever gain a `dep:`.
default = ["cjk"]
cjk = []
no_std = []
rustc-dep-of-std = []

[lints]
workspace = true
