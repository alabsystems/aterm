#
# THE TOOLCHAIN, ONE SOURCE: where the pinned Trust toolchain is, where rustup's home
# is, where plain targo puts its build intermediates, when a checkout is gone, the
# lease a run holds on the toolchain it resolved, the named lock and the interrupt
# every wait for a lock or for capacity ends on, and the status digest a sealed
# toolchain is rechecked by. Std only but for aterm-libc's signal declarations,
# aterm-sysprobe's process sweep (a wait's stuck holder) and aterm-digest's SHA-256
# (the status digest), so the check runner (aterm-verify), the libc oracle's gate
# and the package manager (atpkg, which re-exports every module under its old path)
# depend on it instead of compiling a file of another crate by `#[path]`.

[package]
name = "aterm-toolchain"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "The pinned Trust toolchain's discovery, rustup's home, the shared build-cache rule, the gone-checkout rule, the toolchain lease, the named lock whose wait names a stuck holder, and the status digest a sealed toolchain is rechecked by"

[dependencies]
# The process sweep (`aterm_sysprobe::processes`): a wait for a named lock reads
# its holder's process tree, its CPU time and its writes, to tell a holder that
# works from one that makes no progress (`src/stall.rs`). On Windows, where a
# device is a volume serial and one path has many spellings, the gone-checkout
# rule reads a device through the one identity export and compares paths
# through the one key (`aterm_sysprobe::volumes::file_id`,
# `aterm_sysprobe::paths`). Workspace crate; every crate that depends on this
# one already reaches it.
aterm-sysprobe = { workspace = true }

# The status digest (`stat_digest`): SHA-256 from aterm-digest, astream-digest's
# re-export, which has no dependencies. Workspace crate; no cycle.
aterm-digest = { workspace = true }

# A wait's interrupt (`interrupt::Watch`) sets the process's own SIGINT, SIGTERM and
# SIGHUP handling aside and puts it back exactly: `sigaction`, `sigemptyset`, `kill`
# and `getpid` from aterm-libc (package `libc`), first-party generated declarations
# with no dependencies, which aterm-uds already links into every tool here.
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
# The lease tests' scratch prefixes, and their one-minute hang detector.
aterm-spec = { workspace = true }
aterm-tempfile = { workspace = true }
# The interrupt and named-lock tests start their waiting stand-ins through
# `spawnfd::command`. Workspace crate; no cycle (it does not depend on this one).
aterm-uds = { workspace = true }

[lints]
workspace = true
