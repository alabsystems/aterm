[package]
name = "aterm-repo-storage"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Bounded read-only Git pack storage plans, without mutation or recovery authority"

[dependencies]
aterm-json = { workspace = true }
serde = { workspace = true, features = ["derive"] }
ring = { workspace = true }

[target.'cfg(unix)'.dependencies]
aterm-dirfd = { workspace = true }

[dev-dependencies]
aterm-tempfile = { workspace = true }

[target.'cfg(unix)'.dev-dependencies]
libc = { workspace = true }

[lints]
workspace = true
