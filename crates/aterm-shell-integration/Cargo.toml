[package]
name = "aterm-shell-integration"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Shell integration (OSC 7/133/633) — extracted from aterm-core for independent verification"

[features]
default = []
local-pty = ["dep:aterm-containment"]

[dependencies]
aterm-containment = { workspace = true, optional = true }

# THE workspace's one audited entropy surface for the capability-nonce mint
# (`aterm_uds::rand::fill`: getentropy(2) with a bounded read_exact fallback,
# BCryptGenRandom on Windows) — the rule `tools/grep_guard.sh` B4 exists to
# hold. Target-gated because there are no Unix-domain sockets in a browser;
# aterm-uds is a dependency-free leaf, so it adds no third-party package.
[target.'cfg(any(unix, windows))'.dependencies]
aterm-uds = { workspace = true }

# THERE IS DELIBERATELY NO wasm32 DEPENDENCY TABLE HERE, and src/lib.rs's
# `fill_nonce_entropy` carries the reasoning: the capability-nonce mint has one
# caller in the workspace (crates/aterm-gui/src/spawn.rs, seeding a spawned
# shell's environment) and a browser has no PTY to spawn, so the wasm arm was a
# `getrandom = { version = "0.2", features = ["js"] }` row holding an entropy
# bridge nothing could reach. The mint is `cfg(any(unix, windows))` now — it
# exists exactly where `aterm_uds::rand` does, and adding a target means adding
# its audited CSPRNG here first. Guarded by tools/grep_guard.sh B13.

[dev-dependencies]
aterm-tempfile = { workspace = true }
# The workspace's one lock-scoped process-environment helper (`aterm_log::env`):
# the two single-test-per-binary integration tests here must clear a shell var
# for the length of one call, and every mutation in the workspace routes through
# that helper rather than a raw `set_var`/`remove_var`.
aterm-log = { workspace = true }

[lints]
workspace = true
