[package]
name = "aterm-shell-integration"
# Integration tests are declared below: with autotests off, an unlisted `tests/*.rs` never
# compiles.
autotests = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Shell integration (OSC 7/133/633) — extracted from aterm-core for independent verification"

[dependencies]
# The workspace's fixed-key hash (`FxHasher`): the NAME of the per-build script
# folder (`prepare`'s content address, `script_set_address`). Not a security
# boundary: the folder is verified byte for byte before a shell is pointed at it.
aterm-hash = { workspace = true }

# The audited entropy surface for the capability-nonce mint (`aterm_uds::rand::fill`).
# Target-gated: there are no Unix-domain sockets in a browser.
[target.'cfg(any(unix, windows))'.dependencies]
aterm-uds = { workspace = true }

# No wasm32 dependency table: a browser spawns no shell, so the nonce mint exists only
# where `aterm_uds::rand` does (src/lib.rs `fill_nonce_entropy`).

[dev-dependencies]
# The Containment write roots, which the script cache must lie outside.
aterm-containment = { workspace = true }
# `stand_in`: the live fixtures' stand-in programs.
aterm-tempfile = { workspace = true }
# `aterm_log::env::scoped_unset`: shell_suite's two env-clearing tests unset a variable for
# one call under its lock, never by a raw `set_var`/`remove_var`.
aterm-log = { workspace = true }
# `aterm_spec::host::could_not_run`: a live test whose shell or pty this host
# lacks ends COULD NOT RUN, never a silent pass; `aterm_spec::host::test_shell`
# finds the live shells, as it does for atpkg's real-shell tests.
aterm-spec = { workspace = true }

# `LiveShell::spawn` starts every live shell with SIGINT and SIGQUIT at their defaults,
# as aterm-pty starts a tab's (`signal` between fork and exec). The workspace's `libc`
# is first-party (crates/aterm-libc).
[target.'cfg(unix)'.dev-dependencies]
libc = { workspace = true }

# The Windows key-press test (src/tests_pwsh_keys.rs) types at a live PowerShell
# prompt through the ConPTY a tab gets: aterm-pty's spawn, with the caps the test
# mints as its own launcher (`launcher-mint` on this dev edge only, as aterm-pty's
# and aterm-sandbox's own tests have it).
[target.'cfg(windows)'.dev-dependencies]
aterm-pty = { workspace = true }
aterm-cap = { workspace = true, features = ["launcher-mint"] }
aterm-sandbox = { workspace = true }

[lints]
workspace = true

[[test]]
name = "shell_suite"
path = "tests/shell_suite.rs"
