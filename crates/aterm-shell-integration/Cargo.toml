[package]
name = "aterm-shell-integration"
# Integration tests are declared below, not discovered. With autotests off a
# `tests/*.rs` file listed nowhere never compiles.
autotests = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Shell integration (OSC 7/133/633) — extracted from aterm-core for independent verification"

[dependencies]
# First-party, dependency-free SHA-256: the NAME of the per-build script folder
# (`prepare`'s content address). Not a security boundary, but collision-free, so
# two builds whose scripts differ never share a folder.
aterm-digest = { workspace = true }

# THE workspace's one audited entropy surface for the capability-nonce mint
# (`aterm_uds::rand::fill`: getentropy(2) with a bounded read_exact fallback,
# BCryptGenRandom on Windows) — the rule `tools/grep_guard.sh` B4 exists to
# hold. Target-gated because there are no Unix-domain sockets in a browser;
# aterm-uds is a dependency-free leaf, so it adds no third-party package.
[target.'cfg(any(unix, windows))'.dependencies]
aterm-uds = { workspace = true }

# Deliberately no wasm32 dependency table (it held a `getrandom` row with the
# `js` feature, an entropy bridge nothing could reach): a browser spawns no shell, so the
# nonce mint exists only where `aterm_uds::rand` does (src/lib.rs
# `fill_nonce_entropy`). A new target adds its audited CSPRNG here first.
# Guarded by tools/grep_guard.sh B18.

[dev-dependencies]
# The Containment write roots, which the script cache must lie outside
# (`test_cache_dir_is_the_per_user_cache_outside_the_containment_write_roots`).
aterm-containment = { workspace = true }
# `stand_in`: the live fixtures' stand-in programs, one pre-assessed inode per body.
aterm-tempfile = { workspace = true, features = ["stand-in"] }
# The workspace's one lock-scoped process-environment helper (`aterm_log::env`):
# the two env-clearing integration tests in shell_suite must clear a shell var
# for the length of one call, and every mutation in the workspace routes through
# that helper rather than a raw `set_var`/`remove_var`.
aterm-log = { workspace = true }

[lints]
workspace = true

[[test]]
name = "shell_suite"
path = "tests/shell_suite.rs"
