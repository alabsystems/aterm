[package]
name = "aterm-primer"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "aterm — the coding-agent primer installer: the marked, self-gating aterm primer block in each agent's global context file plus the bundled skill files, behind `aterm agents` AND the auto-prime every aterm session runs. Std-only leaf so the CLI and the GUI share one installer."

# Deliberately dependency-free but for how a write is finished: the installer is
# pure string transforms over std::fs, and it runs on a detached thread inside
# every GUI process, so the whole thing stays auditable in one small crate with
# nothing to drag in. aterm-durable is std plus astream-sys (zero dependencies;
# on Apple, the barrier itself): the barrier each atomic write and backup takes
# before its rename.
[dependencies]
aterm-durable = { workspace = true }

[dev-dependencies]
# Scratch home directories for the installer tests.
aterm-tempfile = { workspace = true }
# The served-verb check: every `aterm ctl` verb the primer and the skills teach is
# in the server's table (aterm-types) or among the client's own (`CLIENT_HELP_VERBS`).
# aterm-ctl is std-only; it brings aterm-uds and aterm-codec (which brings the
# dependency-free astream-wire), and no third-party crate.
aterm-types = { workspace = true }
aterm-ctl = { path = "../aterm-ctl" }
# The log-word check: every key, `out=` word and kind a skill shows in a session
# log or brief example is one the log's own vocabulary holds (`aterm_slog`'s
# `Key`, `Kind`, `OUT_WORDS`). An engine crate: std, aterm-codec, aterm-messages.
aterm-slog = { workspace = true }

[lints]
workspace = true
