[package]
name = "aterm-primer"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "aterm — the coding-agent primer installer: the marked, self-gating aterm primer block in each agent's global context file plus the bundled skill files, behind `aterm agents` AND the auto-prime every aterm session runs. Std-only leaf so the CLI and the GUI share one installer."

# Deliberately dependency-free but for how a write is finished: the installer is
# pure string transforms over std::fs, and it runs on a detached thread inside
# every GUI process, so the whole thing stays auditable in one small crate with
# nothing to drag in. aterm-durable is std plus astream-sys (zero dependencies,
# Apple only): the barrier each atomic write and backup takes before its rename.
[dependencies]
aterm-durable = { workspace = true }

[dev-dependencies]
# Scratch home directories for the installer tests.
aterm-tempfile = { workspace = true }

[lints]
workspace = true
