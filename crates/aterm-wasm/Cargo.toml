[package]
name = "aterm-wasm"
version.workspace = true
edition = "2021"
description = "The aterm engine + CPU rasterizer (aterm-render) -> RGBA frames as a wasm module, for rendering a terminal on a <canvas> in the Electron renderer. The in-page replacement substrate for @xterm/xterm's rendering."
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# aterm engine + pure-Rust CPU rasterizer (fonts via `aterm_render::font` over
# aterm-font, shaping via aterm-font's shaper), all wasm32-safe.
aterm-core = { path = "../aterm-core", default-features = false }
aterm-render = { path = "../aterm-render", default-features = false }
# Cursor-wake and sparkle-words effects; wasm32-clean.
aterm-effects = { path = "../aterm-effects" }
# The mosh-style predictive-echo state machine the native app runs.
aterm-predict = { workspace = true }
# The message engine behind the band above the grid (src/messages_api.rs);
# clockless and thread-free.
aterm-messages = { workspace = true }
# Real clock: std Instant on native, performance.now() on wasm32. The predictor
# reconciles echo on real time, unlike the deterministic effects clock.
aterm-time = { workspace = true }
# aterm_types::Appearance for the set_color_scheme binding (aterm-core does not
# re-export it), plus the theme catalog, selector and parser theme_api.rs
# draws through (the same ones aterm-gui uses). default-features = false pins
# out serde/winit -> wasm32-clean.
aterm-types = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# The host boundary, with no third-party dependency: `#[export]` marks what JS
# sees, `verify glue` writes the JS glue, and the panic hook reports to
# `console.error` through the `aterm_host` imports src/host.rs names.
aterm-wasm-abi = { workspace = true, features = ["export"] }
# No getrandom row: nothing needs entropy, and deny.toml admits getrandom only
# under ring (`forge check` [OB-18]).

# No per-crate [profile.release]: profiles take effect only from the workspace
# root, which sets this crate's opt-level = "z".

[dev-dependencies]
# Test-only: `pct_encode_is_the_control_wires` holds `messages_api::pct_encode`
# equal to the control socket's encoder, which the shipped module cannot link
# (aterm-control takes the engine's disk tier, whose mmap store cannot target
# wasm32). Dev-dependencies never enter the wasm32 graph.
aterm-control = { workspace = true }
# TEST-ONLY: `aterm_spec::host::could_not_run`, so a test the host cannot run
# (no system font, no GPU) ends COULD NOT RUN, never a silent pass.
aterm-spec = { workspace = true }

[lints]
workspace = true
