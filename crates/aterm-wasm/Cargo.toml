[package]
name = "aterm-wasm"
version.workspace = true
edition = "2021"
description = "wasm-bindgen binding: the aterm engine + CPU rasterizer (aterm-render) -> RGBA frames, for rendering a terminal on a <canvas> in the Electron renderer. The in-page replacement substrate for @xterm/xterm's rendering."
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# aterm engine + pure-Rust CPU rasterizer (fonts via `aterm_render::font` over
# ttf-parser, shaping via rustybuzz), all wasm32-safe.
# default-features = false drops the disk-tier cold scrollback (libc mmap + zstd-sys
# C), which cannot target wasm32; a renderer needs only the RAM/LZ4 tiers.
# "sixel" adds aterm-sixel (pure Rust, no libc/C) for Sixel DCS images.
aterm-core = { path = "../aterm-core", default-features = false, features = ["sixel"] }
aterm-render = { path = "../aterm-render", default-features = false }
# The cursor-wake + sparkle-words engines the native app runs; wasm32-clean.
aterm-effects = { path = "../aterm-effects" }
# The mosh-style predictive-echo state machine the native app runs; clock-injected
# (predict_api samples aterm-time for it).
aterm-predict = { workspace = true }
# The unified message engine (the message band: `notice`, `messages`, the
# rows the frame reserves above the grid — src/messages_api.rs). Its only
# dependency is aterm-time: clockless, thread-free, wasm-clean. The renderer's
# `band` module composes its rows (the same composition the native window runs).
aterm-messages = { workspace = true }
# Real monotonic clock for the predict_api host seam: std Instant on native,
# performance.now() on wasm32 — the predictor's echo reconciliation runs on
# REAL time (the glitch-expiry self-heal), unlike the deterministic effects clock.
aterm-time = { workspace = true }
# aterm_types::Appearance for the set_color_scheme binding (aterm-core does not
# re-export it). default-features = false pins out serde/winit -> wasm32-clean.
aterm-types = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Matches aterm-gpu-web's pin so both web crates share the one workspace lock.
wasm-bindgen = "=0.2.108"
console_error_panic_hook = "0.1"
# No getrandom row: nothing needs it. Measured with `cargo tree -p aterm-wasm
# --target wasm32-unknown-unknown -i getrandom`: aterm's own manifests were its
# only parents, so a defensive row alone pulled getrandom + js-sys (2 packages /
# 9,774 lines) into the shipped module. A transitive dep
# that selects it on wasm32 fails loudly with getrandom's "unsupported target".
# Guarded by tools/grep_guard.sh B18.

# NOTE: no per-crate [profile.release] — profiles only take effect from the
# workspace root, which already sets lto/codegen-units=1/strip for release. A wasm
# size build (opt-level="z") is driven by the build tool's --profile, not here.

[dev-dependencies]
# TEST-ONLY: the control socket's percent-encoder, which `messages_api`'s
# `pct_encode` copies byte for byte (`aterm-control` takes the engine's disk
# tier, whose zstd C library cannot target wasm32, so the shipped module keeps
# the copy) — `pct_encode_is_the_control_wires` holds the two together.
# Dev-dependencies never enter the shipped wasm32 graph (resolver 2), and the
# wasm census's derived closure excludes them.
aterm-control = { workspace = true }

[lints]
workspace = true
