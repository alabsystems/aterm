[package]
name = "aterm-keeper"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "aterm — the PTY keeper: a per-login holder of a custody copy of every terminal's master, so a window's crash does not hang up its shells (docs/DESIGN-pty-keeper-2026-09-26.md). The pure custody core, the AKP1 wire, the server loop, the client, job control and relaunch. Links no AppKit, CoreGraphics or winit."

[dependencies]
# The cordoned unsafe crate the keeper's OS half is built on (descriptors, peers, process
# birth, exit watch, spawn, holder scan).
aterm-uds = { workspace = true }
# The workspace's one FNV-1a/64, for a dev keeper's per-path label. Its one
# dependency is astream-wire (dependency-free, vendor/astream), whose byte loop it runs.
aterm-hash = { workspace = true }
# The anchor attributes' registry (std-only): `#[cfg_attr(any(test, debug_assertions),
# aterm_spec_anchor::refines(…))]` expands in every test and debug build; release strips it.
aterm-spec-anchor = { workspace = true }

[dev-dependencies]
aterm-tempfile = { workspace = true }
aterm-spec = { workspace = true }
# The models its tests drive (a model edit rebuilds only their tests).
aterm-models-core = { workspace = true }
# The tests' real PTYs, close-on-exec from birth. The keeper itself links aterm-uds alone.
aterm-pty = { workspace = true }
# The kernel lane's stand-in windows journal a real session into a real region (the
# crash-restore journal's writer) and restore it after a SIGKILL (its recovery, into the
# engine): the keeper itself never links either (it never maps a region, guard
# `keeper-no-mmap`).
aterm-restore = { workspace = true }
aterm-core = { workspace = true }

[lints]
workspace = true
