[package]
name = "aterm-render"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "aterm CPU rasterizer: the terminal grid -> an RGBA framebuffer. The renderer core AND the read_image pixel-introspection oracle (headless, testable)."
# The integration tests are one suite binary (whose two tests that read
# process-wide state re-run the binary on themselves, `tests/common/alone.rs`)
# plus the allocation-counting files, which install a `#[global_allocator]` and
# are `[[test]]` targets at the end of this file. With autotests off a
# `tests/*.rs` file listed nowhere never compiles.
autotests = false

[features]
default = ["embedded-font"]
# DEVELOPMENT SEAMS in an optimized build: this crate's `aterm_types::dev_seam!`
# reads (`ATERM_RASTERIZER` and the golden/parity suites' portable-raster pin).
# A debug build compiles them anyway; the release cutter never enables it
# (aterm-gui's `dev-seams` forwards here).
dev-seams = []
# Every compiled-in font, one switch: DEFAULT-ON; the wasm and library
# consumers (aterm-wasm, aterm-gpu-web, aterm-gpu, aterm-effects) build with
# --no-default-features and carry none of them.
# - FONT-EMBED: a bundled last-resort monospace font (DejaVu Sans Mono, ~340KB,
#   Bitstream Vera license — see assets/DejaVuSansMono.LICENSE.txt) so text
#   renders even on a host with NO usable system font (e.g. a stripped Linux box).
# - FONT-2b: the Symbols Nerd Font (Mono, ~2.5MB, MIT — see
#   assets/SymbolsNerdFont-LICENSE.txt) as a GUARANTEED last-resort icon face, so
#   the Nerd Font PUA icons (Devicons / Font Awesome / Material / Powerline-extra /
#   …) render out of the box with NO installed Nerd Font. Tried last in the
#   runtime fallback, so any installed/configured face still wins.
# - The BUNDLED TERMINAL FONT STACK (owner decision, 2026-09-24: the fonts a stock
#   Linux ships are poor and incomplete, so aterm ships its own). JetBrains Mono
#   2.304 (Regular/Bold/Italic/BoldItalic, ~1.1MB, OFL-1.1) becomes the DEFAULT
#   primary when no font is configured, and Noto Sans Symbols 2 + Noto Sans Math
#   (~1.6MB, OFL-1.1) join the symbol tier ahead of the system faces; the embedded
#   DejaVu Sans Mono leads the broad fallback tier. On WINDOWS the default primary
#   is Iosevka Term Semibold instead (a ~2.3MB subset of Iosevka Term 34.9.0's
#   SemiBold/ExtraBold faces and their italics, without calt ligatures, OFL-1.1,
#   compiled in on Windows only; owner request and two judged render farms,
#   2026-10-16), with Cascadia Mono PL 2407.24 (the Windows default from
#   2026-09-30, static Regular/Bold/Italic/BoldItalic, ~2.4MB, OFL-1.1, Windows
#   only) and JetBrains Mono still compiled in there and selectable by name. See
#   `src/bundled.rs` and assets/bundled/*.LICENSE.txt. Compiled in on NON-macOS
#   targets only: the macOS default (SF Mono + CoreText system coverage) is
#   unchanged by that decision, and a universal binary would carry the ~2.8MB
#   twice for faces it never selects. The one exception is Iosevka Term 34.9.0's
#   Regular set (a ~2.3MB subset of its four faces, OFL-1.1; owner request
#   2026-10-14), compiled in on EVERY target, macOS included: no default
#   anywhere, a family a user selects by name.
embedded-font = []

[dependencies]
aterm-core = { path = "../aterm-core", default-features = false }
# The Unicode `Emoji_Presentation` gate: a default-text code point (⏺ U+23FA) is
# never resolved to the colour-emoji face merely because that face covers it.
aterm-grapheme = { workspace = true }
# The bidi class of a cell (R/AL): the run planner shapes a stretch of
# right-to-left letters a reordered row paints backwards in logical order. The
# font oracle (tests/font_oracle.rs) reorders its visual-order runs with the
# same UAX #9 code aterm-core calls. First-party, already linked through
# aterm-font.
aterm-bidi = { workspace = true }
# Ligature config (LigatureMode / TextShapingConfig / FontFeature): the shaping
# settings that gate liga/calt. Plain data types, no default features.
aterm-types = { workspace = true }
# The unified message engine (docs/DESIGN-unified-messages-2026-09-21.md,
# ruling 331): `src/band.rs` turns its resolved band rows into this renderer's
# input, the one composition the native window and the web module share.
# `aterm-time` is its only dependency — clockless, wasm-clean.
aterm-messages = { workspace = true }
# Fast unkeyed hasher (FxHash) for the per-cell glyph caches — the render profile
# showed ~10% of rasterize time in SipHash. Glyph-cache keys are local render state
# (font glyphs), not an untrusted hashmap-flood vector, so FxHash is the right
# choice there (matches the engine's grid/core caches, which already use it). The
# memos keyed by text a pane's program prints use its `KeyedHashMap` instead.
aterm-hash = { workspace = true }
# First-party PNG (crates/aterm-png), which retired `png` and the flate2/
# miniz_oxide/fdeflate/simd-adler32/crc32fast/adler2 compression stack behind
# it — 7 packages / 33,439 lines. Decode is the inline-image and colour-emoji
# path (`decode_png_rgba8`); encode is the `image` verb's framebuffer dump.
aterm-png = { workspace = true }
# THE font reader and shaper (first-party since TF.5 and TF.6 of
# docs/AUDIT-third-party-2026-10-15.md, carved from ttf-parser 0.25.1 and
# rustybuzz 0.20.1): `src/font.rs` reads the cmap, `hmtx`, `hhea`/OS/2 and
# legacy `kern` through it and outlines every glyph through it, `src/colr.rs`
# paints COLR glyphs, the colour-emoji path reads `sbix`/`CBDT` bitmaps, and
# `src/ligature_shaping.rs` shapes runs with `aterm_font::shape` (the colour
# face's clusters too, except on macOS, where CoreText shapes them).
aterm-font = { workspace = true }
# The anchor attributes' registry (std-only): `#[cfg_attr(any(test, debug_assertions),
# aterm_spec_anchor::refines(…))]` expands in every test and debug build; release strips it.
aterm-spec-anchor = { workspace = true }

[target.'cfg(unix)'.dependencies]
# Safe admission of config-authored font files: O_NONBLOCK prevents a FIFO from
# parking the caller, O_NOFOLLOW rejects a swapped final symlink, and O_CLOEXEC
# keeps the capability out of spawned children.
libc = { workspace = true }

[target.'cfg(any(all(unix, not(target_os = "macos")), windows))'.dependencies]
# NATIVE CRISPNESS (see src/hinted.rs): grid-fitted glyph outlines for the two
# native raster paths that are NOT CoreText — Linux (W13) and Windows. The
# first-party coverage fill (`src/raster.rs`) does not hint, so at desktop
# sizes (~12px, scale 1.0) stems and crossbars land at fractional pixel phases
# and read fuzzy; aterm-font's `hint` feature, the automatic hinter carved
# from skrifa 0.46.2 (TF.4 of docs/AUDIT-third-party-2026-10-15.md; never the
# font's own bytecode since TF.2b), hands back a grid-fitted outline that the
# SAME coverage fill (as the FONT-2 variation path) turns into crisp masks.
# Target-gated so the macOS (CoreText) build and the wasm consumer — which
# trims its closure deliberately — compile not one byte of it (a `--workspace`
# build unifies aterm-font's default `hint` in everywhere; `src/hinted.rs`
# stays target-gated either way).
aterm-font = { workspace = true, features = ["hint"] }

[dev-dependencies]
# Exercise the native portable rasters with embedded fonts on the macOS test
# host too; normal macOS and wasm builds retain the target-gated hint feature.
aterm-font = { workspace = true, features = ["hint"] }
# Base64 encoder for the inline-image (OSC 1337) integration tests.
aterm-codec = { workspace = true }
# The rain_render test drives the shared aterm-effects engines. The dev-dep cycle (effects depends on
# this crate) is fine — cargo permits dev-dependency cycles. Dev-only: the
# shipped renderer lib gains no effects dep.
aterm-effects = { workspace = true }
# Trust/ty derived-model proof of the colour-presentation gate invariant
# (tests/presentation_gate.rs): a default-text code point never resolves to the
# colour-emoji face. Same in-process model interpreter the scrollback/session
# proofs use.
aterm-spec = { workspace = true }
# The models its tests drive (a model edit rebuilds only their tests).
aterm-models-effects = { workspace = true }
aterm-models-render = { workspace = true }

[lints]
workspace = true

# ---- integration tests (autotests = false above) ----------------------------

[[test]]
name = "render_suite"
path = "tests/render_suite.rs"

# Alone: installs a #[global_allocator] and asserts process-wide allocation counts.
[[test]]
name = "free_sprite_alloc"
path = "tests/free_sprite_alloc.rs"
# Its renderer is built on the embedded face.
required-features = ["embedded-font"]

# Alone: installs a counting #[global_allocator].
[[test]]
name = "snapshot_alloc"
path = "tests/snapshot_alloc.rs"
# Its renderer is built on the embedded face.
required-features = ["embedded-font"]

# Alone: (Windows) installs the heap-attribution #[global_allocator]; its gate
# and measurements read the whole process's heap.
[[test]]
name = "win_heap_attribution"
path = "tests/win_heap_attribution.rs"

# ---- release perf gates: `targo --unverified bench -p aterm-render` ----------
[[bench]]
name = "sparkle_words"
path = "benches/sparkle_words.rs"
harness = false

# A measurement, not a gate: where the Windows heap goes across the whole font
# stack (one heapprof report per process, so its own binary). Windows only.
[[bench]]
name = "full_font_stack_heap"
path = "benches/full_font_stack_heap.rs"
harness = false

# A measurement, not a gate: what each script's first frame costs once the
# Windows fallback chain's faces are mapped. Windows only.
[[bench]]
name = "first_frame_per_script"
path = "benches/first_frame_per_script.rs"
harness = false
