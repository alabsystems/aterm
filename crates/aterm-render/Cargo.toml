[package]
name = "aterm-render"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "aterm CPU rasterizer: the terminal grid -> an RGBA framebuffer. The renderer core AND the read_image pixel-introspection oracle (headless, testable)."

[features]
default = ["disk-tier", "embedded-font", "embedded-symbols"]
# Compile source↔spec anchors into the library for the downstream aterm-gui
# closure gate. Off by default, so production rendering carries no verifier dep.
spec-anchors = ["dep:aterm-spec"]
# Disk-backed scrollback cold tier, forwarded through aterm-core. DEFAULT-ON so
# native builds are byte-identical; a wasm consumer disables it
# (--no-default-features) to drop libc/zstd-sys.
disk-tier = ["aterm-core/disk-tier", "aterm-render-api/disk-tier"]
# FONT-EMBED: compile in a bundled last-resort monospace font (DejaVu Sans Mono,
# ~340KB, Bitstream Vera license — see assets/DejaVuSansMono.LICENSE.txt) so text
# renders even on a host with NO usable system font (e.g. a stripped Linux box).
# DEFAULT-ON; disable with --no-default-features to drop the ~340KB from the binary.
embedded-font = []
# FONT-2b: compile in the Symbols Nerd Font (Mono, ~2.5MB, MIT — see
# assets/SymbolsNerdFont-LICENSE.txt) as a GUARANTEED last-resort icon face, so the
# Nerd Font PUA icons (Devicons / Font Awesome / Material / Powerline-extra / …) render
# out of the box with NO installed Nerd Font. Tried last in the runtime fallback, so any
# installed/configured face still wins. DEFAULT-ON; --no-default-features drops the ~2.5MB.
embedded-symbols = []

[dependencies]
# Path (not `workspace = true`) so we can set default-features = false here without
# forcing it on every workspace consumer; disk-tier is re-enabled by default via this
# crate's own default = ["disk-tier"], so the native closure is unchanged.
aterm-core = { path = "../aterm-core", default-features = false }
aterm-render-api = { path = "../aterm-render-api", default-features = false }
# The Unicode `Emoji_Presentation` gate: a default-text code point (⏺ U+23FA) is
# never resolved to the colour-emoji face merely because that face covers it.
aterm-grapheme = { workspace = true }
# Ligature config (LigatureMode / TextShapingConfig / FontFeature): the shaping
# settings that gate liga/calt. Plain data types, no default features.
aterm-types = { workspace = true }
# Fast non-DoS hasher (FxHash) for the per-cell glyph caches — the render profile
# showed ~10% of rasterize time in SipHash. Glyph-cache keys are local render state
# (font glyphs), not an untrusted hashmap-flood vector, so FxHash is the standard,
# safe choice (matches the engine's grid/core caches, which already use it).
aterm-hash = { workspace = true }
# DEFAULT FEATURES OFF to drop the OPTIONAL `hashbrown` arm: fontdue's default
# is ["simd", "hashbrown"], and its only use of it is `HashMap`/`HashSet` with
# new/with_capacity/get/insert — src/lib.rs:25-28 falls back to std::collections
# with no `std`-feature guard, so this compiles unchanged and rasterizes
# identically. Costs hashbrown 0.15.5 + foldhash + allocator-api2: 3 packages,
# 32,597 lines, mac-arm and wasm. `simd` is kept — it is the rasterizer.
fontdue = { version = "0.9", default-features = false, features = ["simd"] }
# First-party PNG (crates/aterm-png), which retired `png` and the flate2/
# miniz_oxide/fdeflate/simd-adler32/crc32fast/adler2 compression stack behind
# it — 7 packages / 33,439 lines. Decode is the inline-image and colour-emoji
# path (`decode_png_rgba8`); encode is the `image` verb's framebuffer dump.
aterm-png = { workspace = true }
rustybuzz = "0.20.1"
# Color-emoji (Apple Color Emoji `sbix` table) glyph extraction. fontdue is a
# monochrome rasterizer; ttf-parser reads the embedded per-glyph PNG bitmaps.
ttf-parser = "0.25"
# Optional verifier registry used only when `spec-anchors` is enabled. The same
# crate remains a dev-dependency below for this crate's Tier-1 tests.
aterm-spec = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
# Safe admission of config-authored font files: O_NONBLOCK prevents a FIFO from
# parking the caller, O_NOFOLLOW rejects a swapped final symlink, and O_CLOEXEC
# keeps the capability out of spawned children.
libc = { workspace = true }

[target.'cfg(any(all(unix, not(target_os = "macos")), windows))'.dependencies]
# NATIVE CRISPNESS (see src/hinted.rs): grid-fitted glyph outlines for the two
# native raster paths that are NOT CoreText — Linux (W13) and Windows. fontdue
# has NO hinting, so at desktop sizes (~12px, scale 1.0) stems and crossbars land
# at fractional pixel phases and read fuzzy; skrifa runs the font's TrueType
# bytecode / FreeType-ported autohinter and hands back a grid-fitted outline that
# the SAME first-party coverage fill (`src/raster.rs`, as the FONT-2 variation path) turns
# into crisp masks. Target-gated so the macOS (CoreText) build and the wasm
# consumer — which trims its closure deliberately, see `disk-tier` above —
# compile not one byte of it.
skrifa = "0.46.2"

[dev-dependencies]
# ORACLE ONLY — never in the shipped graph. `src/raster.rs` is the first-party
# scanline signed-area coverage rasterizer that retired this crate; it is kept
# here purely so `tests/rasterizer_oracle.rs` can prove the two agree at f32
# BIT equality over ~48k real glyph rasters from the embedded faces plus random
# line/quad/cubic contours. Antialiased coverage is where an off-by-one is
# invisible in a test and obvious on screen, so the evidence has to be an
# equality against the thing it replaced — and a dev-dep costs the product
# nothing.
ab_glyph_rasterizer = "0.1.10"
libc = { workspace = true }
# The workspace's one lock-scoped process-environment helper (`aterm_log::env`):
# these parity tests export a font / rasterizer selection to both renderers, and
# every mutation in the workspace routes through that helper rather than a raw
# `set_var`. Dependency-free leaf, already linked transitively.
aterm-log = { workspace = true }
# Base64 encoder for the inline-image (OSC 1337) integration tests.
aterm-codec = { workspace = true }
# Sparkle-words v2 visual demo (examples/sparkle_v2_demo.rs, design §13): the
# genome + CatBaker + nova engines now live in the shared aterm-effects
# library (extracted from aterm-gui). The dev-dep cycle (effects depends on
# this crate) is fine — cargo permits dev-dependency cycles. Dev-only: the
# shipped renderer lib gains no effects/lexicon dep.
aterm-effects = { workspace = true }
# `aterm_scene::mix_rgb` (the shared linear-RGB colour mix) for the sparkle demo only —
# dev-only, so the shipped renderer lib carries no aterm-scene dep.
aterm-scene = { workspace = true }
# The genome's context SimHash folds tokens through the lexicon's shared
# case-folding (demo helpers).
aterm-lexicon = { workspace = true }
# Trust/ty derived-model proof of the colour-presentation gate invariant
# (tests/presentation_gate.rs): a default-text code point never resolves to the
# colour-emoji face. Same in-process model interpreter the scrollback/session
# proofs use.
aterm-spec = { workspace = true }
# Direct shaping access for the ligature gate (pre-check that "=>" ligates).
rustybuzz = "0.20.1"
# Coverage probing for the W6 styled-face/fallback-chain gates
# (tests/styled_faces.rs): scan for a code point one fixture covers and the
# other lacks, so the fallback routing test can never go vacuous.
fontdue = "0.9"
# Property test (tests/set_px_rerasterizes.rs): the renderer's DPR re-rasterization
# guarantee — set_px(newPx) scales cell metrics proportionally AND clears the glyph
# atlas/caches so a subsequent render re-rasterizes at the new px. The host-side DPR
# fix in the renderer depends on this engine invariant holding.
proptest = { workspace = true }
# IMG-1 pricing bench (benches/image_diff.rs): per-frame dirty-row diff cost
# when an inline image is RE-TRANSMITTED (fresh Arc, byte-identical payload).
# Same direct pin as aterm-gpu's benches (criterion is not a workspace dep).
criterion = "0.5"

[[bench]]
name = "image_diff"
harness = false

[[bench]]
name = "image_blit"
harness = false

[lints]
workspace = true
