[package]
name = "aterm-db"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Embedded encrypted replicated application database over astream"
[features]
# The one `aterm_types::dev_seam!` read here: `ATERM_DEV_FLEET_FIXTURE`, which holds the fleet
# tables to `fleet::fixture`'s lab (`fleet::fixture::under_seam`). A debug build compiles it
# anyway; the release cutter never enables this (aterm's and aterm-gui's `dev-seams` forward
# here), so a shipped binary reads no fixture.
dev-seams = []
[dependencies]
# The grid round trip reads and writes a TSV with amacs's own table codec, so a lab table edited
# in amacs's spreadsheet mode comes back exactly as the grid committed it.
amacs.workspace = true
aterm-db-core.workspace = true
aterm-secrets.workspace = true
# The update record type `alab::journal::upd` publishes (the updater itself is no dependency).
aterm-update-core.workspace = true
aterm-http.workspace = true
serde.workspace = true
aterm-spec-anchor.workspace = true
aterm-journal.workspace = true
aterm-durable.workspace = true
aterm-codec.workspace = true
aterm-digest.workspace = true
aterm-json.workspace = true
aterm-net.workspace = true
aterm-uds.workspace = true
aterm-time.workspace = true
aterm-stamp.workspace = true
aterm-types.workspace = true
aterm-tempfile.workspace = true
aterm-toml.workspace = true
# The seal the lab's generated exports carry (`aterm db alab export`, design §9): a hand edit of
# an exported file shows in `check` as `edited`, not as the lab having moved.
aterm-census.workspace = true
# The macOS major version the lab journal's `sum` row states
# (docs/DESIGN-alab-lab-model-2026-11-01.md §4.17), and a repair round's CPU time (tests).
aterm-sysprobe.workspace = true
ring.workspace = true
zeroize = { version = "1", default-features = false, features = ["alloc"] }
# Every Ed25519 verification (`crypto::verify`): astream's strict check, which refuses
# the small-order keys and commitments ring alone takes.
astream-aead = { path = "../../vendor/astream/crates/astream-aead", default-features = false, features = ["signature"] }
astream-broker = { path = "../../vendor/astream/crates/astream-broker" }
astream-wire = { path = "../../vendor/astream/crates/astream-wire" }
[target.'cfg(unix)'.dependencies]
# Database diagnostics and authenticated contacts use the shared network place.
aterm-netplace.workspace = true
# The owner's views ask the aterm instance they run under whether its session may see plaintext
# (`reveal`, docs/DESIGN-alab-one-mesh-2026-11-05.md §4.8): aterm-ctl's discovery and exchange.
# A path dependency, as every aterm-ctl user's is: the workspace has no aterm-ctl row.
aterm-ctl = { path = "../aterm-ctl" }
[dev-dependencies]
aterm-heap-count = { path = "../aterm-heap-count" }
aterm-bench = { path = "../aterm-bench" }
aterm-spec.workspace = true
# The process-wide flush tally `tests/table_flushes.rs` reads.
astream-sys = { path = "../../vendor/astream/crates/astream-sys" }
aterm-models-db.workspace = true
# SwarmRecordsCapacity's legacy database fence (control::tests::crossing_tests).
aterm-models-swarm.workspace = true
# FleetMachineAssignment's mail area: the alias chain the harness is handed (alab::view).
aterm-models-harness.workspace = true

[[example]]
name = "commons_probe"
path = "examples/commons_probe.rs"
# Its unit tests (receiver reads, the live-config pause guard, the audit's classification) run with the crate's tests: verify's `--tests` selects only targets with test = true.
test = true

[lints]
workspace = true
