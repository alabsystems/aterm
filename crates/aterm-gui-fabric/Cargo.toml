[package]
name = "aterm-gui-fabric"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "aterm-gui's fabric endpoint, below the window: each session's inbox ring, outbound posts, watermarks and hold gate, and the instance's view of its bridge. Reaches a session and the registry through two traits; aterm-gui re-exports it as `crate::fabric`."

[features]
# Read `ATERM_FABRIC_STALE_AFTER_MS` and keep the fabric bench's handler tally in an
# optimized build too (`aterm-gui/dev-seams` forwards it). A debug build has both anyway; a
# shipped build has neither.
dev-seams = ["aterm-types/dev-seams"]

[dependencies]
# The bus log's identity (`logid::LogIdentity`): the endpoint's log clock parses,
# compares and continues identities exactly as astream does. Already in the graph
# through aterm-control → aterm-codec; dependency-free, every target. The broker
# re-exports the same type, but aterm links the broker only on Unix (aterm-link),
# and this crate builds on every target.
astream-wire = { path = "../../vendor/astream/crates/astream-wire" }
# The wire's percent escape and the blocking verbs' caller-hangup check.
aterm-control = { workspace = true }
# The one mesh's decision kernels: whether a delivery is shown anew, its offset and the offset a
# moved copy was first moved from remembered or not (§11 C3b, `inbox_move::shows_anew`).
# Dependency-free, every target.
aterm-mesh-core = { path = "../aterm-mesh-core" }
# The fence and notice waits' one timing value, and the process clock.
aterm-gui-timing = { workspace = true }
aterm-log = { workspace = true }
# The presence facts' mail counts, built here from the ring.
aterm-messages = { workspace = true }
aterm-session = { workspace = true }
# The fabric's word grammar and the env seams.
aterm-stamp = { workspace = true }
aterm-types = { workspace = true }
# The seamless carry rides the update's TOML manifest
# (`#[derive(Serialize, Deserialize)]`, so the row asks for the derive).
serde = { workspace = true, features = ["derive"] }
aterm-toml = { workspace = true }

[target.'cfg(unix)'.dependencies]
aterm-uds = { workspace = true }
# Direct fleet mail sealed at rest (`fleet_mail`): astream's seal and open alone, without its
# sealed stream, as aterm-link's `at-rest` takes it; its ring and zeroize are in the graph already.
astream-aead = { path = "../../vendor/astream/crates/astream-aead", default-features = false }

[dev-dependencies]
# The hang detector, the environment refusal, and the link's bind to its
# derived model.
aterm-spec = { workspace = true }
# The carry's TOML round trips.
aterm-tempfile = { workspace = true }
# A test's poll pauses with `aterm_uds::deadline::poll_yield` on every target, the
# library's own use being Unix's (clippy.toml: a wait that wakes).
aterm-uds = { workspace = true }

[lints]
workspace = true
