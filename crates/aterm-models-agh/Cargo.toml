[package]
name = "aterm-models-agh"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "agh's models: the route wall (ty_model!), for agh's Tier-1 conformance and spec-check"
# The Tier-0 tests compile as ONE suite (tests/suite.rs): a tests/*.rs that is neither
# the suite nor a `mod` of it compiles into nothing.
autotests = false

[lib]
# No unit tests and no doctests live in src/: the models' tests are tests/suite.rs.
test = false
doctest = false

[dependencies]
aterm-spec.workspace = true

[lints]
workspace = true

[[test]]
name = "suite"
path = "tests/suite.rs"
