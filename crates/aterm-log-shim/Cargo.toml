[package]
# `[patch.crates-io]` matches on package name, so to redirect third-party
# consumers' `log = "0.4.x"` dependencies here the package is named `log`.
# The directory is `crates/aterm-log-shim` because `crates/aterm-log` is
# aterm's own logging facade. See `src/lib.rs` for why the two are separate
# packages.
name = "log"
# Semver contract with third-party consumers (^0.4.29 for naga/wgpu/wgpu-core/
# wgpu-hal/wgpu-types, ^0.4 for the rest), not an aterm release number.
version = "0.4.32"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "First-party no-op `log` facade for aterm (package `log`; replaces the crates.io log 0.4.32 for its third-party consumers)"

[dependencies]
# Deliberately empty (does not depend on `aterm-log`; see `src/lib.rs` for why
# `max_level()`, `Display for Level`, `LevelFilter::parse`, and `#![no_std]`
# require a separate implementation).

[features]
# Upstream's feature table, reproduced by name as no-ops so any transitive
# consumer enabling a `log/*` feature or optional-dependency feature resolves.
# `default` is left implicit, matching upstream.
std = []
kv = []
kv_std = ["std", "kv"]
kv_sval = ["kv", "sval", "sval_ref"]
kv_serde = ["kv_std", "serde"]
kv_unstable = ["kv", "value-bag"]
kv_unstable_std = ["kv_std", "kv_unstable"]
kv_unstable_sval = ["kv_sval", "kv_unstable"]
kv_unstable_serde = ["kv_serde", "kv_unstable_std"]
serde = ["serde_core"]
max_level_off = []
max_level_error = []
max_level_warn = []
max_level_info = []
max_level_debug = []
max_level_trace = []
release_max_level_off = []
release_max_level_error = []
release_max_level_warn = []
release_max_level_info = []
release_max_level_debug = []
release_max_level_trace = []
# Synthesized by cargo upstream from `[dependencies.<name>] optional = true`.
# Empty here; see the paragraph above.
value-bag = []
sval = []
sval_ref = []
serde_core = []

[dev-dependencies]
# None: this package IS the `[patch.crates-io]` target for `log`, so a
# dev-dependency on crates.io `log` resolves back to this package.

[lints]
workspace = true

[lib]
# No unit tests live in src/, so this lib's libtest harness ran 0 tests in every
# gate while still being linked and executed. Off; doctests are governed
# separately and still run.
test = false
