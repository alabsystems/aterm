[package]
name = "aterm-uds"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "aterm — the portable control-socket stream: pure type aliases to std Unix-domain sockets on Unix, AF_UNIX over winsock (afunix.sys) on Windows, plus the latest-alias, CSPRNG, pid-liveness, SCM_RIGHTS descriptor-passing and shared-memory region helpers the control channel and the PTY keeper need. Std-only but for aterm-libc's declarations on Unix; the Windows side is direct ws2_32/kernel32/bcrypt FFI."

# Dependency-free on every platform (the Windows side is raw FFI) so the
# whole transport stays auditable in one small crate, but for one first-party
# declaration crate on Unix, aterm-vitals' pure types, and aterm-sysprobe's
# readers: `KERN_PROCARGS2`'s (`procargs`, re-exported) on Unix and Windows,
# and its path rule and process reader on Windows.
[dependencies]
# aterm-vitals: the program check's reading and verdict types
# (`program_check`), which this crate's reader fills. A pure model crate with
# no dependencies of its own.
aterm-vitals = { workspace = true }

[target.'cfg(any(unix, windows))'.dependencies]
# aterm-sysprobe: `procargs`, the workspace's one `KERN_PROCARGS2` reader and
# parser, which this crate re-exports and its `process` reads argv with; on
# Windows, the one rule that places a kernel path under a directory across
# Windows' spellings (`volumes::Table::is_under`, over the mount table it
# reads): the path-user scan compares through it and nothing else; and the one
# reader of another process's image and environment block (`peb`), which names
# each scanned process's image and working directory. Pure Rust, libc on Unix
# and kernel32/ntdll FFI on Windows, so the transport stays auditable; its own
# dependency on this crate is dev-only.
aterm-sysprobe = { workspace = true }

[target.'cfg(unix)'.dependencies]
# aterm-libc (package `libc`): generated, oracle-checked ABI declarations, no
# code. The shared-memory module (`shm`) needs `shm_open` and `fcntl`, which
# are variadic on Darwin: declared by hand as fixed-arity, their extra argument
# rides a register where Apple arm64 reads variadic arguments from the stack.
libc = { workspace = true }

[dev-dependencies]
# Test scratch directories (mode 0700, an unpredictable name); itself dependency-free.
aterm-tempfile = { workspace = true }

[lints]
workspace = true

# What a spawn costs a process shaped like the window: a benchmark run by hand
# (`targo --unverified bench -p aterm-uds --bench spawn_cost`), never a gate.
[[bench]]
name = "spawn_cost"
harness = false

# Explicit mounted-volume acceptance; not an ordinary test or a release dependency.
[[bench]]
name = "dmg_acceptance"
harness = false
test = false
