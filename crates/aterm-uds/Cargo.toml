[package]
name = "aterm-uds"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "aterm — the portable control-socket stream: pure type aliases to std Unix-domain sockets on Unix, AF_UNIX over winsock (afunix.sys) on Windows, plus the latest-alias, CSPRNG, pid-liveness, and SCM_RIGHTS descriptor-passing helpers the control channel needs. Std-only; the Windows side is direct ws2_32/kernel32/bcrypt FFI."

# Dependency-free on every platform (the Windows side is raw FFI) so the
# whole transport stays auditable in one small crate.
[dependencies]

[features]
# `deadline::{trust_service_silent, notice_once}`: how a TEST that needs macOS's
# trustd to answer skips, with one line, when it does not. Enabled only from
# dev-dependencies, so no shipped build carries it.
test-support = []

[lints]
workspace = true
