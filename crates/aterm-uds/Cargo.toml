[package]
name = "aterm-uds"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "aterm — the portable control-socket stream: pure type aliases to std Unix-domain sockets on Unix, AF_UNIX over winsock (afunix.sys) on Windows, plus the latest-alias, CSPRNG, pid-liveness, SCM_RIGHTS descriptor-passing and shared-memory region helpers the control channel and the PTY keeper need. The Windows side is direct ws2_32/kernel32/bcrypt FFI."

# Dependency-free on every platform (the Windows side is raw FFI) so the
# whole transport stays auditable in one small crate, but for one first-party
# declaration crate on Unix, aterm-vitals' pure types, and aterm-sysprobe's
# readers: `KERN_PROCARGS2`'s (`procargs`, re-exported) on Unix and Windows,
# and its path rule and process reader on Windows; and on Unix astream-sys
# (zero dependencies), whose owner-only rule `private_file` admits by and whose
# boot reader names this boot, and aterm-durable (std plus astream-sys), which
# finishes an `atomic_file` write on Unix and Windows.
[dependencies]
# aterm-vitals: the program check's reading and verdict types
# (`program_check`), the services' reading and fold (`services`) and the
# leftover judge's facts (`left`), which this crate's readers fill, and the
# jobs engine's backed-up count (`jobs::HELD_AT_ONCE`), which
# `process::HeldNow::backed_up` reads. A pure model crate with no
# dependencies of its own.
aterm-vitals = { workspace = true }
# aterm-stamp: the running binary's identity record, read at run time for the
# build the LAN broker's hello names (`lan::hello_build`) where the front door set
# none. No dependencies of its own, and a constant version.
aterm-stamp = { workspace = true }

[target.'cfg(any(unix, windows))'.dependencies]
# aterm-sysprobe: `procargs`, the workspace's one `KERN_PROCARGS2` reader and
# parser, which this crate re-exports and its `process` reads argv with; the
# job probe's socket table decoders (`jobs::darwin::unix_listeners`, Linux's
# socket dump `linux::unix_diag_listeners`, `parse_fd_link`), which the
# listener-holder scan (`holders::scan_listener_holders`) reads the kernel's
# socket table with; the one `/proc/<pid>/stat` parser (`jobs::linux::parse_stat`); on
# Windows, the one rule that places a kernel path under a directory across
# Windows' spellings (`volumes::Table::is_under`, over the mount table it
# reads): the path-user scan compares through it and nothing else; and the one
# reader of another process's image and environment block (`peb`), which names
# each scanned process's image and working directory. Pure Rust, libc on Unix
# and kernel32/ntdll FFI on Windows, so the transport stays auditable; beside
# libc its one dependency is first-party aterm-json (with first-party serde, no
# derive), for its build-slot record parse; its own dependency on this crate is
# dev-only.
aterm-sysprobe = { workspace = true }

# aterm-durable: how an `atomic_file` write is finished. A write takes one `Flush`, durable
# unless its caller names another through `write_flushed` (or none, which flushes nothing):
# the temporary takes it before the rename (`Flush::file`) and the directory after it
# (`Flush::dir`, classified as `Flush::dir_best_effort` does by astream-sys's
# `dir_flush_unavailable`): a directory that cannot be flushed here is accepted, and `EIO` is
# returned. Std plus astream-sys, so no third-party code is added; it depends on nothing of
# this crate's, so no cycle.
aterm-durable = { workspace = true }

[target.'cfg(unix)'.dependencies]
# aterm-libc (package `libc`): generated, oracle-checked ABI declarations, no
# code. The shared-memory module (`shm`) needs `shm_open` and `fcntl`, which
# are variadic on Darwin: declared by hand as fixed-arity, their extra argument
# rides a register where Apple arm64 reads variadic arguments from the stack.
libc = { workspace = true }
# astream-sys: astream's OS cordon, zero dependencies. `private_file` holds every
# file and directory it admits to astream's one owner-only rule
# (`open_nonblocking`, `owner_private`, `owner_private_dir`: the kind, the owner,
# the macOS access list, the mode), so the ACL FFI it needs lives there, not here;
# this boot's id (`process::kin::boot_id`, which a verify run's record names)
# is its one reader's (`boot_session`: the all-zero id refused); and
# `keep_out_of_children` is its `close_on_fork` (`FD_CLOFORK`).
astream-sys = { path = "../../vendor/astream/crates/astream-sys" }

[dev-dependencies]
# Test scratch directories (mode 0700, an unpredictable name); itself dependency-free.
aterm-tempfile = { workspace = true }

[lints]
workspace = true

# What a spawn costs a process shaped like the window: a benchmark run by hand
# (`targo --unverified bench -p aterm-uds --bench spawn_cost`), never a gate.
[[bench]]
name = "spawn_cost"
harness = false

# What the spawn lock costs a spawn and a kept-out socket's creation under a spawn-heavy load:
# a benchmark run by hand (`targo --unverified bench -p aterm-uds --bench spawn_lock_cost`),
# never a gate.
[[bench]]
name = "spawn_lock_cost"
harness = false

# Explicit mounted-volume acceptance; not an ordinary test or a release dependency.
[[bench]]
name = "dmg_acceptance"
harness = false
test = false
