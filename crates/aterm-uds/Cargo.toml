description = "aterm — the portable control-socket stream: pure type aliases to std Unix-domain sockets on Unix, AF_UNIX over winsock (afunix.sys) on Windows, plus the latest-alias, CSPRNG, pid-liveness, and SCM_RIGHTS descriptor-passing helpers the control channel needs. Std-only; the Windows side is direct ws2_32/kernel32/bcrypt FFI."

# Deliberately dependency-free on EVERY platform (the Windows side is raw
# `unsafe extern "system"` FFI, the house pattern) so the whole transport
# stays auditable in one small crate.
