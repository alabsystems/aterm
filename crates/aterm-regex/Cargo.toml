[package]
name = "aterm-regex"
# Integration tests are modules of one suite binary (`tests/regex_suite.rs`).
autotests = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "aterm's first-party regular-expression engine: a bounded Pike VM (parse -> NFA -> parallel simulation) with linear-time matching, replacing the `regex` crate"

[dependencies]
# None, deliberately: `regex` cost four third-party packages (~158k lines) for the
# handful of APIs this crate provides.

[lints]
workspace = true

[[test]]
name = "regex_suite"
path = "tests/regex_suite.rs"
