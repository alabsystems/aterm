[package]
name = "aterm-release"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "aterm — the one-command release cutter behind the `targo --unverified ship` alias: ledger claim, universal build, bundle/sign/DMG, tag, one publication onto the release channel."

# Binary-only on purpose (no lib.rs; src/main.rs says why): every module is a private
# `mod` of this binary, so dead_code judges each item against what main() can reach.
#
# The integration tests reach the pipeline by `#[path]`-mounting src/ into a test
# crate, and every mount compiles the whole cutter again and runs all of its inline
# `#[cfg(test)]` tests again. So the mounts live in ONE test binary, tests/it/main.rs,
# and this bin has `test = false`: each inline test runs once, in `it`, instead of
# once here and once per mounting file (14 files mounted all fifteen modules, and a
# `targo --unverified test -p aterm-release` ran 3,870 tests to check 534 fns).
# What that costs, on purpose:
#  - `targo --unverified test --bin aterm-release` runs nothing; the inline tests
#    are in `it`, which `-p aterm-release` and `--tests` both run.
#  - `it` reaches `pub(crate)` items through the mounts, which carry
#    `#[allow(dead_code)]`; the dead-code line is this binary's build, not the tests'.
# A lib target would run each inline test once without any mounts, but every `pub`
# item would then be exported and escape dead_code, and any crate could link the
# cutter. That is a change to the spec's file plan, not to the test layout.
[[bin]]
name = "aterm-release"
path = "src/main.rs"
test = false

[dependencies]
# The shared RFC3339 / Howard-Hinnant civil-calendar math (`aterm_types::rfc3339`);
# already in the dependency graph via aterm-update-core.
aterm-types = { workspace = true }
# How each write is finished: durable (F_FULLFSYNC) or ordered (F_BARRIERFSYNC).
aterm-durable = { workspace = true }
# The shared serde `Manifest` type (release spec §4) lives in aterm-update-core
# so publisher and updater client agree by compilation, not by convention — the
# publish-time byte round-trip through the CLIENT's parser is the bridge proof.
aterm-update-core = { workspace = true }
# The LIFELINE the x86_64 slice's Rosetta session holds (`aterm_uds::lifeline`,
# gap #36): a cut killed mid-drive takes the translated instance with it. A
# dependency-free leaf the shipped binary links already.
aterm-uds = { workspace = true }
# The cutter builds with the toolchain atpkg installs, so it resolves the store the
# same way atpkg does rather than guessing at a path.
atpkg = { workspace = true }
# Manifest emission, the dist/cut-state.toml resume journal, and the release.conf
# key=value surface are all serde-derived TOML (derive comes with the workspace dep).
serde = { workspace = true, features = ["derive"] }
# First-party JSON (crates/aterm-json): the serde Deserializer/Serializer plus the
# untyped `Value` and `json!`. Replaces `serde_json` and the `zmij` float formatter
# behind it.
aterm-json = { workspace = true }
aterm-toml = { workspace = true }
# DMG sha256 is computed in-process (dmg.rs) — never shelled out to `shasum`,
# so the digest that lands in the manifest is the digest of the bytes we hashed.
aterm-digest = { workspace = true }
# Release-channel signatures are verified in the cutter itself.  The signer is
# deliberately external/owner-only, but trusting its exit status would not bind
# the bytes uploaded to the public key compiled into clients.
ring = { workspace = true }
# Standard padded Base64 — first-party and zero-dependency. `decode_strict` is
# the entry point every trust path uses: canonical padding REQUIRED and no
# trailing bits, so a pinned key has exactly one spelling.
aterm-codec = { workspace = true }
# The provisioning engine: `targo --unverified ship provision` drives the join ceremony
# in-process (RELEASE-KEYS.md's "signing is in-process" rule, extended to
# minting), so one phrase prompt provisions the machine with no second binary.
# This edge unifies ring's default features (RNG) into THIS binary's graph —
# deliberate: the cutter is owner-only; shipped clients keep their own graphs.
atpkg-keys = { workspace = true }
# The candidate gate's ADMISSION rule (`channel::candidate`: the receipt, which one
# governs, and every reason it admits nothing) is the producer's, answered there
# in-process for the `rustc` group's publish; `ship trust candidate` writes the receipt
# it reads and asks the same rule under `--admits`. Std-only on that side.
atpkg-publish = { workspace = true }
# `ship site` builds alab.systems' `/terminal` engine itself (site/engine.rs): the
# CPU module's JS glue comes from `verify glue`'s generator in process, the shipping
# wasm-opt flags are the ones the wasm perf lane runs, and the wasm32 pin's rustup is
# found the way the STOCK EXCEPTION lanes find it. First-party, no cycle: nothing
# links this binary-only crate.
aterm-verify = { workspace = true }

# Same-filesystem clock stamps own an exclusive scratch directory in the slot;
# they never remove a fixed pre-existing marker merely to read its mtime.
aterm-tempfile = { workspace = true }

[dev-dependencies]
# Tier-1 binds the real release-floor resolver and late guard to their derived
# lifecycle model; production release binaries retain no spec dependency.
aterm-spec = { workspace = true }
# The models its tests drive (a model edit rebuilds only their tests).
aterm-models-release = { workspace = true }
# The wire `ship release` asks the owner through (`notice ask`): its tests hold every
# ask the release can raise to the wire's own parse, so none is refused at the door.
aterm-messages = { workspace = true }
# The updater's own reading of a bundle's dev mark: `ship dev-app`'s tests hold the
# plist it stamps to it, so the mark it seals is the one the updater leaves alone.
aterm-update = { workspace = true }

[lints]
workspace = true
