[package]
name = "aterm-release"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "aterm — the one-command release cutter behind the `cargo ship` alias: ledger claim, universal build, bundle/sign/DMG, draft-first GitHub publish, post-publish verify."

[[bin]]
name = "aterm-release"
path = "src/main.rs"

[dependencies]
# The shared RFC3339 / Howard-Hinnant civil-calendar math (`aterm_types::rfc3339`);
# already in the dependency graph via aterm-update-core.
aterm-types = { workspace = true }
# The shared serde `Manifest` type (release spec §4) lives in aterm-update-core
# so publisher and updater client agree by compilation, not by convention — the
# publish-time byte round-trip through the CLIENT's parser is the bridge proof.
aterm-update-core = { workspace = true }
# The cutter builds with the toolchain atpkg installs, so it resolves the store the
# same way atpkg does rather than guessing at a path.
atpkg = { workspace = true }
# Manifest emission, the dist/cut-state.toml resume journal, and the release.conf
# key=value surface are all serde-derived TOML (derive comes with the workspace dep).
serde = { workspace = true }
# First-party JSON (crates/aterm-json): the serde Deserializer/Serializer plus the
# untyped `Value` and `json!`. Replaces `serde_json` and the `zmij` float formatter
# behind it; `serde_json` survives only as that crate's [dev-dependencies] oracle.
aterm-json = { workspace = true }
aterm-toml = { workspace = true }
# DMG sha256 is computed in-process (dmg.rs) — never shelled out to `shasum`,
# so the digest that lands in the manifest is the digest of the bytes we hashed.
aterm-digest = { workspace = true }
# Release-channel signatures are verified in the cutter itself.  The signer is
# deliberately external/owner-only, but trusting its exit status would not bind
# the bytes uploaded to the public key compiled into clients.
ring = { version = "0.17.14", default-features = false }
# Standard padded Base64 — first-party, zero-dependency, and held byte-identical
# to the retired `base64` package's `general_purpose::STANDARD` engine by
# `crates/aterm-codec/tests/base64_oracle.rs`. `decode_strict` is the entry
# point every trust path uses: canonical padding REQUIRED and no trailing bits,
# so a pinned key has exactly one spelling.
aterm-codec = { workspace = true }
# The provisioning engine: `cargo ship provision` drives the join ceremony
# in-process (RELEASE-KEYS.md's "signing is in-process" rule, extended to
# minting), so one phrase prompt provisions the machine with no second binary.
# This edge unifies ring's default features (RNG) into THIS binary's graph —
# deliberate: the cutter is owner-only; shipped clients keep their own graphs.
atpkg-keys = { workspace = true }

[dev-dependencies]
# Tier-1 binds the real release-floor resolver and late guard to their derived
# lifecycle model; production release binaries retain no spec dependency.
aterm-spec = { workspace = true }

[lints]
workspace = true
