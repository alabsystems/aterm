[package]
name = "aterm-release"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "aterm — the one-command release cutter behind the `targo --unverified ship` alias: ledger claim, universal build, bundle/sign/DMG, tag, one publication onto the release channel."

# Binary-only (src/main.rs says why). The integration tests `#[path]`-mount src/ into one
# test binary, tests/it/main.rs; every mount recompiles the cutter and reruns its inline
# tests, so this bin has `test = false` and each inline test runs once, in `it`:
#  - `targo --unverified test --bin aterm-release` runs nothing; `-p aterm-release` and
#    `--tests` run `it`.
#  - `it` reaches `pub(crate)` items through the mounts, which carry
#    `#[allow(dead_code)]`; the dead-code line is this binary's build, not the tests'.
# A lib target would run each inline test once without any mounts, but every `pub`
# item would then be exported and escape dead_code, and any crate could link the
# cutter. That is a change to the spec's file plan, not to the test layout.
[[bin]]
name = "aterm-release"
path = "src/main.rs"
test = false

[dependencies]
# RFC3339 civil-calendar math (`aterm_types::rfc3339`).
aterm-types = { workspace = true }
# How each write is finished: durable (F_FULLFSYNC) or ordered (F_BARRIERFSYNC).
aterm-durable = { workspace = true }
# The publisher fence names its boot by the kernel's boot id (`boot_session`) and compares
# a recorded one as 16 bytes (`parse_boot_id`): astream's OS cordon, zero dependencies,
# already in the graph through aterm-durable.
astream-sys = { path = "../../vendor/astream/crates/astream-sys" }
# The serde `Manifest` type is shared with the updater client, so publisher and client
# agree by compilation; publish round-trips the bytes through the client's parser.
aterm-update-core = { workspace = true }
# The static bootstrap verifier a Linux worker builds beside the executable: its asset
# name, its static build's flags and install.sh's pin, which the cut prints.
aterm-bootstrap-verify = { workspace = true }
# The x86_64 slice's Rosetta session holds an `aterm_uds::lifeline`: a cut killed
# mid-drive takes the translated instance with it.
aterm-uds = { workspace = true }
# The Trust lane reads the host's load while each check runs (`load_average`): the judge
# files a shortfall as the clock's only for a starved run. Already in the graph through
# aterm-uds.
aterm-sysprobe = { workspace = true }
# The trust lane's run lock: a lock file that names its holder, and the wait on a held one
# (`named_lock`). Std only, and already in the graph through atpkg.
aterm-toolchain = { workspace = true }
# Each Trust lane check takes a memory claim in the machine's capacity ledger before it
# starts, and waits while its recorded peak does not fit beside the claims already held
# (docs/DESIGN-adaptive-build-2026-10-24.md TRUST-MEM). Workspace crate; first-party
# dependencies only, already in the graph through atpkg.
aterm-capacity = { workspace = true }
# The cutter builds with the toolchain atpkg installs, so it resolves the store the
# same way atpkg does rather than guessing at a path.
atpkg = { workspace = true }
# Manifest emission and the dist/cut-state.toml resume journal are serde-derived TOML.
serde = { workspace = true, features = ["derive"] }
# First-party JSON: serde Deserializer/Serializer, untyped `Value` and `json!`.
aterm-json = { workspace = true }
aterm-toml = { workspace = true }
# The DMG sha256 is computed in-process (dmg.rs), never by `shasum`, so the manifest
# carries the digest of the bytes we hashed.
aterm-digest = { workspace = true }
# Release-channel signatures are verified in the cutter: the external signer's exit status
# would not bind the uploaded bytes to the public key compiled into clients. `ship site`
# signs its Firebase Hosting deploy's OAuth2 assertion (RS256) with the deployer's
# service-account key, which needs `alloc`'s RsaKeyPair; atpkg-keys already unifies ring's
# default features (alloc among them) into this binary's graph, so naming it changes no build.
ring = { workspace = true, features = ["alloc"] }
# Standard padded Base64 — first-party; its one dependency is astream-wire
# (dependency-free, vendor/astream). `decode_strict` is
# the entry point every trust path uses: canonical padding REQUIRED and no
# trailing bits, so a pinned key has exactly one spelling.
aterm-codec = { workspace = true }
# The export's text rewrite (`aterm_census::export::rewrite`), defined once and
# shared with the census's export-content guard, which reads the checkout as the
# transforms leave it. std-only; its one dependency is aterm-regex.
aterm-census = { workspace = true }
# The harness versions gate and `ship harness-bump` read each harness's sources and version
# file from the one place the build reads them (`aterm_phase::CliHarness`); the reader is
# dependency-light (one first-party crate).
aterm-phase = { workspace = true }
# `ship provision` mints in-process, so one phrase prompt provisions the machine with no
# second binary. This unifies ring's default features (RNG) into this binary's graph only:
# the cutter is owner-only and shipped clients keep their own graphs.
atpkg-keys = { workspace = true }
# `ship site` builds alab.systems' `/terminal` engine itself (site/engine.rs): the
# CPU module's JS glue comes from `verify glue`'s generator in process, the shipping
# wasm-opt flags are the ones the wasm perf lane runs, and the wasm32 pin's rustup is
# found the way the STOCK EXCEPTION lanes find it. First-party, no cycle: nothing
# links this binary-only crate.
aterm-verify = { workspace = true }
# The release layer `ship provision` audits (provision/layer.rs, design §4.6) is
# aterm-converge items: one engine with `aterm init`, whose base report it reads back
# from the installed aterm in the engine's own schema.
aterm-converge = { workspace = true }
# The release.site-key row asks the lab for a missing deployer key through the need ledger
# (docs/DESIGN-credential-requests-2026-10-27.md §12.1). No cycle: aterm-secrets links no
# release crate.
aterm-secrets = { workspace = true }

# `ship site` uploads each file of the site as one gzip member around the PNG encoder's
# deterministic DEFLATE (no clock, name or host in a member), so its SHA-256 names the
# content for Firebase Hosting's populateFiles.
aterm-png = { workspace = true }

# Same-filesystem clock stamps own an exclusive scratch directory in the slot;
# they never remove a fixed pre-existing marker merely to read its mtime.
aterm-tempfile = { workspace = true }

[dev-dependencies]
# Binds the release-floor resolver and late guard to their derived lifecycle model.
aterm-spec = { workspace = true }
# The models its tests drive (a model edit rebuilds only their tests).
aterm-models-release = { workspace = true }
# Tests hold every ask the release can raise (`notice ask`) to the wire's own parse.
aterm-messages = { workspace = true }
# The updater's own reading of a bundle's dev mark: `ship dev-app`'s tests hold the
# plist it stamps to it, so the mark it seals is the one the updater leaves alone.
aterm-update = { workspace = true }
# A loopback GitHub (api, uploads, web and CDN origins): the release's REST lane
# (src/github.rs) is tested against it through the real /usr/bin/curl, never the network.
agh-fake = { workspace = true }

[lints]
workspace = true
