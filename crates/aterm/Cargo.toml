[package]
name = "aterm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "aterm — THE one binary: the transparent terminal session, the GPU window, and every verb (ctl/pkg/fleet/drive/help), behind a single name."

[[bin]]
name = "aterm"
path = "src/main.rs"

[dependencies]
# The four faces of the one command, all libraries:
aterm-cli = { path = "../aterm-cli" }     # the SESSION (PTY passthrough) + parser/diag/manual
aterm-gui = { path = "../aterm-gui" }     # the WINDOW (winit/wgpu) + headless engine
aterm-ctl = { path = "../aterm-ctl" }     # `aterm ctl`  — control-socket client
atpkg = { path = "../atpkg" }             # `aterm pkg`  — toolchain package manager
aterm-agent = { path = "../aterm-agent" } # `aterm fleet` / `aterm drive`
# The headless update lane: `aterm update status|check` and the session-mode
# background check/stage loop (round-11 — a terminal-only Mac used to run NONE
# of the updater, while install.sh promised automatic updates).
aterm-update = { path = "../aterm-update" }
aterm-log = { path = "../aterm-log" }    # stderr logger for the headless update lane
# THE compiler gate (crates/trust-gate): a build script with no dependencies
# that refuses any non-Trust rustc FIRST, with the one message naming the fix
# (`aterm pkg doctor`, or the installer), instead of letting an upstream
# compiler die deep in the graph on Trust-only syntax. Native builds only
# (TARGET == HOST): the release's x86_64 compat slice is a cross build on
# upstream stable and is not gated. The library is empty; nothing links in.
trust-gate = { path = "../trust-gate" }

[dev-dependencies]
# The front-door verb-routing test drives the binary under a REAL pty: the
# regression it pins (`aterm ship` reaching the session parser) is invisible
# with piped stdio, because piped stdio takes the WINDOW route instead.
libc = { workspace = true }

[build-dependencies]
# Windows only: compile + link the icon, the side-by-side manifest and
# VS_VERSION_INFO into THE shipped exe (build.rs → OUT_DIR/aterm.rc). It has to
# live HERE and not in aterm-gui: `embed_resource::compile` emits
# `cargo:rustc-link-arg-bins`, which reaches only its own package's bins, so
# aterm-gui's copy only ever decorated `aterm-gui.exe` — never the binary
# install.ps1 actually ships. Same version aterm-gui already pins, so it adds
# nothing to the dependency tree. The crate is a documented no-op when the
# target is not Windows, and build.rs returns before calling it anyway.
embed-resource = "3"

[lints]
workspace = true
