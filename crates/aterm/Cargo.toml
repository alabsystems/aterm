[package]
name = "aterm"
# Integration tests are declared below, not discovered: the live headless files
# are modules of one suite binary where they can share a process. With autotests
# off a `tests/*.rs` file listed nowhere never compiles.
autotests = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "aterm — THE one binary: the transparent terminal session, the GPU window, and every verb (ctl/pkg/fleet/drive/help), behind a single name."
# Select the product front door when `targo --unverified run -p aterm` omits
# `--bin`; the Windows launcher below is a second development target.
default-run = "aterm"

[[bin]]
name = "aterm"
path = "src/main.rs"

# The WINDOWED image of the same front door, for Windows: the PE subsystem is a
# per-file header field the shell keys on (it waits for a console-subsystem
# child and not for a GUI one), so `aterm.exe` above is CONSOLE subsystem and
# this second file object — `src/windowed.rs`, which `#[path]`-includes
# `src/main.rs` and adds only `windows_subsystem = "windows"` — is what the Start
# Menu, the Explorer verb and a pinned tile launch without a console flash.
# `apps/aterm-win/build.ps1` ships it renamed to `aterm-gui.exe` (crate
# `aterm-gui` already owns the bin name `aterm-gui`, so the target cannot be
# called that). A `[[bin]]` cannot be made target-conditional, so on macOS and
# Linux it still builds — as a std-only stub that says to run `aterm` and exits
# 2, never a second link of the whole front door (with `lto = true` that would
# double the slowest step of every release build) — and it is on no bundle or
# release list there.
[[bin]]
name = "aterm-windowed"
path = "src/windowed.rs"

[dependencies]
# The four faces of the one command, all libraries:
aterm-cli = { path = "../aterm-cli" }     # the SESSION (PTY passthrough) + parser/diag/manual
aterm-gui = { path = "../aterm-gui" }     # the WINDOW (winit/wgpu) + headless engine
aterm-ctl = { path = "../aterm-ctl" }     # `aterm ctl`  — control-socket client
# `aterm ctl cast drift` computed client-side (a server that predates the verb,
# or saved files): the replay audit is aterm-control's, the code the server
# runs, handed to the dependency-free aterm-ctl as a plain fn (`CTL_LOCAL`).
# Already in the graph through aterm-gui; no new crate reaches the binary.
aterm-control = { path = "../aterm-control" }
atpkg = { path = "../atpkg" }             # `aterm pkg`  — toolchain package manager
# The Full Disk Access probe's child, `aterm __tcc-open` (`consent::run_open_probe_verb`);
# already in the graph through aterm-gui.
aterm-containment = { workspace = true }
# The workspace's one epoch-clock read; already in the graph through aterm-gui.
aterm-time = { workspace = true }
# Windows: a tab's console clients, `aterm --conpty-input-guard` and
# `--conpty-leave-alt-screen` (`serve_console_client`); already in the graph
# through aterm-gui.
aterm-pty = { workspace = true }
# `aterm update`'s log hint names the resolved log directory (`dirs::logs_dir`);
# already in the graph through aterm-gui.
aterm-types = { workspace = true }
aterm-agent = { path = "../aterm-agent" } # `aterm fleet` / `aterm drive`
# `aterm keeper start|stop|status|serve` — the PTY keeper (opt-in).
aterm-keeper = { path = "../aterm-keeper" }
# `aterm caffeine` — the menu-bar keep-awake mug. Compiles everywhere: its
# AppKit half is `cfg(target_os = "macos")` and the verb refuses by name elsewhere.
aterm-caffeine = { workspace = true }
# `aterm link` — the fabric bridge — is a UNIX-ONLY dependency; see the
# `[target.'cfg(unix)'.dependencies]` table below and the `Link` arms in
# src/main.rs.
# The headless update lane: `aterm update status|check` and the session-mode
# background check/stage loop (round-11 — a terminal-only Mac used to run NONE
# of the updater, while install.sh promised automatic updates).
aterm-update = { path = "../aterm-update" }
# The atpkg "never checked" read (R3/R4, 2026-09-10): one tiny shared reader of
# `<prefix>/status.toml` so the session lane says on stderr that packages cannot
# be updated yet, and spawns the one-shot pass, without reaching into atpkg's
# internals beyond the file.
aterm-update-core = { path = "../aterm-update-core" }
aterm-log = { path = "../aterm-log" }    # the log facade (the update verb records to aterm.log)
# `aterm_uds::spawnfd::command` for the windowed front door's launch (Windows: no
# descriptor to strip there, and one spelling of a spawn everywhere,
# clippy.toml: one child constructor), with its console flag (`Console::Detached`)
# from `aterm_uds::spawn::set_gui_image_flags`. Every
# live-headless test arms its instance with this crate's lifeline too
# (`tests/support/launch_isolation.rs::lifeline`), so a killed test run takes its
# instances with it. A dependency-free leaf the binary links already.
aterm-uds = { workspace = true }

# `aterm link` — the fabric bridge. A LIBRARY like every other verb, so the one
# Mach-O carries it: before 2026-09-10 this crate lived outside the workspace
# and path-depended on a sibling astream checkout, so no release ever shipped
# the bridge and turning the fabric on meant building two repositories by hand.
# Its astream crates come from the vendor/astream submodule (see
# vendor/README-astream.md), and none of them carries a cipher tree.
#
# UNIX ONLY, on purpose: the bridge is Unix-domain sockets and
# descriptors inherited at fixed numbers (`aterm_uds::spawnfd`: `dup2` between
# fork and exec) end to end — `std::os::unix` and `std::os::fd` at module
# level in ctl.rs, and a Unix-socket dial and owner-only permission bits in
# transport.rs — and astream has that face only on unix too (`Broker::serve` is
# `cfg(unix)`, and `connect` refuses `Transport::Unix` elsewhere; the broker
# itself serves TCP on Windows); on macOS the broker is kept alive by launchd.
# Unconditional, it would make the Windows binary unbuildable: `verify cells`
# type-checks `-p aterm` for x86_64-pc-windows-msvc and fails on the
# `std::os::unix` imports. The x86_64-pc-windows-gnu cfg-validation lane
# (.cargo/config.toml's `[target.x86_64-pc-windows-gnu]` linker/ar pair) needs
# crates/aterm-libc's windows-gnu cell, or it dies on a `compile_error!` at the
# BOTTOM of the graph before one line of `cfg(windows)` code is read. On non-unix targets the
# `link` verb stays on the roster and refuses by name (src/main.rs
# `link_unavailable`) instead of failing to exist.
[target.'cfg(unix)'.dependencies]
aterm-link = { path = "../aterm-link" }

# `aterm machines` — a lab of Macs managed from this one over SSH
# (docs/DESIGN-machines-2026-10-16.md). MACOS ONLY: it drives macOS's own tools
# (`defaults`, `scutil`, `launchctl`, `dns-sd`, Apple's `ssh-keygen`), so the
# other cells never build it, and `machines_unavailable` in src/main.rs answers
# the verb there by name.
[target.'cfg(target_os = "macos")'.dependencies]
aterm-machines = { workspace = true }

[features]
# DEVELOPMENT SEAMS in an optimized build: every `aterm_types::dev_seam!` read (the
# `ATPKG_REGISTRY` fetch source, the `ATERM_UPDATE_ROOT` ledger, the handoff deadlines,
# the `ATERM_DEBUG_*` screenshot seams, …) and the development settings (`[update]`
# owner/repo, `[packages]` prefix/account/repo links). A debug build compiles them
# anyway; an optimized QA build asks for them with `-p aterm --features dev-seams`.
# The release cutter NEVER enables it — `aterm-release`'s buildplan pins that — so a
# shipped binary reads none of them (owner, 2026-09-22: "NOT ENV VARS those are for
# development").
dev-seams = [
    "aterm-agent/dev-seams",
    "aterm-gui/dev-seams",
    "aterm-link/dev-seams",
    "aterm-update/dev-seams",
    "atpkg/dev-seams",
]

[dev-dependencies]
# The live tests' raw process and descriptor calls (signals, waits, process groups, fd flags, rlimits).
libc = { workspace = true }
# Private scratch directories removed on drop, and `stand_in` programs (in an
# optimized test build too).
aterm-tempfile = { workspace = true, features = ["test-support"] }
# The live tests' bounded polls (`aterm_spec::wait`): one hang-detector loop.
aterm-spec = { workspace = true }
# The models its tests drive (a model edit rebuilds only their tests).
aterm-models-session = { workspace = true }
# The front-door verb-routing test drives the binary under a REAL pty: the
# regression it pins (`aterm ship` reaching the session parser) is invisible
# with piped stdio, because piped stdio takes the WINDOW route instead. Its
# pairs, and the launch tests', come from `open_pty_pair`, both ends
# close-on-exec from birth: an `openpty(3)` pair is inheritable, and the child
# spawned onto it kept a copy of its own master. Already in the graph through
# aterm-gui.
aterm-pty = { workspace = true }
# The fleet listener's live test dials a real instance as a fleet member would
# (`aterm_net::fleet::client_handshake`). Already in the graph through aterm-gui.
aterm-net = { workspace = true }
# The fabric worlds' fixture config is asserted as TOML.
aterm-toml = { workspace = true }
# The bus mirror's world (`tests/fabric_world/log_mirror.rs`) decodes and folds
# the session logs' bus bodies as every reader does (`aterm_slog::bus`).
aterm-slog = { workspace = true }
# `fabric status --json` is asserted as JSON, not as substrings.
aterm-json = { workspace = true }
# The spare suite asks which system files the host's zsh reads before aterm's
# parked hold (`pre_hold_files`). Already in the graph through aterm-gui.
aterm-shell-integration = { workspace = true }

# The fabric worlds (`tests/fabric_world`): an in-process guarded broker and the
# caps minted for it.
[target.'cfg(unix)'.dev-dependencies]
astream-broker = { path = "../../vendor/astream/crates/astream-broker", features = ["cap"] }
astream-cap = { path = "../../vendor/astream/crates/astream-cap" }

[build-dependencies]
# Windows only: compile + link the icon, the side-by-side manifest and
# VS_VERSION_INFO into THE shipped exe (build.rs → OUT_DIR/aterm.rc). It has to
# live HERE and not in aterm-gui: the step emits `cargo:rustc-link-arg-bins`,
# which reaches only its own package's bins, so aterm-gui's copy only ever
# decorated `aterm-gui.exe` — never the binary install.ps1 actually ships.
# First-party (crates/aterm-winres) since 2026-09-14: the `embed-resource` it
# replaces pulled `vswhom` into the msvc graph, which reaches `libc::wchar_t`
# and `libc::wcslen` — items crates/aterm-libc deliberately does not declare on
# Windows — so the native msvc build failed closed. The step is a documented
# no-op when the target is not Windows, and build.rs returns before calling it
# anyway.
aterm-winres = { workspace = true }

[lints]
workspace = true

[[test]]
name = "aterm_suite"
path = "tests/aterm_suite.rs"

# The fabric worlds: a broker, this binary `--headless` and the `aterm link
# serve` bridge it launches. Its own binary: its harness caps the live stacks
# it holds at once.
[[test]]
name = "fabric_world"
path = "tests/fabric_world/main.rs"

# Pure helpers shared with the fabric measurement; no live measurement entry.
[[test]]
name = "fabric_bench"
path = "tests/fabric_bench/main.rs"

# Live post/delivery, burst, ping-pong and attach measurements over the same
# stack the fabric worlds boot. `verify perf fabric` explicitly runs this
# bench alone with a required FABRIC_BENCH specification.
[[bench]]
name = "fabric_bench"
path = "benches/fabric_bench.rs"
harness = false

# Alone: raises this process's descriptor limit.
[[test]]
name = "control_lanes_live_headless"
path = "tests/control_lanes_live_headless.rs"

# Alone: inheritable pty descriptors a sibling's child could hold open.
[[test]]
name = "front_door_verbs"
path = "tests/front_door_verbs.rs"

# Alone: inheritable pty descriptors a sibling's child could hold open.
[[test]]
name = "session_launch_silence"
path = "tests/session_launch_silence.rs"
