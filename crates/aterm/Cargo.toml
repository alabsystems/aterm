[package]
name = "aterm"
# Integration tests are declared below, not discovered: the live headless files
# are modules of one suite binary where they can share a process. With autotests
# off a `tests/*.rs` file listed nowhere never compiles.
autotests = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "aterm — THE one binary: the transparent terminal session, the GPU window, and every verb (ctl/pkg/fleet/drive/help), behind a single name."
# Select the product front door when `targo --unverified run -p aterm` omits
# `--bin`; the Windows launcher below is a second development target.
default-run = "aterm"

[[bin]]
name = "aterm"
path = "src/main.rs"

# The windowed image of the same front door, for Windows. The PE subsystem is a per-file header
# field a shell keys on (it waits for a console-subsystem child, not a GUI one), so `aterm.exe` is
# console subsystem and this bin (`src/windowed.rs`: `src/main.rs` plus
# `windows_subsystem = "windows"`) is what the Start Menu, Explorer and a pinned tile launch
# without a console flash. `apps/aterm-win/build.ps1` ships it as `aterm-gui.exe` (crate
# aterm-gui owns that bin name). A `[[bin]]` cannot be target-conditional, so elsewhere it builds
# as a std-only stub that exits 2, not a second LTO link of the front door, and ships nowhere.
[[bin]]
name = "aterm-windowed"
path = "src/windowed.rs"

[dependencies]
# The four faces of the one command, all libraries:
aterm-cli = { path = "../aterm-cli" }     # the SESSION (PTY passthrough) + parser/diag/manual
aterm-gui = { path = "../aterm-gui" }     # the WINDOW (winit/wgpu) + headless engine
aterm-ctl = { path = "../aterm-ctl" }     # `aterm ctl`  — control-socket client
# `aterm ctl cast drift` computed client-side (an older server, or saved files): the replay audit
# is aterm-control's, the code the server runs, handed to the dependency-free aterm-ctl as a plain
# fn (`CTL_LOCAL`). Already in the graph through aterm-gui.
aterm-control = { path = "../aterm-control" }
atpkg = { path = "../atpkg" }             # `aterm pkg`  — toolchain package manager
agh = { path = "../agh" }               # `aterm agh`  — the GitHub client
# `aterm doctor` composed here (docs/DESIGN-init-system-2026-10-20.md §3.4): aterm-cli's
# items, the packages' repair items and `pkg doctor`'s rows through the one engine, its
# `--json` in the one report schema. Both already in the graph through atpkg.
aterm-converge = { workspace = true }
aterm-json = { workspace = true }
# The Full Disk Access probe's child, `aterm __tcc-open` (`consent::run_open_probe_verb`);
# already in the graph through aterm-gui.
aterm-containment = { workspace = true }
# The workspace's one epoch-clock read; already in the graph through aterm-gui.
aterm-time = { workspace = true }
# Windows: a tab's console clients, `aterm --conpty-input-guard` and
# `--conpty-leave-alt-screen` (`serve_console_client`); already in the graph
# through aterm-gui.
aterm-pty = { workspace = true }
# `aterm update`'s log hint names the resolved log directory (`dirs::logs_dir`);
# already in the graph through aterm-gui.
aterm-types = { workspace = true }
aterm-agent = { path = "../aterm-agent" } # `aterm fleet` / `aterm drive`
# `aterm keeper start|stop|status|serve` — the PTY keeper (opt-in).
aterm-keeper = { path = "../aterm-keeper" }
# `aterm caffeine` — the menu-bar keep-awake mug. Compiles everywhere: its
# AppKit half is `cfg(target_os = "macos")` and the verb refuses by name elsewhere.
aterm-caffeine = { workspace = true }
# `aterm link` (the fabric bridge) is in the unix-only table below.
# The headless update lane: `aterm update status|check` and the session-mode background
# check/stage loop.
aterm-update = { path = "../aterm-update" }
# `pkg_check` (when the session lane spawns the detached `aterm pkg update` pass, read from
# atpkg's `<prefix>/status.toml`) and the `[update]` settings.
aterm-update-core = { path = "../aterm-update-core" }
aterm-log = { path = "../aterm-log" }    # the log facade (the update verb records to aterm.log)
# `aterm_uds::spawnfd::command` and `spawn::set_gui_image_flags` for the windowed front door's
# launch. Every live-headless test arms its instance with this crate's lifeline
# (`tests/support/launch_isolation.rs::lifeline`), so a killed test run takes its instances with
# it.
aterm-uds = { workspace = true }

# `aterm link` — the fabric bridge. A LIBRARY like every other verb, so the one
# Mach-O carries it. Its astream crates come from the vendor/astream submodule (see
# vendor/README-astream.md), and none of them carries a cipher tree.
#
# Unix only: the bridge is Unix-domain sockets and descriptors inherited at fixed numbers
# (`aterm_uds::spawnfd`) end to end, and astream has that face only on unix (`Broker::serve` is
# `cfg(unix)`; `connect` refuses `Transport::Unix` elsewhere). `verify cells` type-checks
# `-p aterm` for x86_64-pc-windows-msvc, where an unconditional dependency fails on the
# `std::os::unix` imports. Off unix the `link` verb stays on the roster and refuses by name
# (src/main.rs `link_unavailable`).
[target.'cfg(unix)'.dependencies]
aterm-link = { path = "../aterm-link" }
# `aterm secrets` — one credentials file for every machine
# (docs/DESIGN-secrets-2026-10-20.md): the vault's client, its keyless
# long-poll server and the launchd/systemd services. UNIX ONLY: the secrets
# are kept private by POSIX file modes (0600 files in a 0700 ~/.secrets),
# which Windows has none of, so there the verb stays on the roster and
# refuses by name (`secrets_unavailable` in src/main.rs).
aterm-secrets = { workspace = true }

# `aterm machines` — a lab of Macs managed from this one over SSH
# (docs/DESIGN-machines-2026-10-16.md). MACOS ONLY: it drives macOS's own tools
# (`defaults`, `scutil`, `launchctl`, `dns-sd`, Apple's `ssh-keygen`), so the
# other cells never build it, and `machines_unavailable` in src/main.rs answers
# the verb there by name.
[target.'cfg(target_os = "macos")'.dependencies]
aterm-machines = { workspace = true }

# The transparent session's cancellable first-run countdown owns the tty before
# its shell starts, and restores its termios before handing it to the session.
libc = { workspace = true }

[features]
# Development seams in an optimized build: every `aterm_types::dev_seam!` read (the
# `ATPKG_REGISTRY` fetch source, the `ATERM_UPDATE_ROOT` ledger, the handoff deadlines, the
# `ATERM_DEBUG_*` screenshot seams, …) and the development settings (`[update]` owner/repo,
# `[packages]` prefix/account/repo links). A debug build compiles them anyway. The release
# cutter never enables it (`aterm-release`'s buildplan pins that), so a shipped binary reads none.
dev-seams = [
    "aterm-agent/dev-seams",
    "aterm-cli/dev-seams",
    "aterm-gui/dev-seams",
    "aterm-link/dev-seams",
    "aterm-update/dev-seams",
    "atpkg/dev-seams",
]

[dev-dependencies]
# `plain_durable_flushes_in_tests!`: fabric_world and aterm_suite mark their process trees
# as a test's, so the instances and brokers they start take a plain `fsync(2)`.
aterm-durable = { workspace = true }
# The live tests' raw process and descriptor calls (signals, waits, process groups, fd flags,
# rlimits).
libc = { workspace = true }
# Private scratch directories removed on drop, and `stand_in` programs.
aterm-tempfile = { workspace = true }
# The live tests' bounded polls (`aterm_spec::wait`): one hang-detector loop.
aterm-spec = { workspace = true }
# The models its tests drive (a model edit rebuilds only their tests).
aterm-models-session = { workspace = true }
# The front-door verb-routing test drives the binary under a real pty (piped stdio takes the
# window route instead). Its pairs, and the launch tests', come from `open_pty_pair`, both ends
# close-on-exec from birth: an `openpty(3)` pair is inheritable, so a child would hold its own
# master open.
aterm-pty = { workspace = true }
# The fleet listener's live test dials a real instance as a fleet member would
# (`aterm_net::fleet::client_handshake`). Already in the graph through aterm-gui.
aterm-net = { workspace = true }
# The fabric worlds' fixture config is asserted as TOML.
aterm-toml = { workspace = true }
# The bus mirror's world (`tests/fabric_world/log_mirror.rs`) decodes and folds
# the session logs' bus bodies as every reader does (`aterm_slog::bus`).
aterm-slog = { workspace = true }
# `fabric status --json` is asserted as JSON, not as substrings: aterm-json is a
# [dependencies] row (the doctor's `--json`), which the tests reach too.
# The spare suite asks which system files the host's zsh reads before aterm's
# parked hold (`pre_hold_files`). Already in the graph through aterm-gui.
aterm-shell-integration = { workspace = true }

# The fabric worlds (`tests/fabric_world`): an in-process guarded broker and the
# caps minted for it.
[target.'cfg(unix)'.dev-dependencies]
astream-broker = { path = "../../vendor/astream/crates/astream-broker", features = ["cap"] }
astream-cap = { path = "../../vendor/astream/crates/astream-cap" }

[build-dependencies]
# Windows only: compiles and links the icon, the side-by-side manifest and VS_VERSION_INFO into
# the shipped exe (build.rs → OUT_DIR/aterm.rc). It lives here, not in aterm-gui, because the
# step's `cargo:rustc-link-arg-bins` reaches only its own package's bins. First-party because
# `embed-resource` pulls `vswhom`, which needs `libc::wchar_t`/`wcslen`, items crates/aterm-libc
# does not declare on Windows.
aterm-winres = { workspace = true }

[lints]
workspace = true

[[test]]
name = "aterm_suite"
path = "tests/aterm_suite.rs"

# The fabric worlds: a broker, this binary `--headless` and the `aterm link
# serve` bridge it launches. Its own binary: its harness caps the live stacks
# it holds at once.
[[test]]
name = "fabric_world"
path = "tests/fabric_world/main.rs"

# Pure helpers shared with the fabric measurement; no live measurement entry.
[[test]]
name = "fabric_bench"
path = "tests/fabric_bench/main.rs"

# Live post/delivery, burst, ping-pong and attach measurements over the same
# stack the fabric worlds boot. `verify perf fabric` explicitly runs this
# bench alone with a required FABRIC_BENCH specification.
[[bench]]
name = "fabric_bench"
path = "benches/fabric_bench.rs"
harness = false

# Alone: raises this process's descriptor limit.
[[test]]
name = "control_lanes_live_headless"
path = "tests/control_lanes_live_headless.rs"

# Alone: a sibling test's child could inherit its descriptors and hold them open.
[[test]]
name = "front_door_verbs"
path = "tests/front_door_verbs.rs"

# Alone: a sibling test's child could inherit its descriptors (std makes a pipe close-on-exec
# non-atomically on macOS) and hold them open.
[[test]]
name = "session_launch_silence"
path = "tests/session_launch_silence.rs"
