[package]
name = "aterm-lab"
version.workspace = true
edition = "2024"
license = "Apache-2.0"
publish = false
description = "The real-Claude lab: the real Claude Code TUI (and Codex, Gemini CLI, agy, Muse Code) in a private, jailed headless aterm against a local stub of the API; and private aterm instances for checking a change (instance, trail-gallery, presence-flap, codex-alab-proof, fleet-sim)"

# Dev-only: never packed or shipped (the workspace's atpkg expose/bundle lists
# name `aterm` alone). Run it as `targo --unverified lab <verb>` (the
# `.cargo/config.toml` alias for `run -q -p aterm-lab --`).
[[bin]]
name = "aterm-lab"
path = "src/main.rs"

[dependencies]
# The in-process control connection (`RelayClient`): the frame stream
# (`subscribe`) and `await match` waits ride one authenticated socket instead of
# a client process per read. And the shipped price table and its loader
# (`harness::spend`), which `prices` sets against a build's own catalog.
aterm-agent = { workspace = true }
# The one spawn seam (`spawnfd::command`: posix_spawn, `setsid` as a spawn
# attribute) and the lifeline a throwaway instance watches.
aterm-uds = { workspace = true }
# The PTY pair the relay puts between aterm's tab and Claude Code.
aterm-pty = { workspace = true }
# Claude Code's screen text (`aterm_phase::anchors`): the card, the banner, the
# mode rows and the busy hint the lab waits on and judges by, never copied here.
aterm-phase = { workspace = true }
# The workspace's JSON parser: request bodies, settings, tool scripts, records.
aterm-json = { workspace = true }
# The workspace's TOML parser: a `harness` value is written as typed only when
# it is a TOML value, so the scratch `aterm.toml` stays one aterm can read.
aterm-toml = { workspace = true }
# The workspace's HTTP/1.1 client: the stub's control calls and its self-test,
# so the stub's framing (chunked SSE) is read by an independent parser.
aterm-http = { workspace = true }
# The regex of `catch` (the workspace's own engine; `await match` waits use the server's).
aterm-regex = { workspace = true }
# The workspace's PNG decoder: the Linux baseline's frames (`linux_baseline`),
# decoded to read the drop highlight, and the frames `trail-contrast` reads
# (every colour type and depth, never a hand-written decoder).
aterm-png = { workspace = true }
# The build slots' lockless reader (`slot-capture`, `slot-lane`): the record
# parse the capture holds to the real build-slot, and the reader the watch sets
# beside the holder scan. Already in the graph through aterm-uds.
aterm-sysprobe = { workspace = true }
# The far end's own screen, replayed from a link take (`predict-live`): the
# engine aterm draws with, so the oracle is the instance's own fold.
aterm-core = { workspace = true }
# The terminal grid's own width table: how many cells a glyph of a frame's
# screen text takes (`trail-contrast`). Already in the graph through aterm-agent.
aterm-grapheme = { workspace = true }
# `fleet-sim` dials a member's fleet port as a reader does (the mutual proof,
# the key file) and speaks the wire for the reflected-tag conformance probe.
aterm-net = { workspace = true }
# The survey text's `tty::one_line` escaping judged, and the fixture's
# transcript written with the one JSON escape.
aterm-codec = { workspace = true }
rustls = { workspace = true }
# `fleet-sim`'s raw wrong-secret dialer: the documented proof (HKDF and
# HMAC-SHA256 over the channel exporter) computed apart from aterm-net's.
aterm-digest = { workspace = true }
# `fleet-sim` holds a fleet read to the client's own deadline and budget
# (`FLEET_WITHIN`, `DEFAULT_BUDGET`). Not a new edge in the build graph:
# aterm-agent above already depends on it.
aterm-ctl = { path = "../aterm-ctl" }
# Signals, terminal modes, ioctls and the Mach bootstrap probe (`sys`).
libc = { workspace = true }
# The disk lane's fixtures finish their writes before it reads free space.
aterm-durable = { workspace = true }
# The node ring a bridge attaches with (`enable::node_grants`), THE ring
# `aterm fabric on` mints: `codex-alab-proof` stands its own bus up for the
# mail step, and a grant the bridge needs cannot be added there and forgotten
# here.
aterm-link = { path = "../aterm-link" }

# `linux vz-agent` finds rustup as `verify cells` does (`rustup::find_rustup`).
# Not a new edge in the build graph: aterm-agent above already depends on it.
aterm-toolchain = { workspace = true }

# `aos-search` runs Aos M4's evaluator in process: schedule plans, the grid and file
# proposers, the evaluator and the provenance bundle exist in a release build only
# under `aos-candidates`. aterm-lab is the one crate that enables it (design §10.8):
# never aterm-bench or aterm-verify, whose builds unify features with the shipped app.
aterm-effects = { workspace = true, features = ["aos-candidates"] }
# `aos-repair --publish` and its `--control` replay a window's exported momentum trace in the
# lab (`aos_phase`): the replay, the code seam and the wire encoder are the Aos crate's own.
# Not a new edge in the build graph: aterm-effects above already depends on it.
aterm-aos = { workspace = true }
# `aos-search --workers`' frames: astream's 12-byte header with CRC-32 (design §11.6). A
# dependency-free leaf already in the graph through aterm-restore and aterm-codec.
astream-wire = { path = "../../vendor/astream/crates/astream-wire" }
# Private, exclusively created directories for lab runs and counterfeit API fixtures.
aterm-tempfile = { workspace = true }
# `abrew-admission` runs abrew's own admission code over Homebrew's indexes
# (`atpkg::abrew::census`). Not a new edge in the build graph: aterm-agent
# above already depends on it.
atpkg = { workspace = true }
# The Linux lane builds install.sh's static bootstrap verifier as the release
# producer does (`pin::static_build_config`, `pin::asset_name`'s crate). A small
# library whose dependencies are already in this graph.
aterm-bootstrap-verify = { workspace = true }
# The vz lane's helper (`linux vz-host`): its content-addressed ad hoc signing, its
# client (`Lab`, `Detached`), V3's disks, kernel and seed, and the agent's command
# client. The library loads no framework; its dependencies are already in this graph.
aterm-vz = { workspace = true }
# The guest agent's ports and wire codec (`COMMAND_PORT`, `Exit`). Already in the
# graph through aterm-vz.
aterm-vz-agent = { workspace = true }

[dev-dependencies]
# `trail-gallery burst`'s key schedule is checked against the flying kitty's
# own summon (`kitty_cursor::CursorCat` on the typing momentum): the model the
# scenario is paced for, not a copy of its constants.
aterm-effects = { workspace = true }
# The tests' one-minute hang detector and the unclocked first exec of a script
# a test just wrote (`aterm_spec::wait`): the gemini/agy launch fixture.
aterm-spec = { workspace = true }

[lints]
workspace = true
