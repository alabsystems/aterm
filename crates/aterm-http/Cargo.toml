[package]
name = "aterm-http"
# Integration tests are declared below, not discovered: the files are modules of
# one suite binary where they can share a process. With autotests off a
# `tests/*.rs` file listed nowhere never compiles.
autotests = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "First-party HTTP/1.1 client for aterm"

[dependencies]
# `aterm_uds::deadline`: the process's one deadline gate for calls that wait on
# macOS's trustd (`src/verifier/apple.rs`), shared with the PTY keeper's code
# checks so a wedge any of them finds refuses all of them at once. A
# dependency-free leaf the one binary links already.
aterm-uds = { workspace = true }
# TLS 1.3/1.2 with the `ring` provider — the same pin aterm-net ships.
rustls = { workspace = true }
# Base64 for PEM certificate-bundle decoding (`src/pem.rs`).
aterm-codec = { workspace = true }

# Server certificates are verified against the OPERATING SYSTEM's trust store
# (`src/verifier.rs`), never a root set bundled into the binary.
#
# macOS/iOS need NO manifest entry: Security.framework and CoreFoundation are OS
# dylibs, declared with `#[link(kind = "framework")]` in `src/verifier/apple.rs`.
# Linux and the BSDs need none either: their arm is `rustls`'s own
# `WebPkiServerVerifier` over `/etc/ssl/certs`, and `rustls-webpki` is already in
# every cell via `rustls`.

# Windows is the one arm that needs bindings for its OS calls
# (`CertGetCertificateChain` + `CertVerifyCertificateChainPolicy`). It adds no
# package: `softbuffer` already resolves `windows-sys` with these features.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", default-features = false, features = [
  "Win32_Foundation",
  "Win32_Security_Cryptography",
] }

[dev-dependencies]
# The one trustd probe and skip line (`src/verifier/test_platform.rs`).
aterm-uds = { workspace = true, features = ["test-support"] }

[lints]
workspace = true

[[test]]
name = "http_suite"
path = "tests/http_suite.rs"
