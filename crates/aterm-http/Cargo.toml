[package]
name = "aterm-http"
# The integration files are modules of one suite binary (`tests/http_suite.rs`);
# with autotests off, a `tests/*.rs` file listed nowhere never compiles.
autotests = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Deadline-bounded TLS stream verified against the OS trust store, for aterm"

[dependencies]
# `aterm_uds::deadline::TRUST`: the process's one gate for calls that wait on
# macOS's trustd (`src/verifier/apple.rs`), shared with the PTY keeper's checks.
aterm-uds = { workspace = true }
# TLS 1.3/1.2 with the `ring` provider.
rustls = { workspace = true }
# Base64 for PEM certificate-bundle decoding (`src/pem.rs`).
aterm-codec = { workspace = true }

# Server certificates are verified against the OS trust store (`src/verifier.rs`),
# never a bundled root set. macOS links Security.framework directly
# (`src/verifier/apple.rs`); Linux and the BSDs use `rustls`'s webpki verifier.

# Windows needs bindings for `CertGetCertificateChain` and
# `CertVerifyCertificateChainPolicy`: aterm-win32's, generated from windows-sys
# 0.61.2 (WB.2 of docs/AUDIT-third-party-2026-10-15.md).
[target.'cfg(windows)'.dependencies]
aterm-win32 = { workspace = true }

# `aterm_spec::host::could_not_run`: a test this host has no trust store for
# ends COULD NOT RUN, never a silent pass.
[dev-dependencies]
aterm-spec = { workspace = true }

[lints]
workspace = true

[[test]]
name = "http_suite"
path = "tests/http_suite.rs"
