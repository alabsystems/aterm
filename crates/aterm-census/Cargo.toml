#
# The L0 censuses (main-loop, lock order, wasm, scope, lazy-init) and the source
# guards as one std-only library, and the `aterm-census` runner over it (bare =
# all of them).

[package]
name = "aterm-census"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The L0 censuses (main-loop reach, lock order, wasm reach, scope cardinality, lazy-init reentrancy), the source guards and the aterm-census runner"

[[bin]]
name = "aterm-census"
path = "src/main.rs"

[dependencies]
# Only aterm's own std-only crates, so the censuses still run offline and build
# in seconds: the regex engine (no dependencies of its own), which runs the
# export's grep -E rows over decoded test captures (capture-privacy) and the
# exported text (export-content), and the DEFLATE (astream-wire's CRC-32 its one
# dependency) and Zstandard decoders, because the engine greps a gzip or zstd
# file in the export by what it decodes to.
aterm-regex = { workspace = true }
aterm-codec = { workspace = true }
aterm-zstd = { workspace = true }

[dev-dependencies]
# None: tests use only std (synthetic sources and trees under a temp dir).

[lints]
workspace = true
