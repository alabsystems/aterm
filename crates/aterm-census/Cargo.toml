#
# The L0 censuses (main-loop, lock-order, wasm, scope, lazy-init) as one library,
# shared by the `aterm-census` runner and tools/freeze-safety-gate/build.rs so
# the manual run and the build-blocking gate cannot diverge.

[package]
name = "aterm-census"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Main-loop completeness census (L0 freeze class) + lock-order census (L0-DEADLOCK): shared by the aterm-census runner and the freeze-safety-gate build"

[[bin]]
name = "aterm-census"
path = "src/main.rs"

[dependencies]
# None — pure std, so the census stays offline-capable inside a build script.

[dev-dependencies]
# None — tests use only std (synthetic trees under a temp dir).

[lints]
workspace = true
