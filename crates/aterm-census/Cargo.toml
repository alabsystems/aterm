#
# The main-loop census and the source guards as one std-only library, and the
# `aterm-census` runner over it (bare = all of them).

[package]
name = "aterm-census"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The main-loop census, the source guards and the aterm-census runner"

[[bin]]
name = "aterm-census"
path = "src/main.rs"

[dependencies]
# aterm-cores: the cores a pool here may use (`available_parallelism`, bounded by a test's grant).
aterm-cores = { workspace = true }
# Export materialization stages new files without APFS cloning source inodes.
aterm-tempfile = { workspace = true }
# Only aterm's own std-only crates, so the census still runs offline and builds
# in seconds: the regex engine (no dependencies of its own), which runs the
# export's grep -E rows over decoded test captures (capture-privacy) and the
# exported text (the export scan), and the DEFLATE (astream-wire's CRC-32 its one
# dependency) and Zstandard decoders, because the engine greps a gzip or zstd
# file in the export by what it decodes to, and aterm-codec's base64, because
# the engine clears a hit in a base64 copy of an exported binary. aterm-hash
# (astream-wire's FNV-1a its one dependency) gives the FNV-1a the export scan
# keys the export's binaries by. aterm-seal (aterm-hash its one dependency) reads
# the generated-file seals `generated-seal` checks.
aterm-regex = { workspace = true }
aterm-codec = { workspace = true }
aterm-zstd = { workspace = true }
aterm-hash = { workspace = true }
aterm-seal = { workspace = true }
# SHA-256, which fingerprints a reader's captured inputs (`inputs`).
aterm-digest = { workspace = true }

[lints]
workspace = true
