#
# The L0 censuses (main-loop, lock order, wasm, scope, lazy-init) and the source
# guards as one std-only library, and the `aterm-census` runner over it (bare =
# all of them).

[package]
name = "aterm-census"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The L0 censuses (main-loop reach, lock order, wasm reach, scope cardinality, lazy-init reentrancy), the source guards and the aterm-census runner"

[[bin]]
name = "aterm-census"
path = "src/main.rs"

[dependencies]
# Only aterm's own std-only crates, so the censuses still run offline and build
# in seconds: the regex engine (no dependencies of its own), which runs the
# export's grep -E rows over decoded test captures (capture-privacy) and the
# exported text (the export scan), and the DEFLATE (astream-wire's CRC-32 its one
# dependency) and Zstandard decoders, because the engine greps a gzip or zstd
# file in the export by what it decodes to, and aterm-codec's base64, because
# the engine clears a hit in a base64 copy of an exported binary. aterm-hash
# (astream-wire's FNV-1a its one dependency) gives the offset and prime the seals
# and the mirror's digests fold with, and the FNV-1a the export scan keys the
# export's binaries by.
aterm-regex = { workspace = true }
aterm-codec = { workspace = true }
aterm-zstd = { workspace = true }
aterm-hash = { workspace = true }
# The identity record's input names (`aterm_stamp::input::ALL`), which `identity-read` bans from
# every compile-time read: one list, the one release_env and `ship dev-app` set them from. No
# dependencies of its own.
aterm-stamp = { workspace = true }
# SHA-256, which keys the census memo (the code that judges, each file a unit read, and the
# record's seal, `memo`) and fingerprints a reader's captured inputs (`inputs`).
aterm-digest = { workspace = true }

[dev-dependencies]
# The checkout the tests read, named when they run (`manifest_dir`); std-only too.
aterm-tempfile = { workspace = true }

[lints]
workspace = true
