[package]
name = "aterm-models-update"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "aterm's models of the native updater and its handoff (ty_model!), for their crates' Tier-1 tests and spec-check"
# No tests of its own: `aterm-models` sweeps these models, and the crates they model
# hold their code to them in conformance tests. A tests/*.rs added here compiles into nothing.
autotests = false

[lib]
# No unit tests and no doctests live in src/.
test = false
doctest = false

[dependencies]
aterm-spec.workspace = true

[lints]
workspace = true
