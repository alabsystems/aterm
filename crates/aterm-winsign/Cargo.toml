[package]
name = "aterm-winsign"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "aterm-winsign — Authenticode signing and verification of the shipped Windows exe, behind `targo --unverified winsign` (Tier WINDOWS)"

[[bin]]
name = "aterm-winsign"
path = "src/main.rs"
# No test lives in main.rs (no #[test], no cfg(test), no `mod`); its libtest
# harness ran 0 tests in every gate. Integration tests still get the binary.
test = false

[lib]
name = "aterm_winsign"
path = "src/lib.rs"

[dependencies]
# The committed anchor (`pins::WINDOWS_SIGNING_PUBLISHER`) is the whole tier
# switch, exactly as `pins::APPLE_TEAM_ID` is for the mac lane.
aterm-update-core = { workspace = true }
# A package's manifest and signature members (`msix`): the workspace's ZIP and XML readers. The
# vault's filed request id, in hex (`principal`).
aterm-codec = { workspace = true }
# The Azure signing principal's one source: this host's vault registry, the value's parser, and
# the need ledger a miss is filed in. The vault client builds on Unix and on Windows, where
# signtool runs.
aterm-secrets = { workspace = true }

[dev-dependencies]
aterm-tempfile = { workspace = true }

[lints]
workspace = true
