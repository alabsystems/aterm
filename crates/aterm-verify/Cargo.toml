[package]
name = "aterm-verify"
version.workspace = true
edition = "2024"
# src/wasm_glue/templates.rs and src/wasm_glue/js.rs are derived from
# wasm-bindgen-cli-support 0.2.108 (MIT OR Apache-2.0); see LICENSE-MIT. The
# rest is aterm's own.
license = "Apache-2.0 AND (MIT OR Apache-2.0)"
publish = false
# One integration-test binary: tests/contract.rs mounts every suite as a module.
autotests = false
description = "Every aterm check as one CLI: targo --unverified verify [CHECK|SET ...]"

[[bin]]
name = "aterm-verify"
path = "src/main.rs"
test = false

[lib]
name = "aterm_verify"
path = "src/lib.rs"

[[test]]
name = "contract"
path = "tests/contract.rs"

# First-party crates (and the workspace's libc, which is crates/aterm-libc),
# each serving a check the CLI runs in-process. Every one is also a workspace
# member that `lint` and `test` compile, so a compile break in any of them
# stops this CLI from building until it is fixed: the price of running the
# walks in-process rather than as children of a second build.
[dependencies]
# `verify census` (the census and its guards): the walks themselves.
aterm-census = { workspace = true }
# `verify forge` (the third-party surface policy) and `verify cells` (forge's
# cell list and its resolver). A path dep: the root [workspace.dependencies]
# table has no `aterm-forge` row.
aterm-forge = { path = "../aterm-forge" }
# cargo's `--message-format=json` (`cells`) and the perf lanes' reports.
aterm-json = { workspace = true }
# `browser`: the pixels its pages hand back over DevTools are base64.
aterm-codec = { workspace = true }
# `browser`: the recorded-frame differential's frames are RGBA8 PNGs
# (`src/browser/recorded.rs`).
aterm-png = { workspace = true }
# `perf`: the box fingerprint (FNV-1a), the arena pins (SHA-256, the typed
# manifest through serde's derive) and the children the arena lanes launch.
aterm-hash = { workspace = true }
aterm-digest = { workspace = true }
aterm-toml = { workspace = true }
aterm-uds = { workspace = true }
serde = { workspace = true, features = ["derive"] }
# `glue` and `wasm-glue` read the descriptor aterm-wasm-abi's `#[export]`
# writes, with that crate's own decoder and lowering table.
aterm-wasm-abi = { workspace = true }

# Scratch output captures (and test directories) removed on drop.
aterm-tempfile = { workspace = true }
# `verify soak`: the crash restore's soak, judged from this machine's recovery ledger by
# the updater crate's own reader and judge (`aterm_update::restore_soak`), at the clock the
# workspace reads (`aterm_time::unix_secs`).
aterm-update = { workspace = true }
aterm-time = { workspace = true }
# THE toolchain resolution, rustup's finder, the build-cache rule plain `targo`
# follows (so the main lane's children share its cache) and the toolchain lease
# a run holds: one std-only source with atpkg.
aterm-toolchain = { workspace = true }
# The timed stages and the perf lanes start on a quiet machine: a claim in the
# per-user capacity ledger, and the machine's reading on each stage's time line
# (docs/DESIGN-adaptive-build-2026-10-24.md, QUIET-ADMIT). Workspace crate;
# first-party dependencies only, aterm-toolchain and aterm-sysprobe among them.
aterm-capacity = { workspace = true }
# A stage child's clock reads what its process group used (CPU and runnable
# time, I/O) to leave its waits for a core out of its ceiling, and a demoted
# child's spawn reads the input clock (HIDIdleTime) to keep utility QoS to a
# Mac someone is at (docs/DESIGN-adaptive-build-2026-10-24.md, CEILING-WAIT).
# Workspace crate, already in the graph through aterm-uds and aterm-capacity.
aterm-sysprobe = { workspace = true }
# Each stage's memory peak is kept in this user's aterm state directory
# (`dirs::account_state_dir`), one record every checkout's runs share
# (docs/DESIGN-adaptive-build-2026-10-24.md, VERIFY-MEM). Workspace crate,
# already in the graph through aterm-capacity.
aterm-types = { workspace = true }

[target.'cfg(unix)'.dependencies]
# The arena lanes' interrupt guard: block SIGINT/SIGTERM/SIGHUP, take them on
# one thread with `sigwait`, and `killpg` the terminals under test.
libc = { workspace = true }
# `verify provision`: atpkg's vetted extractor lays each pinned upstream archive
# (`atpkg::extract::extract_tree`), its Mach-O walk and load-command reader hold
# pwsh's tree to its signer and fish's build to the OS's libraries
# (`atpkg::macho`), and the updater's codesign check is the Developer ID
# requirement pwsh's Mach-Os meet.
atpkg = { workspace = true }
aterm-update-core = { workspace = true }
# `verify provision --linux`: Ubuntu's pinned image files for the lane's own VM
# (`aterm_vz::pins`), the one place a pin bump edits, and the words for a
# release Ubuntu has moved to its http-only archive host.
aterm-vz = { workspace = true }

[dev-dependencies]
# Tier-1 of `EndByProof` (tests/conformance_end_by_proof.rs): the model and the interpreter
# that drives it against the real `aterm_uds::process::end_proven`.
aterm-models-misc = { workspace = true }
aterm-spec = { workspace = true }

[lints]
workspace = true
