#
# aterm-messages's lint config. Clippy reads only the nearest clippy.toml, so the
# workspace file's rows that can resolve in a crate with no libc, winit or windows
# dependency are repeated here word for word (the root file says why each exists, and
# census guard `clippy-mirror` holds the copy), followed by the injected clock.
#
# The injected clock: the messages engine never samples a clock. Every instant it
# judges by is handed in, so its decisions replay exactly; a read that cannot affect
# that state carries `#[expect(clippy::disallowed_methods, reason = "…")]`.
# `aterm_time::Instant::now` is `std::time::Instant::now` on native targets, so the
# std row covers it; `elapsed` reads the clock too.
disallowed-methods = [
  { path = "std::net::TcpListener::accept", reason = "accept through aterm_uds so the accepted stream's blocking mode is explicit (clippy.toml: one sanctioned accept)" },
  { path = "std::net::TcpListener::incoming", reason = "accept through aterm_uds so the accepted stream's blocking mode is explicit (clippy.toml: one sanctioned accept)" },
  { path = "std::os::unix::net::UnixListener::accept", reason = "accept through aterm_uds so the accepted stream's blocking mode is explicit (clippy.toml: one sanctioned accept)", allow-invalid = true },
  { path = "std::os::unix::net::UnixListener::incoming", reason = "accept through aterm_uds so the accepted stream's blocking mode is explicit (clippy.toml: one sanctioned accept)", allow-invalid = true },
  { path = "std::io::pipe", reason = "make a pipe with aterm_uds::pipe, which keeps both ends out of every child it is not handed to (clippy.toml: kept-out pipes)" },
  { path = "std::fs::File::lock", reason = "take it through a guard whose Drop releases by LOCK_UN (clippy.toml: the flock release rule)" },
  { path = "std::fs::File::try_lock", reason = "take it through a guard whose Drop releases by LOCK_UN (clippy.toml: the flock release rule)" },
  { path = "std::fs::File::lock_shared", reason = "take it through a guard whose Drop releases by LOCK_UN (clippy.toml: the flock release rule)" },
  { path = "std::fs::File::try_lock_shared", reason = "take it through a guard whose Drop releases by LOCK_UN (clippy.toml: the flock release rule)" },
  { path = "std::fs::File::sync_all", reason = "finish the write with aterm_durable::durable or aterm_durable::ordered: name what a power loss may leave (clippy.toml: a chosen flush)" },
  { path = "std::fs::File::sync_data", reason = "finish the write with aterm_durable::durable_data or aterm_durable::ordered: name what a power loss may leave (clippy.toml: a chosen flush)" },
  { path = "std::process::abort", reason = "die by SIGKILL: aterm_uds::process::kill_self_now() (clippy.toml: no core-dump death)" },
  { path = "std::os::windows::process::CommandExt::creation_flags", reason = "set a child's console with aterm_uds::spawn (clippy.toml: one Windows console decision)", allow-invalid = true },
  { path = "core::option::Option::map_or_default", reason = "spell it .map(..).unwrap_or_default(): it is unstable on the stable Rust the foreign cells build with (clippy.toml: stable spellings)" },
  { path = "core::result::Result::map_or_default", reason = "spell it .map(..).unwrap_or_default(): it is unstable on the stable Rust the foreign cells build with (clippy.toml: stable spellings)" },
  { path = "std::thread::yield_now", reason = "wait on a wake: a Condvar, a channel, pause_for_handover or a bounded sleep slice; a test's poll pauses with aterm_uds::deadline::poll_yield (clippy.toml: a wait that wakes)" },
  { path = "std::thread::available_parallelism", reason = "size a pool with aterm_cores::available_parallelism, bounded by the cores verify grants a test (clippy.toml: a granted pool)" },
  { path = "std::time::Instant::now", reason = "the messages engine reads no clock: judge by the instant it was handed (clippy.toml: the injected clock)" },
  { path = "std::time::SystemTime::now", reason = "the messages engine reads no clock: judge by the instant it was handed (clippy.toml: the injected clock)" },
  { path = "std::time::Instant::elapsed", reason = "the messages engine reads no clock: judge by the instant it was handed (clippy.toml: the injected clock)" },
  { path = "std::time::SystemTime::elapsed", reason = "the messages engine reads no clock: judge by the instant it was handed (clippy.toml: the injected clock)" },
  { path = "aterm_time::since_epoch", reason = "the messages engine reads no clock: judge by the instant it was handed (clippy.toml: the injected clock)" },
  { path = "aterm_time::unix_secs", reason = "the messages engine reads no clock: judge by the instant it was handed (clippy.toml: the injected clock)" },
  { path = "aterm_time::unix_millis", reason = "the messages engine reads no clock: judge by the instant it was handed (clippy.toml: the injected clock)" },
  { path = "aterm_types::shell_types::current_time_ms", reason = "the messages engine reads no clock: judge by the instant it was handed (clippy.toml: the injected clock)" },
]
disallowed-types = [
  { path = "std::process::Command", reason = "build children with aterm_uds::spawnfd::command, which hands them stdio and nothing else (clippy.toml: one child constructor)" },
]
