[package]
name = "aterm-secrets"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "aterm's credentials vault (`aterm secrets`, docs/DESIGN-secrets-2026-10-20.md): one text file of secrets, encrypted per audience to every machine's age X25519 key, signed by the vault's Ed25519 key, served from a URL (or read from a path) by a keyless long-poll server, and kept in sync into ~/.secrets on every machine. The age v1 codec and a first-party X25519 (RFC 7748's ladder over fiat-crypto's radix-2^51 field) compile everywhere; the files, the server, the subscriber and the services are Unix."

[dependencies]
# ChaCha20-Poly1305, HKDF-SHA256, HMAC-SHA256 and Ed25519 signing. No features:
# none of these is behind `alloc`, and randomness is aterm_uds::rand, not ring's RNG.
ring = { workspace = true }
# Every Ed25519 verification (`ed25519::verifies` and direct calls): astream's strict
# check, which refuses the small-order keys and commitments ring alone takes. Its
# `signature` feature is ring, zeroize and getrandom, all already in this graph.
astream-aead = { path = "../../vendor/astream/crates/astream-aead", default-features = false, features = ["signature"] }
# Wipes every key, file key and plaintext buffer the crate holds on drop (not the key
# schedules ring derives from them, which ring never wipes). Already in the KEEP closure
# through rustls, so no new package.
zeroize = { version = "1", default-features = false }
# Padded base64 (armor, envelope fields); the unpadded canonical form age needs is a
# wrapper over its strict decoder (`b64`).
aterm-codec = { workspace = true }
# SHA-256 (join codes, fingerprints, the manifest's digests).
aterm-digest = { workspace = true }
# `rand::fill` (keys, nonces), `spawnfd::command` (dns-sd, caffeinate, launchctl,
# systemctl, $EDITOR, scutil), `atomic_file::write`, `peer::our_uid`.
aterm-uds = { workspace = true }
# `dirs::home_dir`, `fs_restricted` (0700 directories).
aterm-stamp = { workspace = true }
aterm-types = { workspace = true }
# `hv_vmm_present`: an identity made in a virtual machine is a lab identity (`LabMark`).
aterm-sysprobe = { workspace = true }
# Shared release-ring authority is verified with the updater's pinned master-roster chain.
aterm-update-core = { workspace = true }
# The workspace clock.
aterm-time = { workspace = true }
# The flush a wiped file gets before it is removed (`durable_data`).
aterm-durable = { workspace = true }
# HTTP(S) GET/PUT/POST to the vault's URL: plain HTTP on the LAN (the payload is
# end-to-end encrypted and signed), OS-verified TLS elsewhere.
aterm-http = { workspace = true }
# source.toml and state.toml, read as a value tree (no derive in this library).
aterm-toml = { workspace = true }
# The explicit release capability probe's value-free journal and API receipts.
aterm-json = { workspace = true }
serde = { workspace = true }
# The one rule for a copy of aterm that lasts (`lasting::transient`), which a launchd job may
# name, shared with atpkg's shims and the window's subscriber mend. std only.
aterm-toolchain = { workspace = true }
# Content-addressed causal control records and their strict local journal.
astream-wire = { path = "../../vendor/astream/crates/astream-wire" }
aterm-db-core.workspace = true
# The proved decisions of one-mesh: P6's capacity kernels, and P3's held-draft and waiting-write
# kernels and folds (`no_lost_edit`). A zero-dependency leaf crate.
aterm-mesh-core.workspace = true
aterm-spec-anchor.workspace = true
# The exceptions digest entry and the step and reason words a credential need's ask is held
# to (`need::exception`).
aterm-messages = { workspace = true }
# This Mac's network place, which `aterm secrets status` names in the words every reporter uses
# (a low crate: it depends on no aterm-net and no aterm-secrets).
aterm-netplace = { workspace = true }

[target.'cfg(unix)'.dependencies]
aterm-journal.workspace = true
aterm-dirfd.workspace = true
# O_NOFOLLOW / O_NONBLOCK for admitted reads.
libc = { workspace = true }
# Exclusive private edit directories; unfinished drafts are explicitly kept.
aterm-tempfile = { workspace = true }
astream-broker = { path = "../../vendor/astream/crates/astream-broker" }

[target.'cfg(target_os = "macos")'.dependencies]
# Network.framework's path monitor (`home_lan`: a cellular or hotspot path is never the home ALab
# LAN). Zero dependencies of its own; it opens the framework only at a monitor's first start.
aterm-objc.workspace = true

[dev-dependencies]
# The differential oracle for x25519.rs: ring's own X25519 (ephemeral keys from its
# RNG) must agree with the first-party ladder in both directions.
ring = { workspace = true, features = ["default"] }
# The C2SP CCTV vectors that ship zlib-compressed.
aterm-codec = { workspace = true }
aterm-models-db.workspace = true
aterm-models-swarm.workspace = true
aterm-spec.workspace = true
# The CCTV vectors are found from the package directory when the tests run
# (`aterm_tempfile::manifest_dir`), off Unix too, where it is no normal dependency.
aterm-tempfile.workspace = true

[[example]]
name = "commons_control_probe"
test = true

[[example]]
name = "commons_epoch_probe"
test = true

[lints]
workspace = true
