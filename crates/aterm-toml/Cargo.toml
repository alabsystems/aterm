[package]
name = "aterm-toml"
# Integration tests are modules of one suite binary (`[[test]]` below); a
# `tests/*.rs` file it does not list never compiles.
autotests = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "First-party TOML 1.0 for aterm: a serde Deserializer/Serializer (replaces `toml`) and a comment-preserving document model (replaces `toml_edit`)"

[lib]
# No unit tests live in src/, so a default `targo test` does not build the lib
# harness (an explicit `--lib` still does, at 0 tests). Doctests still run.
test = false
[dependencies]
# serde is the only dependency, on purpose: the tree's `#[derive(Deserialize)]`
# models need a `serde::Deserializer`, and serde is already in the graph.
serde = { workspace = true }

[lints]
workspace = true

[[test]]
name = "toml_suite"
path = "tests/toml_suite.rs"
