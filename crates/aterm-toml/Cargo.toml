[package]
name = "aterm-toml"
# Integration tests are modules of one suite binary (`[[test]]` below); a
# `tests/*.rs` file it does not list never compiles.
autotests = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "First-party TOML 1.0 for aterm: a serde Deserializer/Serializer (replaces `toml`) and a comment-preserving document model (replaces `toml_edit`)"

[lib]
# No unit tests live in src/, so no lib test harness is built; doctests still run.
test = false
[dependencies]
# serde is the only dependency, on purpose: the tree's `#[derive(Deserialize)]`
# models need a `serde::Deserializer`. The workspace `serde` row is first-party
# crates/aterm-serde since docs/AUDIT-third-party-2026-10-15.md SP.6.
serde = { workspace = true }

[dev-dependencies]
# The tests and doctests derive their models, as a dependent would. The normal
# row stays derive-free so the lib's closure holds no proc macro (Trust PM-1).
serde = { workspace = true, features = ["derive"] }

[lints]
workspace = true

[[test]]
name = "toml_suite"
path = "tests/toml_suite.rs"
