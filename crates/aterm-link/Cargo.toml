# The aterm-side fabric crate: the `aterm-link serve` bridge (§11.2).
#
# The astream crates come from `vendor/astream`, a git submodule pinned to one
# commit; a bus fix lands in astream and arrives here as a submodule bump
# (`vendor/README-astream.md`).
[package]
name = "aterm-link"
version.workspace = true
# Edition 2021, not 2024: this crate uses `gen` as an identifier (the fabric's
# `gen=<content_seq>:<fp16>` fence), which 2024 reserves.
edition = "2021"
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[features]
# The sealed cross-host transport (`--tcp --key-file`), off by default so a
# shipped binary carries no cipher tree: `aead` pulls chacha20poly1305 +
# getrandom and, further up, the curves — 22 third-party packages, and this
# repository counts packages. chacha20poly1305 + getrandom still appear in
# `Cargo.lock` (a lockfile records reachable optional deps; the curves do not,
# as nothing here can enable them); `targo tree -p aterm-link -e normal` shows a
# default build compiles none. `tests/two_nodes_sealed.rs` turns it on.
sealed = ["astream-broker/aead"]
# Development seams (`aterm_types::dev_seam!`) in an optimized build: `ATERM_BIN`,
# the bridge's and notifier's fault switches, `fabric on`'s effect trace and mint
# fault, and the redirected fabric root. Debug builds compile them anyway; the
# release buildplan never enables this, so a shipped binary reads none of them.
dev-seams = []

[dependencies]
# The bus: `cap` for the bound grant every fabric principal attaches with. With
# `sealed`, the crate's whole third-party crypto surface is sha2,
# chacha20poly1305 and getrandom.
astream-broker = { path = "../../vendor/astream/crates/astream-broker", features = ["cap"] }
astream-cap = { path = "../../vendor/astream/crates/astream-cap" }
# The verb table (what the bridge may call) and the control-socket vocabulary.
aterm-types = { workspace = true }
# The body's informational `t=` (`now_ms`).
aterm-time = { workspace = true }
aterm-uds = { workspace = true }
# The one hex codec (key file, roster nonce) and the control wire's percent
# escape (`pct`, shared by the fabric body).
aterm-codec = { workspace = true }
# The one FNV-1a/64 (the `gen=` fingerprint, the say-cursor shard): the same
# hash `status` stamps `hash=` with.
aterm-hash = { workspace = true }
# The control-socket client: the same rendezvous walk and Owner-token read
# `aterm ctl instances`/`ls` use, so `aterm fabric` and the bridge's hosted set
# cannot find different instances than the client does.
aterm-ctl = { path = "../aterm-ctl" }
# `[fabric] command` is read with the app's own aterm.toml parser, so the report
# and the instance cannot disagree about the file. Its `serde` is already in the
# shipped graph.
aterm-toml = { workspace = true }

[dev-dependencies]
# `aterm fabric status --json` is asserted as JSON, not as substrings.
aterm-json = { workspace = true }
# `tests/world/fabric_on.rs` runs `fabric on`'s effect trace through the
# capability-publication model's `Model::fire`.
aterm-spec = { workspace = true }
# Scratch directories removed on drop, and `stand_in`: a fake program with one
# pre-assessed inode per body.
aterm-tempfile = { workspace = true, features = ["stand-in"] }

[[bin]]
name = "aterm-link"
path = "src/main.rs"

[lints]
workspace = true
