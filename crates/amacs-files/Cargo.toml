[package]
name = "amacs-files"
# Integration tests are declared below, not discovered: every file is a module
# of the one `amacs_files_suite` binary. With autotests off a `tests/*.rs` file
# listed nowhere never compiles. The host's own tests live in its source files.
autotests = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "amacs's document I/O, shared by both faces: the pure save and draft-journal contracts, and the file-capability host (admission, atomic save, the advisory-lock door). aterm-gui re-exports both under their old module names."

[features]
# The test seams aterm-gui's tests call, in an optimized build. A test or debug
# build of this crate has them anyway, so no manifest turns this on (a
# dev-dependency row that did would fork the test build from `build -p aterm
# --profile test`). A `--release` test run names it: `--features
# amacs-files/test-support`. `--profile opt-test` needs nothing.
test-support = []

[dependencies]
# The document store's ids and snapshots that plans and grants name, and the
# file-URI codec admission parses with (`amacs::protocol::uri`).
amacs = { workspace = true }
# The store's sequence numbers a plan is stamped with.
aterm-buffer = { path = "../aterm-buffer" }
# How each write is finished: durable (F_FULLFSYNC) or ordered.
aterm-gui-consent = { workspace = true }
# The journal key's HMAC-SHA256.
aterm-digest = { workspace = true }
# The content fingerprint (FNV-1a with a length mix).
aterm-hash = { workspace = true }
# The workspace's one epoch-clock read, which seeds a temporary's name.
aterm-time = { workspace = true }
# open(2) flags and errnos.
libc = { workspace = true }

[dev-dependencies]
# Exclusive scratch directories whose cleanup belongs to the fixture.
aterm-tempfile = { workspace = true }
# The tests mint a root authority for the store's write cap; only a test may,
# below the launchers (the `launcher-mint` guard).
aterm-cap = { workspace = true, features = ["launcher-mint"] }
# The counting seam (`aterm_durable::seam`) the flush-tier test reads.
aterm-durable = { workspace = true }
# Hang detectors, and the reducers' Tier-1 binds to their derived models.
aterm-spec = { workspace = true }
aterm-models-native = { workspace = true }

[[test]]
name = "amacs_files_suite"
path = "tests/amacs_files_suite.rs"

[lints]
workspace = true
