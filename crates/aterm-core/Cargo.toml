[package]
name = "aterm-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "aterm — lean, headless VT terminal engine core"
# Integration tests are declared at the end of this file, not discovered: every
# tests/*.rs is a `mod` of a suite root or its own [[test]] with the hazard that
# needs a process of its own. With autotests off a file listed nowhere never
# compiles.
autotests = false

[features]
# Serde on the CheckpointMeta seam (seamless-update screen carry): derives on the
# checkpoint's scalar projections only — grid bodies stay on the binary Line codec.
serde = ["dep:serde", "aterm-types/serde"]
# Sixel decoding is always on. The empty feature stays because orca-alab's
# orca-terminal still asks for `features = ["sixel"]`, which cargo refuses on a
# crate that does not declare it.
sixel = []

[dependencies]
# The anchor attributes' registry (std-only): `#[cfg_attr(any(test, debug_assertions),
# aterm_spec_anchor::refines(…))]` expands in every test and debug build; release strips it.
aterm-spec-anchor = { workspace = true }
aterm-log = { workspace = true }
aterm-hash = { workspace = true }
aterm-codec = { workspace = true }
# The one hardened PNG → RGBA8 decode (`aterm_png::decode_rgba8`): the engine
# stores images as delivered, and decodes a PNG only to compose Kitty animation
# frames, which composes pixels.
aterm-png = { workspace = true }
aterm-types = { workspace = true }
# The one dark/light classifier (`aterm_messages::ink::bg_is_light`), which the
# reported colour scheme (DSR 996 / mode 2031) shares with the chrome.
# aterm-messages depends only on aterm-time, so this adds no cycle and stays
# wasm-clean.
aterm-messages = { workspace = true }
serde = { workspace = true, optional = true, features = ["derive"] }
aterm-provenance = { workspace = true }
aterm-grapheme = { workspace = true }
aterm-grid = { workspace = true }
aterm-parser = { workspace = true }
aterm-scrollback = { workspace = true }
aterm-policy = { workspace = true }
aterm-selection = { workspace = true }
aterm-search = { workspace = true }
aterm-shell-integration = { workspace = true }
# Clock seam: std::time on native, the JS clock on wasm32 (where std's panics).
aterm-time = { workspace = true }
# UAX #9 BiDi visual reordering (terminal/bidi_reorder.rs):
# `Terminal::bidi_visual_order_cells`. Applying the permutation is the renderer's job.
aterm-bidi = { workspace = true }
# Sixel graphics: decode a sixel DCS into an inline image (the OSC 1337 `File=`
# placement path); DA1 advertises code 4.
aterm-sixel = { workspace = true }

[dev-dependencies]
aterm-spec = { workspace = true }
# The models its tests drive (a model edit rebuilds only their tests).
aterm-models-core = { workspace = true }
aterm-models-misc = { workspace = true }
aterm-models-render = { workspace = true }
aterm-models-session = { workspace = true }

[lints]
workspace = true

# ---- integration tests (autotests = false above) ----------------------------

[[test]]
name = "core_suite"
path = "tests/core_suite.rs"

# Alone: installs a #[global_allocator] and asserts process-wide byte counts.
[[test]]
name = "mem_budget"
path = "tests/mem_budget.rs"

# Alone: installs a #[global_allocator] and asserts process-wide allocation counts.
[[test]]
name = "perf_scaling"
path = "tests/perf_scaling.rs"

# Alone: installs a #[global_allocator] and counts allocations per thread.
[[test]]
name = "scoped_extract_alloc"
path = "tests/scoped_extract_alloc.rs"

# Alone: it sets the process-wide scrollback budget every terminal in the process
# obeys, and the exact arithmetic needs this binary to own every share it sees.
[[test]]
name = "conformance_shared_budget"
path = "tests/conformance_shared_budget.rs"
