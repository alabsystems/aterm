[package]
name = "aterm-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "aterm — lean, headless VT terminal engine core"
# Integration tests are declared at the end of this file, not discovered: every
# tests/*.rs is a `mod` of a suite root or its own [[test]] with the hazard that
# needs a process of its own. With autotests off a file listed nowhere never
# compiles.
autotests = false

[features]
default = ["disk-tier"]
# Disk-backed scrollback cold tier, forwarded to aterm-grid and aterm-scrollback.
# A wasm consumer disables it (--no-default-features) to drop libc.
disk-tier = ["aterm-grid/disk-tier", "aterm-scrollback/disk-tier"]
# Serde on the CheckpointMeta seam (seamless-update screen carry): derives on the
# checkpoint's scalar projections only — grid bodies stay on the binary Line codec.
serde = ["dep:serde", "aterm-types/serde"]
# Heavyweight stress/stability tests (tests/stress_stability.rs).
long-tests = []
# UAX #9 BiDi visual reordering (terminal/bidi_reorder.rs):
# `Terminal::bidi_visual_order`. Applying the permutation is the renderer's job.
bidi = ["dep:aterm-bidi"]
# Compile the `#[refines]`/`#[spec_unmodeled]` anchors into the library so
# aterm-gui's `spec_xref_closure` test can collect them via `aterm_spec::registry`. Off in
# production: no `aterm-spec` in the closure.
spec-anchors = ["dep:aterm-spec"]
# Sixel graphics: decode a sixel DCS into an inline image (the OSC 1337 `File=`
# placement path) and advertise DA1 code 4. Without it sixel DCS is consumed and
# dropped.
sixel = ["dep:aterm-sixel"]

[dependencies]
# Library dependency only under `spec-anchors` (the anchors emit
# `::aterm_spec::registry::submit!`).
aterm-spec = { workspace = true, optional = true }
aterm-log = { workspace = true }
aterm-hash = { workspace = true }
aterm-codec = { workspace = true }
# The one hardened PNG → RGBA8 decode (`aterm_png::decode_rgba8`): the engine
# stores images as delivered, and decodes a PNG only to compose Kitty animation
# frames, which composes pixels.
aterm-png = { workspace = true }
aterm-types = { workspace = true }
serde = { workspace = true, optional = true, features = ["derive"] }
aterm-provenance = { workspace = true }
aterm-grapheme = { workspace = true }
# Path, not `workspace = true`, so default-features = false stays local; this
# crate's `disk-tier` default re-enables it.
aterm-grid = { path = "../aterm-grid", default-features = false, features = ["alacritty-compat"] }
aterm-parser = { workspace = true }
aterm-scrollback = { workspace = true }
aterm-policy = { workspace = true }
aterm-vi = { workspace = true }
aterm-selection = { workspace = true }
aterm-search = { workspace = true }
aterm-shell-integration = { workspace = true }
# Clock seam: std::time on native, the JS clock on wasm32 (where std's panics).
aterm-time = { workspace = true }
aterm-bidi = { workspace = true, optional = true }
# No self dev-dependency enables `sixel`: cargo cannot turn a dev-dependency's
# feature off, so the default no-sixel engine would go untested. aterm-conformance
# builds it and mounts tests/fuzz_process_never_panics/fresh.rs in its `vt` suite.
aterm-sixel = { workspace = true, optional = true }

[dev-dependencies]
aterm-spec = { workspace = true }

[lints]
workspace = true

# ---- integration tests (autotests = false above) ----------------------------

[[test]]
name = "core_suite"
path = "tests/core_suite.rs"

# The deterministic-LCG fuzzers (the crate's CPU long poles), as one binary,
# kept off core_suite's clock.
[[test]]
name = "core_fuzz"
path = "tests/core_fuzz.rs"

# Alone: installs a #[global_allocator] and asserts process-wide byte counts.
[[test]]
name = "mem_budget"
path = "tests/mem_budget.rs"

# Alone: installs a #[global_allocator] and asserts process-wide allocation counts.
[[test]]
name = "perf_scaling"
path = "tests/perf_scaling.rs"

# Alone: installs a #[global_allocator] and counts allocations per thread.
[[test]]
name = "scoped_extract_alloc"
path = "tests/scoped_extract_alloc.rs"

# Alone: the scrollback share registry is process-global, and the exact
# arithmetic needs this binary to own every share it sees.
[[test]]
name = "conformance_shared_budget"
path = "tests/conformance_shared_budget.rs"

# The long stress run, only under `long-tests`.
[[test]]
name = "stress_stability"
path = "tests/stress_stability.rs"
required-features = ["long-tests"]
