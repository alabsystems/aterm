[package]
name = "aterm-containment"
description = "4-mode containment architecture for AI agent isolation"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# One integration binary (`tests/containment_suite.rs`) plus the two files that
# must own their process; the suite gives each one-shot-state test a fresh
# process of its own by re-executing itself (`in_fresh_process`). With
# autotests off a `tests/*.rs` file listed nowhere never compiles.
autotests = false

[features]

[dependencies]
aterm-log.workspace = true
# `aterm_uds::spawnfd::command`: the `Command` every child here is built with, so
# none inherits a descriptor of this process above stdio (clippy.toml: one child
# constructor). A dependency-free leaf the one binary links already.
aterm-uds = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
libc.workspace = true

[dev-dependencies]
aterm-log = { workspace = true }
aterm-tempfile.workspace = true
# `aterm_spec::host::could_not_run`: a proof this host cannot run (no HOME, a
# missing tool) ends COULD NOT RUN, never a silent pass.
aterm-spec = { workspace = true }

[lints]
workspace = true

[[test]]
name = "containment_suite"
path = "tests/containment_suite.rs"

# Alone: installs the process-global logger and asserts exact record counts.
[[test]]
name = "audit_denial_logged"
path = "tests/audit_denial_logged.rs"

# Alone: copies its own binary and re-enters it by `--exact` as the child.
[[test]]
name = "image_anchor_live"
path = "tests/image_anchor_live.rs"

# Explicit mounted-volume acceptance; not an ordinary test or a release dependency.
[[bench]]
name = "dmg_acceptance"
harness = false
test = false
