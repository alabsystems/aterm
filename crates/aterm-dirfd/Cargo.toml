[package]
name = "aterm-dirfd"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Fd-relative POSIX directory operations for aterm's confined artifact paths"

[dependencies]
# Already in the shipped graph, so this crate adds no package.
libc = { workspace = true }

[dev-dependencies]
# Tests run on real directories: TOCTOU windows, link counts and rename
# atomicity exist only on a real filesystem.
aterm-tempfile = { workspace = true }

[lints]
workspace = true

[lib]
# No unit tests in src/; doctests still run.
test = false
