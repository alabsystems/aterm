  { path = "std::time::Instant::now", reason = "the crash-restore journal reads no clock: the parse thread hands the policy the time (clippy.toml: the injected clock)" },
  { path = "std::time::SystemTime::now", reason = "the crash-restore journal reads no clock: the parse thread hands the policy the time (clippy.toml: the injected clock)" },
