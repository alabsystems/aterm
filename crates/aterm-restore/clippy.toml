#
# aterm-restore's lint config: the workspace clippy.toml's rows (clippy reads only the
# nearest file, so they are repeated here word for word, as census guard `clippy-mirror`
# holds; the root file says why each exists) and THE INJECTED CLOCK.
#
# THE INJECTED CLOCK. The crash-restore journal never samples a clock: the keyframe
# policy is a pure state machine that the parse thread hands the time
# (`KeyframePolicy::after_slice(now_ms, ..)`), so a test drives every rule (the 200 ms
# quiescence, the 1 s period, the 100 ms pressure gap) without sleeping, and the
# recovery is a function of the region's bytes alone. `aterm_time::Instant::now` is
# `std::time::Instant::now` on every native target, so the std row names it too;
# `elapsed` reads the clock as well.
disallowed-methods = [
