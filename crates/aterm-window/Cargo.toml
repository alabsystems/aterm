[package]
edition = "2021"
rust-version = "1.84"
name = "winit"
version = "0.30.13"
authors = [
    "The winit contributors",
    "Pierre Krieger <pierre.krieger1708@gmail.com>",
]
build = "build.rs"
include = [
    "/build.rs",
    "/LICENSE",
    "/src",
    "/tests",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Cross-platform window creation library."
documentation = "https://docs.rs/winit"
readme = "README.md"
keywords = ["windowing"]
categories = ["gui"]
license = "Apache-2.0"
repository = "https://github.com/rust-windowing/winit"

[package.metadata.docs.rs]
features = ["rwh_06"]
targets = [
    "i686-pc-windows-msvc",
    "x86_64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "i686-unknown-linux-gnu",
    "x86_64-unknown-linux-gnu",
]
rustdoc-args = [
    "--cfg",
    "docsrs",
]

[features]
# aterm's downstream GUI conformance tests must exercise the real `KeyEvent`
# dispatch boundary. Winit intentionally keeps the platform payload private, so
# expose its synthetic-event constructor only when aterm's dev-dependency asks
# for it; production builds leave this feature disabled.
aterm-test-key-event = []
# LOCAL PATCH (aterm), 2026-10-15 (docs/AUDIT-third-party-2026-10-15.md, winit-core step 6):
# `rwh_06` is not a default. On macOS a window hands over its content view through
# first-party `aterm_objc::HasNsView`, which the Metal presenter and aterm-gui's chrome read,
# so raw-window-handle leaves the macOS graph. The cells that still present through wgpu or
# softbuffer, or link accesskit_winit, turn it on: aterm-gui's non-macOS dependency row, and
# accesskit_winit's own default features.
default = [
    "x11",
    "wayland",
    "wayland-dlopen",
    "wayland-csd-adwaita",
]
rwh_06 = ["dep:rwh_06"]
wayland = [
    "wayland-client",
    "wayland-backend",
    "wayland-protocols",
    "sctk",
    "aterm-hash",
    "memmap2",
    "cursor-icon",
]
# LOCAL PATCH (aterm), 2026-10-15 (docs/AUDIT-third-party-2026-10-15.md, LW.1): KDE's
# org_kde_kwin_blur protocol is the only thing `wayland-protocols-plasma` gives this crate, and
# it serves only `Window::set_blur` (WC.5 cut `WindowAttributes::with_blur`), which no aterm
# crate calls. Upstream folded it
# into `wayland`; here it is opt-in. Without it the Wayland backend never binds the blur
# manager and `set_blur(true)` logs that blur is unavailable, exactly what it already did on a
# compositor that does not advertise the global (X11 and Windows ignore the call outright).
# Off: -1 package / -292 lines on linux and linux-arm.
wayland-kwin-blur = [
    "wayland",
    "dep:wayland-protocols-plasma",
]
wayland-csd-adwaita = [
    "sctk-adwaita",
    "sctk-adwaita/ab_glyph",
]
wayland-dlopen = ["wayland-backend/dlopen"]
x11 = [
    "x11-dl",
    "bytemuck",
    "xkbcommon-dl/x11",
    "x11rb",
]

[lib]
name = "winit"
path = "src/lib.rs"

[[test]]
name = "send_objects"
path = "tests/send_objects.rs"

[[test]]
name = "sync_object"
path = "tests/sync_object.rs"

# LOCAL PATCH (aterm), 2026-10-15: recorded answers for the leaf types winit-core step 5
# absorbs (dpi, cursor-icon, the bitflags! types); see the file.
[[test]]
name = "recorded_answers"
path = "tests/recorded_answers.rs"

# LOCAL PATCH (aterm), 2026-10-15 (docs/AUDIT-third-party-2026-10-15.md, winit-core step 5): the
# crate's seven flag types (ModifiersState, ModifiersKeys, WindowButtons, macOS's location mask,
# Windows' modifier, cursor and window flags) are `aterm_types::bitflags!`, where upstream uses
# `bitflags` 2. FIRST-PARTY and path-only; aterm-gui already links it in every cell this crate
# compiles in.
[dependencies.aterm-types]
path = "../aterm-types"

[dependencies.rwh_06]
version = "0.6"
features = ["std"]
optional = true
package = "raw-window-handle"

[dependencies.tracing]
version = "0.1.40"
default-features = false

# LOCAL PATCH (aterm), 2026-10-15: the Wayland backend's maps and set (windows, window
# requests, seats, pointer surfaces, touch points, a window's focused seats) hash with aterm's
# FxHash instead of `ahash` (docs/AUDIT-third-party-2026-10-15.md, winit-core step 2). Their keys
# are compositor object ids and window ids, never text a peer chooses, so an unkeyed hash is the
# right one (aterm-hash's own rule), and it is what the retired `ahash` row already ran: it had
# pinned ahash to fixed seeds (`no-rng`). Every iteration over them was read for order
# dependence; none has any beyond what upstream's randomly seeded default already left
# arbitrary. FIRST-PARTY and path-only, zero dependencies.
[target.'cfg(all(unix, not(any(target_os = "redox", target_family = "wasm", target_os = "android", target_os = "ios", target_os = "macos"))))'.dependencies.aterm-hash]
path = "../aterm-hash"
optional = true

[target.'cfg(all(unix, not(any(target_os = "redox", target_family = "wasm", target_os = "android", target_os = "ios", target_os = "macos"))))'.dependencies.bytemuck]
