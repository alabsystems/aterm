# Modified by the aterm project in 2026; see the repository NOTICE.
# Derived from the manifest of the published winit 0.30.13 crate (cargo's normalized
# Cargo.toml; upstream's own is that crate's Cargo.toml.orig), and maintained here by hand.
# What differs from upstream (docs/AUDIT-third-party-2026-10-15.md, the winit-core, LW and
# A11Y steps; each row's LOCAL PATCH note says more):
#  - The package is `aterm-window` (library `aterm_window`), a workspace member that takes the
#    workspace's `[lints]` like every other; every dependent names it `aterm-window` and its
#    paths `aterm_window::`. `version` stays 0.30.13: it is the upstream release this crate
#    derives from, which the top-level NOTICE line cites and `forge attest` [OB-6] compares
#    with it. No `documentation` (docs.rs/winit documents upstream, not this crate).
#  - No Android, iOS, Orbital or Web backend: no aterm cell compiles them. Gone with them: the
#    features no aterm crate enables (rwh_04, rwh_05, serde, mint, android-*, the crossfont and
#    notitle CSD variants), the examples, FEATURES.md (upstream's seven-platform support
#    matrix) and the dev-dependencies only they used.
#  - The macOS backend runs on first-party `aterm-objc` and `aterm-cg`, with no objc2-family,
#    `core-foundation` or `core-graphics` row (see the notes where those rows stood). The
#    Windows backend is on `windows-sys` 0.61, its handle conversions in
#    src/platform_impl/windows/handle.rs. The X11 and Wayland backends speak through
#    first-party `aterm-x11`, `aterm-wayland` and `aterm-xkb` and wait in their own poll(2)
#    (src/platform_impl/linux/common/poll.rs), with none of upstream's `x11rb`, `x11-dl`,
#    `bytemuck`, `xkbcommon-dl`, `memmap2`, `smithay-client-toolkit`, `wayland-*`, `calloop`
#    or `rustix` rows: a Wayland keymap arrives as the text aterm-wayland's seat read from the
#    compositor's descriptor (no mapping here), and libwayland-client is always opened at run
#    time (no `wayland-dlopen` feature).
#  - First-party code where upstream took a crate: `aterm-grapheme` for `unicode-segmentation`
#    (Windows), `aterm-hash` for `ahash` (Wayland), `aterm_types::bitflags!` for `bitflags`;
#    X11's drop parser decodes percent escapes with src/platform_impl/linux/common/percent.rs,
#    which Wayland's shares; `keyboard::SmolStr` is src/keyboard/smol_str.rs; `winit::dpi` is
#    src/dpi.rs, the part of dpi 0.1.2 aterm uses; `window::CursorIcon` is src/cursor_icon.rs,
#    the six icons aterm sets and the eight edge-resize icons a client-decorated Wayland
#    header's frame edges set; build.rs prints the five live cfgs itself (no `cfg_aliases`).
#  - No `rwh_06` feature and no `raw-window-handle` row; see the note on `default`.
#  - The Wayland backend draws no client-side frame (no `wayland-csd-adwaita` feature, no
#    `sctk-adwaita` row): where the compositor grants no server-side decorations the
#    application draws its header (aterm-gui's chrome band) and reads the negotiated mode from
#    `platform::wayland::WindowExtWayland::client_decorations`. It has no KDE blur (no
#    `wayland-kwin-blur` feature; `Window::set_blur` is Windows-only).
#  - src/frame_shadow.rs, the shadow margin outside a client-decorated Wayland window, is
#    carved from sctk-adwaita 0.10.1 (MIT; its LICENSE ships beside this file as
#    LICENSE-MIT-sctk-adwaita, and the repository NOTICE names it), so `license` says
#    `Apache-2.0 AND MIT`: the carved file stays MIT.

[package]
edition = "2021"
# LOCAL PATCH (aterm) (docs/AUDIT-third-party-2026-10-15.md, LW.7): 1.88, where upstream
# declares 1.70: what the first-party Linux crates this backend speaks through need (aterm-x11
# and aterm-wayland read words with slice `as_chunks`, 1.88; a selection's pipe is std's
# anonymous pipe, 1.87), above the 1.84 the Windows backend's handle.rs needs for
# `ptr::without_provenance_mut` and `pointer::addr`.
rust-version = "1.88"
name = "aterm-window"
version = "0.30.13"
authors = [
    "The winit contributors",
    "Pierre Krieger <pierre.krieger1708@gmail.com>",
]
build = "build.rs"
include = [
    "/build.rs",
    "/LICENSE",
    "/LICENSE-MIT-sctk-adwaita",
    "/src",
    "/tests",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Cross-platform window creation library."
readme = "README.md"
keywords = ["windowing"]
categories = ["gui"]
license = "Apache-2.0 AND MIT"
repository = "https://github.com/rust-windowing/winit"

[package.metadata.docs.rs]
targets = [
    "i686-pc-windows-msvc",
    "x86_64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "i686-unknown-linux-gnu",
    "x86_64-unknown-linux-gnu",
]
rustdoc-args = [
    "--cfg",
    "docsrs",
]

[features]
# LOCAL PATCH (aterm) (docs/AUDIT-third-party-2026-10-15.md, winit-core step 6 and RWH-LOCK):
# no `rwh_06` feature. On macOS a window hands over its content view through first-party
# `aterm_objc::HasNsView`, which the Metal presenter and aterm-gui's chrome read, and an X11,
# Wayland or Win32 window hands over its handles through first-party
# `aterm_types::native_window::HasNativeWindow`, which the GL and D3D11 arms and the CPU
# presenters read. The opt-in `rwh_06` handles wrapped the same answer and had no caller once
# the BSDs, which turned them on to present through wgpu, stopped building at GW.6; they went
# with the `raw-window-handle` row, which left Cargo.lock.
default = [
    "x11",
    "wayland",
]
# LOCAL PATCH (aterm) (docs/AUDIT-third-party-2026-10-15.md, LW.7): the Wayland
# backend speaks to the compositor through first-party `aterm-wayland` (its protocol tables, a
# runtime over libwayland-client opened at run time, and its registry, output, seat, selection
# and cursor helpers), where upstream used smithay-client-toolkit, wayland-client,
# wayland-backend, wayland-protocols, cursor-icon and calloop.
wayland = [
    "dep:aterm-wayland",
    "aterm-hash",
]
# LOCAL PATCH (aterm) (docs/AUDIT-third-party-2026-10-15.md, LW.7): the X11
# backend speaks to the server through first-party `aterm-x11` (its codec, libxcb transport,
# ICCCM and Xrm, and the Xlib, XInput 2 and Xcursor declarations), where upstream used
# `x11rb` (with `as-raw-xcb-connection` and `gethostname`), `x11-dl` and `bytemuck`.
x11 = [
    "dep:aterm-x11",
]

[lib]
name = "aterm_window"
path = "src/lib.rs"

# LOCAL PATCH (aterm): recorded answers for the leaf types this crate took in from dpi,
# cursor-icon and bitflags (winit-core step 5); see the file.
[[test]]
name = "recorded_answers"
path = "tests/recorded_answers.rs"

# LOCAL PATCH (aterm) (docs/AUDIT-third-party-2026-10-15.md, winit-core steps 5 and 6): the
# crate's six flag types (ModifiersState, ModifiersKeys, macOS's location mask, Windows'
# modifier, cursor and window flags) are `aterm_types::bitflags!`, where upstream uses `bitflags`
# 2, and an X11, Wayland or Win32 window's handles are `aterm_types::native_window`.
# FIRST-PARTY and path-only; aterm-gui already links it in every cell this crate compiles in.
[dependencies.aterm-types]
path = "../aterm-types"

[dependencies.tracing]
version = "0.1.40"
default-features = false

# LOCAL PATCH (aterm): the Wayland backend's maps and set (windows, window requests, seats,
# pointer surfaces, touch points, a window's focused seats) hash with aterm's FxHash where
# upstream used `ahash` (docs/AUDIT-third-party-2026-10-15.md, winit-core step 2). Their keys
# are compositor object ids and window ids, never text a peer chooses, so an unkeyed hash is
# the right one (aterm-hash's own rule). Every iteration over them was read for order
# dependence; none has any beyond what upstream's randomly seeded default already left
# arbitrary. FIRST-PARTY and path-only; its one dependency is astream-wire (path-only,
# dependency-free, vendor/astream), whose FNV byte loop aterm-hash runs.
[target.'cfg(all(unix, not(any(target_os = "redox", target_family = "wasm", target_os = "android", target_os = "ios", target_os = "macos"))))'.dependencies.aterm-hash]
path = "../aterm-hash"
optional = true

# LOCAL PATCH (aterm) (docs/AUDIT-third-party-2026-10-15.md, LW.7): the X11
# backend; see the note on the `x11` feature. FIRST-PARTY and path-only.
[target.'cfg(all(unix, not(any(target_os = "redox", target_family = "wasm", target_os = "android", target_os = "ios", target_os = "macos"))))'.dependencies.aterm-x11]
workspace = true
optional = true

# LOCAL PATCH (aterm) (docs/AUDIT-third-party-2026-10-15.md, LW.7): the Wayland
# backend; see the note on the `wayland` feature. FIRST-PARTY and path-only.
[target.'cfg(all(unix, not(any(target_os = "redox", target_family = "wasm", target_os = "android", target_os = "ios", target_os = "macos"))))'.dependencies.aterm-wayland]
workspace = true
optional = true

[target.'cfg(all(unix, not(any(target_os = "redox", target_family = "wasm", target_os = "android", target_os = "ios", target_os = "macos"))))'.dependencies.libc]
version = "0.2.64"

# LOCAL PATCH (aterm) (docs/AUDIT-third-party-2026-10-15.md, LW.7): the Wayland seat's
# capability-removal test (`seat/retire_tests.rs`) starts `lane-bus seat` and paces it through
# files in a scratch directory; the X11 lost-display test (`x11/gone_tests.rs`) and the GLX
# error test (`x11/glx_error_tests.rs`) run their work in a child, this test binary run again,
# with its output in a scratch directory. FIRST-PARTY, path-only, test builds only.
[target.'cfg(target_os = "linux")'.dev-dependencies.aterm-uds]
workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies.aterm-tempfile]
workspace = true

# LOCAL PATCH (aterm) (docs/AUDIT-third-party-2026-10-15.md, LW.7): libxkbcommon
# (and libxkbcommon-x11) through first-party `aterm-xkb`, read at run time, and its keysym
# names, where upstream used `xkbcommon-dl` and its `xkeysym`. FIRST-PARTY and path-only.
[target.'cfg(all(unix, not(any(target_os = "redox", target_family = "wasm", target_os = "android", target_os = "ios", target_os = "macos"))))'.dependencies.aterm-xkb]
workspace = true

# LOCAL PATCH (aterm), THE CF/CG CARVE: upstream's `core-foundation` 0.9.3 and `core-graphics`
# 0.23.1 rows are RETIRED. The macOS backend declares what it calls through `aterm_objc::cf`
# and `aterm_cg` (first-party, zero third-party dependencies, every prototype held to the SDK
# headers by clang on both arches in `crates/aterm-objc/tests/cf_sdk.rs` and
# `crates/aterm-cg/tests/cg_sdk.rs`). With them went `core-foundation-sys`,
# `core-graphics-types`, `foreign-types`, `foreign-types-shared`, `foreign-types-macros` and,
# on macOS, `bitflags` 1.3.2: -8 packages / -16,477 lines on mac-arm and mac-x64
# (docs/AUDIT-third-party-2026-10-15.md, winit-core step 3).

# LOCAL PATCH (aterm), THE objc2 EXIT: upstream's four macOS objc2-family rows — `block2`
# 0.5.1, `objc2` 0.5.2 (`relax-sign-encoding`), `objc2-app-kit` 0.2.2 and `objc2-foundation`
# 0.2.2 — are RETIRED. Every file of `platform_impl/macos` runs on `aterm-objc`, and so does
# `aterm-gui`, so nothing on a macOS-compiled path names the family, and with the rows gone
# nothing can: an undeclared crate does not resolve. `block2`'s last use was `observer.rs`'s
# queued-closure block, whose `extern "C"` (nounwind) invoke was measured to end the process
# on an NSException raised beneath it; that block is `aterm_objc::RcBlock`. There is no iOS
# backend, so upstream's `cfg(target_os = "ios")` rows went with it.

# LOCAL PATCH (aterm): aterm's own Objective-C runtime layer — `objc_allocateClassPair`,
# `class_addMethod`/`class_addIvar`/`class_addProtocol`, typed sends, the block ABI, and the
# main-thread witness that gates instantiation. This backend's DECLARED CLASSES are built on
# it (`aterm_objc::declare_class!`, where upstream used objc2's), and no file here uses
# `objc2` (see the retirement note above). FIRST-PARTY and path-only: it is a workspace member
# of this repository, has ZERO third-party dependencies by construction, and is macOS-gated.
[target.'cfg(target_os = "macos")'.dependencies.aterm-objc]
path = "../aterm-objc"

# LOCAL PATCH (aterm): `aterm-cg`, the CoreGraphics display calls
# `monitor.rs` and `window_delegate.rs` make (the CF/CG carve). Its own crate,
# not an `aterm-objc` feature, so CoreGraphics is linked only where this
# backend is, and aterm-objc compiles once for every selection. FIRST-PARTY and
# path-only, zero dependencies beyond aterm-objc.
[target.'cfg(target_os = "macos")'.dependencies.aterm-cg]
workspace = true

# LOCAL PATCH (aterm): aterm's own UAX #29 segmenter for the one call upstream made into
# `unicode-segmentation` (8,961 lines, Windows only), keyboard.rs's "is this key's text more
# than one grapheme cluster" (docs/AUDIT-third-party-2026-10-15.md, winit-core step 2).
# FIRST-PARTY and path-only, like `aterm-objc` above; its own dependencies are aterm crates the
# Windows graph already carries, so it adds no package there.
[target.'cfg(target_os = "windows")'.dependencies.aterm-grapheme]
path = "../aterm-grapheme"

[target.'cfg(target_os = "windows")'.dependencies.windows-sys]
version = "0.61.2"
features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Media",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_Security",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_Ime",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_Pointer",
    "Win32_UI_Input_Touch",
    "Win32_UI_Shell",
    "Win32_UI_TextServices",
    "Win32_UI_WindowsAndMessaging",
]

[lints]
workspace = true
