[package]
edition = "2021"
# LOCAL PATCH (aterm), 2026-10-17 (docs/AUDIT-third-party-2026-10-15.md, LW.7): RAISED 1.84 ->
# 1.88, what the first-party Linux crates this backend speaks through already need (aterm-x11
# and aterm-wayland read words with slice `as_chunks`, 1.88; a selection's pipe is std's
# anonymous pipe, 1.87).
rust-version = "1.88"
name = "aterm-window"
version = "0.30.13"
authors = [
    "The winit contributors",
    "Pierre Krieger <pierre.krieger1708@gmail.com>",
]
build = "build.rs"
include = [
    "/build.rs",
    "/LICENSE",
    "/src",
    "/tests",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Cross-platform window creation library."
readme = "README.md"
keywords = ["windowing"]
categories = ["gui"]
license = "Apache-2.0"
repository = "https://github.com/rust-windowing/winit"

[package.metadata.docs.rs]
features = ["rwh_06"]
targets = [
    "i686-pc-windows-msvc",
    "x86_64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "i686-unknown-linux-gnu",
    "x86_64-unknown-linux-gnu",
]
rustdoc-args = [
    "--cfg",
    "docsrs",
]

[features]
# LOCAL PATCH (aterm), 2026-10-15 (docs/AUDIT-third-party-2026-10-15.md, winit-core step 6):
# `rwh_06` is not a default. On macOS a window hands over its content view through
# first-party `aterm_objc::HasNsView`, which the Metal presenter and aterm-gui's chrome read,
# so raw-window-handle leaves the macOS graph. 2026-10-17, the Linux half: an X11 or Wayland
# window hands over its handles through first-party `aterm_types::native_window::
# HasNativeWindow`, which the GL arm and the CPU presenters read, so it leaves the Linux graph
# too; the opt-in `rwh_06` handles there wrap the same answer. The cells that still present
# through wgpu or softbuffer (Windows, the BSDs) turn it on: aterm-gui's dependency row for
# them. (accesskit_winit's default features also did, until A11Y.4 retired it.)
default = [
    "x11",
    "wayland",
]
rwh_06 = ["dep:rwh_06"]
# LOCAL PATCH (aterm), 2026-10-17 (docs/AUDIT-third-party-2026-10-15.md, LW.7): the Wayland
# backend speaks to the compositor through first-party `aterm-wayland` (its protocol tables, a
# runtime over libwayland-client opened at run time, and its registry, output, seat, selection
# and cursor helpers), where upstream used smithay-client-toolkit, wayland-client,
# wayland-backend, wayland-protocols, cursor-icon and calloop.
wayland = [
    "dep:aterm-wayland",
    "aterm-hash",
]
# LOCAL PATCH (aterm), 2026-10-17 (docs/AUDIT-third-party-2026-10-15.md, LW.7): the X11
# backend speaks to the server through first-party `aterm-x11` (its codec, libxcb transport,
# ICCCM and Xrm, and the Xlib, XInput 2 and Xcursor declarations), where upstream used
# `x11rb` (with `as-raw-xcb-connection` and `gethostname`), `x11-dl` and `bytemuck`.
x11 = [
    "dep:aterm-x11",
]

[lib]
name = "aterm_window"
path = "src/lib.rs"

# LOCAL PATCH (aterm), 2026-10-15: recorded answers for the leaf types winit-core step 5
# absorbs (dpi, cursor-icon, the bitflags! types); see the file.
[[test]]
name = "recorded_answers"
path = "tests/recorded_answers.rs"

# LOCAL PATCH (aterm), 2026-10-15 (docs/AUDIT-third-party-2026-10-15.md, winit-core step 5): the
# crate's seven flag types (ModifiersState, ModifiersKeys, WindowButtons, macOS's location mask,
# Windows' modifier, cursor and window flags) are `aterm_types::bitflags!`, where upstream uses
# `bitflags` 2. 2026-10-17 (winit-core step 6, the Linux half): an X11 or Wayland window's
# handles are `aterm_types::native_window`. FIRST-PARTY and path-only; aterm-gui already links
# it in every cell this crate compiles in.
[dependencies.aterm-types]
path = "../aterm-types"

[dependencies.rwh_06]
version = "0.6"
features = ["std"]
optional = true
package = "raw-window-handle"

[dependencies.tracing]
version = "0.1.40"
default-features = false

# LOCAL PATCH (aterm), 2026-10-15: the Wayland backend's maps and set (windows, window
# requests, seats, pointer surfaces, touch points, a window's focused seats) hash with aterm's
# FxHash instead of `ahash` (docs/AUDIT-third-party-2026-10-15.md, winit-core step 2). Their keys
# are compositor object ids and window ids, never text a peer chooses, so an unkeyed hash is the
# right one (aterm-hash's own rule), and it is what the retired `ahash` row already ran: it had
# pinned ahash to fixed seeds (`no-rng`). Every iteration over them was read for order
# dependence; none has any beyond what upstream's randomly seeded default already left
# arbitrary. FIRST-PARTY and path-only; its one dependency is astream-wire (path-only,
# dependency-free, vendor/astream), whose FNV byte loop aterm-hash runs.
[target.'cfg(all(unix, not(any(target_os = "redox", target_family = "wasm", target_os = "android", target_os = "ios", target_os = "macos"))))'.dependencies.aterm-hash]
path = "../aterm-hash"
optional = true

# LOCAL PATCH (aterm), 2026-10-17 (docs/AUDIT-third-party-2026-10-15.md, LW.7): the X11
# backend; see the note on the `x11` feature. FIRST-PARTY and path-only.
[target.'cfg(all(unix, not(any(target_os = "redox", target_family = "wasm", target_os = "android", target_os = "ios", target_os = "macos"))))'.dependencies.aterm-x11]
workspace = true
optional = true

# LOCAL PATCH (aterm), 2026-10-17 (docs/AUDIT-third-party-2026-10-15.md, LW.7): the Wayland
# backend; see the note on the `wayland` feature. FIRST-PARTY and path-only.
[target.'cfg(all(unix, not(any(target_os = "redox", target_family = "wasm", target_os = "android", target_os = "ios", target_os = "macos"))))'.dependencies.aterm-wayland]
workspace = true
optional = true

[target.'cfg(all(unix, not(any(target_os = "redox", target_family = "wasm", target_os = "android", target_os = "ios", target_os = "macos"))))'.dependencies.libc]
version = "0.2.64"

# LOCAL PATCH (aterm), 2026-10-19 (docs/AUDIT-third-party-2026-10-15.md, LW.7): the Wayland
# seat's capability-removal test (`seat/retire_tests.rs`) starts `lane-bus seat` and paces it
# through files in a scratch directory. FIRST-PARTY, path-only, test builds only.
[target.'cfg(target_os = "linux")'.dev-dependencies.aterm-uds]
workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies.aterm-tempfile]
workspace = true

# LOCAL PATCH (aterm), 2026-10-17 (docs/AUDIT-third-party-2026-10-15.md, LW.7): libxkbcommon
# (and libxkbcommon-x11) through first-party `aterm-xkb`, read at run time, and its keysym
# names, where upstream used `xkbcommon-dl` and its `xkeysym`. FIRST-PARTY and path-only.
[target.'cfg(all(unix, not(any(target_os = "redox", target_family = "wasm", target_os = "android", target_os = "ios", target_os = "macos"))))'.dependencies.aterm-xkb]
workspace = true

# LOCAL PATCH (aterm), THE CF/CG CARVE, 2026-10-15: the `core-foundation` 0.9.3 row stood here
# and `core-graphics` 0.23.1 stood after the `objc2` note below (both `cfg(macos)` once the iOS
# backend was cut); both are RETIRED. The macOS backend declares what it calls through
# `aterm_objc::cf` and `aterm_cg` (first-party, zero dependencies, every prototype held to
# the SDK headers by clang on both arches in `crates/aterm-objc/tests/cf_sdk.rs` and
# `crates/aterm-cg/tests/cg_sdk.rs`). With them
# went `core-foundation-sys`, `core-graphics-types`, `foreign-types`, `foreign-types-shared`,
# `foreign-types-macros` and, on macOS, `bitflags` 1.3.2: -8 packages / -16,477 lines on
# mac-arm and mac-x64 (docs/AUDIT-third-party-2026-10-15.md, winit-core step 3).

# LOCAL PATCH (aterm), THE objc2 EXIT CONDITION, 2026-09-03: four macOS rows
# stood here and on the two tables after `aterm-objc` below — `block2` 0.5.1,
# `objc2` 0.5.2 (`relax-sign-encoding`), `objc2-app-kit` 0.2.2 and
# `objc2-foundation` 0.2.2, each with its feature list — and all four are
# RETIRED. `block2` went FIRST, and for a different reason: its last macOS use
# was `observer.rs`'s queued-closure block, whose `extern "C"` (nounwind)
# invoke was measured to abort the process on an NSException raised beneath
# it; that block is `aterm_objc::RcBlock` now (the containment, 2026-09-05),
# and the row left with it. The other three leave here, with the port. W9 phase 3 had narrowed `objc2` and `block2` from upstream's
# `cfg(any(ios, macos))` to `cfg(macos)`, so that the iOS backend — 9 files,
# 3,743 lines, 8 of them (3,691 lines) using the family, which no aterm target
# compiles — could not hold the packages in the mac-arm graph at zero macOS
# uses. W12 then ported the last eight files of `platform_impl/macos` onto
# `aterm-objc` (the fork's half: zero), and W13 ported `aterm-gui`'s last five
# and retired ITS four rows (the crate's half: zero). Each branch measured the
# other half unmoved, and W12 measured that deleting these rows ALONE broke
# `aterm-gui`, whose build had been borrowing `NSThread`, `dispatch` and
# `NSEnumerator` from the `objc2-foundation` features this manifest enabled.
# Merged, nothing on a macOS-compiled path names the family, and with the rows
# gone nothing can: an undeclared crate does not resolve. A HYPOTHETICAL
# `--target *-apple-ios` build of this fork has not resolved `objc2` since W9
# phase 3, and since 2026-10-15 there is no iOS backend at all: upstream's
# `cfg(target_os = "ios")` rows left with it.

# LOCAL PATCH (aterm): aterm's own Objective-C runtime layer — `objc_allocateClassPair`,
# `class_addMethod`/`class_addIvar`/`class_addProtocol`, typed sends, the block ABI, and the
# main-thread witness that gates instantiation. This backend's DECLARED CLASSES are moving off
# `objc2`'s `declare_class!` onto it, one file at a time; `window_delegate.rs` is the first.
# FIRST-PARTY and path-only: it is a workspace member of the repository that owns this fork, has
# ZERO third-party dependencies by construction, and is macOS-gated here exactly as the AppKit
# bindings beside it are. It removes no package from the graph on its own and does not claim to —
# `objc2` leaves only when every file in this backend has stopped using it.
# That day was the W12 + W13 merge, 2026-09-03; see the retirement note above.
[target.'cfg(target_os = "macos")'.dependencies.aterm-objc]
path = "../aterm-objc"

# LOCAL PATCH (aterm), 2026-10-16: `aterm-cg`, the CoreGraphics display calls
# `monitor.rs` and `window_delegate.rs` make (the CF/CG carve). Its own crate,
# not an `aterm-objc` feature, so CoreGraphics is linked only where this
# backend is, and aterm-objc compiles once for every selection. FIRST-PARTY and
# path-only, zero dependencies beyond aterm-objc.
[target.'cfg(target_os = "macos")'.dependencies.aterm-cg]
workspace = true

# LOCAL PATCH (aterm), 2026-10-15: `unicode-segmentation` (8,961 lines, Windows only) is
# replaced by aterm's own UAX #29 segmenter for its one call, keyboard.rs's "is this key's text
# more than one grapheme cluster" (docs/AUDIT-third-party-2026-10-15.md, winit-core step 2).
# FIRST-PARTY and path-only, like `aterm-objc` above; its own dependencies are aterm crates the
# Windows graph already carries, so the cell loses one package and gains none.
[target.'cfg(target_os = "windows")'.dependencies.aterm-grapheme]
path = "../aterm-grapheme"

[target.'cfg(target_os = "windows")'.dependencies.windows-sys]
version = "0.61.2"
features = [
