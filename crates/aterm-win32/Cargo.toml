#
# Every file under src/ but lib.rs, com.rs and dxgi.rs is GENERATED by
# aterm-win32-oracle from the upstream `windows-sys` crate, version 0.61.2
# (https://github.com/microsoft/windows-rs, by Microsoft Corporation,
# dual-licensed MIT OR Apache-2.0), and names the upstream file it came from.
# lib.rs's `link!` macro is derived from `windows-link` 0.2.1, com.rs's
# `IUnknown_Vtbl` from `windows-core` 0.62.2 and dxgi.rs from `windows`
# 0.62.2 (same project, same licence). See `LICENSE-MIT` and `LICENSE-APACHE`
# in this directory for the upstream licenses.

[package]
name = "aterm-win32"
description = "aterm's Win32 declarations: the windows-sys 0.61.2 types, constants and imports aterm's Windows graph reads, generated at upstream's module paths, plus the COM vocabulary and DXGI slice aterm calls, with no third-party dependency (derived from windows-sys, windows-link, windows-core and windows, MIT OR Apache-2.0 upstream)."
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
license = "Apache-2.0 AND (MIT OR Apache-2.0)"

[lib]
name = "aterm_win32"
path = "src/lib.rs"
# No unit tests live in src/; tests/recorded.rs holds the generated
# declarations, tests/com.rs the hand-written ones, and tests/dxgi_live.rs
# and tests/scrgb_live.rs call DXGI on a live Windows desktop.
test = false

# No dependencies, on any target: rustc writes each DLL import itself
# (`link!` in src/lib.rs), so neither windows-link nor an import library is
# needed.

[lints]
workspace = true
