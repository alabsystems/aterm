[package]
name = "aterm-ctl"
# Integration tests are declared below, not discovered: the files are modules of
# the one `ctl_suite` binary. With autotests off a `tests/*.rs` file listed
# nowhere never compiles.
autotests = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "aterm — a std-only command-line client for the aterm introspection control socket (v1)."

[[bin]]
name = "aterm-ctl"
path = "src/main.rs"
# main.rs holds no tests; integration tests still get the binary.
test = false

[features]
# DEVELOPMENT SEAMS in an optimized build: this crate's `aterm_types::dev_seam!` reads (a
# discovery probe's wait, `ATERM_DEBUG_CTL_PROBE_WITHIN_MS`, and a connect's accept patience,
# `ATERM_DEBUG_CTL_ACCEPT_WITHIN_MS`, which the live suites lift to their hang detector). A debug
# build compiles them anyway; the release cutter never enables this (aterm's `dev-seams`
# forwards here), so a shipped binary waits the full 2 s and 10 s.
dev-seams = []

[dependencies]
# Workspace crates only: this binary has no third-party dependencies.
#
# Socket naming and discovery, shared with the server so the two cannot drift.
aterm-types = { workspace = true }
# The portable control-socket stream and `latest`-alias resolution.
aterm-uds = { workspace = true }
# The control wire's percent escape (`sessions` titles, `conn`), the one copy
# the server's `aterm_control::wire::pct_*` re-export. Workspace crate: std plus
# astream-wire (dependency-free, vendor/astream), so still no third-party crate.
aterm-codec = { workspace = true }
# The `edit` request, its ticket replies and `await edit` (`amacs_protocol`), for the `amacs`
# client's exchanges: one grammar with the server, and no editor engine in this crate's graph.
amacs-protocol = { workspace = true }

# The census's process table (`kproc::records`), read in-process instead of running `ps`.
# First-party, and so is each crate it brings (its `libc` is aterm-libc).
[target.'cfg(target_os = "macos")'.dependencies]
aterm-sysprobe = { workspace = true }

[dev-dependencies]
# Scratch directories for the tests' sockets, removed on drop.
aterm-tempfile = { workspace = true }
# The tests' scratch-directory stamp.
aterm-time = { workspace = true }

# tests/terminal_output.rs puts the CLI's stdout or stderr on a real pty.
[target.'cfg(unix)'.dev-dependencies]
aterm-pty = { workspace = true }

[[test]]
name = "ctl_suite"
path = "tests/ctl_suite.rs"

[lints]
workspace = true
