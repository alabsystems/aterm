[package]
name = "aterm-update-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Portable update primitives shared by aterm-update and atpkg: source resolution, machine-roster verification, file locks, HTTP, private directories and SHA-256."

[features]
# Development seams in an optimized build (`ATERM_UPDATE_ROOT`; the `[update]` owner/repo
# repoint, `source::REPOINT_IS_A_DEV_SEAM`). Debug builds compile them anyway; the release
# cutter never enables this.
dev-seams = []

[dependencies]
# The private-dir ownership predicate shared with the control socket's hardening, plus
# `dev_seam!` and the RFC 3339 helpers.
aterm-types = { workspace = true }
# How each write is finished: durable (F_FULLFSYNC) or ordered (F_BARRIERFSYNC).
aterm-durable = { workspace = true }
# The roster clock (`roster::now_unix`) reads the workspace's one epoch accessor.
aterm-time = { workspace = true }
# Diagnostics land in the app log file (visible for a Finder-launched .app, unlike stderr).
aterm-log = { workspace = true }
# The release-manifest wire type (src/manifest.rs) the publisher and the updater share.
serde = { workspace = true, features = ["derive"] }
aterm-toml = { workspace = true }
# Ed25519 verification of the master-signed MACHINE ROSTER (src/roster.rs). The chain
# lives here rather than in aterm-update because BOTH sides need it: the client verifies
# it, and the owner-side minting tool emits and signs it through the very same type. Two
# spellings of one verifier is the drift this crate exists to prevent.
#
# No features (the workspace row turns ring's defaults off) is deliberate and matches
# atpkg's edge: VERIFICATION needs neither RNG nor alloc, so the client's crypto surface
# stays minimal. ring is already a direct dependency of atpkg, aterm-update and
# aterm-release, so this adds an edge, not a crate — and the `deny.toml` version floor
# already covers it. Its `digest` (no feature needed) is also the macOS arm of
# `hash::sha256_file`: the CPU's SHA-256 instructions, as atpkg's bulk hash uses.
ring = { workspace = true }
# Decode the base64 master + machine Ed25519 public keys (32 raw bytes each).
# Standard padded Base64 — first-party; its one dependency is astream-wire
# (dependency-free, vendor/astream). `decode_strict` is
# the entry point every trust path uses: canonical padding REQUIRED and no
# trailing bits, so a pinned key has exactly one spelling.
aterm-codec = { workspace = true }
# `aterm_uds::spawnfd::command` builds every child: no descriptor above stdio leaks, and on
# Windows a console-less caller gives its curl and certutil children a windowless console.
aterm-uds = { workspace = true }

# getuid(2), fsync(2), and the open flags and errno values std does not name.
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

# The Linux arm of `hash::sha256_file` (docs/AUDIT-third-party-2026-10-15.md,
# CT.2): first-party, zero-dependency SHA-256 in place of `ring::digest`. The
# macOS arm hashes on ring (above), whose SHA-256 runs on the CPU's instructions
# where the scalar loop would not; Windows runs its system hash command.
[target.'cfg(target_os = "linux")'.dependencies]
aterm-digest = { workspace = true }

[dev-dependencies]
# Exclusive private directories for file-hash fixtures, removed on drop.
aterm-tempfile = { workspace = true }
# The Linux binary-identity round-trip test; the library writes no JSON.
aterm-json = { workspace = true }
# The roster tests sign synthetic fixtures, which needs ring's `alloc`; default features in
# the test build only, so the normal build still proves the no-alloc verify path.
ring = { workspace = true, features = ["default"] }
# `hash::sha256_stream` (the Linux arm) compiles for tests on every host, so its recorded
# answers run everywhere.
aterm-digest = { workspace = true }

[lints]
workspace = true
