[package]
name = "aterm-update-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Portable update primitives shared by aterm-update and atpkg: source resolution, machine-roster verification, file locks, HTTP, private directories and SHA-256."

[features]
# Development seams in an optimized build (`aterm_types::dev_seam!`: ATERM_UPDATE_ROOT;
# `source::REPOINT_IS_A_DEV_SEAM`: the `[update]` owner/repo repoint). Debug builds
# compile them anyway; the release cutter never enables this — aterm-release's
# buildplan pins that.
dev-seams = []

[dependencies]
# Reuse the single source-of-truth private-dir ownership predicate (no drift with
# the control socket's Application Support hardening).
aterm-types = { workspace = true }
# The roster clock (`roster::now_unix`) reads the workspace's one epoch accessor.
aterm-time = { workspace = true }
# Route diagnostics through the global logger aterm-gui installs, so they land in
# the app log file (visible for a Finder-launched .app, unlike stderr).
aterm-log = { workspace = true }
# The shared release-manifest wire type (src/manifest.rs): ONE serde struct the
# publisher (crates/aterm-release) and the updater client both compile against.
serde = { workspace = true, features = ["derive"] }
aterm-toml = { workspace = true }
# Ed25519 verification of the master-signed MACHINE ROSTER (src/roster.rs). The chain
# lives here rather than in aterm-update because BOTH sides need it: the client verifies
# it, and the owner-side minting tool emits and signs it through the very same type. Two
# spellings of one verifier is the drift this crate exists to prevent.
#
# No features (the workspace row turns ring's defaults off) is deliberate and matches
# atpkg's edge: VERIFICATION needs neither RNG nor alloc, so the client's crypto surface
# stays minimal. ring is already a direct dependency of atpkg, aterm-update and
# aterm-release, so this adds an edge, not a crate — and the `deny.toml` version floor
# already covers it.
ring = { workspace = true }
# Decode the base64 master + machine Ed25519 public keys (32 raw bytes each).
# Standard padded Base64 — first-party and zero-dependency. `decode_strict` is
# the entry point every trust path uses: canonical padding REQUIRED and no
# trailing bits, so a pinned key has exactly one spelling.
aterm-codec = { workspace = true }
# `aterm_uds::spawnfd::command`: the `Command` every child here is built with, so
# none inherits a descriptor of this process above stdio (clippy.toml: one child
# constructor), and on Windows a caller with no console (the window) gives its curl and
# certutil children a WINDOWLESS console instead of a visible one.
aterm-uds = { workspace = true }

# flock(2) for the apply/stage critical sections + getuid(2) for the private-dir
# ownership check. The two narrow syscalls with no safe std wrapper (POSIX-only;
# Windows uses std-only approximations).
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

# The Linux arm of `hash::sha256_file` (docs/AUDIT-third-party-2026-10-15.md,
# CT.2): first-party, zero-dependency SHA-256 in place of `ring::digest`, which
# leaves ring here only for the roster's Ed25519 verify. Other hosts run their
# system hash command and do not link it.
[target.'cfg(target_os = "linux")'.dependencies]
aterm-digest = { workspace = true }

[dev-dependencies]
# Exclusive private directories for file-hash fixtures, removed on drop.
aterm-tempfile = { workspace = true }
# The Linux binary-identity round-trip test reads its JSON back through the
# workspace's own parser; the library itself writes no JSON.
aterm-json = { workspace = true }
# The roster tests must SIGN deterministic fixtures with obviously-synthetic seeds
# (`Ed25519KeyPair::from_seed_unchecked` + `.sign`), which needs ring's `alloc` feature.
# Re-declaring ring here with DEFAULT features pulls alloc into the TEST build only, so
# the normal build still proves the no-alloc verify path compiles on its own.
ring = { workspace = true, features = ["default"] }
# The Linux arm's hash loop (`hash::sha256_stream`) is compiled for tests on every
# host, so its recorded answers run here too, not only on Linux.
aterm-digest = { workspace = true }

[lints]
workspace = true
