[package]
name = "aterm-forge"
version.workspace = true
edition = "2024"
license = "Apache-2.0"
publish = false
description = "aterm-forge — the third-party surface survey, provenance notary and carve ledger behind `targo --unverified forge`"

[[bin]]
name = "aterm-forge"
path = "src/main.rs"

[lib]
name = "aterm_forge"
path = "src/lib.rs"

[dependencies]
# No third-party dependencies: the tool that measures the surface does not
# enlarge it. `aterm-toml`'s comment-preserving document model reads the policy
# file, whose comments carry the fork reasons.
aterm-toml = { workspace = true }
# The shared source walk, the [patch] classification and the census review
# (`reviewed_forks`, read from vendor/forge.toml), so each has one definition.
aterm-census = { workspace = true }
# Parses cargo's metadata JSON.
aterm-json = { workspace = true }
# Descriptor-safe children, delegated to verify's cancellation scope when embedded.
aterm-uds = { workspace = true }

[dev-dependencies]
# Fixture workspaces removed on drop.
aterm-tempfile = { workspace = true }

[lints]
workspace = true
