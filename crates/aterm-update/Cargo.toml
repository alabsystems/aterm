[package]
name = "aterm-update"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "aterm — signature-pinned in-app updater: stages verified releases and hands the live session to the new build in place."

[features]
default = []
# Compile the shipping source↔spec anchors for cross-crate inventory collection.
# Tests always compile the same anchors through `cfg(test)`; the default updater
# build keeps the specification machinery out of the shipped dependency graph.
spec-anchors = ["dep:aterm-spec"]
# Development seams in an optimized build — forwarded to the crate that reads them
# (`aterm-update-core`: ATERM_UPDATE_ROOT, the `[update]` repoint). The release cutter
# never enables this; aterm-release's buildplan pins that.
dev-seams = ["aterm-update-core/dev-seams"]

[dependencies]
# Manifest (aterm-appcast.toml) + the on-disk `ready.toml` staging marker.
aterm-toml = { workspace = true }
serde = { workspace = true, features = ["derive"] }
# The Linux lane's compiled binary identity crosses as JSON
# (`binary_identity_json`, and the candidate's identity probe in `linux.rs`).
aterm-json = { workspace = true }
# renamex_np(RENAME_SWAP) for the atomic bundle swap.
libc = { workspace = true }
# The shared RFC3339 civil-calendar math (`aterm_types::rfc3339`).
aterm-types = { workspace = true }
# The workspace's one epoch-clock read (`aterm_time::unix_secs`).
aterm-time = { workspace = true }
# The artifact-agnostic, portable update primitives (Source resolution, FileLock +
# same_volume, the download host's curl plumbing, ensure_private_dir, sha256_file, the
# pin idiom).
aterm-update-core = { workspace = true }
# Route updater diagnostics through the global logger aterm-gui installs, so they
# land in the app log file (visible for a Finder-launched .app, unlike stderr).
aterm-log = { workspace = true }
# Decode the base64-pinned paper master (32 raw bytes) for its fingerprint.
# `decode_strict`: canonical padding required and no trailing bits, so a pinned
# key has exactly one spelling.
aterm-codec = { workspace = true }
# Fingerprints the decoded compile-time update key (the bytes the verifier
# consumes, not the base64 literal).
aterm-digest = { workspace = true }
# The ONE audited entropy surface (`aterm_uds::rand`) for the re-exec nonce —
# never a hand-rolled `/dev/urandom` read (that pattern caused kernel panics).
# aterm-uds has no dependencies, so no cycle.
aterm-uds = { workspace = true }
# Optional source↔spec anchor support. The real Tier-1 conformance test gets the
# same crate through `[dev-dependencies]` below.
aterm-spec = { workspace = true, optional = true }

[dev-dependencies]
# install.sh's tests build atpkg's shim from its own block (`build_cache::shim_block`),
# so the shim writer and the installer's reader answer to one contract.
atpkg = { workspace = true }
# Signing side (Ed25519KeyPair::from_seed_unchecked + .sign) for the roster-chain
# fixtures; the verifying side is `aterm_update_core::roster`'s.
ring = { workspace = true, features = ["default"] }
# Tier-1 binds the real updater reducers to their single-source derived models;
# production builds retain no spec dependency.
aterm-spec = { workspace = true }
# Test scratch directories removed on drop, and the shared-inode stand-ins the
# install.sh tests lay as stub tools (`stand_in`, a debug build's).
aterm-tempfile = { workspace = true }

[lints]
workspace = true
