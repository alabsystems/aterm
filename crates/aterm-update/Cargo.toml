[package]
name = "aterm-update"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "aterm — signature-pinned in-app updater: stages verified releases and hands the live session to the new build in place."

[features]
# Development seams in an optimized build — forwarded to the crate that reads them
# (`aterm-update-core`: ATERM_UPDATE_ROOT, the `[update]` repoint). The release cutter
# never enables this; aterm-release's buildplan pins that.
dev-seams = ["aterm-update-core/dev-seams"]

[dependencies]
# The manifest (aterm-appcast.toml) and the `ready.toml` staging marker.
aterm-toml = { workspace = true }
serde = { workspace = true, features = ["derive"] }
# The Linux lane's compiled binary identity crosses as JSON
# (`binary_identity_json`, and the candidate's identity probe in `linux.rs`).
aterm-json = { workspace = true }
# renamex_np(RENAME_SWAP) for the atomic bundle swap.
libc = { workspace = true }
# How each write is finished: durable (F_FULLFSYNC) or ordered (F_BARRIERFSYNC).
aterm-durable = { workspace = true }
# The shared RFC3339 civil-calendar math (`aterm_types::rfc3339`).
aterm-types = { workspace = true }
# `aterm_time::unix_secs`, the workspace's one epoch-clock read.
aterm-time = { workspace = true }
# Portable update primitives: Source resolution, FileLock, curl downloads, sha256_file.
aterm-update-core = { workspace = true }
# Diagnostics go to the app log file, visible for a Finder-launched .app.
aterm-log = { workspace = true }
# `base64::decode_strict` for the compiled update key (one spelling per key), and hex.
aterm-codec = { workspace = true }
# SHA-256 of the decoded update key and of Linux binaries.
aterm-digest = { workspace = true }
# `aterm_uds::rand`, the audited entropy source (nonces, jitter); never a hand-rolled
# `/dev/urandom` read.
aterm-uds = { workspace = true }
# The anchor attributes' registry (std-only): `#[cfg_attr(any(test, debug_assertions),
# aterm_spec_anchor::refines(…))]` expands in every test and debug build; release strips it.
aterm-spec-anchor = { workspace = true }

[target.'cfg(unix)'.dependencies]
# The Linux lane's steady clock is named by the kernel's boot id
# (`linux::steady_clock`), judged by astream's reader of its text
# (`parse_boot_id`: a UUID, the all-zero id refused), the reader aterm-link's
# broker and the supervisor's sleep count use. Unix, as the lane is (`linux`
# compiles on Linux and into macOS test builds). Zero dependencies, and not a
# new edge in the shipped graph: aterm-durable above links it on Apple, and
# aterm-link on every Unix.
astream-sys = { path = "../../vendor/astream/crates/astream-sys" }

[dev-dependencies]
# install.sh's tests build atpkg's shim from its own block (`build_cache::shim_block`),
# so the shim writer and the installer's reader answer to one contract.
atpkg = { workspace = true }
# Signing side (Ed25519KeyPair::from_seed_unchecked + .sign) for the roster-chain
# fixtures; the verifying side is `aterm_update_core::roster`'s.
ring = { workspace = true, features = ["default"] }
# Tier-1 conformance tests bind the updater reducers to their derived models.
aterm-spec = { workspace = true }
# The models its tests drive (a model edit rebuilds only their tests).
aterm-models-misc = { workspace = true }
aterm-models-update = { workspace = true }
# Test scratch directories removed on drop, and the shared-inode stand-ins the
# install.sh tests lay as stub tools (`stand_in`).
aterm-tempfile = { workspace = true }

# Explicit mounted-volume acceptance; not an ordinary test or a release dependency.
[[bench]]
name = "dmg_acceptance"
harness = false
test = false

[lints]
workspace = true
