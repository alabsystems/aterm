[package]
name = "aterm-vz"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The Linux lane's own VM (docs/DESIGN-vz-guest-2026-10-23.md): Ubuntu's pinned image, the in-house gunzip of its kernel, the base, baked and live disk layers made with APFS clones, and the helper that runs the VM (its Machine port, control protocol, lifetime and detectors, and the dev-only aterm-vz-host)"

# The image and the disks (the design's slice V3), and the helper (V2). The
# library loads no framework: the dev-only `[[bin]]` below `dlopen`s
# Virtualization.framework when it boots a VM (never `#[link]`), so linking
# this library, or starting the helper, loads nothing of it.
[[bin]]
name = "aterm-vz-host"
path = "src/bin/aterm-vz-host/main.rs"

[dependencies]
# The image pins' provider rows (`host::TOOLS`' `ubuntu-root` and
# `ubuntu-kernel`, placed by `verify provision --linux`) and their resolver;
# `spawnfd::command` and its one-minute detector for `hdiutil`, and
# `os_path!` for its absolute path; the host user's name and uid for the seed.
aterm-uds = { workspace = true }
# A volume's free bytes for the free-space floor at every bring-up
# (`volumes::read_path`).
aterm-sysprobe = { workspace = true }
# The in-house gunzip of the pinned `vmlinuz` to the arm64 `Image`
# (`inflate::stream::GzipReader`, which checks the CRC and the length).
aterm-codec = { workspace = true }
# The SHA-256 the gunzipped `Image` and the initrd are held to.
aterm-digest = { workspace = true }
# The seed's fingerprint: FNV-1a/64, as the guest plan's fingerprint is.
aterm-hash = { workspace = true }
# The seal and the live record finish their writes durably (`clippy.toml`
# bans a bare `sync_all`).
aterm-durable = { workspace = true }
# The live record's reader (`Table`'s `FromStr`, no derive: the library's
# graph holds no proc macro).
aterm-toml = { workspace = true }
# Scratch directories the kernel and the seed are laid in before their one
# rename into place.
aterm-tempfile = { workspace = true }
# The record's clock (Unix seconds).
aterm-time = { workspace = true }
# The placed rows' `stamp.json`, which holds the base and the kernel to their pin
# (`Value`, no derive).
aterm-json = { workspace = true }
# The guest agent's wire codec (`wire::Frame`, `Hello`, `Exec`) and its ports
# (`COMMAND_PORT`, `WATCH_PORT`), which the helper and its client speak.
aterm-vz-agent = { workspace = true }

[target.'cfg(unix)'.dependencies]
# `kill` for the escalation by pid, `O_CLOEXEC` for the disk's lock file
# (first-party, crates/aterm-libc).
libc = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
# The helper's VZ arm: the framework's classes by name after its `dlopen`,
# `checked_msg` sends, completion blocks, the listener's delegate class, and
# the serial queue every VZ call runs on (`SerialQueue`). It links libobjc,
# Foundation and CoreFoundation, no GUI framework.
aterm-objc = { workspace = true }

[dev-dependencies]
# The tooling cache's reclaim, which the tests hold to keeping a row the lane
# reads at every bring-up (`build_cache::tooling::plan`).
atpkg = { workspace = true }

[lints]
workspace = true
