# This crate is a modified block-mode subset of the upstream `lz4_flex` crate
# (https://github.com/pseitz/lz4_flex, MIT-licensed, by Pascal Seitz et al).
# See `LICENSE-MIT` in this directory for the upstream license. The derived
# files preserve the original layout (`src/block/*.rs`, `src/sink.rs`,
# `src/fastcpy.rs`) and carry local compatibility, lint, and verification
# changes.

[package]
name = "aterm-lz4"
description = "Vendored block-mode subset of lz4_flex for aterm. MIT/Apache-2.0."
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
license = "MIT AND Apache-2.0"

[lib]
name = "aterm_lz4"
path = "src/lib.rs"

[dependencies]

[dev-dependencies]
# Upstream lz4_flex uses proptest for fastcpy property tests; keeping it as
# a dev-dep lets vendor refreshes land without edits to the inline tests.
proptest = { workspace = true }

[lints]
workspace = true
