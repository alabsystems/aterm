# changes.

[package]
name = "aterm-lz4"
# Integration tests are declared below, not discovered. With autotests off a
# `tests/*.rs` file listed nowhere never compiles.
autotests = false
description = "Vendored block-mode subset of lz4_flex for aterm. MIT/Apache-2.0."
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
license = "MIT AND Apache-2.0"

[lib]
name = "aterm_lz4"
path = "src/lib.rs"

[dependencies]

[lints]
workspace = true

[[test]]
name = "lz4_suite"
path = "tests/lz4_suite.rs"
