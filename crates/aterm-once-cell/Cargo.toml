[package]
# The package must be named `once_cell`: `[patch.crates-io]` matches on package
# name. The directory keeps the `aterm-` prefix so it is not mistaken for
# vendored upstream (`vendor/`).
name = "once_cell"
# Not `version.workspace = true`: this is a semver contract with the consumers.
# It must satisfy the strictest requirement (`naga`, `wgpu-core` and
# `wgpu-hal` 29.0.3 ask `^1.21`) and stay >= any other `1.x` once_cell in the
# graph, or cargo picks the registry copy and the patch row is silently inert.
# `targo --unverified forge check` fails if that happens.
version = "1.21.4"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "First-party `once_cell` replacement for aterm (sync/unsync/race cells over std's OnceLock, Mutex and Cell; replaces the crates.io once_cell package)"

# Declared explicitly so the crate name consumers write cannot drift.
[lib]
name = "once_cell"
path = "src/lib.rs"
# No unit tests: they live in tests/behaviour.rs.
test = false

[dependencies]
# None. Upstream's three are optional, behind the features this shim does not
# declare (below).

[features]
# Upstream's feature names that change nothing here, declared (a `[patch]`
# target must accept every feature its consumers ask for) and inert: `sync`,
# `unsync` and `race` are always built. The implications are upstream's.
# `critical-section`, `atomic-polyfill`, `parking_lot` and `portable-atomic` are
# NOT declared: each changes upstream's implementation, so a consumer that asks
# for one fails to resolve instead of silently getting this one. No `default`
# key (upstream's is `std`): an inert default still forked the build, since a
# `--workspace` build selects this member with it and the shipped graph's
# consumers (rustls) turn defaults off, so the two compiled two once_cells and
# everything above them (P4).
std = ["alloc"]
alloc = ["race"]
race = []
unstable = []

[dev-dependencies]
# No differential oracle: a registry `once_cell` would make `-p once_cell`
# ambiguous. tests/behaviour.rs asserts the contracts directly.

[lints]
workspace = true
