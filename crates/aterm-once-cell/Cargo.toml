[package]
# The package must be named `once_cell`: `[patch.crates-io]` matches on package
# name. The directory keeps the `aterm-` prefix so it is not mistaken for
# vendored upstream (`vendor/`).
name = "once_cell"
# Not `version.workspace = true`: this is a semver contract with the consumers.
# It must satisfy the strictest requirement (`read-fonts 0.43.2` asks
# `^1.21.4`) and stay >= any other `1.x` once_cell in the graph, or cargo picks
# the registry copy and the patch row is silently inert. `targo --unverified
# forge check` fails if that happens.
version = "1.21.4"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "First-party `once_cell` replacement for aterm (sync/unsync/race cells over std's OnceLock, Mutex and Cell; replaces the crates.io once_cell package)"

# Declared explicitly so the crate name consumers write cannot drift.
[lib]
name = "once_cell"
path = "src/lib.rs"
# No unit tests: they live in tests/behaviour.rs and tests/consumers.rs.
test = false

[dependencies]
# None. Upstream's three are optional and no aterm cell enables them
# (`tests/consumers.rs::no_cell_enables_a_feature_this_shim_ignores`).

[features]
# Upstream's nine feature names, declared (a `[patch]` target must accept every
# feature its consumers ask for) and inert: `sync`, `unsync` and `race` are
# always built. The implications are upstream's. `critical-section`,
# `atomic-polyfill`, `parking_lot` and `portable-atomic` would change upstream's
# implementation; `tests/consumers.rs` fails if a cell enables one.
default = ["std"]
std = ["alloc"]
alloc = ["race"]
race = []
unstable = []
critical-section = ["portable-atomic"]
atomic-polyfill = ["critical-section"]
parking_lot = []
portable-atomic = []

[dev-dependencies]
# No differential oracle: a registry `once_cell` would make `-p once_cell`
# ambiguous. tests/behaviour.rs asserts the contracts directly.

[lints]
workspace = true
