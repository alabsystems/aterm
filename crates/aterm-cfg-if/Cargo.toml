[package]
# Package name is `cfg-if` so `[patch.crates-io]` redirects third-party
# consumers; directory keeps the `aterm-` prefix.
name = "cfg-if"
# Pinned to `1.0.4` to match the `^1.0` semver contract in `Cargo.lock`.
version = "1.0.4"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "First-party `cfg_if!` macro for aterm (replaces the crates.io cfg-if package)"

[lib]
name = "cfg_if"
path = "src/lib.rs"
# Tests live in `tests/` and doctests.
test = false

[features]
# No-op feature kept for upstream manifest compatibility.
rustc-dep-of-std = []
# `tests/differential.rs` compares against `core::cfg!` directly because
# `[patch.crates-io]` would redirect a `cfg-if` dev-dependency to this crate.

[lints]
workspace = true
