[package]
# THE DIRECTORY AND THE PACKAGE NAME DIFFER ON PURPOSE.
#
# `[patch.crates-io]` matches on PACKAGE name, so to redirect the four
# third-party consumers' `arrayvec = "0.7.x"` lines at this code the package
# must be called `arrayvec` — nothing else works, and in particular pointing
# them at `aterm-alloc` (which is where the implementation actually lives)
# cannot work: the name does not match and `0.63.0` satisfies none of the
# requirements below. The DIRECTORY keeps the `aterm-` prefix so a `ls crates/`
# or a stack trace still reads as ours and nobody mistakes this for a vendored
# upstream (those live under `vendor/`, which is where genuinely-upstream source
# belongs).
name = "arrayvec"
# NOT `version.workspace = true`. This version is a SEMVER CONTRACT with the
# consumers, not an aterm release number: naga 29.0.3, wgpu 29.0.3, wgpu-core
# 29.0.3 and wgpu-hal 29.0.3 ask for ^0.7.1 (tiny-skia 0.11.4's ^0.7 left with
# sctk-adwaita at LW.5). 0.7.8 satisfies all four.
#
# IT MUST ALSO BE THE HIGHEST `0.7.x` CANDIDATE IN THE GRAPH, and that half was
# learned the expensive way: this crate shipped as 0.7.6 and the
# `[patch.crates-io]` row SILENTLY DID NOTHING. `[patch]` does not delete the
# other registry versions — it hides only the one at the patch's own version and
# adds itself as a candidate — so when a dev-dependency pinned registry
# `=0.7.8`, cargo had to activate a real 0.7.8 for that edge, and then
# satisfied every `^0.7.1` consumer from it too rather than carrying two
# semver-compatible copies. `cargo tree -p aterm -e normal -i arrayvec` printed
# `arrayvec v0.7.8` with no path, under naga, and CARGO warned about none of it
# (`cargo forge check` DID). The rule to keep: THE SHIM'S VERSION MUST BE >=
# EVERY OTHER `0.7.x` THIS WORKSPACE FORCES INTO THE GRAPH.
version = "0.7.8"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "First-party `arrayvec` replacement for aterm (re-exports aterm_alloc::ArrayVec under upstream's package name)"

[dependencies]
# The ONLY dependency, and the whole point: `ArrayVec` is already written,
# already used by aterm's VT parser on every byte of terminal output, and
# already carries the workspace's Trust annotations. This crate adds no
# implementation — see src/lib.rs for what "no implementation" is allowed to
# mean and where the two surfaces still differ.
aterm-alloc = { workspace = true }

[features]
# Upstream's feature table, reproduced. `serde` IS MANDATORY even though nobody
# turns it on: wgpu-core-29.0.3/Cargo.toml:79 declares
# `serde = [ …, "arrayvec/serde", … ]`, and cargo rejects a feature edge naming
# a feature the target package does not declare at RESOLUTION time, whether or
# not the feature is ever activated ("package `a` depends on `b` with feature
# `serde` but `b` does not have that feature"). The resolver reports this
# package with an EMPTY feature set on all four cells — every consumer writes
# `default-features = false` — so `default`/`std` exist only to make that
# spelling a no-op rather than an error.
default = ["std"]
# Accepted and ignored: this crate and `aterm-alloc` under it are `#![no_std]`
# either way.
std = []
# DELIBERATE EMPTY STUBS, and the failure mode is worth knowing. Upstream
# spells these `serde = ["dep:serde"]` etc. and each pulls in a trait impl.
# Here they resolve and do nothing. Nothing in aterm's graph activates any of
# them today; if something ever does, the error will be a missing
# `Serialize`/`BorshSerialize`/`Zeroize` impl at the CONSUMER's derive rather
# than a feature-resolution error naming arrayvec — silent about its cause, not
# silently wrong. The fix then is to implement the trait here, or to retire the
# patch row for that build.
serde = []
borsh = []
zeroize = []

[lints]
workspace = true

[lib]
# No unit tests live in src/, so this lib's libtest harness ran 0 tests in every
# gate while still being linked and executed. Off; doctests are governed
# separately and still run.
test = false
