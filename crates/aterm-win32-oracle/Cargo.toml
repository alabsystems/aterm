[package]
name = "aterm-win32-oracle"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Generate and check aterm's Windows declarations (the 0.61 closure, the 0.52 facade) against pinned registry windows-sys"

[dependencies]
aterm-json = { workspace = true }
aterm-toml = { workspace = true }
aterm-tempfile = { workspace = true }
aterm-uds = { workspace = true }
aterm-census = { workspace = true }
# The build directory's named lock (`named_lock`): a second record/oracle/oracle-052 run on one
# target directory waits for the first, named, instead of racing its `cargo clean -p` and
# builds. Workspace crate.
aterm-toolchain = { workspace = true }

[lints]
workspace = true
