[package]
name = "aterm-gpu"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "aterm GPU renderer (wgpu/Metal): glyph-atlas + instanced cell quads. Renders the terminal grid on the GPU; offscreen render-to-texture readback for headless verification."
# The integration tests are two suite binaries, split by one process-wide
# environment write (`[[test]]` targets at the end). A `tests/*.rs` file neither
# suite includes never compiles.
autotests = false

[features]
default = []
# DEVELOPMENT SEAMS in an optimized build: this crate's `aterm_types::dev_seam!`
# reads (the `ATERM_GPU_*` adapter/power/memblock/present/frame-latency seams and
# the `ATERM_METAL_INJECT_LOSS` drill). A debug build compiles them anyway; the
# release cutter never enables it (aterm-gui's `dev-seams` forwards here).
dev-seams = []
# The wgpu ORACLE arm, off in every production build. On macOS wgpu is optional
# and this is its only activator; the self-dev-dependency at the bottom turns it
# on for this crate's tests, so the differential suites compile both arms while
# the shipped mac graph (`cargo tree -e normal`, what the forge prices) has no
# wgpu. A no-op elsewhere, where wgpu is required. Code gates on `cfg(wgpu_arm)`
# (build.rs).
wgpu-oracle = ["dep:wgpu"]
# Compile the `#[refines]` anchors binding the bg-instance build/slice path to
# `GpuEncode`. Off by default; aterm-gui's `spec_xref_closure` gate enables it.
spec-anchors = ["dep:aterm-spec", "aterm-render/spec-anchors"]

[dependencies]
# default-features = false: the engine's `disk-tier` (libc mmap + zstd-sys C)
# cannot target wasm32, and a renderer needs no disk tier. aterm-gui re-enables
# it natively through feature unification.
aterm-core = { path = "../aterm-core", default-features = false }
aterm-render = { path = "../aterm-render", default-features = false }
# Fast non-DoS hasher (FxHash) for the per-drawable-cell glyph atlas lookups.
aterm-hash = { workspace = true }
# `std::time::Instant::now()` panics on wasm32-unknown-unknown; aterm-time shims
# it to performance.now() there and is std's Instant natively.
aterm-time = { workspace = true }
# `aterm_types::dev_seam!`, the one reader of the `ATERM_GPU_*` development seams.
aterm-types = { workspace = true }
# wgpu is declared per target below. Named directly because
# `renderer::WindowTarget` (`HasWindowHandle + HasDisplayHandle`) bounds the
# public `create_window_surface`; it adds no package (wgpu and winit already
# resolve this one version on every cell).
raw-window-handle = "0.6"
# This workspace's own `Pod`/`Zeroable` with no derive: the `#[repr(C)]`
# uniform/instance structs in `renderer.rs` carry hand-written `unsafe impl`s
# (`impl_pod_zeroable!`), which keeps `bytemuck_derive` out of the mac graph.
aterm-bits = { workspace = true }
# Optional: only pulled in by the off-by-default `spec-anchors` feature.
aterm-spec = { workspace = true, optional = true }

# Native GPU backends: ONE PER CELL (Metal on macOS, Vulkan on Linux, DX12 on
# Windows), so no cell compiles another's backend (`gles` alone was ~57k lines on
# Linux; `vulkan` ~160k on Windows; docs/THIRD_PARTY_ROAD_TO_ZERO.md). The trade:
# a box whose one driver is broken falls to the CPU softbuffer present path, not
# a second GPU backend. `gpu = false` chooses that path outright. `dx12` stays in
# the `cfg(windows)` table: its feature forwards `naga/hlsl-out`, which is not
# target-gated and would compile ~10k dead lines of HLSL writer on other cells.
# Native init blocks on this crate's own `block_on`; the wasm path awaits.
[target.'cfg(target_os = "macos")'.dependencies]
aterm-objc = { workspace = true }
# Optional: the first-party Metal renderer is the macOS backend; wgpu compiles
# here only as the differential oracle (`wgpu-oracle`).
wgpu = { version = "29", optional = true, default-features = false, features = ["metal", "wgsl"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
wgpu = { version = "29", default-features = false, features = ["vulkan", "wgsl"] }

# wasm32: WebGL2 (production refuses unsafe-WebGPU), which carries the
# instanced-quad + R8/Rgba8 atlas pipeline unchanged.
# `fragile-send-sync-non-atomic-wasm` lets the non-Send GPU handles satisfy
# wgpu's Send/Sync bounds on single-threaded wasm.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "29", default-features = false, features = ["webgl", "wgsl", "fragile-send-sync-non-atomic-wasm"] }

# Windows: DX12, the only backend wired for the HDR/scRGB present. `windows` must
# be the version wgpu-hal resolved (0.62): `as_hal::<Dx12>` hands back its
# `IDXGISwapChain3`, which this crate tags scRGB with `SetColorSpace1`.
[target.'cfg(windows)'.dependencies]
wgpu = { version = "29", default-features = false, features = ["dx12", "wgsl"] }
windows = { version = "0.62", features = [
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Foundation",
    # `IDXGIOutput6::GetDesc1` returns a `DXGI_OUTPUT_DESC1` holding an
    # `HMONITOR`, which lives here; without it the method is not generated.
    "Win32_Graphics_Gdi",
] }

# The oracle activation: a target-gated self-dev-dependency unifies
# `wgpu-oracle` into the lib under test on macOS. Dev edges are invisible to
# `cargo tree --edges normal` and to `cargo build -p aterm`, so the shipped
# binary and the forge ratchets never carry wgpu.
[target.'cfg(target_os = "macos")'.dev-dependencies]
aterm-gpu = { path = ".", features = ["wgpu-oracle"] }

[dev-dependencies]
# `aterm_log::env`, the workspace's lock-scoped environment writer: parity tests
# export a font / rasterizer selection to both renderers.
aterm-log = { workspace = true }
# Inline-image (OSC 1337) parity tests: encode test PNGs + base64 payloads.
aterm-png = { workspace = true }
aterm-codec = { workspace = true }
# `sixel` for tests only: `sixel_rawrgba8_pixels_gpu_match_cpu` drives a real
# sixel DCS to produce the `ImageData{RawRgba8}` the GUI renders.
aterm-core = { workspace = true, features = ["sixel"] }
# Tier-1 `GpuEncode` conformance (`tests/conformance_gpuencode.rs`).
aterm-spec = { workspace = true }
aterm-spec-models = { workspace = true }
# The pure, clockless supernova emitters feed `nova_parity`'s RenderInput
# channels directly, with no engine.
aterm-effects = { workspace = true }

[lints]
workspace = true

# ---- integration tests (autotests = false above) ----------------------------

# Every file that writes no process environment.
[[test]]
name = "gpu_suite"
path = "tests/gpu_suite.rs"

# The additive-parity files that force the deterministic fontdue rasterizer
# (`common::backends_fontdue` sets ATERM_RASTERIZER=fontdue for the whole
# process), apart from every renderer the suite above builds.
[[test]]
name = "gpu_fontdue"
path = "tests/gpu_fontdue.rs"

