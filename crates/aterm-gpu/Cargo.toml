[package]
name = "aterm-gpu"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "aterm GPU renderer (Metal, OpenGL ES and WebGL2, wgpu): glyph-atlas + instanced cell quads. Renders the terminal grid on the GPU; offscreen render-to-texture readback for headless verification."
# The integration tests separate the environment-writing parity suite and
# the process-wide GPU timing observer from the ordinary suite (`[[test]]`
# targets below). Unmounted `tests/*.rs` files never compile.
autotests = false

[features]
# DEVELOPMENT SEAMS in an optimized build: this crate's `aterm_types::dev_seam!`
# reads (the `ATERM_GPU_*` adapter/power/present seams, the pass-economy
# ablation `ATERM_GPU_ABLATE_UNORM` with its programmatic twin
# `GpuRenderer::set_unorm_ablation`, and the `ATERM_METAL_INJECT_LOSS` and
# `ATERM_GL_INJECT_LOSS` drills). A debug build
# compiles them anyway; the release cutter never enables it (aterm-gui's
# `dev-seams` forwards here).
dev-seams = []
# The wgpu ORACLE arm, off in every build but its own lane. On macOS and Linux
# wgpu is optional and this is its only activator, named on the command line and
# never by a manifest: `targo --unverified test -p aterm-gpu --features
# wgpu-oracle` compiles both arms (Metal or GL beside wgpu) and runs the
# differential suites (the release's gpu-oracle stage). No dev-dependency turns
# it on, so `-p` and `--workspace` builds compile one aterm-gpu, and none of
# wgpu/naga on macOS or Linux. A no-op elsewhere, where wgpu is required. Code
# gates on `cfg(wgpu_arm)` (build.rs).
wgpu-oracle = ["dep:wgpu"]

[dependencies]
aterm-core = { path = "../aterm-core", default-features = false }
# default-features = false: no compiled-in fonts (aterm-render's `embedded-font`
# default); aterm-gui re-enables them natively through feature unification.
aterm-render = { path = "../aterm-render", default-features = false }
# Fast non-DoS hasher (FxHash) for the per-drawable-cell glyph atlas lookups.
aterm-hash = { workspace = true }
# `std::time::Instant::now()` panics on wasm32-unknown-unknown; aterm-time shims
# it to performance.now() there and is std's Instant natively.
aterm-time = { workspace = true }
# `aterm_types::dev_seam!`, the one reader of the `ATERM_GPU_*` development seams.
aterm-types = { workspace = true }
# This workspace's own `Pod`/`Zeroable` with no derive: the `#[repr(C)]`
# uniform/instance structs in `renderer.rs` carry hand-written `unsafe impl`s
# (`impl_pod_zeroable!`), which keeps `bytemuck_derive` out of the mac graph.
aterm-bits = { workspace = true }
# The anchor attributes' registry (std-only): `#[cfg_attr(any(test, debug_assertions),
# aterm_spec_anchor::refines(…))]` expands in every test and debug build; release strips it.
aterm-spec-anchor = { workspace = true }

# GPU backends: ONE PER CELL (first-party Metal on macOS, first-party OpenGL ES
# on Linux and, as WebGL2, on wasm32, wgpu's DX12 on Windows), so no cell
# compiles another's backend (`vulkan` was ~160k lines on Windows;
# docs/THIRD_PARTY_ROAD_TO_ZERO.md).
# The trade: a box whose one driver is broken falls to the CPU softbuffer present
# path, not a second GPU backend. `gpu = false` chooses that path outright. `dx12`
# stays in the `cfg(windows)` table: its feature forwards `naga/hlsl-out`, which
# is not target-gated and would compile ~10k dead lines of HLSL writer on other
# cells. Native init blocks on this crate's own `block_on`.
[target.'cfg(target_os = "macos")'.dependencies]
aterm-objc = { workspace = true }
# Optional: the first-party Metal renderer is the macOS backend; wgpu compiles
# here only as the differential oracle (`wgpu-oracle`).
wgpu = { version = "29", optional = true, default-features = false, features = ["metal", "wgsl"] }

# The native cells that present on wgpu (Windows, the BSDs): named directly
# because `renderer::WindowTarget` (`HasWindowHandle + HasDisplayHandle`) bounds
# the public `create_window_surface`; it adds no package (wgpu already resolves
# this one version there). macOS's `WindowTarget` is first-party
# `aterm_objc::HasNsView` and Linux's `aterm_types::native_window::
# HasNativeWindow`, so neither shipped graph has raw-window-handle; their wgpu
# oracles reach the crate through `wgpu::rwh` (docs/AUDIT-third-party-2026-10-15.md,
# winit-core step 6, the macOS and Linux halves). wasm32 attaches no window:
# its one surface is a canvas (`web::GpuContext::for_canvas`).
[target.'cfg(not(any(target_os = "macos", target_os = "linux", target_arch = "wasm32")))'.dependencies]
raw-window-handle = "0.6"

# The unix cells no forge row prices (the BSDs): wgpu's Vulkan, as Linux had
# before the GL flip.
[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "linux"))))'.dependencies]
wgpu = { version = "29", default-features = false, features = ["vulkan", "wgsl"] }

# Linux renders on the first-party GL arm (`src/gl`,
# docs/AUDIT-third-party-2026-10-15.md GW.4): it opens `libEGL.so.1` (and, on
# Wayland, `libwayland-egl.so.1`) with `dlopen` through aterm-libc's
# declarations; no GL library is linked and no crate binds one. wgpu compiles
# here only as the oracle (`wgpu-oracle`), with both backends the GL arm is
# byte-compared against on the same driver: GLES (the downlevel plan) and
# Vulkan (the native plan, and the rows wgpu's GLES backend cannot build).
[target.'cfg(target_os = "linux")'.dependencies]
libc = { workspace = true }
wgpu = { version = "29", optional = true, default-features = false, features = ["vulkan", "gles", "wgsl"] }

# wasm32: WebGL2 on the first-party GL arm (`src/gl`), its GL calls the
# module's `aterm_gl` imports and its canvas a JS object in the glue's table
# (`aterm_wasm_abi::js`): no wgpu, web-sys, js-sys or wasm-bindgen
# (docs/AUDIT-third-party-2026-10-15.md, wasm-platform WP.8). Nothing
# third-party, and no `export` feature: this crate exports nothing itself.
[target.'cfg(target_arch = "wasm32")'.dependencies]
aterm-wasm-abi = { workspace = true }

# Windows: DX12, the only backend wired for the HDR/scRGB present.
# `as_hal::<Dx12>` hands back wgpu-hal's `IDXGISwapChain3`, which this crate
# takes over as an aterm-win32 `Com` (one pointer, whatever `windows` version
# wgpu-hal resolved) and tags scRGB with `SetColorSpace1` through aterm-win32's
# DXGI vtables (WB.2 of docs/AUDIT-third-party-2026-10-15.md).
[target.'cfg(windows)'.dependencies]
wgpu = { version = "29", default-features = false, features = ["dx12", "wgsl"] }
aterm-win32 = { workspace = true }

[dev-dependencies]
# `aterm_log::env`, the lock-scoped environment writer: parity tests export a font or
# rasterizer choice to both renderers.
aterm-log = { workspace = true }
# Inline-image (OSC 1337) parity tests: encode test PNGs + base64 payloads.
aterm-png = { workspace = true }
aterm-codec = { workspace = true }
# Tier-1 model conformance (`capture_tap_conformance`, `conformance_gpuencode`,
# `present_real`).
aterm-spec = { workspace = true }
# The models its tests drive (a model edit rebuilds only their tests).
aterm-models-core = { workspace = true }
aterm-models-misc = { workspace = true }
aterm-models-render = { workspace = true }
# The pure, clockless supernova emitters feed `nova_parity`'s RenderInput
# channels directly, with no engine.
aterm-effects = { workspace = true }

[lints]
workspace = true

# ---- integration tests (autotests = false above) ----------------------------

# Every file that writes no process environment.
[[test]]
name = "gpu_suite"
path = "tests/gpu_suite.rs"

# The files that force the fontdue rasterizer (`common::backends_fontdue` sets
# ATERM_RASTERIZER=fontdue process-wide), kept apart from `gpu_suite`.
[[test]]
name = "gpu_fontdue"
path = "tests/gpu_fontdue.rs"

# This target owns the process-wide timing sink and its serial lookups. The
# large parity suites must not evict a sample before the test observes it.
[[test]]
name = "frame_instrumentation"
path = "tests/frame_instrumentation.rs"

# ---- measurements: `targo --unverified bench -p aterm-gpu --bench <name>` ----

# The first window's Metal compiles, with and without the launch warm (one
# BENCH line; FIRST_FRAME_BENCH / FIRST_FRAME_BENCH_PROLOGUE_MS select the run).
[[bench]]
name = "first_frame_compile"
path = "benches/first_frame_compile.rs"
harness = false
