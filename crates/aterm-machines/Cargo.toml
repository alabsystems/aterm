[package]
name = "aterm-machines"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "aterm — `aterm machines`: configure and manage a lab of Macs from one controller over SSH (docs/DESIGN-machines-2026-10-16.md). The controller (inventory, signed envelopes, SSH fan-out, Screen Sharing person steps) and the host agent (a probe/plan/apply/verify engine over macOS's own tools)."

[dependencies]
# Exclusive owned ephemeral staging; shared by controller and agent writers.
aterm-tempfile = { workspace = true }
# Child processes (spawnfd::command), bounded runs (deadline), this process's euid (peer).
aterm-uds = { workspace = true }
# A process's start second, any uid's (`kproc`): the run lock's holder check.
aterm-sysprobe = { workspace = true }
# The baseline, fleet and envelope documents; comment-preserving edits of fleet.toml.
aterm-toml = { workspace = true }
# Reports on the wire and in state/.
aterm-json = { workspace = true }
serde = { workspace = true, features = ["derive"] }
# The controller's config and state directories (never the agent's: DESIGN-machines §3.4) and
# the macOS setup settings (`macos_setup`).
aterm-types = { workspace = true }
# SHA-256 of artifacts and of the agent payload.
aterm-digest = { workspace = true }
# hex for digests, base64 for plist <data>.
aterm-codec = { workspace = true }
# The calls std lacks: O_NOFOLLOW opens, exclusive renames, poll, termios, signal dispositions,
# advisory locks. The crate is macOS-only: crates/aterm links it under
# cfg(target_os = "macos") and answers `aterm machines` elsewhere with a one-line refusal.
libc = { workspace = true }
# How each write is finished: durable (F_FULLFSYNC) or ordered (F_BARRIERFSYNC).
aterm-durable = { workspace = true }
# `aterm init`'s secrets vault step (init_secrets.rs): the vault's local status, its join,
# and the subscriber's launchd job (docs/DESIGN-secrets-2026-10-20.md §7).
aterm-secrets = { workspace = true }
# atpkg's prefix and its store's Spotlight layout contract (`layout`), which `aterm init`'s
# Rust in Spotlight row reads: std only.
aterm-toolchain = { workspace = true }
# The engine every family runs on, re-exported as `converge`
# (docs/DESIGN-init-system-2026-10-20.md §3): the model, the ordered run and the journal
# `init` and `here` keep.
aterm-converge = { workspace = true }
# The native initial repository inventory uses agh's routed credential and HTTP doors.
agh = { workspace = true }
# GitHub's REST pagination (`github_pages`), which init's repository inventory and the
# controller's key listing share with the publishers' REST lane.
aterm-update-core = { workspace = true }
# The machines controller's SSH-key writes as its machine user (port/github_rest.rs): agh's
# client sends only GET and HEAD, so they go over aterm-http, as agh's own transport does.
aterm-http = { workspace = true }

# Dev only (AGENTS.md: `aterm` is the one shipped executable): the crate as a standalone
# executable, `aterm-machines-dev machines <verb>`, so the agent can be enrolled into a test VM
# before `aterm machines` is routed in crates/aterm, plus `enroll-through`, which enrolls over an
# SSH control master that is already open (a VM test harness's) instead of opening one.
[[bin]]
name = "aterm-machines-dev"
path = "src/bin/aterm-machines-dev.rs"
test = false

[lints]
workspace = true
