[package]
name = "aterm-grid"
# Integration tests are declared below, not discovered. With autotests off a
# `tests/*.rs` file listed nowhere never compiles.
autotests = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Terminal grid model: cells, rows, styles, damage tracking, page storage, cursor and region state"

[features]
default = ["disk-tier"]
# Disk-backed scrollback cold tier (libc mmap). Default-on so native builds keep
# it; off for wasm32 (no libc), where the grid runs the RAM tiers only.
disk-tier = ["aterm-scrollback/disk-tier"]
alacritty-compat = []  # Expose legacy Alacritty-facing CellFlags aliases
fuzz = ["aterm-scrollback/fuzz"]  # Expose fuzz-only APIs
# Compile the `#[refines]` anchors (page store, row, resize undo) into the library so
# the `spec_xref_closure` gate in aterm-gui collects them. Off by default so
# production builds carry no aterm-spec.
spec-anchors = ["dep:aterm-spec"]

[dependencies]
aterm-rle = { workspace = true }
# Its disk tier is enabled through this crate's `disk-tier` feature, so a wasm
# consumer can drop libc.
aterm-scrollback = { workspace = true }
aterm-types = { workspace = true }
aterm-log = { workspace = true }
aterm-hash = { workspace = true }
aterm-alloc = { workspace = true }
aterm-grapheme = { workspace = true }
# The `#[refines]` anchors only (`spec-anchors`).
aterm-spec = { workspace = true, optional = true }

[dev-dependencies]
aterm-tempfile = { workspace = true }
aterm-selection = { workspace = true }
# The `#[refines]` anchors under a plain test run, and the derived models and seeded
# `XorShift` the tests use.
aterm-spec = { workspace = true }

[lints]
workspace = true

[[test]]
name = "grid_suite"
path = "tests/grid_suite.rs"

# Alone: named by CONTRIBUTING.md and publish/config.sh's CHECK_CMD_DEFAULT
# (`--test conformance_offload`).
[[test]]
name = "conformance_offload"
path = "tests/conformance_offload.rs"

# The lib's unit tests reach other crates' debug-only test seams, so they are
# no bench target (the bench profile has no debug assertions).
[lib]
bench = false

# A measurement, run by hand: `targo --unverified bench -p aterm-grid`.
[[bench]]
name = "reflow_step"
path = "benches/reflow_step.rs"
harness = false
