[package]
name = "aterm-grid"
# Integration tests are declared below, not discovered. With autotests off a
# `tests/*.rs` file listed nowhere never compiles.
autotests = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Terminal grid model: cells, rows, styles, damage tracking, page storage, cursor and region state"

# No `default` feature: a `default` here would enter this crate's hash only when a
# workspace test selects it, so `build -p aterm` and the test build would compile two
# aterm-grids.
[features]

[dependencies]
aterm-rle = { workspace = true }
aterm-scrollback = { workspace = true }
aterm-types = { workspace = true }
aterm-log = { workspace = true }
aterm-hash = { workspace = true }
aterm-alloc = { workspace = true }
aterm-grapheme = { workspace = true }
# The anchor attributes' registry (std-only): `#[cfg_attr(any(test, debug_assertions),
# aterm_spec_anchor::refines(…))]` expands in every test and debug build; release strips it.
aterm-spec-anchor = { workspace = true }

[dev-dependencies]
aterm-selection = { workspace = true }
# The `#[refines]` anchors under a plain test run, and the derived models and seeded
# `XorShift` the tests use.
aterm-spec = { workspace = true }
# The models its tests drive (a model edit rebuilds only their tests).
aterm-models-core = { workspace = true }
aterm-models-misc = { workspace = true }

[lints]
workspace = true

[[test]]
name = "grid_suite"
path = "tests/grid_suite.rs"

# Alone: named by CONTRIBUTING.md and publish/config.sh's CHECK_CMD_DEFAULT
# (`--test conformance_offload`).
[[test]]
name = "conformance_offload"
path = "tests/conformance_offload.rs"

# The lib's unit tests reach other crates' debug-only test seams, so they are
# no bench target (the bench profile has no debug assertions).
[lib]
bench = false

# A measurement, run by hand: `targo --unverified bench -p aterm-grid`.
[[bench]]
name = "reflow_step"
path = "benches/reflow_step.rs"
harness = false
