[package]
name = "aterm-grid"
# Integration tests are declared below, not discovered. With autotests off a
# `tests/*.rs` file listed nowhere never compiles.
autotests = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Terminal grid model: cells, rows, styles, damage tracking, page storage, cursor and region state"

[features]
default = ["disk-tier"]
# Disk-backed scrollback cold tier (mmap + zstd). Default-on so native builds keep
# it; off for wasm32 (no libc/zstd-sys), where the grid runs the RAM tiers only.
disk-tier = ["aterm-scrollback/disk-tier"]
alacritty-compat = []  # Expose legacy Alacritty-facing CellFlags aliases
fuzz = ["aterm-scrollback/fuzz"]  # Expose fuzz-only APIs
testing = []  # Expose test-only helpers for downstream crate tests
# Register the ring-buffer kani harnesses as `proof_anchor!`s in the verifier ledger
# (TRUST_NATIVE_TLA §4). Off by default so production builds carry no aterm-spec.
spec-anchors = ["dep:aterm-spec"]

[dependencies]
aterm-rle = { workspace = true }
# Its disk tier is enabled through this crate's `disk-tier` feature, so a wasm
# consumer can drop libc/zstd-sys.
aterm-scrollback = { workspace = true }
aterm-types = { workspace = true }
aterm-log = { workspace = true }
aterm-hash = { workspace = true }
aterm-alloc = { workspace = true }
aterm-grapheme = { workspace = true }
# Verifier-ledger anchors only (`spec-anchors`).
aterm-spec = { workspace = true, optional = true }

[dev-dependencies]
# The corruption seam for the dense-history conformance tests
# (`history_lines_from_*`); dev-only, so no product build carries it.
aterm-scrollback = { workspace = true, features = ["testing"] }
aterm-tempfile = { workspace = true }
aterm-selection = { workspace = true }
# So the `#[cfg(test)]` `spec_proof_anchors` module compiles under a plain test run.
aterm-spec = { workspace = true }

[build-dependencies]
# build.rs model-checks the scrollback-offload detach-window protocol
# (`offload_window_spec.rs`, shared with tests/conformance_offload.rs), so a violated
# invariant fails the build. No cycle: aterm-spec depends only on aterm-spec-macros
# and aterm-json.
aterm-spec = { workspace = true }

[lints]
workspace = true

[[test]]
name = "grid_suite"
path = "tests/grid_suite.rs"

# Alone: named by CONTRIBUTING.md and publish/config.sh's CHECK_CMD_DEFAULT
# (`--test conformance_offload`).
[[test]]
name = "conformance_offload"
path = "tests/conformance_offload.rs"
