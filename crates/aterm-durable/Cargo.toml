[package]
name = "aterm-durable"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "How aterm finishes a write: durable (on stable media at return, F_FULLFSYNC on Apple) or ordered (ahead of every later write on the device, F_BARRIERFSYNC on Apple), with a counting seam that tells a test which one each operation took."

# Std-only apart from the barrier itself, so a dependency-free crate (aterm-primer)
# can finish its writes here and still pull no third-party code: astream-sys has no
# dependencies, and its one cordoned module of two FFI calls is the only `unsafe`
# the barrier needs. Only Apple targets have an ordering-only flush, so only they
# compile it.
[target.'cfg(target_vendor = "apple")'.dependencies]
astream-sys = { path = "../../vendor/astream/crates/astream-sys" }

[dev-dependencies]
aterm-tempfile = { workspace = true }

[lints]
workspace = true

[features]
# The counting seam (`seam`) in an optimized build. A test or debug build of this
# crate has it anyway, so no manifest turns this on: a dev-dependency row that did
# would fork this crate and every dependent between `targo --unverified test
# --workspace` and `build -p aterm --profile test` (41 units recompiled). A
# `--release` test run of a dependent whose tests reach the seam (the recording,
# or the test arm's `durable_fsync`) names it: `--features
# aterm-durable/test-support`. `--profile opt-test` needs nothing.
test-support = []
