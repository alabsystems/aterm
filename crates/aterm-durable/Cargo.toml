[package]
name = "aterm-durable"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "How aterm finishes a write: durable (on stable media at return, F_FULLFSYNC on Apple) or ordered (ahead of every later write on the device, F_BARRIERFSYNC on Apple), with a counting seam that tells a test which one each operation took."

# Std-only apart from astream-sys, so a dependency-free crate (aterm-primer) can
# finish its writes here and still pull no third-party code: astream-sys has no
# dependencies, and its cordoned modules of FFI calls (astream claim `os.cordon`) hold
# the only `unsafe` the barrier needs. On every target this crate classifies refused file
# flushes (`file_flush_refused`, for the opt-in `refusal_accepted`) and unavailable
# directory flushes (`dir_flush_unavailable`, for `Flush::dir_best_effort` and
# `DirFlushed::classify`) by astream's rules, plain judgements of the error that cross
# into no kernel. On Apple targets, the only ones with an ordering-only
# flush, it also calls `barrier_sync` (`fcntl(F_BARRIERFSYNC)`) and `barrier_refused`,
# on files and on directories (`ordered_dir`), and reads and sets the test mark
# (`test_plain_fsync`, `TEST_PLAIN_FSYNC_ENV`); it never installs the `SIGHUP` handler.
[dependencies]
astream-sys = { path = "../../vendor/astream/crates/astream-sys" }

[dev-dependencies]
aterm-tempfile = { workspace = true }

[lints]
workspace = true

[features]
# The counting seam (`seam`) in an optimized build. A test or debug build of this
# crate has it anyway, so no manifest turns this on: a dev-dependency row that did
# would fork this crate and every dependent between `targo --unverified test
# --workspace` and `build -p aterm --profile test` (41 units recompiled). A
# `--release` test run of a dependent whose tests reach the recording names it:
# `--features aterm-durable/test-support`. `--profile opt-test` needs nothing.
test-support = []
