[package]
name = "aterm-acaffiene"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "aterm's menu-bar keep-awake mug (`aterm acaffiene`): a click keeps this Mac awake, a right click picks 1, 8 or 24 hours or forever, starts it at login or quits. The pure model, menu and icon raster compile everywhere; the status item, the power activity, the launchd job and the bundle copy it runs from are macOS."

[dependencies]
# The state directory, the logs directory and $HOME (`dirs`), the origin line
# the about row prints (`identity`).
aterm-types = { workspace = true }
# The wall clock (`unix_secs`), which a timed span's end is shown on.
aterm-time = { workspace = true }
# The launchd plist's XML text escape (`xml::escape`).
aterm-codec = { workspace = true }
# The menu-bar icon is drawn here as coverage and handed to AppKit as PNG.
aterm-png = { workspace = true }
# The per-path launchd label of a non-installed build.
aterm-hash = { workspace = true }
aterm-log = { workspace = true }
# The state file's flush (`ordered`): its bytes land before the rename over it.
aterm-durable = { workspace = true }
# `spawnfd::command` (launchctl, the re-exec into the bundle copy),
# `ownerlock::probe` (is a mug running), `process::read_process_path|argv`
# (is the lock's pid that mug), `peer::our_uid` (the GUI domain),
# `process::continuous_ms` (the boot clock a timed span's deadline is on: it
# counts time asleep, and no change of the date moves it).
aterm-uds = { workspace = true }
# THE BOOT the state file is stamped with (a restart of the Mac turns the mug
# off): `boot_session`, the kernel's boot id as 16 bytes (`instance::boot_id`),
# and `parse_boot_id`, astream's reader of its text (`state::parse_boot`),
# which refuses the all-zero id a damaged answer reads as. The reading
# aterm-link's broker opens its log in, so the mug and the bus name a boot one
# way. Every target, not only macOS where the mug reads its boot: the state
# file's parser is the pure model's, which compiles everywhere. Zero
# dependencies; its two cordoned `unsafe` modules are hand-declared FFI calls,
# `apple` (`sysctlbyname` for the boot id among them, so this crate declares no
# `sysctlbyname` of its own) and `owner` (`cfg(unix)`: `geteuid` and the ACL
# calls). Not a new edge on Apple, where aterm-durable above
# links it, nor on Linux, where aterm-link does; on Windows it is a new one,
# and a harmless one: no dependencies, and no `unsafe` compiled there.
astream-sys = { path = "../../vendor/astream/crates/astream-sys" }

[target.'cfg(unix)'.dependencies]
# `kill` (`aterm acaffiene quit`), the code directory's backup exclusion
# (`getxattr`/`setxattr`), the SIGTERM watch (`sigaction`, `raise`) and the
# open flags; `notify_post` is declared by hand in notify.rs.
libc = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
# The status item, its menu, the image and the NSProcessInfo activity.
aterm-objc = { workspace = true }

[dev-dependencies]
aterm-tempfile = { workspace = true }

[lints]
workspace = true
