[package]
name = "aterm-digest"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "First-party SHA-256 and HMAC-SHA256 for aterm (replaces sha2 and hmac)"

[dependencies]
# None - zero external dependencies. That is the entire point of this crate:
# `sha2` + `hmac` dragged in 8 packages / 49,474 lines of third-party source
# (sha2, hmac, digest, typenum, generic-array, crypto-common, block-buffer,
# cpufeatures) to expose four methods we actually call. Measured before/after
# with `cargo forge survey --cell mac-arm`: 161 -> 153 third-party packages.
# `subtle` is NOT in that list: rustls depends on it directly, so it stays in
# the graph and `ct_eq` replaces our USE of it rather than the package.

[dev-dependencies]
# Dev-dependencies ONLY - differential ORACLES for the crates this one replaces,
# exactly as crates/aterm-grapheme keeps unicode-segmentation/unicode-width to
# cross-validate its inline tables. A dev-dependency never enters the shipped
# graph, so the oracle costs nothing at ship time while every byte we emit is
# proved equal to the reference implementation over ~200 pseudorandom lengths.
# Pinned here rather than in [workspace.dependencies]: the whole point of this
# crate is that no shipped member declares them any more, so the root manifest no
# longer carries an entry to inherit.
sha2 = "0.10"
hmac = "0.12"

[lints]
workspace = true
