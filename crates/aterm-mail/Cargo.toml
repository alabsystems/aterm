[package]
name = "aterm-mail"
version = "0.0.0"
edition.workspace = true
license = "Apache-2.0 AND MIT"
repository.workspace = true
authors.workspace = true
description = "Native mail accounts, protocol connections and message state for aterm"

[lints]
workspace = true

[dependencies]
aterm-codec = { workspace = true }
aterm-http = { workspace = true }
aterm-json = { workspace = true }
aterm-uds = { workspace = true }
aterm-time = { workspace = true }
aterm-stamp = { workspace = true }
aterm-types = { workspace = true }
ring = { workspace = true }
# The Ed25519 checks of the pinned modulus key and the address-token keys: astream's
# strict verify, which refuses the small-order keys and commitments ring alone takes.
astream-aead = { path = "../../vendor/astream/crates/astream-aead", default-features = false, features = ["signature"] }
aterm-mail-bigint = { workspace = true }
aterm-secrets = { workspace = true }
aterm-digest = { workspace = true }
zeroize = { version = "1", default-features = false, features = ["alloc"] }

