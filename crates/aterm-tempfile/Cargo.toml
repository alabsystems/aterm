[package]
name = "aterm-tempfile"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Private temporary directories with RAII cleanup"

[lints]
workspace = true

[features]
# `stand_in` in an optimized build. A test or debug build of this crate has it
# anyway, so no manifest turns this on (a dev-dependency row that did would fork
# the test build from `build -p aterm --profile test`). A `--release` test run of
# a dependent whose tests lay stand-ins names it: `--features
# aterm-tempfile/test-support`. `--profile opt-test` needs nothing.
test-support = []

[dependencies]
# Backup marking sits below uds, which uses this allocator for its own roots.
aterm-backup = { workspace = true }

[dev-dependencies]
# The stand-in tests run a stand-in and this test binary as children: built with
# `spawnfd::command`, bounded by `deadline`. A dev-dependency only, so the crate
# depends only on aterm-backup; aterm-uds also uses this allocator, but the reverse
# edge here is test-only, so no normal dependency cycle forms.
aterm-uds = { workspace = true }
# `fnv1a` is spelled out, so the crate needs no hash dependency; its test holds it to the
# workspace's FNV-1a. aterm-hash depends on astream-wire alone.
aterm-hash = { workspace = true }
