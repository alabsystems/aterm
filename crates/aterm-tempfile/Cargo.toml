[package]
name = "aterm-tempfile"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Zero-dependency temporary directories with RAII cleanup"

[lints]
workspace = true

[features]
# `stand_in` in an optimized build. A test or debug build of this crate has it
# anyway, so no manifest turns this on (a dev-dependency row that did would fork
# the test build from `build -p aterm --profile test`). A `--release` test run of
# a dependent whose tests lay stand-ins names it: `--features
# aterm-tempfile/test-support`. `--profile opt-test` needs nothing.
test-support = []

[dev-dependencies]
# The stand-in tests run a stand-in and this test binary as children: built with
# `spawnfd::command`, bounded by `deadline`. A dev-dependency only, so the crate
# still depends on nothing; aterm-uds reaches aterm-tempfile only as its own
# dev-dependency, so no cycle forms.
aterm-uds = { workspace = true }
