[package]
name = "aterm-a11y"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "aterm's accessibility publishing: the tree model, its text and AT-SPI semantics, and the publisher that serves them to Linux screen readers over aterm-dbus"

# The publisher is unix-only: AT-SPI is D-Bus, and aterm-dbus's client is a unix
# socket. It compiles on every unix so its tests run on the Mac that builds
# aterm; only Linux ships it (aterm-gui's linux dependency row).
[target.'cfg(unix)'.dependencies]
# The model, tree, text and AT-SPI semantics are this crate's own
# (docs/AUDIT-third-party-2026-10-15.md, unit a11y, A11Y.5: carved from
# accesskit, accesskit_consumer, accesskit_atspi_common and atspi-common);
# accesskit_unix, zbus and its async stack are what A11Y.4 replaced.
# The bus: first-party, blocking, unix-socket D-Bus (A11Y.3).
aterm-dbus = { workspace = true }
aterm-log = { workspace = true }
# `MutexExt::lock_or_recover`: a window's state stays reachable after a panic.
aterm-types = { workspace = true }
# poll(2), the publisher thread's one wait.
libc = { workspace = true }

[dev-dependencies]
aterm-uds = { workspace = true }

[lints]
workspace = true
