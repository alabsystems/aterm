[package]
name = "aterm-a11y"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "aterm's shared accessibility tree and native screen-reader publishers"

# The native publishers share the validated model/tree/text consumer. AT-SPI
# runs only on Linux; its Unix unit tests retain the same D-Bus dependencies.
[target.'cfg(target_os = "linux")'.dependencies]
aterm-dbus = { workspace = true }
aterm-log = { workspace = true }
aterm-types = { workspace = true }
libc = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
aterm-objc = { workspace = true }

[target.'cfg(windows)'.dependencies]
aterm-types = { workspace = true }
# UI Automation is COM: aterm-win32 supplies the provider interfaces' vtables
# (held to `windows` 0.62.2 by its oracle) and the generated UIAutomationCore,
# OLE Automation and VARIANT imports; src/uia/ writes the objects out by hand
# (WIN-UIA, docs/AUDIT-third-party-2026-10-15.md). The shared model/tree/text
# consumer remains independent of this platform arm.
aterm-win32 = { workspace = true }

[dev-dependencies]
aterm-uds = { workspace = true }

[target.'cfg(unix)'.dev-dependencies]
aterm-dbus = { workspace = true }
aterm-log = { workspace = true }
aterm-types = { workspace = true }
libc = { workspace = true }

[lints]
workspace = true

# Explicit Linux session-bus acceptance, run only in the scratch runtime lane.
[[bench]]
name = "live_atspi"
harness = false
test = false
