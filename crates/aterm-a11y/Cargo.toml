[package]
name = "aterm-a11y"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "aterm's shared accessibility tree and native screen-reader publishers"

# The native publishers share the validated model/tree/text consumer. AT-SPI
# runs only on Linux; its Unix unit tests retain the same D-Bus dependencies.
[target.'cfg(target_os = "linux")'.dependencies]
aterm-dbus = { workspace = true }
aterm-log = { workspace = true }
aterm-types = { workspace = true }
libc = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
aterm-objc = { workspace = true }

[target.'cfg(windows)'.dependencies]
aterm-types = { workspace = true }
# The interface implementation macro emits absolute windows_core references.
windows-core = "0.62"
# UI Automation is COM. The existing windows binding supplies its interfaces;
# the shared model/tree/text consumer remains independent of this platform arm.
windows = { version = "0.62", features = [
    "Win32_UI_Accessibility",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_Foundation",
] }

[dev-dependencies]
aterm-uds = { workspace = true }

[target.'cfg(unix)'.dev-dependencies]
aterm-dbus = { workspace = true }
aterm-log = { workspace = true }
aterm-types = { workspace = true }
libc = { workspace = true }

[lints]
workspace = true

# Explicit Linux session-bus acceptance, run only in the scratch runtime lane.
[[bench]]
name = "live_atspi"
harness = false
test = false
