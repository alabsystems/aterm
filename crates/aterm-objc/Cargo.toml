[package]
name = "aterm-objc"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "aterm's first-party Objective-C runtime layer: typed message sends, ownership, runtime class creation, and the block ABI — the foundation that retires the objc2 cluster."

# ZERO dependencies, by construction. This crate exists to REMOVE third-party
# code (objc2 + block2 + the objc2-* binding crates), so adding one here would
# defeat the whole point. Everything below is std plus `libobjc`, `Foundation`
# and `CoreFoundation`, which ship with the OS and are already loaded in every
# aterm process. CoreGraphics is `aterm-cg`'s, so no feature here can make a
# binary that reaches this crate load a GUI framework.
#
# The integration files that only READ the runtime are modules of one binary,
# `tests/objc_static_suite.rs`; the files whose subject is a process death (a
# self re-exec) or the containment sink are modules of `tests/objc_process_suite.rs`;
# every file that owns other process-global state (a swizzle, a global
# allocator, the protocol table) is its own `[[test]]` below. With
# autotests off a `tests/*.rs` file listed nowhere never compiles.
autotests = false

[lints]
workspace = true

# No libtest harness: libtest runs each `#[test]` on a worker and parks the
# main thread, so neither branch of `run_on_main` (which `MainThreadBound`'s
# `Drop` goes through) is reachable from one. Here `main` is the process main
# thread; the file answers libtest's argv itself, as one test of this name.
[[test]]
name = "main_thread_bound_drive"
harness = false

# Test-only: `tests/conformance_wake_timer.rs` steps aterm-spec's derived
# `run_loop_waker_model` beside the real wake timer.
[dev-dependencies]
aterm-spec = { workspace = true }
# The models its tests drive (a model edit rebuilds only their tests).
aterm-models-core = { workspace = true }
# Scratch directories for the SDK-constant probes.
aterm-tempfile = { workspace = true }

[[test]]
name = "objc_static_suite"
path = "tests/objc_static_suite.rs"

# Alone: swaps method implementations on shared classes.
[[test]]
name = "swizzle"
path = "tests/swizzle.rs"

# Alone: installs a quarantining #[global_allocator].
[[test]]
name = "weak"
path = "tests/weak.rs"

# Alone: adds protocols to the runtime-wide protocol table.
[[test]]
name = "protocol_registration"
path = "tests/protocol_registration.rs"

# The process suite: every test that re-runs the binary on itself (`--exact`)
# to watch a child die, plus the process-wide containment sink.
[[test]]
name = "objc_process_suite"
path = "tests/objc_process_suite.rs"
