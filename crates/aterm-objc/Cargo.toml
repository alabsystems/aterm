[package]
name = "aterm-objc"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "aterm's first-party Objective-C runtime layer: typed message sends, ownership, runtime class creation, and the block ABI — the foundation that retires the objc2 cluster."

# ZERO dependencies, by construction. This crate exists to REMOVE third-party
# code (objc2 + block2 + the objc2-* binding crates), so adding one here would
# defeat the whole point. Everything below is std plus `libobjc`/`Foundation`,
# which ship with the OS and are already loaded in every aterm process.

[lints]
workspace = true

# TEST-ONLY. The shipped layer keeps its zero dependencies; the Tier-1 bind of
# the run-loop wake timer (`tests/conformance_wake_timer.rs`) steps the derived
# `run_loop_waker_model` beside the real timer, and that model lives in
# `aterm-spec` (first-party, no dependency on this crate).
[dev-dependencies]
aterm-spec = { workspace = true }
