[package]
name = "aterm-objc"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "aterm's first-party Objective-C runtime layer: typed message sends, ownership, runtime class creation, and the block ABI — the foundation that retires the objc2 cluster."

# ZERO dependencies, by construction. This crate exists to REMOVE third-party
# code (objc2 + block2 + the objc2-* binding crates), so adding one here would
# defeat the whole point. Everything below is std plus `libobjc`/`Foundation`,
# which ship with the OS and are already loaded in every aterm process.
#
# The integration files that only READ the runtime are modules of one binary,
# `tests/objc_static_suite.rs`; every file that owns process-global state (a
# swizzle, a panic hook, a global allocator, a self re-exec) is its own
# `[[test]]` below. With autotests off a `tests/*.rs` file listed nowhere never
# compiles.
autotests = false

[lints]
workspace = true

# THE CONTAINER DRIVE, as a test with no libtest harness. libtest runs every
# `#[test]` on a worker and parks its main thread, so neither branch of
# `run_on_main` (which `MainThreadBound`'s `Drop` goes through) can be driven
# from one. Without the harness `main` is the process main thread; the file
# answers libtest's argv itself, as one test of this name.
[[test]]
name = "main_thread_bound_drive"
harness = false

# TEST-ONLY. The shipped layer keeps its zero dependencies; the Tier-1 bind of
# the run-loop wake timer (`tests/conformance_wake_timer.rs`) steps the derived
# `run_loop_waker_model` beside the real timer, and that model lives in
# `aterm-spec` (first-party, no dependency on this crate).
[dev-dependencies]
aterm-spec = { workspace = true }
# The SDK-constant probes' scratch directories, removed on drop. Workspace crate,
# std-only, zero dependencies; already in the dev graph via aterm-spec.
aterm-tempfile = { workspace = true }

[[test]]
name = "objc_static_suite"
path = "tests/objc_static_suite.rs"

# Alone: swaps method implementations on shared classes.
[[test]]
name = "swizzle"
path = "tests/swizzle.rs"

# Alone: installs a process panic hook; `--test winit_seam` is the spelling
# crates/aterm-gui/examples/objc_live_class_audit.rs cites.
[[test]]
name = "winit_seam"
path = "tests/winit_seam.rs"

# Alone: installs a quarantining #[global_allocator].
[[test]]
name = "weak"
path = "tests/weak.rs"

# Alone: adds protocols to the runtime-wide protocol table.
[[test]]
name = "protocol_registration"
path = "tests/protocol_registration.rs"

# Alone: re-execs itself with --exact and records process-wide ObjC exceptions.
[[test]]
name = "exception_containment"
path = "tests/exception_containment.rs"

# Alone: re-execs itself with --exact.
[[test]]
name = "pools"
path = "tests/pools.rs"

# Alone: re-execs itself with --exact.
[[test]]
name = "adversary_w2"
path = "tests/adversary_w2.rs"

# Alone: re-execs itself with --exact.
[[test]]
name = "adversary_w2b"
path = "tests/adversary_w2b.rs"

# Alone: re-execs itself with --exact.
[[test]]
name = "adversary_w2c"
path = "tests/adversary_w2c.rs"

# Alone: installs a panic hook and re-execs itself with --exact.
[[test]]
name = "adversary_w2d"
path = "tests/adversary_w2d.rs"
