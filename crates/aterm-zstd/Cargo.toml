#
# The decoder under `src/decode/` is a modified, decode-only subset of the
# upstream `ruzstd` crate 0.8.3 (https://github.com/KillingSpark/zstd-rs,
# MIT-licensed, by Moritz Borcherding et al). See `LICENSE-MIT` in this
# directory for the upstream license; each derived file names the upstream
# file it derives from. The rest of the crate is first-party.

[package]
name = "aterm-zstd"
# Integration tests are declared below, not discovered: the files are modules of
# one suite binary where they can share a process. With autotests off a
# `tests/*.rs` file listed nowhere never compiles.
autotests = false
version.workspace = true
edition.workspace = true
license = "Apache-2.0 AND MIT"
repository.workspace = true
description = "First-party Zstandard for aterm: a safe streaming decoder (carved from ruzstd 0.8.3), a streaming encoder, XXH64 and a raw-block frame writer"

[lib]
name = "aterm_zstd"
path = "src/lib.rs"

[dependencies]
# None, on purpose: first-party replacement for the zstd / zstd-safe / zstd-sys
# C dependency family.

[dev-dependencies]
# SHA-256 of the frames the zstd CLI wrote (tests/cli_frames.rs) and of what
# the recorded frames decode to (tests/cli_decode.rs, tests/sweep.rs). Those
# recorded answers are the decoder's oracle.
aterm-digest = { workspace = true }
# The zstd CLI's TOOLS row (`aterm_uds::host::need_tool`), spawned through
# `aterm_uds::spawnfd::command`, is the reference decoder the encoder's frames
# are held to, and its `-19` the size level 19 stays within 3% of
# (tests/encode_cli.rs); without it those tests end COULD NOT RUN.
aterm-uds = { workspace = true }
# Scratch directories for the frames the CLI reads.
aterm-tempfile = { workspace = true }

[[test]]
name = "zstd_suite"
path = "tests/zstd_suite.rs"

[lints]
workspace = true
