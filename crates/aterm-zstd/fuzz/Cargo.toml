#
# STOCK EXCEPTION: cargo-fuzz runs on a stock nightly (Trust ships no
# cargo-fuzz and no sanitizer runtime). Not a workspace member; see
# fuzz_targets/decode.rs for how to run it.

[package]
name = "aterm-zstd-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.aterm-zstd]
path = ".."

# Prevent this from interfering with workspaces
[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "decode"
path = "fuzz_targets/decode.rs"
test = false
doc = false
bench = false
