[package]
name = "aterm-effects"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "aterm visual-effects engines — the host-agnostic cursor aurora/comet-trail and sparkle-words (animated ink, peeking cat, supernova) state machines, extracted from aterm-gui so the native GUI and the web embedders (aterm-wasm / aterm-gpu-web) drive ONE implementation of the art."

[features]
# Test-only observation seam for proving how many OS open attempts one exact
# visual-feed path receives. No shipping crate enables this feature.
test-open-probe = []

[dependencies]
# Engine snapshot types (Terminal for the rescan, RenderCell, selection view).
# default-features = false keeps the closure wasm32-clean (no disk-tier libc/zstd);
# the GUI's `bidi` feature unions in via the workspace build without affecting us.
aterm-core = { path = "../aterm-core", default-features = false }
# The render-boundary overlay types (GlowQuad/WordDecoration/InkCell/SpriteQuad/
# SceneAtlas) + the comet-beam rasterizer the aurora shares with the renderer.
aterm-render = { path = "../aterm-render", default-features = false }
# Multilingual whole-word matching for the sparkle-words rescan.
aterm-lexicon = { workspace = true }
# v3 §6 spec framework: the FxHashMap override table (same hasher the lexicon
# keys with) + serde/toml for the `[[sparkle_words.custom]]` fragment both the
# native resolver and the web `set_sparkle_custom_specs` surface parse.
aterm-hash = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
# Deterministic kinematics kit (mix_rgb/smoothstep) + the procedural Tile the
# cat baker draws with. Pure/dependency-free (no `bridge` feature needed here).
aterm-scene = { workspace = true }
# The engine-wide injected-clock idiom: EXACTLY std::time::Instant on native
# (byte-identical to the pre-extraction aterm-gui build), a JS clock on wasm32 —
# the state machines stay clockless (the host injects `now`), but wasm hosts
# need a constructible Instant to synthesize one from an advance(dt) stream.
web-time = { workspace = true }
# Tiny public-domain bitmap faces used only to author the 64-slot PHOSPHOR
# material ROM from literal sampled output characters. The live renderer still
# consumes the existing backend-neutral SceneAtlas/SpriteQuad contract.
font8x8 = { workspace = true }

[target.'cfg(unix)'.dependencies]
# Native config-referenced visual feeds are opened O_NONBLOCK/O_NOFOLLOW on
# Unix before their same-handle regular-file check.
libc = { workspace = true }

[dev-dependencies]
# The ty models the sparkle tests run (identity episodes, flash limiter).
aterm-spec = { workspace = true }
# Atlas PNG dumps for visual iteration (gated behind ATERM_CAT_DUMP); dev-only.
png = "0.17"
# The per-frame effect benchmarks. Until these landed the crate had NO bench
# target at all — 130k lines on the frame path with no instrument, which is how
# four unmeasured "optimizations" once shipped a 1.83% engine regression.
criterion = "0.5"

[[bench]]
name = "cursor_glow_tick"
harness = false

[[bench]]
name = "word_decorations_tick"
harness = false

[[bench]]
name = "trail_synth_render"
harness = false

[[bench]]
name = "matrix_rain_tick"
harness = false

[[bench]]
name = "effect_bakers"
harness = false

[lints]
workspace = true
