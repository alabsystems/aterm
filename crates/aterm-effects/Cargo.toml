[package]
name = "aterm-effects"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "aterm visual-effects engines: the host-agnostic cursor aurora/comet-trail and sparkle-words (animated ink, peeking cat, supernova) state machines that the native GUI and the web embedders share."
# The integration tests are one suite binary and one binary of their own (Aos
# M6's held-out counter), each declared as a `[[test]]` target at the end of
# this file. The two trick conformances are unit modules mounted by src/lib.rs
# so they share the cfg(test) build that emits the implementation's model
# anchors. With autotests off, every other `tests/*.rs` that is neither a `mod`
# of tests/effects_suite.rs nor a `[[test]]` target is silently never compiled.
autotests = false

[dependencies]
# Engine snapshot types (Terminal for the rescan, RenderCell, selection view).
aterm-core = { path = "../aterm-core", default-features = false }
# Explicit terminal progress facts; already part of the core dependency graph.
aterm-types = { workspace = true }
# The one char-width authority, shared with the terminal's write path and the
# native capture seam.
aterm-grapheme = { workspace = true }
# The render-boundary overlay types (GlowQuad/WordDecoration/InkCell), the
# companions' sprite layers (`sprites`) + the comet-beam rasterizer the aurora
# shares with the renderer.
aterm-render = { path = "../aterm-render", default-features = false }
# Multilingual whole-word matching for the sparkle-words rescan.
aterm-lexicon = { workspace = true }
# The FxHashMap override table (the lexicon's hasher) + serde/aterm-toml for the
# `[[sparkle_words.custom]]` fragment that both the native resolver and the web
# `set_sparkle_custom_specs` parse.
aterm-hash = { workspace = true }
serde = { workspace = true, features = ["derive"] }
aterm-toml = { workspace = true }
# Deterministic kinematics kit (mix_rgb/smoothstep) + the procedural Tile the
# cat baker draws with.
aterm-scene = { workspace = true }
# The injected-clock idiom: the state machines take `now` from the host; wasm
# hosts need a constructible Instant to synthesize it from an advance(dt) stream.
aterm-time = { workspace = true }
# The anchor attributes' registry (std-only): `#[cfg_attr(any(test, debug_assertions),
# aterm_spec_anchor::refines(…))]` expands in every test and debug build; release strips it.
aterm-spec-anchor = { workspace = true }
# Aos hosted execution: the momentum glow's task schema, boundary publication and replay.
aterm-aos = { workspace = true }

[features]
# Aos M4 candidate generation (docs/DESIGN-aos-hosted-execution-2026-10-21.md §10):
# schedule plans, their interpreter and the plan-only presentation fallback in a
# release build. Test and debug builds have them without it; a release build
# without it has none of them and runs exactly the prebuilt codes.
aos-candidates = []
# Aos M5a shared-buffer inference (the same design, §12): the int32-exact/v1
# bag-of-ids MLP job kind, its CPU reference and tone-int v1 in a release
# build. Test and debug builds have them without it; aterm-gpu's `compute`
# feature turns it on, and no release binary names it.
int-bag-mlp = []
# Aos M6 online learning (the same design, §13) in a release build: today the
# model-admission policy; the ranker, its ledger and store join it in stage C.
# Test and debug builds have them without it; aterm-lab is to turn it on in
# stage D, and no release binary names it.
aos-learn = ["aos-candidates"]
# DEVELOPMENT SEAMS in an optimized build: the cursor glow's cost for its beams' runs
# (`CursorGlow::set_ramp_cost`), which the effects harness's `--ramp-cost` sweep sets
# (`docs/measured/card-engine-b5-2026-10-24.md`, round 3). Test and debug builds have it
# without this; aterm-bench's `dev-seams` forwards here, and no release binary names it.
dev-seams = []

[target.'cfg(unix)'.dependencies]
# Native config-referenced visual feeds are opened O_NONBLOCK/O_NOFOLLOW on
# Unix before their same-handle regular-file check.
libc = { workspace = true }

[dev-dependencies]
# Models and cfg(test) anchors for the effect state machines.
aterm-spec = { workspace = true }
# The seal `examples/art_rig.rs dogs` stamps on the breed TOMLs it writes (`aterm_census::seal`).
aterm-census = { workspace = true }
# Atlas PNG dumps for the art gallery examples.
# The models its tests drive (a model edit rebuilds only their tests).
aterm-models-aos = { workspace = true }
aterm-models-effects = { workspace = true }
aterm-models-misc = { workspace = true }
aterm-models-render = { workspace = true }
aterm-png = { workspace = true }
# The pack themes' grounds the harness card's floor tests hold every dark theme's stars on.
aterm-theme-pack = { workspace = true }

[lints]
workspace = true

# ---- integration tests (autotests = false above) ----------------------------

# Apart from the unit-mounted trick conformances and the one exception below,
# every tests/*.rs is a `mod` of this suite: one link and one process instead
# of one per file, the files unchanged at their paths. The exact-allocation
# pins share it through the suite's per-thread counting allocator
# (tests/alloc_count), so none needs a binary of its own.
[[test]]
name = "effects_suite"
path = "tests/effects_suite.rs"

# The one exception: Aos M6's process-global held-out counter (design §13.3)
# is read by a test of its own binary, since the suite and the unit tests judge
# held-out items on parallel threads of one process.
[[test]]
name = "m6_held_out_counter"
path = "tests/m6_held_out_counter.rs"

# ---- release perf gates: `targo --unverified bench -p aterm-effects` ----------
# Wall-clock budgets in the bench profile; the tests above hold their
# deterministic halves.
[[bench]]
name = "cursor_bench"
path = "benches/cursor_bench.rs"
harness = false

[[bench]]
name = "rainbow_kitty_v2_frame_cost"
path = "benches/rainbow_kitty_v2_frame_cost.rs"
harness = false
