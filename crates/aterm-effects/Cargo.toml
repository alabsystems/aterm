[package]
name = "aterm-effects"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "aterm visual-effects engines: the host-agnostic cursor aurora/comet-trail and sparkle-words (animated ink, peeking cat, supernova) state machines that the native GUI and the web embedders share."
# The integration tests are ONE suite binary plus four isolates, declared as
# `[[test]]` targets at the end of this file. With autotests off, a `tests/*.rs`
# that is neither a `mod` of tests/effects_suite.rs nor its own `[[test]]` is
# silently never compiled.
autotests = false

[features]
# Compile the kitty-command anchors (`#[refines]` on the listener and the flash,
# machines `TrickListenerPurity` and `TrickFlashLifecycle`) into the LIBRARY.
# OFF by default: the shipped build carries no `aterm-spec` and no probe. The
# unit-test build expands them through `cfg(test)`, the integration tests
# through the dev edge on this crate below.
spec-anchors = ["dep:aterm-spec"]

[dependencies]
# Library dependency only under `spec-anchors`.
aterm-spec = { workspace = true, optional = true }
# Engine snapshot types (Terminal for the rescan, RenderCell, selection view).
# default-features = false keeps the closure wasm32-clean (no disk-tier libc mmap);
# the GUI's `bidi` feature unions in via the workspace build without affecting us.
aterm-core = { path = "../aterm-core", default-features = false }
# Explicit terminal progress facts; already part of the core dependency graph.
aterm-types = { workspace = true }
# The one char-width authority `note_committed_char` shares with the terminal's
# own materialization law (handler_write Tier 5) and the native capture seam.
aterm-grapheme = { workspace = true }
# The render-boundary overlay types (GlowQuad/WordDecoration/InkCell/SpriteQuad/
# SceneAtlas) + the comet-beam rasterizer the aurora shares with the renderer.
aterm-render = { path = "../aterm-render", default-features = false }
# Multilingual whole-word matching for the sparkle-words rescan.
aterm-lexicon = { workspace = true }
# v3 §6 spec framework: the FxHashMap override table (same hasher the lexicon
# keys with) + serde/aterm-toml for the `[[sparkle_words.custom]]` fragment both the
# native resolver and the web `set_sparkle_custom_specs` surface parse.
aterm-hash = { workspace = true }
serde = { workspace = true, features = ["derive"] }
aterm-toml = { workspace = true }
# Deterministic kinematics kit (mix_rgb/smoothstep) + the procedural Tile the
# cat baker draws with. Pure/dependency-free (no `bridge` feature needed here).
aterm-scene = { workspace = true }
# The injected-clock idiom: std::time::Instant on native, a JS clock on wasm32.
# The state machines stay clockless (the host injects `now`), but wasm hosts
# need a constructible Instant to synthesize one from an advance(dt) stream.
aterm-time = { workspace = true }

[target.'cfg(unix)'.dependencies]
# Native config-referenced visual feeds are opened O_NONBLOCK/O_NOFOLLOW on
# Unix before their same-handle regular-file check.
libc = { workspace = true }

[dev-dependencies]
# The ty models the sparkle tests run (identity episodes, flash limiter).
aterm-spec = { workspace = true }
# The integration tests link the library with its anchors on, so a Tier-1 bind
# in `tests/` sees its machine's anchors. A dev edge: a build of the library
# never follows it.
aterm-effects = { path = ".", features = ["spec-anchors"] }
# Atlas PNG dumps for visual iteration (`ATERM_CAT_ART_DUMP_DIR` in
# tests/cat_art_quality.rs).
aterm-png = { workspace = true }

[lints]
workspace = true

# ---- integration tests (autotests = false above) ----------------------------

# Every tests/*.rs not listed below is a `mod` of this suite: one link and one
# process instead of one per file, the files unchanged at their paths.
[[test]]
name = "effects_suite"
path = "tests/effects_suite.rs"

# ISOLATES — each installs a `#[global_allocator]` and asserts exact allocation
# counts, which a concurrent module in a shared process would falsify.
[[test]]
name = "rainbow_kitty_v2_frame_cost"
path = "tests/rainbow_kitty_v2_frame_cost.rs"

[[test]]
name = "trick_flash_alloc"
path = "tests/trick_flash_alloc.rs"

[[test]]
name = "typed_tricks_alloc"
path = "tests/typed_tricks_alloc.rs"

[[test]]
name = "word_reflow_identity"
path = "tests/word_reflow_identity.rs"

# ---- release perf gates: `targo --unverified bench -p aterm-effects` ----------
# Wall-clock budgets measured in the bench profile; their deterministic halves
# are the tests above.
[[bench]]
name = "cursor_bench"
path = "benches/cursor_bench.rs"
harness = false

[[bench]]
name = "rainbow_kitty_v2_frame_cost"
path = "benches/rainbow_kitty_v2_frame_cost.rs"
harness = false
