[package]
name = "aterm-effects"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "aterm visual-effects engines: the host-agnostic cursor aurora/comet-trail and sparkle-words (animated ink, peeking cat, supernova) state machines that the native GUI and the web embedders share."
# The integration tests are ONE suite binary, declared as the `[[test]]` target
# at the end of this file. The two trick conformances are unit modules mounted
# by src/lib.rs so they share the cfg(test) build that emits the
# implementation's model anchors. With autotests off, every other `tests/*.rs`
# that is not a `mod` of tests/effects_suite.rs is silently never compiled.
autotests = false

[dependencies]
# Engine snapshot types (Terminal for the rescan, RenderCell, selection view).
aterm-core = { path = "../aterm-core", default-features = false }
# Explicit terminal progress facts; already part of the core dependency graph.
aterm-types = { workspace = true }
# The one char-width authority, shared with the terminal's write path and the
# native capture seam.
aterm-grapheme = { workspace = true }
# The render-boundary overlay types (GlowQuad/WordDecoration/InkCell/SpriteQuad/
# SceneAtlas) + the comet-beam rasterizer the aurora shares with the renderer.
aterm-render = { path = "../aterm-render", default-features = false }
# Multilingual whole-word matching for the sparkle-words rescan.
aterm-lexicon = { workspace = true }
# The FxHashMap override table (the lexicon's hasher) + serde/aterm-toml for the
# `[[sparkle_words.custom]]` fragment that both the native resolver and the web
# `set_sparkle_custom_specs` parse.
aterm-hash = { workspace = true }
serde = { workspace = true, features = ["derive"] }
aterm-toml = { workspace = true }
# Deterministic kinematics kit (mix_rgb/smoothstep) + the procedural Tile the
# cat baker draws with.
aterm-scene = { workspace = true }
# The injected-clock idiom: the state machines take `now` from the host; wasm
# hosts need a constructible Instant to synthesize it from an advance(dt) stream.
aterm-time = { workspace = true }
# The anchor attributes' registry (std-only): `#[cfg_attr(any(test, debug_assertions),
# aterm_spec_anchor::refines(…))]` expands in every test and debug build; release strips it.
aterm-spec-anchor = { workspace = true }
# Aos hosted execution: the momentum glow's task schema, boundary publication and replay.
aterm-aos = { workspace = true }

[target.'cfg(unix)'.dependencies]
# Native config-referenced visual feeds are opened O_NONBLOCK/O_NOFOLLOW on
# Unix before their same-handle regular-file check.
libc = { workspace = true }

[dev-dependencies]
# Models and cfg(test) anchors for the effect state machines.
aterm-spec = { workspace = true }
# The seal `examples/art_rig.rs dogs` stamps on the breed TOMLs it writes (`aterm_census::seal`).
aterm-census = { workspace = true }
# Atlas PNG dumps for the art gallery examples.
# The models its tests drive (a model edit rebuilds only their tests).
aterm-models-effects = { workspace = true }
aterm-models-misc = { workspace = true }
aterm-models-render = { workspace = true }
aterm-png = { workspace = true }

[lints]
workspace = true

# ---- integration tests (autotests = false above) ----------------------------

# Apart from the unit-mounted trick conformances, every tests/*.rs is a `mod`
# of this suite: one link and one process instead of one per file, the files
# unchanged at their paths. The exact-allocation pins share it through the
# suite's per-thread counting allocator (tests/alloc_count), so none needs a
# binary of its own.
[[test]]
name = "effects_suite"
path = "tests/effects_suite.rs"

# ---- release perf gates: `targo --unverified bench -p aterm-effects` ----------
# Wall-clock budgets in the bench profile; the tests above hold their
# deterministic halves.
[[bench]]
name = "cursor_bench"
path = "benches/cursor_bench.rs"
harness = false

[[bench]]
name = "rainbow_kitty_v2_frame_cost"
path = "benches/rainbow_kitty_v2_frame_cost.rs"
harness = false
