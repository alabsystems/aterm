id = "spec_maneki"
kind = "special"
# Owner, 2026-08-09: "make it bigger with 50% bigger wings so I can see it more
# clearly". The "wings" are this cat's ONE distinguishing feature — the raised
# pink-bean paw — so the paw group (outline path 2, coat path 2, all three pink
# beans) took a uniform 1.5x about the shoulder at (102, 148), the point where
# the arm meets the body, so the limb grows outward while staying attached.
#
# THE VIEWBOX GREW WITH IT. Coordinates normalize as `v / extent` and the
# codegen CLAMPS to the box, so a 1.5x paw reaching x = 160.5 inside the old
# [150, 170] frame would have been squashed flat against the right edge instead
# of drawn. 166 clears the paw's true extent with a small margin; the cat's
# other geometry is untouched, so only the authored ASPECT changes (0.882 ->
# 0.976 — a wider sprite for a wider cat, which is exactly what a bigger paw
# is).
viewbox = [166, 170]
anchor = { eye_y = 0.36, center_x = 0.5, word_top = 1.0 }

# Lucky Bean: a smiling beckoning cat with one raised pink-bean paw.
#
# LAYER ORDER IS PAINT ORDER. `whisker` used to be last, which put the right-
# hand whisker tips ON TOP of the pink beans; at the enlarged paw size those
# hairlines bisect the pad instead of grazing it. Whiskers now paint after the
# face (`mouth`) and BEFORE the paw group, so the pad reads as a solid shape in
# front of the face — which is what a raised paw physically is.
[[layer]]
role = "outline"
ref_fill = "#342B35"
recolor = "fixed"
paths = ["M 23 64 C 21 50 25 39 34 31 L 31 10 C 31 5 35 3 39 7 L 55 20 C 68 16 82 16 95 21 L 113 8 C 117 5 121 8 120 13 L 117 34 C 125 43 128 54 126 66 C 123 85 109 97 91 101 C 74 105 56 102 42 94 C 31 88 24 78 23 64 Z", "M 40 93 C 27 104 24 133 36 153 C 49 169 94 169 109 151 C 119 136 116 108 101 96 Z", "M 102 82 C 105 64 109.5 41.5 127.5 31 C 144 23.5 160.5 34 159 52 C 157.5 73 138 82 124.5 89.5 L 124.5 136 C 124.5 149.5 112.5 155.5 100.5 148 Z", "M 104 137 C 124 128 136 133 136 143 C 136 154 121 160 107 154 Z"]

