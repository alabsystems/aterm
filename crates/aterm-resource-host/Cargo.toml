[package]
name = "aterm-resource-host"
version = "0.0.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Native retained resource admission, execution and recovery"

[target.'cfg(unix)'.dependencies]
aterm-capacity = { workspace = true }
# One dependency shape in dev and tests: the native-context fixtures use the client.
# Selecting it here compiles the same library everywhere without activating any RPC caller.
trust-resource-controller = { workspace = true, features = ["client"] }
trust-resource-provenance = { workspace = true }
aterm-ctl = { workspace = true }
aterm-types = { workspace = true }
aterm-uds = { workspace = true }
aterm-sysprobe = { workspace = true }
aterm-codec = { workspace = true }
aterm-digest = { workspace = true }
aterm-json = { workspace = true }
aterm-durable = { workspace = true }
atpkg = { workspace = true }
libc = { workspace = true }
jobserver_utils = { workspace = true }

[dev-dependencies]
aterm-tempfile = { workspace = true }
aterm-toolchain = { workspace = true }
# The `kind=admission` rows the queue's memory admissions write, as its tests read them
# (`aterm_capacity::telemetry::capture`). aterm-capacity already links it.
aterm-telemetry = { workspace = true }

[target.'cfg(target_os = "macos")'.dev-dependencies]
trust-exec-policy = { workspace = true }

[lints]
workspace = true

[[test]]
name = "resource-member-native"
path = "tests/member_native_main.rs"
harness = false
