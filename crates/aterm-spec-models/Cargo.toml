[package]
name = "aterm-spec-models"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The proof bundles beside aterm's models (the ay certificates), re-checked by `spec-check`."

# No code deps: `spec-check ay` (aterm-models) re-checks the bundles under
# `proofs/ay`. The bundles ARE the crate; tests/ay_bundles.rs holds the two
# generated bundles to their generator.

[lints]
workspace = true

[lib]
# No unit tests live in src/, so this lib's libtest harness ran 0 tests in every
# gate while still being linked and executed. Doctests are a separate switch.
test = false
