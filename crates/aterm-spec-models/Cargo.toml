[package]
name = "aterm-spec-models"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "TLA+ models of aterm's kernel/security/concurrency invariants (ROADMAP WS-I), model-checked by `ty` from `spec-check`."

# No code deps: `spec-check specs` (aterm-spec) model-checks the specs in
# `specs/` with `ty`. The .tla/.cfg files ARE the crate.

[lints]
workspace = true

[lib]
# No unit tests live in src/, so this lib's libtest harness ran 0 tests in every
# gate while still being linked and executed. Doctests are a separate switch.
test = false
