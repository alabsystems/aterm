\* Fixed variant: the decorative Scenes layer is OFF the terminal's present path (worker thread)
\* and its build buffer is bounded (per-panel frame clear + MAX_SCENE_QUADS). Both the leak
\* catcher (SceneFrameBounded) and the isolation theorem (DecorativeLatencyBounded) hold under
\* exhaustive BFS. Flip `Buggy = 0` -> `Buggy = 1` to model the v0.5.9 regression (on-path build
\* + leaking buffer): DecorativeLatencyBounded then has a reachable counterexample.
CONSTANT Buggy = 0
CONSTANT PresentBase = 1
CONSTANT Emit = 2
CONSTANT PerFrameCap = 4
CONSTANT MaxLen = 8
CONSTANT LatencyBound = 1
CONSTANT MaxTime = 4
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT SceneFrameBounded
INVARIANT DecorativeLatencyBounded
CHECK_DEADLOCK FALSE
