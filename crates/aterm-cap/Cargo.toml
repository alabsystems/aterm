[package]
name = "aterm-cap"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Owns-correctness capabilities (ATERM_DESIGN WS-G): an UNFORGEABLE sealed-mint capability + trust tier + effect-gating layer."

[features]
# `launcher-mint` exposes the root-authority mint (ATERM_DESIGN §5.4):
# `Authority::root_authority()` exists only with it (or under this crate's `test`
# cfg). Only the trusted launchers (aterm-gui, aterm-cli) enable it; cargo unifies
# features, so the `launcher-mint` source guard (aterm-census --guards) keeps
# every other crate's shipped code and shipped tables from naming or enabling it.
launcher-mint = []

[lints]
workspace = true
