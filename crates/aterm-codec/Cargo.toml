[package]
name = "aterm-codec"
# Integration tests are declared below, not discovered. With autotests off a
# `tests/*.rs` file listed nowhere never compiles.
autotests = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Base64 and hex encoding/decoding for aterm: zero external dependencies"

[dependencies]
# None — pure std

[dev-dependencies]
# The generated-input tests' one generator (`aterm_spec::rng::XorShift`).
aterm-spec = { workspace = true }

[lints]
workspace = true

[[test]]
name = "codec_suite"
path = "tests/codec_suite.rs"
