[package]
name = "aterm-codec"
# Integration tests are declared below, not discovered. With autotests off a
# `tests/*.rs` file listed nowhere never compiles.
autotests = false
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Base64, hex, the wire and terminal escapes, CRC-32 (astream-wire's) and DEFLATE for aterm: std and astream-wire only"

[package.metadata.aterm.test-inputs]
read-only = true
bounded = true
content-only = true
volatile-environment = []
paths = []

[dependencies]
# The CRC-32 is astream-wire's `hash::crc32_ieee_update` (compile-time
# slicing-by-8, bounds proved there), the one aterm-png checks chunks with and
# astream frames every record with. astream-wire has no dependencies and no
# platform code; the macOS and Linux graphs already hold it (aterm-restore,
# astream-broker); on Windows and wasm32 it arrives with aterm-hash and here.
astream-wire = { path = "../../vendor/astream/crates/astream-wire" }

[dev-dependencies]
# The generated-input tests' one generator (`aterm_spec::rng::XorShift`).
aterm-spec = { workspace = true }

[lints]
workspace = true

[[test]]
name = "codec_suite"
path = "tests/codec_suite.rs"
