[package]
name = "aterm-models"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Every aterm model in one binary: spec-check, the registry-wide sweeps and the source-spec closure"
# Each integration test is its own [[test]] below: a tests/*.rs that is neither one nor a
# `mod` of one compiles into nothing.
autotests = false

[lib]
# `link_all` is the whole library; its checks are the tests below.
test = false
doctest = false

[dependencies]
aterm-spec.workspace = true
# Every domain crate, so a binary that calls `link_all` registers every model.
aterm-models-agh.workspace = true
aterm-models-atpkg.workspace = true
aterm-models-core.workspace = true
aterm-models-effects.workspace = true
aterm-models-gui.workspace = true
aterm-models-harness.workspace = true
aterm-models-misc.workspace = true
aterm-models-native.workspace = true
aterm-models-release.workspace = true
aterm-models-render.workspace = true
aterm-models-session.workspace = true
aterm-models-update.workspace = true

[dev-dependencies]
# The source-spec closure (`tests/spec_xref_closure.rs`) links every anchored crate, so the
# registry holds every anchor, waiver and model in one binary. Test-only: nothing ships this
# crate, and no library depends on it.
agh.workspace = true
aterm-agent.workspace = true
aterm-core.workspace = true
aterm-effects.workspace = true
aterm-gpu.workspace = true
aterm-grid.workspace = true
aterm-gui = { path = "../aterm-gui" }
aterm-keeper.workspace = true
aterm-pty.workspace = true
aterm-render.workspace = true
aterm-restore.workspace = true
aterm-sandbox.workspace = true
aterm-search.workspace = true
aterm-selection.workspace = true
aterm-session.workspace = true
aterm-update.workspace = true

[lints]
workspace = true

# The checker run (`aterm_spec::check`): the obligations only `ty` and `ay` discharge, over
# every registered model, run on purpose. Dev-only; nothing ships it.
[[bin]]
name = "spec-check"
path = "src/bin/spec-check.rs"
test = false

# Its own binary: the registry it sweeps is exactly the registered models, without the
# fixtures another test file writes.
[[test]]
name = "non_vacuity"
path = "tests/non_vacuity.rs"

# What the registry sweeps do not ask (deadlock freedom, scenario corners, scope-aggregate
# multiplication), over models from several domain crates.
[[test]]
name = "derived_ring_ty"
path = "tests/derived_ring_ty.rs"

# The toolchain-free source-spec closure over every anchored crate.
[[test]]
name = "spec_xref_closure"
path = "tests/spec_xref_closure.rs"
