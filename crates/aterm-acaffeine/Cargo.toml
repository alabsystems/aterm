[package]
name = "aterm-acaffeine"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "aterm's menu-bar keep-awake mug (`aterm acaffeine`): a click keeps this Mac awake, a right click picks 1, 8 or 24 hours or forever, starts it at login or quits. The pure model, menu and icon raster compile everywhere; the status item, the power activity, the launchd job and the bundle copy it runs from are macOS."

[dependencies]
# The state directory, the logs directory and $HOME (`dirs`), the origin line
# the about row prints (`identity`).
aterm-types = { workspace = true }
# The wall clock (`unix_secs`), which a timed span's end is shown on.
aterm-time = { workspace = true }
# The launchd plist's XML text escape (`xml::escape`).
aterm-codec = { workspace = true }
# The menu-bar icon's shapes are drawn here; this supersamples them to coverage and encodes the
# template PNG AppKit is handed.
aterm-template-icon = { workspace = true }
# The per-path launchd label of a non-installed build.
aterm-hash = { workspace = true }
aterm-log = { workspace = true }
# The power assertions a process holds (`power::assertions_of`), which `held`
# reads for the mug in-process: `aterm doctor`'s `awake:` row and the converge
# pass's `sync.awake`. Every target, as `held::judge` is pure and tested
# everywhere; off macOS the reader only says there is none to list.
aterm-sysprobe = { workspace = true }
# The state file's flush (`ordered`): its bytes land before the rename over it.
aterm-durable = { workspace = true }
# `spawnfd::command` (launchctl, the re-exec into the bundle copy),
# `ownerlock::probe` (is a mug running), `process::read_process_path|argv`
# (is the lock's pid that mug), `peer::our_uid` (the GUI domain),
# `process::continuous_ms` (the boot clock a timed span's deadline is on: it
# counts time asleep, and no change of the date moves it).
aterm-uds = { workspace = true }
# THE BOOT the state file is stamped with (a span's `ends` counts on that boot's
# clock alone, so a file of an earlier boot is read on the wall clock):
# `boot_session`, the kernel's boot id as 16 bytes (`instance::boot_id`),
# and `parse_boot_id`, astream's reader of its text (`state::parse_boot`),
# which refuses the all-zero id a damaged answer reads as. The reading
# aterm-link's broker opens its log in, so the mug and the bus name a boot one
# way. Every target, not only macOS where the mug reads its boot: the state
# file's parser is the pure model's, which compiles everywhere. Zero
# dependencies; its two cordoned `unsafe` modules are hand-declared FFI calls,
# `apple` (`sysctlbyname` for the boot id among them, so this crate declares no
# `sysctlbyname` of its own) and `owner` (`cfg(unix)`: `geteuid` and the ACL
# calls). Not a new edge on Apple, where aterm-durable above
# links it, nor on Linux, where aterm-link does; on Windows it is a new one,
# and a harmless one: no dependencies, and no `unsafe` compiled there.
astream-sys = { path = "../../vendor/astream/crates/astream-sys" }

[target.'cfg(unix)'.dependencies]
# `kill` (`aterm acaffeine quit`), the code directory's backup exclusion
# (`getxattr`/`setxattr`), the SIGTERM watch (`sigaction`, `raise`) and the
# open flags.
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
# `start_outside_job`: the holder `aterm acaffeine on` starts from a tab is started outside the
# tab's kill-on-close job (under the aterm window), so closing the tab does not end it. The one
# door through which aterm calls `CreateProcessW` itself.
aterm-pty = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
# The status item, its menu, the image and the NSProcessInfo activity. The click split, the
# pop-up, the template image and the state file's change observer are aterm-macos-ui's
# (`status_button`, `darwin_notify`), shared with aterm's own menu-bar item.
aterm-objc = { workspace = true }
aterm-macos-ui = { workspace = true }

[dev-dependencies]
aterm-tempfile = { workspace = true }
# The icon's PNG is decoded back in its test.
aterm-png = { workspace = true }

[lints]
workspace = true
