[package]
# Named `libc` because `[patch.crates-io]` matches on package name: this
# redirects every consumer's `libc = "0.2"` here.
name = "libc"
# Not `version.workspace = true`: it must meet every consumer's requirement, the
# strictest being `^0.2.182` (rustix 1.1.4). One it misses leaves the patch
# silently unused (`targo --unverified forge check` catches it).
version = "0.2.186"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "First-party platform ABI declarations for aterm (replaces the crates.io libc package)"

# Declared so the package and the lib name consumers write cannot drift.
[lib]
name = "libc"
path = "src/lib.rs"
# src/ has no unit tests; one added there would not run.
test = false

[features]
# Upstream's feature table, so every consumer's feature request resolves. Only
# `extra_traits` does anything (the unix cells get it through rustix 0.38's
# `libc-extra-traits`): it gates the PartialEq/Eq/Hash derives upstream gates.
default = ["std"]
extra_traits = []
# Inert: the crate is always `no_std`, the generated cells apply `align` and
# `const-extern-fn` unconditionally, and `rustc-dep-of-std` omits upstream's
# `rustc-std-workspace-core` (nothing in aterm builds `std` from this crate).
std = []
use_std = ["std"]
align = []
const-extern-fn = []
rustc-dep-of-std = ["align"]

[lints]
workspace = true
