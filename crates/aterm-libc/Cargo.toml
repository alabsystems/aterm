[package]
# Package `libc` (directory `aterm-libc`, as with crates/aterm-cfg-if):
# `[patch.crates-io]` matches on package name, so this name redirects every
# consumer's `libc = "0.2"`; the directory prefix marks it as ours.
name = "libc"
# NOT `version.workspace = true`: a semver contract with consumers. The
# strictest requirement was `^0.2.182` (rustix 1.1.4, which left the lock at
# linux-windowing LW.7); 0.2.186 meets all and matches the lock's pre-swap
# version. A version below any requirement makes the
# patch silently inert (`targo --unverified forge check` catches it).
version = "0.2.186"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "First-party platform ABI declarations for aterm (replaces the crates.io libc package)"

# Declared so the package and the lib name consumers write cannot drift.
[lib]
name = "libc"
path = "src/lib.rs"
# No unit tests in src/; doctests still run.
test = false

[features]
# Upstream's feature table, so no parent's feature request fails to resolve.
# Resolved (`cargo tree --target <cell> -e features -i libc`):
# `default,extra_traits,std` on the unix cells, `default,std` on Windows and
# wasm32. `extra_traits` is real (reached via rustix's `libc-extra-traits`
# until rustix left at LW.7) and gates the PartialEq/Eq/Hash derives upstream
# gates.
default = ["std"]
extra_traits = []
# The rest are inert: this crate is always `no_std`; `align` and
# `const-extern-fn` effects are unconditional in the generated cells;
# `rustc-dep-of-std` deliberately omits upstream's `rustc-std-workspace-core`
# (this crate cannot build `std` itself, and nothing in aterm asks it to).
std = []
use_std = ["std"]
align = []
const-extern-fn = []
rustc-dep-of-std = ["align"]

[lints]
workspace = true
