[package]
name = "trust-build-cpu"
version = "0.13.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Andrew Yates"]
description = "Native per-unit CPU leases shared by Trust builds and aterm"

[features]
observations = ["dep:serde_json"]
jobserver = ["dep:jobserver"]
native-host = ["observations", "dep:trust-resource-controller"]

[dependencies]
serde_json = { version = "1", optional = true }
jobserver = { version = "0.1.35", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
sha2 = { package = "trust-sha2", path = "../trust-sha2", default-features = false }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
trust-resource-controller = { path = "../trust-resource-controller", features = ["client"], optional = true }

[dev-dependencies]
tempfile = "3"


[[test]]
name = "recovery_material"
path = "src/recovery_material/tests.rs"

[package.metadata.aterm-origin]
project = "Trust"
commit = "e4899fc0806811ae633d0bad6f0f0f924d60545c"
path = "crates/trust-build-cpu"

[workspace]
