[package]
name = "jobserver_utils"
version = "0.0.0"
edition = "2024"

# Trust: shared runtime scheduling authority; independent of bootstrap policy
# helpers, argument parsing, compiler internals and Cargo workspace internals.
[features]
# Existing clients retain their GNU scheduling API. A custodian can transfer
# existing descriptors without linking or minting a GNU token client.
default = ["client"]
client = ["dep:jobserver"]

[dependencies]
jobserver = { version = "=0.1.35", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[package.metadata.aterm-origin]
project = "Trust"
commit = "263e40c542b1efd7e4464e9ef191cdea0b7add8f"
path = "src/jobserver_utils"

[workspace]
