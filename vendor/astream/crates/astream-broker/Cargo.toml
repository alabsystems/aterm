[package]
name = "astream-broker"
description = "astream servable broker: durable exactly-once pub/sub, Filter-routed subscribe, resume-from-offset (replay-subscription), durable consumer groups and atomic read-process-write, served over a Unix-domain socket, plaintext TCP, or (feature `aead`) an XChaCha20-Poly1305-sealed TCP transport (ring's ChaCha20-Poly1305 under an in-crate HChaCha20 subkey); capability enforcement on attach behind feature `cap`. std-only concurrency (threads + Mutex/Condvar), zero third-party deps by default, forbid(unsafe)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

# Zero third-party dependencies — std only (threads, sync, UnixListener) plus the
# in-tree wire vocabulary. The broker is a substrate crate, so forbid(unsafe).
[features]
# Retention compiles in by default (REQUIREMENTS R4; aterm's ruling U23(a)): a broker
# given no rules never compacts and behaves exactly as one built without it.
default = ["retention"]
# Off by default: enforce capabilities on the accept path. Pulls astream-cap and
# its SHA-256, astream-digest -- both in-tree, so even a `cap` broker takes no
# third-party crate.
cap = ["dep:astream-cap"]
# Off by default: an XChaCha20-Poly1305-sealed TCP transport (serve_tcp_sealed /
# Client::connect_tcp_sealed). Pulls astream-aead and its cipher (ring's
# ChaCha20-Poly1305; astream-aead derives the XChaCha20 subkey itself), so the default
# broker stays zero-third-party.
aead = ["dep:astream-aead"]
# Off by default: the Rung-7 forward-secret handshake (serve_tcp_handshake /
# Client::connect_tcp_handshake) — ephemeral X25519 authenticated by the PSK.
# Implies aead and enables astream-aead's handshake (pulls the vetted curve).
handshake = ["aead", "astream-aead/handshake"]
# Off by default: Rung-8 static public-key identity (serve_tcp_identity /
# Client::connect_tcp_identity) — mutual signed-DH (SIGMA/Ed25519), no shared
# secret. Implies handshake and enables astream-aead's identity (pulls Ed25519).
identity = ["handshake", "astream-aead/identity"]
# Off by default: encrypt-at-rest for the durable log (Broker::open_encrypted /
# BrokerLog::open_encrypted). Seals each record's payload on disk with the AEAD
# (reuses astream-aead via `aead`); the default broker writes plaintext frames.
at-rest = ["aead"]
# Off by default: anti-rollback for the encrypted log (Broker::open_encrypted_verified).
# Maintains an authenticated monotonic head watermark (a `<log>.hw` sidecar) so a
# write-capable attacker cannot silently truncate/roll back the log. Implies at-rest.
anti-rollback = ["at-rest"]
# ON by default (`default` above): retention — the caller's compactions
# (Broker::retain_before / BrokerLog::retain_before, keeping surviving offsets absolute),
# the writer's caps, and the retention rules (Broker::set_retention: the prefix rule's
# cut, the held store `<log>.held`, the broker's retention tick). std-only; works on
# plaintext and encrypted logs. `--no-default-features` builds the broker without it.
retention = []

[dependencies]
astream-wire = { workspace = true }
# The OS cordon: this boot's id (the unclean-open rule, logid.rs) and the ordering-only
# flush. In-tree and zero-dependency, so the broker stays zero-third-party and keeps
# forbid(unsafe): its FFI calls live in astream-sys's cordoned modules.
astream-sys = { workspace = true }
astream-cap = { workspace = true, optional = true }
astream-aead = { workspace = true, optional = true }

# Dev-only, and IN-TREE (not third-party): the cognition-routing test publishes a
# REAL astream-agent CogRecord through the bus. astream-agent's own lib graph is
# zero-third-party, so `cargo test` still pulls no crates.io dependency.
[dev-dependencies]
astream-agent = { path = "../astream-agent" }
# For the at-rest test only: Offset + Frame, to read/tamper raw log bytes.
astream-wire = { workspace = true }
# For the cap-enforcement test only (mints capabilities); the LIB graph stays
# zero-third-party (astream-cap is an OPTIONAL runtime dep behind the `cap` feature).
astream-cap = { path = "../astream-cap" }
astream-digest = { workspace = true }

# `asb` — the thin CLI over the library (serve / pub / sub / last / fetch / drain / ack /
# commit / mint / repair) so a shell or bridge can move bytes on the bus, read retained
# state and drain an inbox. std-only; no new dependency. `mint` and `--cap-file` need the
# `cap` feature (they compute the same vetted MAC the broker verifies with).
[[bin]]
name = "asb"
path = "src/bin/asb.rs"
