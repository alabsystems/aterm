[package]
name = "astream-cap"
description = "astream capability mint: an unforgeable, HMAC-SHA256-signed capability over the astream_wire Filter grammar. A capability IS a signed Filter (a subject subtree the bearer may attach/observe/drive); the broker mints and verifies it. HMAC is RFC 2104 over SHA-256 — a standard construction, never an invented MAC — and the SHA-256 is the workspace's own astream-digest (FIPS 180-4, pinned to its vectors and to the sha2 crate it replaced), so this crate takes no third-party dependency. The other half of 'SSH' (an AEAD wire) is a separate, deliberate crypto-dependency decision."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

# astream-digest is the ONE crypto-grade primitive: the workspace's SHA-256 (it
# replaced the sha2 crate and its six-package chain, held to it byte for byte and
# pinned by the RFC 4231 vectors and recorded answers in src/lib.rs). HMAC is built
# on it per RFC 2104. astream-wire provides the Filter/Subject grammar the
# capability authorizes over. forbid(unsafe).
[dependencies]
astream-wire = { workspace = true }
astream-digest = { workspace = true }
