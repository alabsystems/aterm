# astream — a small, reproducibly-buildable, agent-native message bus.
# The gate (astream-wire + astream-evidence) is the
# foundation; the 14 members below are the built system — see README "Layout".
#
# HARD INVARIANT: zero private / git dependencies. Everything resolves from
# crates.io with a committed Cargo.lock so `targo --unverified build --locked`
# works from a clean checkout with the Trust toolchain (measured on macOS only).
# This is the headline correctness property.

[workspace]
resolver = "2"
members = [
    "crates/astream-wire",
    "crates/astream-digest",
    "crates/astream-evidence",
    "crates/astream-term",
    "crates/astream-engine",
    "crates/astream-host",
    "crates/astream-effects",
    "crates/astream-agent",
    "crates/astream-live",
    "crates/astream-broker",
    "crates/astream-cap",
    "crates/astream-kafka",
    "crates/astream-pump",
    "crates/astream-aead",
]
# NOTE: a `verify/` workspace will live in a SEPARATE workspace and must never
# appear in these members — the evidence gate enforces this (see gate.rs).

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/alabsystems/astream"
authors = ["Andrew Yates"]
# 1.89 is the floor `BrokerLog` needs for `File::try_lock`/`unlock` (the exclusive
# log lock); the toolchain itself is Trust (rust-toolchain.toml).
rust-version = "1.89"

[workspace.dependencies]
astream-wire = { path = "crates/astream-wire", version = "0.2.0" }
astream-digest = { path = "crates/astream-digest", version = "0.2.0" }
# astream-broker's sibling crates are declared HERE, with the version crates.io
# requires beside `path`, because `pub bump` moves only the ROOT manifest's
# intra-workspace requirements. A requirement left in a member manifest does not
# move, and the bumped workspace stops resolving (measured 2026-09-29: broker's
# `astream-aead = "^0.1.0"` against a 0.2.0 crate, so `pub bump` undid itself).
astream-cap = { path = "crates/astream-cap", version = "0.2.0" }
astream-aead = { path = "crates/astream-aead", version = "0.2.0" }
# Third-party (crates.io only — no git, no path-to-private):
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
proptest = "1.5"

[profile.release]
# Deliberately NOT panic="abort": astream isolates faults per-connection and
# wants to unwind one task rather than kill the node (a predecessor lesson).
lto = true
codegen-units = 1
