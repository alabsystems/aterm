#
# vendor/forge.toml — THE FORK LEDGER. One [[fork]] block per VENDORED [patch.crates-io]
# entry in the workspace root manifest: what aterm vendored, at which upstream version,
# under which license, and how the lock-order census classifies it.
#
# THE COMMENTS ARE THE RECORD. A fork's reason to exist is not a key here — it is the
# comment block above it, and its `census review:` line says what the lock-order census's
# reviewer read; no tool checks that prose, so it is kept with the fork. Nothing in forge
# writes this file; it is edited by hand. Unknown KEYS are refused by name (fail-closed).
#
# THIS FILE IS THE CENSUS REVIEW. aterm-census reads each block's name, path and census.*
# keys (`aterm_census::scan_set::reviewed_forks`): a vendored [patch] entry with no block
# is unreviewed, and the census refuses it.
#
# `targo --unverified forge check` holds this file to the tree ([OB-17]): every [[fork]]
# block must match its vendored manifest's path, version and license — no block missing,
# none stale — with apache_notice as attest's [OB-7] reads that license. Patch LIVENESS (a
# vendored version that drifts from the requirement the graph asks for silently un-uses
# the patch) is [OB-12]'s.

[forge]
# The methods every number in a forge report was produced by, recorded so a report can be
# re-derived years later and so a change of method lands as a diff instead of as a silent
# shift in the ratchet.
# loc_method "rs-physical-all-files-v1": physical lines over every *.rs under the package
#   root, that package's own tests and examples included. It measures the source aterm would
#   OWN on vendoring, not the code that reaches codegen.
# graph_method "cargo-tree-normal-no-dedupe-locked-offline-v1": cargo tree -p <package> -e
#   normal --target <triple> --prefix depth --no-dedupe --locked --offline. Deliberately NOT
#   cargo metadata --filter-platform, whose resolve is feature-unified across every
#   workspace member and over-counts the macOS root by 28%.
loc_method = "rs-physical-all-files-v1"
graph_method = "cargo-tree-normal-no-dedupe-locked-offline-v1"
# The measurement matrix is `aterm_forge::resolve::default_cells()`, declared there once.

# --- winit 0.30.13: ABSORBED, no longer a fork ------------------------------
# Re-homed 2026-10-15 as crates/aterm-window, a workspace member
# (docs/AUDIT-third-party-2026-10-15.md, winit-core step 4); its package keeps the
# name `winit`, which accesskit_winit required until A11Y.4 retired it; the rename is
# winit-core step 7. Its [[fork]] block retired with
# the move: the root [patch.crates-io] row now points at an ABSORBED target, whose
# NOTICE line, retained LICENSE and Apache-2.0 §4(b) notices `targo --unverified
# forge attest` holds ([OB-5]/[OB-6]/[OB-7]/[OB-9]), and which aterm-census scans
# from its ABSORBED_CRATES row. The carve ledger below stays: those backends are
# still gone, now from crates/aterm-window.

# The four backends no aterm cell compiles, DELETED from the fork 2026-10-15
# (docs/AUDIT-third-party-2026-10-15.md, winit-core step 1; re-pointed with the
# re-home, step 4): their target tables held 22 lock-only packages (android-activity,
# jni, orbclient, pin-project, web-time, ...) and their sources were 16k of the fork's
# lines in every native cell's count. aterm ships macOS, Windows and Linux GUIs; the
# wasm cells do not compile winit at all.
[[carved]]
path = "crates/aterm-window/src/platform_impl/android"
reason = "aterm ships no Android GUI; the backend held android-activity, jni and ndk-context"

[[carved]]
path = "crates/aterm-window/src/platform_impl/ios"
reason = "aterm ships no iOS GUI; the backend held the objc2 0.5 iOS rows"

[[carved]]
path = "crates/aterm-window/src/platform_impl/orbital"
reason = "aterm ships no Redox GUI; the backend held orbclient and redox_syscall 0.4"

[[carved]]
path = "crates/aterm-window/src/platform_impl/web"
reason = "the wasm cells do not compile winit; the backend held pin-project and web-time"

# --- indexmap 2.14.0: RETIRED to the registry's 2.13.0, no longer a fork -------
# Retired 2026-10-16 (docs/AUDIT-third-party-2026-10-15.md, "The last fork"): the
# [patch.crates-io] row and vendor/indexmap are gone. The fork carried two edits:
# checked slice-range indexing (the `aterm-trust` index-panic fix, which the trust lane
# never verified: QUEUED_FORKS held it) and a hashbrown 0.17 -> 0.16 requirement pin.
# The lock now resolves the registry's indexmap 2.13.0 (`targo update -p indexmap
# --precise 2.13.0`): the 2.13 releases ask for hashbrown ^0.16.1 and every parent
# allows them (naga and wgpu-core ^2.11.4, toml_edit ^2.13.0), so the one hashbrown
# 0.16.1 still serves the whole graph and no cell gains a package. A plain resolve picks
# 2.14.x and brings hashbrown 0.17.1 back (+1 package / +25,236 lines and a duplicate
# name in every cell that compiles indexmap); the forge-budget ratchet turns that RED.
# indexmap leaves the graph with wgpu (win, win-arm, wasm-gpu: GW.5, WP.8) and with the
# host-only proc-macro-crate -> toml_edit edge under zvariant_derive (linux: A11Y.5a;
# zbus_macros's path to it left at A11Y.4). With this block gone the ledger holds no [[fork]]: vendor/ holds
# only the first-party astream submodule.
