# landed in hashbrown 0.15. The floor is enforced by compilation, not by this
# comment: indexmap is a normal build unit in every cell above.
# HONEST CAVEAT: this pin now has to move when indexmap next takes a hashbrown
# API that only 0.17 has. That shows up as a compile error in indexmap itself,
# which is the loudest place it could show up.
